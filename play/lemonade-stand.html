<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:44px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
/* Game-only styles. The engine (toot.css / toot.js) owns the top bar, stage grid, coach strip, cards, hint box, nudge and buttons. */
[hidden]{display:none!important}
:root{--lemon:#FFE45C;--lemon-dark:#E0B62A;--leaf:#5FAF4E;--silver:#D9DDE3;--silver-dark:#9AA3AE;--gold:#E9B94A;--gold-dark:#B98A1E}

/* ---------- scene: a sunny sidewalk ---------- */
#scene{background:linear-gradient(#8FD6FF 0%,#C9ECFF 55%,#C9ECFF 100%)}
.sun{position:absolute;left:6%;top:6%;width:11cqw;height:11cqw;border-radius:50%;background:var(--sun);box-shadow:0 0 3cqw rgba(255,200,61,.8);animation:sunspin 12s linear infinite}
.sun::before{content:"";position:absolute;inset:-18%;border-radius:50%;border:.6cqw dashed rgba(255,200,61,.7)}
@keyframes sunspin{to{transform:rotate(360deg)}}
.cloud{position:absolute;width:9cqw;height:3.2cqw;background:#fff;border-radius:3cqw;opacity:.95;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;top:-2cqw;left:1.4cqw;width:4cqw;height:4cqw}
.cloud::after{left:4.2cqw;top:-1.4cqw;width:3.2cqw;height:3.2cqw}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(110cqw)}}
.grass{position:absolute;left:0;right:0;top:56%;height:12%;background:var(--grass)}
.walk{position:absolute;left:0;right:0;top:66%;bottom:0;background:repeating-linear-gradient(90deg,#E8DCC5 0 12cqw,#DCCDB1 12cqw 12.6cqw)}
.tree{position:absolute;right:3%;top:14%;width:14cqw;height:26cqw}
.tree .trunk{position:absolute;left:42%;bottom:0;width:16%;height:48%;background:var(--wood-dark);border-radius:1cqw 1cqw 0 0}
.tree .leaf{position:absolute;border-radius:50%;background:var(--leaf);box-shadow:inset -1cqw -1cqw 0 rgba(0,0,0,.12)}
.tree .leaf.a{left:8%;top:24%;width:62%;height:48%}.tree .leaf.b{left:34%;top:0;width:66%;height:54%}.tree .leaf.c{left:0;top:42%;width:46%;height:38%}
.stand{position:absolute;left:46%;top:22%;width:40%;height:56%}
.awning{position:absolute;left:-6%;right:-6%;top:0;height:22%;background:repeating-linear-gradient(90deg,var(--ketchup) 0 4cqw,#fff 4cqw 8cqw);border-radius:2cqw 2cqw 0 0;box-shadow:0 .6cqw 0 var(--ketchup-dark)}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:-1.4cqw;height:1.6cqw;background:repeating-linear-gradient(90deg,var(--ketchup) 0 4cqw,#fff 4cqw 8cqw);clip-path:polygon(0 0,100% 0,100% 100%,95% 40%,90% 100%,85% 40%,80% 100%,75% 40%,70% 100%,65% 40%,60% 100%,55% 40%,50% 100%,45% 40%,40% 100%,35% 40%,30% 100%,25% 40%,20% 100%,15% 40%,10% 100%,5% 40%,0 100%)}
.post{position:absolute;top:18%;bottom:0;width:2.2cqw;background:var(--wood-dark)}
.post.l{left:-2%}.post.r{right:-2%}
.counter{position:absolute;left:0;right:0;top:56%;bottom:0;background:repeating-linear-gradient(0deg,var(--wood) 0 3cqw,#D89B5B 3cqw 3.5cqw);border-radius:1.5cqw;box-shadow:0 .6cqw 0 var(--wood-dark);display:flex;align-items:center;justify-content:center}
.counter .sign{background:#fff;border-radius:1.2cqw;padding:.3cqw 1.6cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.6cqw,22px);color:var(--ketchup);transform:rotate(-2deg);box-shadow:0 .3cqw 0 rgba(59,42,31,.15);white-space:nowrap;position:relative}
.counter .sign b{color:var(--mint-dark)}
.pitcher{position:absolute;left:41%;top:34%;width:16%;z-index:4;transform-origin:50% 100%;line-height:0}
.pitcher svg,.cups svg,.lemon svg,.cup svg{width:100%;height:auto;display:block;overflow:visible}
.cups{position:absolute;right:3%;top:44%;width:13%;z-index:4;line-height:0}
.toot-actor .toot-char{width:100%}
.robo{left:4%;top:14%;width:36%}
.chef{left:62%;top:18%;width:32%}
.chef .lemon{position:absolute;left:-16%;top:54%;width:32%;transform-origin:50% 50%;z-index:2;line-height:0}
.robo .lemon{position:absolute;left:74%;top:52%;width:30%;transform-origin:50% 50%;z-index:2;line-height:0}
.robo .juggle-lemons{position:absolute;left:-10%;right:-10%;top:-34%;display:none;justify-content:center;gap:6%;z-index:2}
.robo.juggle .juggle-lemons{display:flex}

  const v = +b.dataset.v;
  if(q.mode === 'price') return pickPrice(v);
  if(v === q.target){ b.classList.add('reveal'); solve(q); return true; }
  b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope');
  miss(q, [M(v), 'LS58']); return false;
}
function submit(){
  if(!playable()) return false; const q = G.q;
  if(q.mode === 'pay' || q.mode === 'change'){
    const cur = trayTotal(q);
    if(cur === q.target){ solve(q); return true; }
    miss(q, ['LS59', M(cur), '.', 'LS60', M(q.target), '.']); return false;
  }
  return false;
}
function pickPrice(cents){
  if(!playable() || G.q.mode !== 'price') return false; const q = G.q; cents = +cents;
  if(!q.prices.includes(cents)) return false;
  const n = G.day.demand[cents]; G.day.price = cents; el.signPrice.textContent = fmt(cents);
  // build the rest of the day: customers pay exactly or need change, then count the box
  const rounds = [];
  for(let i=0;i<n;i++){
    if(i % 2 === 0) rounds.push(mk('collect', {coins: coinsFor(cents, [200,100,25]), target:cents}));
    else { const paid = cents < 100 ? 100 : cents === 100 ? pick([200,500]) : cents === 200 ? 500 : pick([500,1000]); rounds.push(changeRound(cents, paid, G.day.boxDenoms)); }
  }
  G.day.made = cents * n;
  const box = []; for(let i=0;i<n;i++) box.push(...coinsFor(cents, [200,100,25]));
  rounds.push(mk('profit', {coins:box, target:G.day.made, choices:choicesFor(G.day.made, cents < 100 ? 25 : 100)}));
  G.queue.splice(G.i+1, 0, ...rounds);
  coachSay([M(cents), 'LS34', 'n_'+n, 'LS35'], 'happy', `${fmt(cents)} a cup! ${n} customers are coming.`);
  q.solved = true; busy = true; UI.nudge.clear(); el.choices.innerHTML = ''; S.ding();
  setTimeout(()=>{ if(G && G.q === q) q.resolve(); }, 900);
  return true;
}
function buy(id){
  if(!playable() || G.q.mode !== 'buy') return false; const q = G.q;
  const it = q.items.find(i => i.id === id), b = el.items.querySelector(`.item[data-id="${id}"]`);
  if(!it || !b || b.classList.contains('bought')) return false;
  b.classList.add('bought'); q.tray.push(it.price); S.coins();
  const spent = trayTotal(q), left = q.budget - spent;
  $('#wallet').textContent = fmt(left); $('#spent').textContent = fmt(spent);
  say([ITEM_ID[it.id], ',', M(it.price), '.', M(left), 'LS36']);
  if(q.tray.length === q.items.length){ setTimeout(()=>{ if(G && G.q === q && !q.solved) showChoices(q, `You bought them all! How much is left?`); }, 900); }
  return true;
}

/* ---------- hint ladder (engine): miss 1 = picture hint, miss 2 = the answer to tap. No failure. A silly reaction runs alongside. ---------- */
function ghostRemaining(q){
  el.tray.querySelectorAll('.coin.ghost').forEach(g => g.remove());
  const need = coinsFor(q.target - trayTotal(q), q.boxDenoms) || [];
  need.forEach(v => el.tray.appendChild(coinEl(v, 'ghost' + (q.ladder.revealed ? ' reveal' : ''))));
  if(q.ladder.revealed){ el.cashbox.querySelectorAll('.coin').forEach(c => c.classList.toggle('reveal', need.includes(+c.dataset.v))); }
  return need;
}
function countUpHTML(from, coins){ // "75 → 100 → 200" with the coin used for each hop
  let cur = from, line = `<span class="from">${fmt(from)}</span>`;
  coins.slice().sort((a,b)=>a-b).forEach(v => { cur += v; line += `<i>→</i><span class="${cur===from+coins.reduce((a,b)=>a+b,0)?'to':''}">${fmt(cur)}</span>`; });
  return `<div class="nline">${line}</div>`;
}
function countUpSegs(from, coins){ // "twenty-five, then five cents more makes thirty, …"
  let cur = from; const segs = [MS(from)];
  coins.slice().sort((a,b)=>a-b).forEach(v => { cur += v; segs.push(',', 'LS64', M(v), 'LS65', MS(cur)); });
  segs.push('.'); return segs;
}
function miss(q, whySegs){
  G.stats.wrong++; q.lastWrong = whySegs;
  if(!reacting){ const name = reactionFor('wrong'); react(name, {situation:'wrong'}); }
  q.ladder.wrong();
}
function showMiss(q, second){
  const why = q.lastWrong || [];
  if(q.mode === 'pay' || q.mode === 'change'){
    const need = ghostRemaining(q);
    const hops = q.tray.concat(need); // coins already given, then the ones still needed
    setHint(q.mode === 'change' ? `Count up from ${fmt(q.price)} to ${fmt(q.paid)}:` + countUpHTML(q.price, hops) : `Fill the ghost coins:` + countUpHTML(trayTotal(q), need));
    const sp = q.mode === 'change' ? countUpSegs(q.price, hops) : ['LS61', CW(need), '.'];
    if(!second) coachSay([pick(TRY_AGAIN)].concat(why, sp), 'happy');
    else coachSay(['LS63', 'LS61', CW(need), '.'].concat(sp, ['LS62']), 'happy', `Tap ${coinWords(need)}. Then tap Give it ✓`);
  } else if(q.mode === 'count' || q.mode === 'profit'){
    let cur = 0; const hops = q.coins.map(v => { cur += v; return cur; });
    setHint(`Count the coins together:<div class="nline">${hops.map((h,i)=>`<span class="${i===hops.length-1?'to':''}">${fmt(h)}</span>`).join('<i>→</i>')}</div>`);
    const sp = ['LS66'].concat(...hops.map(v => [MS(v), ','])).concat(['.']);
    if(!second) coachSay([pick(TRY_AGAIN), 'LS74'].concat(sp, ['LS67']), 'happy');
    else { revealChoice(q); coachSay(['LS68', M(q.target), '!'].concat(sp, ['LS61', M(q.target), '.']), 'happy', `It’s ${fmt(q.target)}! Tap ${fmt(q.target)}.`); }
  } else if(q.mode === 'buy'){
    let cur = q.budget; const steps = q.items.map(it => { cur -= it.price; return `<span>${fmt(cur)}</span>`; });
    setHint(`Start with ${fmt(q.budget)} and take away each price:<div class="nline"><span class="from">${fmt(q.budget)}</span><i>→</i>${steps.join('<i>→</i>')}</div>`);
    let c2 = q.budget; const sp = ['LS69', M(q.budget), '.'].concat(...q.items.map(it => { c2 -= it.price; return ['LS70', M(it.price), 'LS71', ITEM_ID[it.id], ',', 'LS72', M(c2), '.']; }));
    if(!second) coachSay([pick(TRY_AGAIN), 'LS75'].concat(sp), 'happy');
    else { revealChoice(q); coachSay([M(q.target), 'LS73'].concat(sp, ['LS61', M(q.target), '.']), 'happy', `${fmt(q.target)} is left! Tap ${fmt(q.target)}.`); }
  }
  if(second && q.mode === 'count'){ // count all the coins for them so only the total is left to tap
    el.tray.querySelectorAll('.coin:not(.counted)').forEach(c => { const v = +c.dataset.v; c.classList.add('counted'); q.counted++; c.querySelector('.tick').textContent = fmt(q.coins.slice(0,q.counted).reduce((a,b)=>a+b,0)); });
    updateTotal(q); if(!el.choices.children.length) el.choices.innerHTML = q.choices.map(v => `<button class="pick" data-v="${v}">${fmt(v)}</button>`).join(''); revealChoice(q);
  }
}
function revealChoice(q){ const b = el.choices.querySelector(`.pick[data-v="${q.target}"]`); if(b) b.classList.add('reveal'); }

/* ---------- solve + celebrate ---------- */
function solve(q){
  if(q.solved) return; q.solved = true; busy = true; UI.nudge.clear(); setHint(''); clearReveals();
  el.tray.querySelectorAll('.coin.ghost').forEach(g => g.remove());
  if(q.graded){ G.stats.questions++; if(q.ladder.firstTry) G.stats.firstTry++; }
  S.ding(); FX.burst(66, 45, {kind:'confetti', count:18}); FX.burst(66, 45, {kind:'stars', count:6});
  if(q.mode === 'profit'){
    const d = G.day; d.profit = d.made - d.spent;
    el.info.innerHTML = `<div class="box"><small>Spent</small><strong>${fmt(d.spent)}</strong></div><div class="box"><small>Made</small><strong>${fmt(d.made)}</strong></div><div class="box ok"><small>Profit</small><strong>${fmt(d.profit)}</strong></div>`;
    el.choices.innerHTML = '';
    const line = d.profit > 0 ? ['LS76', M(d.spent), 'LS77', M(d.made), '.', 'LS78', M(d.profit), 'LS79'] : ['LS76', M(d.spent), 'LS77', M(d.made), '.', 'LS80'];
    coachSay([M(d.made), '!'].concat(line), 'happy', `Spent ${fmt(d.spent)}, made ${fmt(d.made)}. Profit: ${fmt(d.profit)}!`);
    UI.toast(`${fmt(d.profit)} profit!`);
    if(!reacting) react(reactionFor('right'), {situation:'right'});
  } else if(q.mode === 'buy'){
    if(G.day) G.day.spent = q.spent; // a stand day: what the supplies cost comes off the profit later
    const p = pick(PRAISE); coachSay([p, M(q.target), 'LS36'], 'happy', `${L[p]} ${fmt(q.target)} left.`);
    if(!reacting) react(reactionFor('right'), {situation:'right'});
  } else {
    const p = pick(PRAISE); coachSay([p, M(q.target), '!'], 'happy', `${L[p]} ${fmt(q.target)}!`);
  }
  setTimeout(()=>{ if(G && G.q === q) q.resolve(); }, q.mode === 'profit' ? 2600 : 900);
}
async function celebrate(q, myRun){
  const ok = () => alive(myRun);
  if(!q.cust){ if(reacting) await reacting; await wait(300); return; }
  el.customer.classList.add('served'); C.mood(cust, 'happy'); S.tone(300, 0.3, {type:'sawtooth', gain:0.04, slide:900});
  const t = pick(THANKS); bubble(L[t], [t], {babble:false});
  G.served++; UI.chip('served', G.served);
  await wait(500); if(!ok()) return;
  await react(reactionFor('drink'), {situation:'drink'}); if(!ok()) return;              // how they like their lemonade
  if(Math.random() < 0.35 && reactionFor('robo')) { await react('lemonEye', {situation:'robo'}); if(!ok()) return; }  // Robo squeezes one more lemon…
  hideBubble(); await exitToot(ok); if(!ok()) return;                                       // the signature toot on the way out
  el.customer.classList.add('walking', q.cust.persona.walk); el.customer.style.left = '105%';
  UI.show('v-wait'); el.waitEm.textContent = '👋'; el.waitText.textContent = 'Bye bye!'; UI.coach(L.LS85, null, false);
  const t0 = performance.now();
  while(performance.now() - t0 < 1200){ FX.burstAt(cust, {kind:'puff', ax:0.1, ay:0.85, count:4, dir:[110,200]}); if(Math.random() < 0.5) fartLog.push(S.play('fart')); await wait(rnd(240,380)); if(!ok()) return; }
  el.customer.className = 'toot-actor customer';
}

/* ---------- level complete (engine card: Next level · Play again · Choose level · All done for today) ---------- */
const IDEAS = ['go find some real coins and sort them by size','go make some real lemonade with a grown-up','go draw a picture of Robo squeezing lemons','go play outside for a bit','go get a drink of water and a stretch'];
function finishLevel(){
  G.complete = true; G.step = 'done'; busy = false; UI.nudge.clear();
  const s = G.stats, stars = UI.stars(s.firstTry, s.questions), n = G.n, last = n >= LEVELS.length;
  const P = UI.progress.data; P.unlocked = Math.max(P.unlocked || 1, Math.min(n+1, LEVELS.length)); P.stars[n] = Math.max(P.stars[n]||0, stars); UI.progress.save();
  const msgId = stars===3 ? 'LS89' : stars===2 ? 'LS90' : 'LS91';
  const d = G.day;
  const profitFact = d && d.profit !== null ? `<div class="fact">Spent <b>${fmt(d.spent)}</b> · Made <b>${fmt(d.made)}</b> · Profit <b>${fmt(d.profit)}</b></div>` : '';
  const who = G.q && G.q.cust ? G.q.cust.id : 'bear';
  if(n === 8) el.robot.classList.add('juggle');
  const r = UI.levelComplete({ n, stars, save:false, hero:'robo ' + who, title: n === 8 ? 'Lemon parade!' : 'Stand closed!', subtitle:`Level ${n} done!`, msg:L[msgId], speak:false, last,
    fact:`${profitFact}<div class="fact">Served <b>${G.served}</b> customers · <b>${s.firstTry}</b> of <b>${s.questions}</b> right first time</div>`,
    onNext: ()=>startLevel(n+1), onReplay: ()=>startLevel(n), onLevels: showLevels, onDone: showTitle,
    goodbye: { hero:'👋🍋', idea: pick(IDEAS), text:`The stand is closed for now. Stretch your arms, ${pick(IDEAS)}. Robo will be here when you come back.` } });
  if(n === 8){ // the lemon parade: lemons and the cast, drawn
    const parade = h(`<div class="parade" aria-hidden="true"></div>`);
    ['bear','rabbit','robo','fox'].forEach((c, i) => { parade.appendChild(h(`<span class="lemon">${LEMON}</span>`)); parade.appendChild(C.make(c, { autoBlink:false })); }); parade.appendChild(h(`<span class="lemon">${LEMON}</span>`));
    const st = q1(refs.card, '.stars'); if(st) st.parentNode.insertBefore(parade, st);
  }
  say([n === 8 ? 'LS87' : 'LS86', 'LS2', 'n_'+n, 'LS88', msgId].concat(r.breakTime ? [`You’ve done ${r.sitting} levels. Time for a break?`] : []));
  const done = $('#btn-done', refs.card); if(done) done.addEventListener('click', () => { run++; G = null; busy = false; UI.nudge.clear(); });
}

/* ---------- cards (engine overlays) ---------- */
function showTitle(){
  run++; G = null; busy = false; UI.nudge.clear(); UI.show('v-wait'); el.waitEm.innerHTML = LEMON; el.waitText.textContent = 'Tap Play to open the stand!';
  UI.title({ hero:'robo bear', title:'Lemonade Stand', playLabel:'Play! 🍋',
    blurb:'Count the coins, pay for lemonade, make change, buy the lemons… and find out if your stand made a profit! Robo squeezes the lemons (and sometimes squirts himself in the eye).',
    fact:'Canadian coins: <b>5¢</b> nickels · <b>10¢</b> dimes · <b>25¢</b> quarters · <b>$1</b> loonies · <b>$2</b> toonies · <b>$5</b> and <b>$10</b> bills',
    onPlay: ()=>startLevel(Math.min(UI.progress.data.unlocked || 1, LEVELS.length)), onLevels: showLevels, grownups: showGrownups });
}
function showGrownups(){
  UI.grownups({ onBack: showTitle, html: `<b>What it teaches</b> (Canadian money: nickels, dimes, quarters, loonies, toonies, $5 and $10 bills — no pennies, so every amount is a multiple of 5¢)<ul>
      ${LEVELS.map((l,i)=>`<li>Level ${i+1} <b>${l.title}</b>: ${l.teach}</li>`).join('')}
      <li>Money is always said the way we say it: “seventy-five cents”, “two dollars and twenty-five cents”, “a loonie”.</li></ul>
    <b class="sub">How it helps without nagging</b><ul>
      <li>First miss: a picture hint (ghost coins in the tray, or a count-up line). Second miss: the answer, to tap. Nobody fails.</li>
      <li>Paying too much just bounces the coin back gently. The stand does the silly reactions, never the child.</li>
      <li>If your child stops for a while, the instruction is repeated and the thing to tap wiggles.</li></ul>` });
}
function showLevels(){
  run++; G = null; busy = false; UI.nudge.clear();
  UI.levels({ count: LEVELS.length, level: n => ({ title: LEVELS[n-1].title, tags: LEVELS[n-1].ops }), onPick: n => { S.ensure(); startLevel(n); }, onBack: showTitle });
}

/* ---------- pointer wiring ---------- */
el.cashbox.addEventListener('click', e => { const b = e.target.closest('.coin'); if(b) tapCoin(+b.dataset.v); });
el.tray.addEventListener('click', e => {
  const c = e.target.closest('.coin'); if(!c || !playable() || c.classList.contains('ghost') || c.classList.contains('bounce')) return;
  const q = G.q;
  if(q.mode === 'count' || q.mode === 'collect' || q.mode === 'profit'){ if(!c.classList.contains('counted')) countCoin(c); }
  else removeFromTray(c);
});
el.choices.addEventListener('click', e => { const b = e.target.closest('.pick'); if(b) choose(+b.dataset.v); });
el.items.addEventListener('click', e => { const b = e.target.closest('.item'); if(b) buy(b.dataset.id); });
el.give.addEventListener('click', submit);
el.robot.addEventListener('pointerdown', e => { if(e.target.closest('.bubble')) return; if(G && !reacting && reactionFor('robo')) react('lemonEye', {situation:'tap'}); });

/* ---------- boot ---------- */
showTitle();

// debug hooks for automated testing
window.__game = {
  startLevel, tapCoin, choose, submit, pickPrice, buy, showTitle, showLevels, spoken, fmt, sayMoney, coinSVG,
  react: (name, ctx) => react(name, ctx || {}), idle: runIdle, reactions: Object.keys(REACTIONS).map(k => ({ name:k, kind:REACTIONS[k].kind })), voiceLines: L, textOf,
  get sittingLevels(){ return UI.sitting; },
  get data(){ return {LEVELS, CUSTOMERS, DENOMS, PERSONA}; },
  get state(){
    const extra = { reactionLog: reactionLog.slice(), lastReaction, reacting: !!reacting, fartLog: fartLog.slice(), speed: Toot.speed };
    if(!G) return Object.assign({level:null, complete:false, step:'title', mode:null, target:null, tray:0, solved:false}, extra);
    const q = G.q || {}, ld = q.ladder || {attempts:0, hinted:false, revealed:false};
    return Object.assign({level:G.n, title:G.cfg.title, step:G.step, complete:G.complete, busy, served:G.served, total:G.queue.length, index:G.i, stats:Object.assign({}, G.stats),
      mode:q.mode || null, target:q.target ?? null, tray:(q.tray||[]).reduce((a,b)=>a+b,0), trayCoins:(q.tray||[]).slice(), coins:(q.coins||[]).slice(), counted:q.counted||0,
      solved:!!q.solved, wrong:ld.attempts, hint:ld.revealed ? 2 : ld.hinted ? 1 : 0, revealed:!!ld.revealed, graded:!!q.graded, customer:q.cust ? q.cust.name : null, idled:!!q.idled,
      options:[...el.choices.querySelectorAll('.pick')].map(b => +b.dataset.v), price:q.price ?? (G.day ? G.day.price : null), paid:q.paid ?? null, boxDenoms:(q.boxDenoms||[]).slice(),
      prices:(q.prices||[]).slice(), items:(q.items||[]).map(i=>({id:i.id, price:i.price})), budget:q.budget ?? null,
      day:G.day ? {price:G.day.price, spent:G.day.spent, made:G.day.made, profit:G.day.profit} : null}, extra);
  }
};
})();
</script>
