<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zookeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --heat-cool:#5CC8FF; --heat-warm:#FFB703; --heat-hot:#FF3B3B; --grass:#8BD36F;
  --shadow: 0 6px 0 rgba(59,42,31,.16);
  --display: 'Fredoka','Nunito',system-ui,sans-serif;
  --body: 'Nunito','Fredoka',system-ui,sans-serif;
  --ar:16/9; --arn:1.7778; --maxh:68vh;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#app,#overlay{user-select:none;-webkit-user-select:none}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid #2A7BFF;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

#app{max-width:1280px;margin:0 auto;padding-block:10px 16px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.logo .brand{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--cocoa-soft);line-height:1;font-weight:700}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
#zoowrap{flex:1 1 160px;min-width:120px;display:flex;align-items:center;gap:8px}
#zoowrap label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
#zoobar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
#zoofill{height:100%;width:0%;background:linear-gradient(90deg,var(--grass),var(--mint));border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
#zoopct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa);font-variant-numeric:tabular-nums}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}

/* ---------- stage ---------- */
#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media (max-width:900px){#stage{grid-template-columns:1fr}}
#scene{position:relative;width:min(100%,calc(var(--maxh) * var(--arn)));margin-inline:auto;aspect-ratio:var(--ar);container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.sky{position:absolute;left:0;right:0;top:0;height:17cqw;background:linear-gradient(#9FDBFF,#DFF3FF)}
.sky .sun{position:absolute;right:20%;top:1.2cqw;width:4.5cqw;height:4.5cqw;border-radius:50%;background:var(--sun);box-shadow:0 0 2cqw rgba(255,200,61,.8)}
.sky .cloud{position:absolute;top:1cqw;font-size:3cqw;line-height:1;opacity:.9}
.sky .zoosign{position:absolute;left:2cqw;top:1.2cqw;background:#fff;border-radius:1cqw;padding:.2cqw 1.2cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.2cqw,16px);color:var(--ketchup);box-shadow:0 .4cqw 0 rgba(59,42,31,.12);white-space:nowrap}
.sky .zoosign::after{content:"";position:absolute;left:50%;top:100%;width:.6cqw;height:2.4cqw;background:var(--wood-dark);transform:translateX(-50%)}
.path{position:absolute;left:0;right:0;top:11cqw;height:6cqw;background:repeating-linear-gradient(90deg,#E6C48F 0 4cqw,#DDB77C 4cqw 8cqw);border-top:.5cqw solid #CFA76A}
.path::after{content:"";position:absolute;left:0;right:0;top:45%;height:.5cqw;background:repeating-linear-gradient(90deg,#fff 0 3cqw,transparent 3cqw 6cqw);opacity:.6}

.zones{position:absolute;left:1.5cqw;right:1.5cqw;top:18cqw;bottom:1.5cqw;display:grid;gap:1.4cqw}
.zones.n2{grid-template-columns:1fr 1fr}
.zones.n3{grid-template-columns:repeat(3,1fr)}
.zones.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.zones.n5,.zones.n6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.zone{position:relative;border-radius:2.4cqw;overflow:hidden;box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.55),0 .5cqw 0 rgba(59,42,31,.12);transition:transform .2s,box-shadow .2s;cursor:pointer;touch-action:manipulation}
.zone[data-h=savanna]{background:linear-gradient(#FFE9A8,#E9C76A 60%,#D9A94E)}
.zone[data-h=ice]{background:linear-gradient(#F4FBFF,#BDE8FF 60%,#9BD4F5)}
.zone[data-h=desert]{background:linear-gradient(#FFE3B0,#F6C77A 60%,#E7A85A)}
.zone[data-h=jungle]{background:linear-gradient(#B9E88A,#6DBE57 60%,#4E9E44)}
.zone[data-h=ocean]{background:linear-gradient(#9FDBFF,#4FB3E8 55%,#2B86C5)}
.zone[data-h=pond]{background:linear-gradient(#D6F2DE,#8FD3C1 55%,#5FB8B0)}
.zone[data-h=forest]{background:linear-gradient(#CDEBB6,#8FCB7A 60%,#5E9E5A)}
.zone[data-h=cave]{background:linear-gradient(#6B5C8A,#4A4064 60%,#2E2842)}
.zone .deco{position:absolute;font-size:5cqw;line-height:1;opacity:.85;pointer-events:none}
.zone .deco.a{left:4%;top:6%}
.zone .deco.b{right:4%;top:6%;font-size:4cqw}
.zone .zlabel{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);background:rgba(255,255,255,.88);color:var(--cocoa);border-radius:999px;padding:.3cqw 1.4cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.3cqw,17px);white-space:nowrap;pointer-events:none;box-shadow:0 .3cqw 0 rgba(59,42,31,.12)}
.zone .residents{position:absolute;left:5%;bottom:22%;display:flex;gap:.2cqw;font-size:4.2cqw;line-height:1;pointer-events:none}
.zone .residents span{display:inline-block;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 .3cqw 0 rgba(59,42,31,.18))}
.zone.hot{transform:scale(1.03);box-shadow:inset 0 0 0 .8cqw #fff,0 0 0 .8cqw rgba(47,191,166,.7)}
.zone.glow{animation:glow 1.2s infinite alternate}
@keyframes glow{from{box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.55),0 0 0 .4cqw rgba(47,191,166,.4)}to{box-shadow:inset 0 0 0 .8cqw #fff,0 0 0 1.2cqw rgba(47,191,166,.85),0 0 3cqw rgba(47,191,166,.9)}}
.zone.landed{animation:landed .5s}
@keyframes landed{0%,100%{transform:scale(1)}40%{transform:scale(1.05)}}
.zone .arrow{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:7cqw;line-height:1;display:none;pointer-events:none;z-index:7;filter:drop-shadow(0 .4cqw 0 rgba(59,42,31,.25))}
.zone.arrow .arrow{display:block;animation:tap 1s infinite}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.6cqw)}}

.crate{position:absolute;left:-22%;top:2.4cqw;width:16cqw;height:13cqw;transition:left 1.6s cubic-bezier(.4,.1,.5,1);z-index:4}
.crate .box{position:absolute;inset:0 0 2.2cqw 0;background:repeating-linear-gradient(0deg,#C98A46 0 2.3cqw,#E0A96D 2.3cqw 3.2cqw);border:.5cqw solid #8E5A24;border-radius:1.2cqw;box-shadow:inset 0 0 0 .3cqw rgba(255,255,255,.2)}
.crate .box::before{content:"ZOO";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-6deg);font-family:var(--display);font-weight:700;font-size:2.6cqw;color:#5A3A1A;background:#fff8;padding:0 .8cqw;border-radius:.6cqw;letter-spacing:.1em}
.crate .wheels{position:absolute;left:1.5cqw;right:1.5cqw;bottom:0;height:2.4cqw;display:flex;justify-content:space-between;font-size:2.2cqw;line-height:1}
.crate.rolling .wheels{animation:spin .3s linear infinite}
.crate.leaving{transition:left 1.4s ease-in}
@keyframes spin{to{transform:rotate(360deg)}}

.animal{position:absolute;left:42%;top:3cqw;width:14cqw;font-size:11cqw;line-height:1;text-align:center;z-index:10;touch-action:none;cursor:grab;transition:left .55s cubic-bezier(.3,1.3,.5,1),top .55s cubic-bezier(.3,1.3,.5,1),opacity .3s;opacity:0;pointer-events:none}
.animal.on{opacity:1;pointer-events:auto}
.animal.static{cursor:default}
.animal .body{display:inline-block;filter:drop-shadow(0 .8cqw 0 rgba(59,42,31,.18))}
.animal.dragging{transition:none;cursor:grabbing;z-index:20}
.animal.dragging .body{transform:scale(1.15) rotate(-4deg)}
.animal.selected .body{transform:scale(1.1);filter:drop-shadow(0 0 1cqw rgba(47,191,166,.9)) drop-shadow(0 .8cqw 0 rgba(59,42,31,.18))}
.animal.popin .body{animation:popin .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popin{0%{transform:translateY(4cqw) scale(.3)}100%{transform:translateY(0) scale(1)}}
.animal.bob .body{animation:bob 1s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.animal.shiver .body{animation:shiver .12s infinite alternate;filter:drop-shadow(0 .8cqw 0 rgba(59,42,31,.18)) hue-rotate(160deg) brightness(1.1)}
@keyframes shiver{from{transform:translateX(-.5cqw) rotate(-3deg)}to{transform:translateX(.5cqw) rotate(3deg)}}
.animal.sweat .body{animation:sweat .4s infinite alternate;filter:drop-shadow(0 .8cqw 0 rgba(59,42,31,.18)) sepia(.5) saturate(2)}
@keyframes sweat{from{transform:scale(1,1) translateY(0)}to{transform:scale(1.05,.93) translateY(.6cqw)}}
.animal.chomp .body{animation:chomp .22s infinite alternate}
@keyframes chomp{from{transform:scale(1,1)}to{transform:scale(1.08,.92) translateY(.6cqw)}}
.animal.happy .body{animation:happy .5s 2}
@keyframes happy{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-1.2cqw)}75%{transform:rotate(8deg) translateY(-1.2cqw)}}
.animal.yuck .body{animation:yuck .6s;filter:drop-shadow(0 .8cqw 0 rgba(59,42,31,.18)) hue-rotate(70deg)}
@keyframes yuck{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg) scale(.92,1.1)}60%{transform:rotate(10deg) scale(1.08,.9)}}
.animal .mood{position:absolute;right:-8%;top:-14%;font-size:.42em;line-height:1;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1);pointer-events:none}
.animal .mood.show{opacity:1;transform:scale(1)}
.animal .hand{position:absolute;left:50%;top:70%;font-size:.5em;line-height:1;transform:translateX(-50%);animation:tap 1s infinite;pointer-events:none;display:none}
.animal.hint .hand{display:block}

.bubble{position:absolute;left:104%;top:-2%;width:max-content;min-width:14cqw;max-width:31cqw;background:#fff;border-radius:2cqw;padding:1.1cqw 1.5cqw;font-family:var(--body);font-size:clamp(10px,2.2cqw,19px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 0;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:none;z-index:26}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;top:1.6cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble.flip{left:auto;right:104%;transform-origin:100% 0}
.bubble.flip::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.bubble .big{font-size:1.5em;line-height:1.15;display:block;margin-top:.2em}

.robot{position:absolute;left:84%;top:5.5cqw;width:9cqw;font-size:8cqw;line-height:1;text-align:center;z-index:9;transition:left 1.1s ease-in-out,top 1.1s ease-in-out}
.robot .bot{display:inline-block;position:relative;filter:drop-shadow(0 .5cqw 0 rgba(59,42,31,.2))}
.robot .wheels{font-size:.32em;letter-spacing:-.4em;display:block;margin-top:-.3em;opacity:.8}
.robot.driving .bot{animation:drive .18s infinite alternate}
.robot.driving .wheels{animation:spin .3s linear infinite}
@keyframes drive{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-.5cqw) rotate(2deg)}}
.robot .scoop{position:absolute;right:-32%;bottom:0;font-size:.6em;opacity:0;transform-origin:bottom;transition:opacity .2s}
.robot.driving .scoop{opacity:1;animation:sweep .25s infinite alternate}
@keyframes sweep{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.robot .steam{position:absolute;left:50%;top:-20%;font-size:.5em;opacity:0;pointer-events:none}
.robot .steam.go{animation:steam .9s forwards}
@keyframes steam{0%{opacity:.9;transform:translate(-50%,0) scale(.7)}100%{opacity:0;transform:translate(-30%,-2.5em) scale(1.4)}}
.robot .rbubble{position:absolute;left:100%;bottom:90%;width:max-content;max-width:24cqw;background:#fff;border-radius:1.6cqw;padding:.7cqw 1.2cqw;font-family:var(--body);font-size:clamp(9px,1.9cqw,15px);font-weight:800;line-height:1.2;box-shadow:0 .4cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s;white-space:normal;text-align:left;pointer-events:none}
.robot .rbubble.show{opacity:1;transform:scale(1)}
.robot .rbubble.flip{left:auto;right:100%;transform-origin:100% 100%}

.poop{position:absolute;font-size:4.5cqw;line-height:1;z-index:7;transition:transform .35s,opacity .35s;animation:popin .5s cubic-bezier(.2,1.6,.4,1) both;filter:drop-shadow(0 .3cqw 0 rgba(59,42,31,.2))}
.poop.gone{transform:scale(0) rotate(180deg);opacity:0}
.puff{position:absolute;width:7cqw;height:7cqw;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(190,235,110,.95),rgba(140,200,70,.65) 55%,rgba(120,180,50,0) 75%);animation:puff 1.3s forwards;z-index:12;pointer-events:none;display:grid;place-items:center;font-size:2.4cqw}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(3cqw,-7cqw) scale(1.7)}}
.spark{position:absolute;font-size:4cqw;line-height:1;animation:spark 1.4s cubic-bezier(.2,.8,.3,1) forwards;z-index:9;pointer-events:none}
@keyframes spark{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.flyfood{position:absolute;font-size:6cqw;line-height:1;z-index:25;pointer-events:none;transition:left .55s cubic-bezier(.3,.8,.4,1),top .55s cubic-bezier(.3,.8,.4,1),transform .3s,opacity .3s}
.flyfood.bounce{animation:bounceaway .7s forwards}
@keyframes bounceaway{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* ---------- panel ---------- */
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:38px;height:38px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}
.view{display:none;flex-direction:column;gap:10px}
.view.on{display:flex}

.animalcard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:8px 12px;box-shadow:0 0 0 2px rgba(59,42,31,.08)}
.animalcard .em{font-size:3rem;line-height:1}
.animalcard .nm{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.1}
.animalcard .snd{font-weight:800;color:var(--ketchup);font-size:.95rem}
.zonebtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.zonebtns .subbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px}
.bowls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bowl{width:60px;height:60px;border-radius:18px;border:3px dashed rgba(59,42,31,.3);display:grid;place-items:center;font-size:2rem;position:relative;background:rgba(255,226,154,.35);line-height:1}
.bowl .ghost{opacity:.35}
.bowl.filled{border-style:solid;border-color:var(--mint);background:#E4FBF5;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.mitem{background:#fff;border-radius:18px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:84px;transition:transform .15s;min-width:44px}
.mitem:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.mitem .em{font-size:2rem;line-height:1}
.mitem .nm{font-size:.75rem;font-weight:800;color:var(--cocoa-soft);text-align:center}
.mitem.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mitem.wiggle{animation:wiggle .7s infinite;box-shadow:0 4px 0 var(--mint-dark),0 0 0 3px var(--mint)}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) scale(1.05)}75%{transform:rotate(5deg) scale(1.05)}}
.mitem.done{opacity:.4;pointer-events:none}
.mitem.correct{box-shadow:0 4px 0 var(--mint-dark),0 0 0 3px var(--mint)}
.factcard{background:#fff;border-radius:16px;padding:12px 14px;font-weight:800;font-size:1.05rem;line-height:1.35;display:flex;gap:10px;align-items:center;box-shadow:0 0 0 2px rgba(59,42,31,.08)}
.factcard .em{font-size:2.6rem;line-height:1;flex:none}
.factcard b{color:var(--ketchup)}
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t+dur);
    const g = c.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  return {
    ensure, get enabled(){ return enabled; }, set enabled(v){ enabled = v; },
    pop(){ tone(600,0.08,{type:'triangle',gain:0.12,slide:900}); },
    ding(){ tone(1046,0.35,{gain:0.16}); tone(1568,0.5,{gain:0.1,delay:0.08}); },
    yay(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.18,{type:'triangle',gain:0.14,delay:i*0.09})); },
    oops(){ tone(330,0.18,{type:'triangle',gain:0.1}); tone(262,0.25,{type:'triangle',gain:0.1,delay:0.16}); },
    chomp(){ noise(0.09,{gain:0.1,from:1200,to:300}); tone(160+Math.random()*60,0.08,{type:'square',gain:0.04}); },
    shiver(){ [440,415,440,415].forEach((f,i)=>tone(f,0.07,{type:'triangle',gain:0.08,delay:i*0.08})); },
    splash(){ noise(0.35,{gain:0.15,from:2500,to:500}); },
    plop(){ tone(220,0.15,{type:'sine',gain:0.15,slide:90}); },
    scoop(){ noise(0.18,{gain:0.12,from:3500,to:800}); tone(880,0.1,{type:'triangle',gain:0.06,delay:0.1,slide:1400}); },
    steam(){ noise(0.4,{gain:0.06,from:5000,to:1500}); },
    boom(){ noise(1.5,{gain:0.6,from:4000,to:60}); tone(70,1,{type:'sine',gain:0.5,slide:30}); },
    fanfare(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.25,{type:'triangle',gain:0.16,delay:i*0.12})); tone(1568,0.7,{type:'triangle',gain:0.16,delay:0.62}); },
    fart(){
      const c = ensure(); if(!c || !enabled) return;
      const t = c.currentTime, dur = 0.22 + Math.random()*0.4, base = 55 + Math.random()*75;
      const o = c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base*0.55, t+dur);
      const lfo = c.createOscillator(); lfo.type='sine'; lfo.frequency.value = 16+Math.random()*22;

      const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 360; f.Q.value = 7;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(f).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
    },
    whirr(dur){

      const t = c.currentTime;

      const lfo = c.createOscillator(); lfo.frequency.value = 11; const lg = c.createGain(); lg.gain.value = 18; lfo.connect(lg).connect(o.frequency);
      const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 650;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.05,t+0.1); g.gain.setValueAtTime(0.05,t+Math.max(0.2,dur-0.2)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(f).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t+dur); lfo.stop(t+dur);

})();

/* ---------- read-aloud ---------- */
const Voice = (() => {
  let enabled = true, voice = null;
  const has = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function pickVoice(){
    if(!has) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/^en/i.test(v.lang) && /Google US|Samantha|Karen|Zira|Aria|Jenny|Female/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  }
  if(has){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function clean(text){
    let t = String(text);
    t = t.replace(/\bKA[- ]?BOOM\b/gi, 'kaboom').replace(/\bKa[- ]ching\b/gi, 'ka ching');
    const N = '(\\$?\\d+)';
    t = t.replace(new RegExp(N+'\\s*[×x]\\s*'+N,'g'), '$1 times $2').replace(/×/g, ' times ');
    t = t.replace(/÷/g, ' divided by ');
    t = t.replace(new RegExp(N+'\\s*\\+\\s*'+N,'g'), '$1 plus $2').replace(/\+/g, ' and ');
    t = t.replace(new RegExp(N+'\\s*[−–-]\\s*'+N,'g'), '$1 take away $2');
    t = t.replace(/−/g, ' take away ').replace(/[–—]/g, ' ').replace(/(\S)-(\S)/g, '$1 $2');
    t = t.replace(/\$(\d+)/g, '$1 dollars');
    t = t.replace(/=\s*\?/g, ' equals what?').replace(/=/g, ' equals ');
    t = t.replace(/[✓✔]/g, ' the green check ').replace(/→/g, ' to ').replace(/&/g, ' and ').replace(/[·•]/g, ', ').replace(/…/g, ', ');
    t = t.replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{1F1E6}-\u{1F1FF}\u{E0020}-\u{E007F}]/gu, ' ');
    t = t.replace(/[^\p{L}\p{N}\s.,!?'’:%]/gu, ' ');
    return t.replace(/\s+/g, ' ').replace(/\s([.,!?])/g, '$1').replace(/^[\s.,]+/, '').trim();
  }
  let last = '';
  return {
    get enabled(){ return enabled; }, set enabled(v){ enabled = v; if(!v && has) speechSynthesis.cancel(); },
    get last(){ return last; }, get rate(){ return 0.9; }, clean,
    say(text, onEnd){
      if(!enabled || !has){ if(onEnd) setTimeout(onEnd, 0); return; }
      try{
        speechSynthesis.cancel(); const t = clean(text); last = t;
        const u = new SpeechSynthesisUtterance(t); u.rate = 0.9; u.pitch = 1.1; if(voice) u.voice = voice;
        let done = false; const fin = ()=>{ if(!done){ done = true; if(onEnd) onEnd(); } };
        u.onend = fin; u.onerror = fin; setTimeout(fin, Math.min(12000, 1500 + t.length*70)); // fallback if the engine never fires onend
        speechSynthesis.speak(u);
      }catch(e){ if(onEnd) setTimeout(onEnd, 0); }
    },
    force(text, onEnd){ const was = enabled; enabled = true; this.say(text, onEnd); enabled = was; }
  };
})();

function levelConfig(n){
  if(n <= LEVELS.length) return Object.assign({n}, LEVELS[n-1]);
  const k = n - LEVELS.length;
  return Object.assign({}, LEVELS[LEVELS.length-1], {n, title:'Super Keeper '+k, quiz:3});
}
function pickAnimals(cfg){
  const pool = ANIMALS.filter(a=>cfg.tiers.includes(a.tier));
  const habIds = Object.keys(HABITATS);
  // choose the habitat zones first, so the animals drawn always fit on screen
  let zones = null;
  for(let t=0;t<60 && !zones;t++){
    const cand = shuffle(habIds).slice(0, cfg.zones);
    if(pool.filter(a=>cand.includes(a.habitat)).length >= cfg.animals) zones = cand;
  }
  if(!zones){ // fallback: the most populated habitats for this tier
    const counts = {}; pool.forEach(a=>{ counts[a.habitat]=(counts[a.habitat]||0)+1; });
    zones = habIds.slice().sort((a,b)=>(counts[b]||0)-(counts[a]||0)).slice(0, cfg.zones);
  }
  const chosen = shuffle(pool.filter(a=>zones.includes(a.habitat))).slice(0, cfg.animals);
  return {animals:chosen, zones:shuffle(zones)};
}
function makeFoods(cfg, animal){
  const correct = shuffle(animal.diet).slice(0, Math.min(cfg.maxCorrect, animal.diet.length));
  let pool = Object.keys(FOODS).filter(f=>!animal.diet.includes(f));
  if(cfg.easyFoods){
    const kind = FOODS[animal.diet[0]].kind;
    const far = pool.filter(f=>FOODS[f].kind!==kind);
    if(far.length >= cfg.foods - correct.length) pool = far;
  }
  const distract = shuffle(pool).slice(0, cfg.foods - correct.length);
  return {correct, foods:shuffle(correct.concat(distract))};
}
function wrongMsg(animal, zoneId){
  const z = HABITATS[zoneId], home = HABITATS[animal.habitat];
  if(z.water && home.water) return zoneId==='ocean' ? 'Glub, too salty!' : 'Too small! I need the big sea!';
  if(home.water && !z.water) return 'I need water! Splish splash!';
  if(home.dark && (z.hot || zoneId==='savanna')) return 'Too bright! My eyes!';
  if(home.cold && z.hot) return 'Phew, too hot! I’m melting!';
  if(home.hot && z.cold) return 'Brr, too cold! Achoo!';
  return z.msg;
}

/* ---------- habitat placing ---------- */
async function placeIn(zoneId){
  if(!G || G.step!=='habitat' || G.busy || !HABITATS[zoneId] || !G.zones.includes(zoneId)) return false;
  const a = G.animal, zone = zoneEl(zoneId);
  G.busy = true; el.animal.classList.remove('selected','dragging','bob','hint'); clearHints();
  const t = zoneTarget(zoneId); moveAnimal(t.left, t.top);
  if(zoneId === a.habitat){
    await wait(450);
    zone.classList.add('landed'); setTimeout(()=>zone.classList.remove('landed'),600);
    Sound.yay(); toast(pick(PRAISE));
    const firstTry = G.wrongHabitat===0; G.stats.questions++; if(firstTry) G.stats.firstTry++;
    el.animal.classList.add('happy'); setTimeout(()=>el.animal.classList.remove('happy'),1100);
    bubble(`${HABITATS[zoneId].name}! ${pick(['Home sweet home!','I love it here!','Yay, my home!'])}`, `${HABITATS[zoneId].name}! Home sweet home!`);
    setMood('😊');
    const r = G.habitatResolve; G.habitatResolve = null; if(r) r(); // G.busy stays true until feeding starts
    return true;
  }
  // wrong zone: shiver / sweat, complain, hop back
  G.wrongHabitat++; G.stats.wrong++;
  const h = HABITATS[zoneId], msg = wrongMsg(a, zoneId);
  await wait(450);
  Sound.oops(); if(h.cold) Sound.shiver(); else if(h.water) Sound.splash();
  el.animal.classList.add(h.anim); setMood(h.mood);
  bubble(msg, msg);
  if(h.water) for(let i=0;i<3;i++) spark(t.left+5+i*3, t.top+8, '💧', 6);
  if(h.hot) for(let i=0;i<3;i++) spark(t.left+4+i*3, t.top+4, '💦', 5);
  await wait(1300);
  el.animal.classList.remove(h.anim); setMood(null); hideBubble();
  homeAnimal(); Sound.pop();
  await wait(500);
  if(G.wrongHabitat === 1){ zoneEl(a.habitat).classList.add('glow'); coach(`Not there. See the glowing home? Try that one.`, '🤗'); }
  else { zoneEl(a.habitat).classList.add('glow','arrow'); coach(`The ${a.name.toLowerCase()} lives in the ${HABITATS[a.habitat].name.toLowerCase()}. Follow the arrow.`, '💛'); }
  el.animal.classList.add('bob');
  G.busy = false;
  return false;
}

/* ---------- drag & drop / tap fallback ---------- */
(function initDrag(){
  let drag = null;
  function zoneAt(x,y){
    for(const z of el.zones.querySelectorAll('.zone')){ const r = z.getBoundingClientRect(); if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return z; }
    return null;
  }
  el.animal.addEventListener('pointerdown', e => {
    if(!G || G.step !== 'habitat' || G.busy) return;
    e.preventDefault();
    const r = el.scene.getBoundingClientRect(), ar = el.animal.getBoundingClientRect();
    drag = {id:e.pointerId, ox:e.clientX-ar.left, oy:e.clientY-ar.top, sx:e.clientX, sy:e.clientY, moved:false, r};
    try{ el.animal.setPointerCapture(e.pointerId); }catch(err){}
    el.animal.classList.add('dragging'); el.animal.classList.remove('bob','hint');
  });
  el.animal.addEventListener('pointermove', e => {
    if(!drag || e.pointerId!==drag.id) return;
    if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) > 6) drag.moved = true;
    const x = (e.clientX - drag.ox - drag.r.left)/drag.r.width*100, y = (e.clientY - drag.oy - drag.r.top)/drag.r.height*100;
    moveAnimal(Math.max(-6, Math.min(92, x)), Math.max(-6, Math.min(90, y)));
    const over = zoneAt(e.clientX, e.clientY);
    el.zones.querySelectorAll('.zone').forEach(z=>z.classList.toggle('hot', z===over));
  });
  function end(e){
    if(!drag || e.pointerId!==drag.id) return;
    const moved = drag.moved, d = drag; drag = null; el.animal.classList.remove('dragging');
    el.zones.querySelectorAll('.zone').forEach(z=>z.classList.remove('hot'));
    if(moved){
      const over = e.type==='pointercancel' ? null : zoneAt(e.clientX, e.clientY);
      if(over) placeIn(over.dataset.h);
      else { homeAnimal(); el.animal.classList.add('bob'); coach('Almost! Drop it inside a home.', '🙂', false); }
    } else {
      el.animal.classList.toggle('selected');
      if(el.animal.classList.contains('selected')) coach('Now tap its home.', '👉', false);
    }
    void d;
  }
  el.animal.addEventListener('pointerup', end); el.animal.addEventListener('pointercancel', end);
  el.zones.addEventListener('pointerdown', e => {
    const z = e.target.closest('.zone'); if(!z || !G || G.step!=='habitat' || G.busy) return;
    if(el.animal.classList.contains('selected')) placeIn(z.dataset.h);
    else { el.animal.classList.add('selected'); coach(`Tap the ${G.animal.name.toLowerCase()} first. Then tap its home.`, '👉', false); }
  });
  el.zones.addEventListener('keydown', e => { const z = e.target.closest('.zone'); if(z && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); placeIn(z.dataset.h); } });
  el.zonebtns.addEventListener('click', e => { const b = e.target.closest('button[data-zone]'); if(b) placeIn(b.dataset.zone); });
})();

/* ---------- feeding ---------- */
function feed(foodId){
  if(!G || G.step!=='feed' || G.busy || !G.foods.includes(foodId)) return false;
  const btn = el.menu.querySelector(`.mitem[data-id="${foodId}"]`), f = FOODS[foodId];
  const c = animalCenter();
  if(G.correct.includes(foodId) && !G.fed.includes(foodId)){
    G.fed.push(foodId);
    if(btn){ btn.classList.add('done','correct'); btn.classList.remove('wiggle'); }
    const bowl = el.bowls.children[G.fed.length-1]; if(bowl){ bowl.classList.add('filled'); bowl.innerHTML = `<span>${f.em}</span>`; }
    flyFood(f.em, c, true);
    Sound.pop();
    setTimeout(()=>{ Sound.chomp(); el.animal.classList.add('chomp'); setMood('😋'); setTimeout(()=>{ el.animal.classList.remove('chomp'); Sound.chomp(); }, 500); }, reduced?50:500);
    if(G.fed.length >= G.need){
      G.stats.questions++; if(G.wrongFood===0) G.stats.firstTry++;
      el.menu.querySelectorAll('.mitem').forEach(b=>b.classList.remove('wiggle'));
      setTimeout(()=>{ el.animal.classList.add('happy'); setMood('😊'); const y = pick(YUM); bubble(y+' 😋', y); Sound.yay(); toast(y); setTimeout(()=>el.animal.classList.remove('happy'),1100); const r = G.feedResolve; G.feedResolve=null; if(r) r(); }, reduced?100:1100);
    } else {
      coach(G.need - G.fed.length === 1 ? 'Yum! Tap one more food.' : `Yum! Tap ${G.need - G.fed.length} more foods.`, '👩‍🌾', false);
    }
    return true;
  }
  if(G.fed.includes(foodId)) return false;
  // wrong food: face, fart, green puff, food bounces away
  G.wrongFood++; G.stats.wrong++;
  if(btn){ btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope'); }
  flyFood(f.em, c, false);
  setTimeout(()=>{
    el.animal.classList.remove('yuck'); void el.animal.offsetWidth; el.animal.classList.add('yuck'); setMood('🤢');
    Sound.fart(); Sound.oops();
    for(let i=0;i<3;i++) setTimeout(()=>puff(c.x + 4 + i*2, c.y + 4 + i*3), i*120);
    const line = pick([`Bleugh! ${G.animal.name}s don’t eat ${f.name.toLowerCase()}!`, `Yuck! Not ${f.name.toLowerCase()}!`, `Pfft! No thanks!`]);
    bubble(line+' 💨', line);
    coach(G.wrongFood>=2 ? `Look! The right food is wiggling. Tap it.` : `Oops! That made a stinky toot. Try another food.`, '🙈', false);
    if(G.wrongFood >= 2) G.correct.forEach(id=>{ const b = el.menu.querySelector(`.mitem[data-id="${id}"]`); if(b && !G.fed.includes(id)) b.classList.add('wiggle'); });
    setTimeout(()=>{ el.animal.classList.remove('yuck'); setMood(null); hideBubble(); }, 1500);
  }, reduced?50:450);
  return false;
}
function flyFood(em, c, eaten){
  const d = document.createElement('div'); d.className='flyfood'; d.textContent=em;
  d.style.left = '48%'; d.style.top = '96%'; el.fx.appendChild(d);
  requestAnimationFrame(()=>{ d.style.left = pct(c.x - 3); d.style.top = pct(c.y - 2); });
  setTimeout(()=>{
    if(eaten){ d.style.transform='scale(0)'; d.style.opacity='0'; setTimeout(()=>d.remove(), 400); }
    else { d.style.setProperty('--dx', (Math.random()<.5?-1:1)*(18+Math.random()*10)+'cqw'); d.style.setProperty('--dy', (-(Math.random()*10)-8)+'cqw'); d.classList.add('bounce'); setTimeout(()=>d.remove(), 800); }
  }, reduced?60:560);
}
el.menu.addEventListener('click', e => { const b = e.target.closest('.mitem'); if(b) feed(b.dataset.id); });

/* ---------- Robo ---------- */
function moveRobot(left, top, ms){
  el.robot.style.left = pct(left); el.robot.style.top = typeof top==='number' ? pct(top) : top;
  return wait(ms);
}
function robotSteam(){ el.steam.classList.remove('go'); void el.steam.offsetWidth; el.steam.classList.add('go'); Sound.steam(); }
async function roboScoop(myRun, poop){
  const alive = () => run === myRun;
  const pr = poop.getBoundingClientRect(), sr = el.scene.getBoundingClientRect();
  const px = (pr.left - sr.left)/sr.width*100, py = (pr.top - sr.top)/sr.height*100;
  el.robot.classList.add('driving'); Sound.whirr(2.6);
  roboSay(pick(ROBO_LINES));
  await moveRobot(Math.max(0, px - 9), Math.max(0, py - 6), 1150); if(!alive()) return;
  Sound.scoop(); poop.classList.add('gone');
  for(let i=0;i<5;i++) spark(px+2, py+2, pick(['✨','💨','⭐']), 10);
  await wait(500); if(!alive()) return;
  setTimeout(()=>poop.remove(), 400);
  // a little victory wiggle around
  await moveRobot(Math.min(88, px + 6), Math.max(0, py - 6), 500); if(!alive()) return;
  robotSteam();
  await moveRobot(84, '5.5cqw', 1150); if(!alive()) return;
  el.robot.classList.remove('driving');
}

/* ---------- main level flow ---------- */
function startLevel(n){
  run++; const myRun = run;
  const cfg = levelConfig(n);
  const {animals, zones} = pickAnimals(cfg);
  G = {cfg, n, animals, zones, round:0, settled:0, step:'idle', animal:null, foods:[], correct:[], need:0, fed:[], wrongHabitat:0, wrongFood:0, busy:false,
       stats:{questions:0,firstTry:0,wrong:0}, habitatResolve:null, feedResolve:null, factResolve:null, quiz:null, complete:false};
  el.lvlChip.textContent = n; setZooBar();
  renderZones(zones);
  el.fx.innerHTML=''; el.scene.querySelectorAll('.poop').forEach(p=>p.remove());
  el.crate.classList.remove('rolling','leaving'); el.crate.style.left='-22%';
  el.animal.className='animal'; homeAnimal(); hideBubble(); setMood(null);
  el.robot.style.left='84%'; el.robot.style.top='5.5cqw'; el.robot.classList.remove('driving');
  hideOverlay();
  coach(`Level ${n}. ${animals.length} animals are coming!`, '👩‍🌾');
  loop(myRun);
}
async function loop(myRun){
  for(const a of G.animals){
    if(run !== myRun) return;
    await animalRound(a, myRun);
  }
  if(run !== myRun) return;
  if(G.cfg.quiz){ await quizRound(myRun); if(run !== myRun) return; }
  finishLevel();
}
async function animalRound(a, myRun){
  const alive = () => run === myRun;
  const cfg = G.cfg;
  G.animal = a; G.round++; G.wrongHabitat = 0; G.wrongFood = 0; G.fed = []; G.busy = false;

  // ---- ARRIVE ----
  G.step='arrive'; show('v-wait'); el.waitEm.textContent='📦'; el.waitText.textContent='A new animal is arriving…';
  coach('A crate is coming! Who is inside?', '👩‍🌾', G.round===1 ? false : true);
  el.animalBody.textContent = a.em; el.habEm.textContent = a.em; el.habName.textContent = a.name; el.habSound.textContent = a.sound;
  el.animal.className='animal'; homeAnimal(); hideBubble(); setMood(null);
  el.crate.classList.remove('leaving'); el.crate.style.transition='none'; el.crate.style.left='-22%'; void el.crate.offsetWidth; el.crate.style.transition='';
  await wait(60); if(!alive()) return;
  el.crate.classList.add('rolling'); el.crate.style.left = pct(CRATE_LEFT); Sound.whirr(1.6);
  await wait(1650); if(!alive()) return;
  el.crate.classList.remove('rolling');
  Sound.pop(); el.animal.classList.add('on','popin');
  await wait(300); if(!alive()) return;
  bubble(`${a.sound}<span class="big">I’m ${art(a.name)}!</span>`, `${a.sound} I am ${art(a.name)}. Where do I live?`);

  // ---- HABITAT ----
  G.step='habitat'; show('v-habitat');
  el.animal.classList.remove('popin'); el.animal.classList.add('bob','hint');
  coach(`Where does the ${a.name.toLowerCase()} live? Drag it there.`, '👩‍🌾', false);
  await new Promise(res => { G.habitatResolve = res; }); if(!alive()) return;
  el.animal.classList.remove('bob','hint','selected'); clearHints();
  el.crate.classList.add('leaving'); el.crate.style.left='110%';
  await wait(900); if(!alive()) return;
  hideBubble();

  // ---- FEED ----
  const {correct, foods} = makeFoods(cfg, a);
  G.correct = correct; G.foods = foods; G.need = correct.length; G.fed = [];
  el.bowls.innerHTML = correct.map(()=>`<div class="bowl"><span class="ghost">🥣</span></div>`).join('');
  el.menu.innerHTML = foods.map(id=>`<button class="mitem" data-id="${id}" aria-label="${FOODS[id].name}"><span class="em">${FOODS[id].em}</span><span class="nm">${FOODS[id].name}</span></button>`).join('');
  G.step='feed'; G.busy = false; show('v-feed'); setMood(null);
  const line = G.need===1 ? `What does the ${a.name.toLowerCase()} eat? Tap the food.` : `What does the ${a.name.toLowerCase()} eat? Tap the food. Fill ${G.need} bowls.`;
  coach(line, '🥣'); bubble(`I’m hungry! ${'🥣'.repeat(G.need)}`, null, 'I am hungry!');
  await new Promise(res => { G.feedResolve = res; }); if(!alive()) return;
  await wait(900); if(!alive()) return;
  hideBubble(); setMood(null);

  // ---- FACT ----
  G.step='fact'; show('v-fact'); el.btnCool.classList.remove('pulse');
  el.factEm.textContent = a.em; el.factText.textContent = a.fact;
  bubble(`Did you know?<span class="big" style="font-size:1em">${a.fact}</span>`, null, `Did you know? ${a.fact}`);
  coach(`Fun fact! ${a.fact}`, '💡', false); Voice.say(`Fun fact! ${a.fact}`, ()=>{ if(G && G.step==='fact') el.btnCool.classList.add('pulse'); });
  await new Promise(res => { G.factResolve = res; }); if(!alive()) return;
  Sound.pop(); hideBubble(); el.btnCool.classList.remove('pulse');

  // ---- POOP + ROBO ----
  G.step='clean'; show('v-clean'); el.cleanText.textContent = `Uh oh! The ${a.name.toLowerCase()} did a poop. Robo to the rescue!`;
  coach('…toot… 💨', '🙈', false);
  el.animal.classList.add('yuck'); setTimeout(()=>el.animal.classList.remove('yuck'), 700);
  const c = animalCenter(); Sound.fart(); puff(c.x+4, c.y+2); Sound.plop();
  const poop = document.createElement('div'); poop.className='poop'; poop.textContent='💩'; poop.style.left = pct(c.x + 4); poop.style.top = pct(c.y + 6); el.scene.appendChild(poop);
  // animal settles into the zone as a resident
  await wait(500); if(!alive()) return;
  const res = zoneEl(a.habitat).querySelector('.residents'); const s = document.createElement('span'); s.textContent = a.em; res.appendChild(s);
  el.animal.classList.remove('on'); G.settled++; setZooBar(); Sound.ding();
  coach(`Robo is scooping the poop! ${G.settled} of ${G.animals.length} animals are home.`, '🤖', false);
  await roboScoop(myRun, poop); if(!alive()) return;
  await wait(300);
}
async function quizRound(myRun){
  const alive = () => run === myRun;
  const count = Math.min(G.cfg.quiz, G.animals.length);
  const asked = shuffle(G.animals).slice(0, count);
  for(let i=0;i<asked.length;i++){
    const ans = asked[i];
    const options = shuffle([ans].concat(shuffle(G.animals.filter(x=>x!==ans)).slice(0,2)));
    G.step='quiz'; G.animal = ans; G.busy = false; G.quiz = {answer:ans.id, options:options.map(o=>o.id), attempts:0, answered:false};
    show('v-quiz');
    el.quizQ.innerHTML = `<b>Quiz ${i+1} of ${asked.length}.</b> Which animal is this? “${ans.fact}” Tap the animal.`;
    el.quizMenu.innerHTML = options.map(o=>`<button class="mitem" data-id="${o.id}" aria-label="${o.name}"><span class="em">${o.em}</span><span class="nm">${o.name}</span></button>`).join('');
    coach(`Which animal is this? Listen. ${ans.fact} Tap the animal.`, '🧠');
    bubble('', null); hideBubble();
    await new Promise(res => { G.quizResolve = res; }); if(!alive()) return;
    G.quiz = null;
    await wait(900); if(!alive()) return;
  }
  G.busy = false;
}
function answer(animalId){
  if(!G || G.step!=='quiz' || !G.quiz || G.quiz.answered || G.busy || !G.quiz.options.includes(animalId)) return false;
  const btn = el.quizMenu.querySelector(`.mitem[data-id="${animalId}"]`);
  if(animalId === G.quiz.answer){
    G.stats.questions++; if(G.quiz.attempts===0) G.stats.firstTry++;
    if(btn) btn.classList.add('correct');
    el.quizMenu.querySelectorAll('.mitem').forEach(b=>{ if(b!==btn) b.classList.add('done'); });
    Sound.yay(); toast(pick(PRAISE)); coach(`Yes! It is the ${G.animal.name.toLowerCase()}!`, '🎉');
    G.quiz.answered = true; G.busy = true; setTimeout(()=>{ const r = G.quizResolve; G.quizResolve=null; if(r) r(); }, reduced?50:400);
    return true;
  }
  G.quiz.attempts++; G.stats.wrong++;
  if(btn){ btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope'); }
  Sound.oops();
  coach(G.quiz.attempts>=2 ? `It is the ${G.animal.name.toLowerCase()}. Tap the ${G.animal.name.toLowerCase()}.` : `Not that one. Listen again. ${G.animal.fact}`, '🤗');
  if(G.quiz.attempts>=2){ const right = el.quizMenu.querySelector(`.mitem[data-id="${G.quiz.answer}"]`); if(right) right.classList.add('wiggle'); }
  return false;
}
el.quizMenu.addEventListener('click', e => { const b = e.target.closest('.mitem'); if(b) answer(b.dataset.id); });
function next(){
  if(!G) return false;
  if(G.step==='fact' && G.factResolve){ const r = G.factResolve; G.factResolve=null; r(); return true; }
  return false;
}
el.btnCool.addEventListener('click', next);

/* ---------- level complete ---------- */
function finishLevel(){
  G.step='done'; G.complete = true;
  const s = G.stats; const rate = s.questions ? s.firstTry/s.questions : 1;
  const stars = rate >= 0.8 ? 3 : rate >= 0.5 ? 2 : 1;
  progress.unlocked = Math.max(progress.unlocked, G.n+1);
  progress.stars[G.n] = Math.max(progress.stars[G.n]||0, stars); Save.save(progress);
  const msg = stars===3 ? 'You found every home and every food on the first try. Wow!' : stars===2 ? 'Great job! You know lots about animals.' : 'You looked after every animal! Play again to learn more.';
  Sound.fanfare();
  sittingLevels++;
  const breakTime = sittingLevels >= 3;
  const stats = `<div class="fact">Settled <b>${G.animals.length}</b> animals · <b>${s.firstTry}</b> of <b>${s.questions}</b> right first time</div>`;
  const starsHTML = `<div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'lit':''}" style="animation-delay:${i*0.25}s">⭐</span>`).join('')}</div>`;
  if(breakTime){
    showOverlay(`<div class="hero">🐾🧘</div><h1>You’ve done ${sittingLevels} levels!</h1><h2>Time for a break?</h2>
      <div class="zoo">${G.animals.map(a=>a.em).join(' ')}</div>${starsHTML}<p>${msg}</p>${stats}
      <button class="bigbtn mint" id="btn-done">All done for today 👋</button>
      <div class="rowbtns"><button class="subbtn" id="btn-next">Next level ▶</button><button class="subbtn" id="btn-replay">Play it again</button></div>`);
    Voice.say(`You have done ${sittingLevels} levels! Time for a break? ${msg}`);
  } else {
    showOverlay(`<div class="hero">🏆🐾</div><h1>Zoo full!</h1><h2>Level ${G.n} done!</h2>
      <div class="zoo">${G.animals.map(a=>a.em).join(' ')}</div>${starsHTML}<p>${msg}</p>${stats}
      <button class="bigbtn" id="btn-next">Next level ▶</button>
      <div class="rowbtns"><button class="subbtn" id="btn-replay">Play it again</button><button class="subbtn" id="btn-done">All done for today 👋</button></div>`);
    Voice.say(`Zoo full! Level ${G.n} done! ${msg}`, ()=>{ const b = $('#btn-next'); if(b) b.classList.add('pulse'); });
  }
  $('#btn-next').addEventListener('click', ()=>startLevel(G.n+1));
  $('#btn-replay').addEventListener('click', ()=>startLevel(G.n));
  $('#btn-done').addEventListener('click', showGoodbye);
}
function showGoodbye(){
  run++; G = null;
  showOverlay(`<div class="hero">👋🌳</div><h1>Great work today!</h1>
    <p>Stretch, drink some water, go look for a real animal outside. See you next time.</p>
    <div class="rowbtns"><button class="subbtn" id="btn-title">Back to start</button></div>`);
  Voice.say('Great work today! Stretch, drink some water, go look for a real animal outside. See you next time.');
  $('#btn-title').addEventListener('click', showTitle);
}

/* ---------- overlays ---------- */
function showOverlay(html){ el.card.innerHTML = html; el.overlay.classList.add('on'); }
function hideOverlay(){ el.overlay.classList.remove('on'); }
function showTitle(){
  run++; G = null;
  showOverlay(`<div class="hero">🦁🐧🤖</div><h1>Zookeeper</h1>
    <p>Animals are coming in crates! Find each one a home. Feed it. Learn a fun fact. Then Robo scoops the poop!</p>
    <div class="fact">Learn <b>🏠</b> habitats · <b>🥣</b> what animals eat · <b>💡</b> fun facts</div>
    <button class="bigbtn" id="btn-play">Play! 🐾</button>
    <div class="rowbtns"><button class="subbtn" id="btn-choose">Choose a level</button><button class="subbtn" id="btn-grownups">For grown-ups 👋</button></div>
    <p style="font-size:.85rem">Tip: tap any speech bubble to hear it again.</p>`);
  $('#btn-grownups').addEventListener('click', showGrownups);
  $('#btn-play').addEventListener('click', ()=>{ Sound.ensure(); startLevel(progress.unlocked > LEVELS.length ? LEVELS.length : progress.unlocked); });
  $('#btn-choose').addEventListener('click', ()=>{ Sound.ensure(); showLevels(); });
}
function showGrownups(){
  run++; G = null;
  const rows = LEVELS.map((l,i)=>`<li><b>Level ${i+1} – ${l.title}:</b> ${l.animals} animals, ${l.zones} homes, ${l.maxCorrect===1?'one food each':'up to '+l.maxCorrect+' foods each'}${l.easyFoods?' (easy, obvious foods)':''}${l.tiers.includes(3)?' (tricky eaters: insects, plankton, omnivores)':''}${l.quiz?`, plus ${l.quiz} “which animal?” quiz question${l.quiz>1?'s':''} at the end`:''}.</li>`).join('');
  showOverlay(`<h2>For grown-ups</h2>
    <div class="fact" style="text-align:left;font-weight:700"><p style="max-width:none;margin-bottom:8px"><b>What it teaches.</b> Each animal has three steps: <b>habitat</b> (drag or tap it into its home), <b>diet</b> (tap the foods it eats; empty bowls show how many) and a <b>fun fact</b> read aloud. Later levels finish with a listening quiz.</p>
    <ul style="margin:0;padding-left:20px;line-height:1.45">${rows}</ul></div>
    <div class="fact" style="text-align:left;font-weight:700"><b>How hints work.</b> There is no losing. After one wrong home the right home glows; after two, an arrow points to it. After two wrong foods the right food wiggles. If nothing happens for a while, the instruction is repeated and the thing to tap wiggles. Tap any speech bubble to hear it again. Stars: 3 for 80% first-try, 2 for 50%, else 1.</div>
    <div class="fact" style="text-align:left;font-weight:700"><b>Wholesome, not addictive.</b> There are no streaks, timers, countdowns, daily rewards or notifications. Stars come only from accuracy – no random prizes or collectibles. The game never moves to the next level by itself; every finished level offers “All done for today”, and after three levels in one sitting it suggests a break first. Celebrations are short and silly, and the jokes are never at the child’s expense.</div>
    <div class="fact" style="text-align:left;font-weight:700"><b>Privacy.</b> Nothing leaves the device. Progress, stars and the sound settings are saved only in this browser. No accounts, no ads, no internet needed.</div>
    <div class="rowbtns"><button class="subbtn" id="btn-title">Back</button></div>`);
  $('#btn-title').addEventListener('click', showTitle);
}
function showLevels(){
  run++; G = null;
  const count = Math.max(LEVELS.length, Math.min(progress.unlocked, LEVELS.length+3));
  let cards=''; for(let n=1;n<=count;n++){
    const c = levelConfig(n), locked = n > progress.unlocked, st = progress.stars[n]||0;
    cards += `<button class="lv ${locked?'locked':''}" data-n="${n}" ${locked?'disabled aria-disabled="true"':''}><span class="num">Level ${n}</span><span class="ttl">${c.title}</span><span class="lvstars">${st?'⭐'.repeat(st):(locked?'':'Not played yet')}</span><span class="ops"><span>${c.animals} 🐾</span><span>${c.zones} 🏠</span>${c.quiz?'<span>🧠</span>':''}</span></button>`;
  }
  showOverlay(`<h2>Choose a level</h2><p>Each level has more animals and more homes. Finish one to open the next!</p><div class="levels">${cards}</div><div class="rowbtns"><button class="subbtn" id="btn-title">Back</button></div>`);
  el.card.querySelectorAll('.lv:not(.locked)').forEach(b=>b.addEventListener('click', ()=>startLevel(+b.dataset.n)));
  $('#btn-title').addEventListener('click', showTitle);
}

/* ---------- top bar ---------- */
function applyToggles(){
  Sound.enabled = progress.sound !== false; Voice.enabled = progress.voice !== false;
  const sb = $('#btn-sound'), vb = $('#btn-voice');
  sb.classList.toggle('off', !Sound.enabled); sb.textContent = Sound.enabled?'🔊':'🔇'; vb.classList.toggle('off', !Voice.enabled);
}
applyToggles();
$('#btn-sound').addEventListener('click', ()=>{ progress.sound = !Sound.enabled; Save.save(progress); applyToggles(); if(Sound.enabled){ Sound.ensure(); Sound.pop(); } });
$('#btn-voice').addEventListener('click', ()=>{ progress.voice = !Voice.enabled; Save.save(progress); applyToggles(); if(Voice.enabled) Voice.say('Read aloud is on.'); });
$('#btn-home').addEventListener('click', showLevels);
$('#btn-say').addEventListener('click', ()=>Voice.force(coachLine));
$('#coach-text').addEventListener('click', ()=>Voice.force(coachLine));
[el.bubble, el.rbubble].forEach(b=>{ b.addEventListener('pointerdown', e=>e.stopPropagation()); b.addEventListener('click', e=>{ e.stopPropagation(); if(b.dataset.say) Voice.force(b.dataset.say); }); });
(function initFullscreen(){
  const b = $('#btn-full'), root = document.documentElement;
  const req = root.requestFullscreen || root.webkitRequestFullscreen, can = !!req && (document.fullscreenEnabled !== false);
  if(!can){ b.hidden = true; return; }
  b.addEventListener('click', ()=>{
    try{
      if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen || document.webkitExitFullscreen).call(document)?.catch?.(()=>{}); }
      else { req.call(root)?.catch?.(()=>{}); }
    }catch(e){}
  });
  document.addEventListener('fullscreenchange', ()=>{ b.textContent = document.fullscreenElement ? '⤡' : '⛶'; b.setAttribute('aria-label', document.fullscreenElement ? 'Leave full screen' : 'Full screen'); });
})();

/* ---------- idle nudge ---------- */
let idleMs = 14000, idleTimer = null;
function nudgeTarget(){
  if(!G || el.overlay.classList.contains('on') || G.busy) return null;
  if(G.step==='habitat') return [el.animal];
  if(G.step==='feed') return [...el.menu.querySelectorAll('.mitem:not(.done)')];
  if(G.step==='fact') return [el.btnCool];
  if(G.step==='quiz') return [...el.quizMenu.querySelectorAll('.mitem:not(.done)')];
  return null;
}
function nudge(){
  const targets = nudgeTarget(); if(!targets) return false;
  if(coachLine) Voice.say(coachLine);
  targets.forEach(t=>{ t.classList.remove('nudge'); void t.offsetWidth; t.classList.add('nudge'); setTimeout(()=>t.classList.remove('nudge'), 2100); });
  return true;
}
function armIdle(){ clearTimeout(idleTimer); idleTimer = setTimeout(()=>{ nudge(); armIdle(); }, idleMs); }
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, armIdle, {passive:true}));
armIdle();

/* ---------- boot ---------- */
function boot(data){
  if(data && data.level && data.level <= progress.unlocked) startLevel(data.level); else showTitle();
}
try{ window.claude?.hot?.snapshot?.(()=>({level: G ? G.n : null})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

// debug / automation hooks
window.__game = {
  startLevel, placeIn, feed, next, answer, showLevels, showTitle, showGrownups, showGoodbye, nudge, get sittingLevels(){ return sittingLevels; },
  clean:Voice.clean, get lastSpoken(){ return Voice.last; }, get voiceRate(){ return Voice.rate; }, get voiceEnabled(){ return Voice.enabled; }, get soundEnabled(){ return Sound.enabled; },
  get idleMs(){ return idleMs; }, set idleMs(v){ idleMs = Math.max(200, +v||14000); armIdle(); },
  data:{ANIMALS, HABITATS, FOODS, LEVELS},
  get state(){
    if(!G) return {step:'idle', level:null, animal:null};
    return {level:G.n, title:G.cfg.title, step:G.step, round:G.round, total:G.animals.length, settled:G.settled, animal:G.animal, animals:G.animals.map(a=>a.id), zones:G.zones.slice(),
      foods:G.foods.slice(), correctFoods:G.correct.slice(), needed:G.need, fed:G.fed.slice(), wrongHabitat:G.wrongHabitat, wrongFood:G.wrongFood, busy:G.busy,
      stats:Object.assign({}, G.stats), quiz:G.quiz ? {answer:G.quiz.answer, options:G.quiz.options.slice(), attempts:G.quiz.attempts, answered:G.quiz.answered} : null, complete:G.complete};
  }
};
})();
</script>
