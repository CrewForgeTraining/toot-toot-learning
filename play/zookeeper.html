<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Zookeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:40px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
/* ---------- scene: sky, crane gantry, road, enclosures ---------- */
#scene{background:linear-gradient(#9FDBFF 0,#DFF3FF 17cqw,#E9D3A6 17cqw,#E2C48E 24cqw,#EBD8B0 24cqw,#E6CFA0 100%)}
#scene>*{user-select:none;-webkit-user-select:none}
.sun{position:absolute;right:7%;top:8cqw;width:5cqw;height:5cqw;border-radius:50%;background:var(--sun);box-shadow:0 0 2cqw rgba(255,200,61,.8)}
.cloud{position:absolute;top:9cqw;width:8cqw;height:2.8cqw;border-radius:2cqw;background:#fff;opacity:.9}
.cloud::before{content:"";position:absolute;left:1.6cqw;top:-1.5cqw;width:3.4cqw;height:3.4cqw;border-radius:50%;background:#fff}
.zoosign{position:absolute;left:50%;top:8cqw;transform:translateX(-50%);background:#fff;border-radius:1cqw;padding:.2cqw 1.2cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.2cqw,16px);color:var(--ketchup);box-shadow:0 .4cqw 0 rgba(59,42,31,.12);white-space:nowrap;z-index:1}
.road{position:absolute;left:0;right:0;top:19cqw;height:5cqw;background:repeating-linear-gradient(90deg,#CDB18A 0 4cqw,#C2A57C 4cqw 8cqw)}
.road::after{content:"";position:absolute;left:0;right:0;top:45%;height:.5cqw;background:repeating-linear-gradient(90deg,#fff 0 3cqw,transparent 3cqw 6cqw);opacity:.55}
.rail{position:absolute;left:3cqw;right:3cqw;top:3.4cqw;height:2.4cqw;background:linear-gradient(#FFD666,#F5B400);border:.5cqw solid var(--cocoa);border-radius:.8cqw;z-index:0}
.rail::before,.rail::after{content:"";position:absolute;top:100%;width:2.2cqw;height:17cqw;background:repeating-linear-gradient(0deg,#F4552F 0 2cqw,#C9391A 2cqw 2.6cqw);border:.5cqw solid var(--cocoa);border-top:0;border-radius:0 0 .6cqw .6cqw}
.rail::before{left:.4cqw}.rail::after{right:.4cqw}
.trolley{position:absolute;left:14%;top:1.6cqw;width:9cqw;height:5cqw;transform:translateX(-50%);z-index:6;pointer-events:none}
.trolley .box{position:absolute;inset:0 0 .8cqw 0;background:linear-gradient(#FFB703,#F58A00);border:.5cqw solid var(--cocoa);border-radius:1.2cqw;box-shadow:inset 0 .6cqw 0 rgba(255,255,255,.35)}
.trolley .box::after{content:"⚙";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font-size:2.4cqw;line-height:1;color:var(--cocoa)}
.trolley .wheel{position:absolute;bottom:0;width:2cqw;height:2cqw;border-radius:50%;background:#6E5546;border:.4cqw solid var(--cocoa)}
.trolley .wheel.a{left:.8cqw}.trolley .wheel.b{right:.8cqw}
.trolley.moving .wheel{animation:spin .3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hang{position:absolute;left:50%;top:100%;width:0;height:0;transform-origin:0 0;--len:12cqw}
.hang .cable{position:absolute;left:-.4cqw;top:0;width:.8cqw;height:var(--len);background:var(--cocoa);border-radius:.4cqw}
.hang .hook{position:absolute;left:-1.7cqw;top:calc(var(--len) - .5cqw);width:3.4cqw;height:2.4cqw;border:.6cqw solid var(--cocoa);border-top:0;border-radius:0 0 1.7cqw 1.7cqw;background:#FFC83D}
.hang .slot{position:absolute;left:0;top:calc(var(--len) + 1.2cqw)}
.slot .toot-actor{position:absolute;left:0;top:0;transform:translateX(-50%);pointer-events:auto}
.slot .toot-actor::before{content:"";position:absolute;left:32%;right:32%;top:-.9cqw;height:1.7cqw;background:#F4552F;border:.45cqw solid var(--cocoa);border-radius:.9cqw;z-index:1}
.slot .toot-char,.toot-actor.free .toot-char{width:11cqw}
.slot .bubble{bottom:auto;top:30%}
.toot-actor.free .bubble{bottom:auto;top:-6%}
.toot-actor.free{position:absolute;transform:translate(-50%,-50%);z-index:4}
.toot-actor.zoo .toot-char{cursor:pointer;transition:filter .2s}
.toot-actor.selected .toot-char{filter:drop-shadow(0 0 .8cqw rgba(47,191,166,.95)) drop-shadow(0 0 .3cqw #fff)}
.toot-actor .hand{left:50%;top:60%;display:none;z-index:3}
.toot-actor.showhand .hand{display:block}

.crate{position:absolute;left:-14%;top:14.5cqw;width:14cqw;height:9cqw;transform:translateX(-50%);z-index:5;pointer-events:none;transition:left 1.5s cubic-bezier(.4,.1,.5,1)}
.crate .box{position:absolute;inset:0 0 1.6cqw 0;background:repeating-linear-gradient(0deg,#C98A46 0 1.8cqw,#E0A96D 1.8cqw 2.5cqw);border:.5cqw solid #8E5A24;border-radius:1cqw;box-shadow:inset 0 0 0 .3cqw rgba(255,255,255,.2)}

  G.correct = correct; G.foods = foods; G.need = correct.length; G.fed = []; G.feedLadder = UI.ladder({
    onHint() { UI.coach(L.Z20, '🙈', false); sayL('Z20'); },
    onReveal() { UI.coach(L.Z21, '🙈', false); sayL('Z21'); G.correct.forEach(id => { const b = el.menu.querySelector(`.mitem[data-id="${id}"]`); if (b && !G.fed.includes(id)) b.classList.add('wiggle'); }); }
  });
  let bowls = $('#bowls'); if (!bowls) { bowls = document.createElement('div'); bowls.id = 'bowls'; bowls.className = 'bowls'; }
  zone.appendChild(bowls); bowls.innerHTML = correct.map(() => '<div class="bowl"></div>').join(''); G.bowls = bowls;
  el.menu.innerHTML = foods.map(id => `<button class="mitem" data-id="${id}" aria-label="${FOODS[id].name}"><span class="em">${FOODS[id].em}</span><span class="nm">${FOODS[id].name}</span></button>`).join('');
  G.step = 'feed'; G.busy = false; UI.show('v-feed');
  const fl = `${L.Z14} ${lname(a)} ${L.Z15}` + (G.need === 2 ? ' ' + L.Z16 : G.need === 3 ? ' ' + L.Z17 : '');
  UI.coach(fl, '🥣', false); say(fl, ['Z14', 'A_' + a.id, 'Z15'].concat(G.need === 2 ? ['Z16'] : G.need === 3 ? ['Z17'] : []));
  bubble(actor, `I’m hungry! ${'🥣'.repeat(G.need)}`, 'I am hungry!');
  setNudge(() => $$('.mitem:not(.done)', el.menu));
  await new Promise(res => { G.feedResolve = res; }); if (!alive()) return;
  await wait(600); if (!alive()) return;
  hideBubble(actor); bowls.remove(); UI.nudge.clear();
  // ---- FACT ----
  G.step = 'fact'; UI.show('v-fact'); el.btnCool.classList.remove('pulse');
  el.factChar.innerHTML = ''; el.factChar.appendChild(makeChar(a, 56)); el.factText.textContent = a.fact;
  bubble(actor, `Did you know?<span class="big" style="font-size:1em">${esc(a.fact)}</span>`, `Did you know? ${a.fact}`, false);
  UI.coach(`${L.Z22} ${a.fact}`, '💡', false); sayThen(`${L.Z22} ${a.fact}`, ['Z22', 'F_' + a.id]).then(() => { if (G && G.step === 'fact' && G.animal === a) el.btnCool.classList.add('pulse'); });
  setNudge(() => [el.btnCool]);
  await new Promise(res => { G.factResolve = res; }); if (!alive()) return;
  S.pop(); hideBubble(actor); el.btnCool.classList.remove('pulse'); UI.nudge.clear();
  // ---- POOP + ROBO ----
  G.step = 'clean'; UI.show('v-clean'); el.cleanText.textContent = `Uh oh! The ${lname(a)} did a poop. Robo to the rescue!`;
  UI.coach('…toot… 💨', '🙈', false);
  await act(actor, 'poop', 'clean'); if (!alive()) return;
  G.settled++; setZooBar(); S.ding();
  UI.coach(`${L.Z39} ${G.settled} of ${G.animals.length} animals are home.`, '🤖', false); sayL('Z23');
  await roboPatrol(myRun); if (!alive()) return;
  await wait(200);
}
async function quizRound(myRun) {
  const alive = () => run === myRun, asked = shuffle(G.animals).slice(0, Math.min(G.cfg.quiz, G.animals.length));
  for (let i = 0; i < asked.length; i++) {
    const ans = asked[i], options = shuffle([ans].concat(shuffle(G.animals.filter(x => x !== ans)).slice(0, 2)));
    G.step = 'quiz'; G.animal = ans; G.busy = false; G.quiz = { answer: ans.id, options: options.map(o => o.id), attempts: 0, answered: false };
    G.ladder = UI.ladder({
      onHint() { UI.coach(`${L.Z26} ${ans.fact}`, '🤗', false); say(`${L.Z26} ${ans.fact}`, ['Z26', 'F_' + ans.id]); },
      onReveal() { const t = `${L.Z27} ${lname(ans)}. ${L.Z28}`; UI.coach(t, '🤗', false); say(t, ['Z27', 'A_' + ans.id, 'Z28']); const right = el.quizMenu.querySelector(`.mitem[data-id="${ans.id}"]`); if (right) right.classList.add('wiggle'); }
    });
    UI.show('v-quiz');
    el.quizQ.innerHTML = `<b>Quiz ${i + 1} of ${asked.length}.</b> Which animal is this? “${esc(ans.fact)}” Tap the animal.`;
    el.quizMenu.innerHTML = options.map(o => `<button class="mitem" data-id="${o.id}" aria-label="${o.name}"><span class="nm">${o.name}</span></button>`).join('');
    options.forEach(o => el.quizMenu.querySelector(`.mitem[data-id="${o.id}"]`).prepend(makeChar(o, 44)));
    const t = `${L.Z24} ${ans.fact} ${L.Z25}`; UI.coach(t, '🧠', false); say(t, ['Z24', 'F_' + ans.id, 'Z25']);
    setNudge(() => $$('.mitem:not(.done)', el.quizMenu));
    await new Promise(res => { G.quizResolve = res; }); if (!alive()) return;
    G.quiz = null; UI.nudge.clear();
    await wait(700); if (!alive()) return;
  }
  G.busy = false;
}
function answer(animalId) {
  if (!G || G.step !== 'quiz' || !G.quiz || G.quiz.answered || G.busy || !G.quiz.options.includes(animalId)) return false;
  const btn = el.quizMenu.querySelector(`.mitem[data-id="${animalId}"]`);
  if (animalId === G.quiz.answer) {
    G.stats.questions++; if (G.ladder.firstTry) G.stats.firstTry++;
    if (btn) btn.classList.add('correct');
    $$('.mitem', el.quizMenu).forEach(b => { if (b !== btn) b.classList.add('done'); });
    S.yay(); UI.toast(pick(PRAISE)); UI.coach(`${L.Z29} ${lname(G.animal)}!`, '🎉', false); say(`${L.Z29} ${lname(G.animal)}!`, ['Z29', 'A_' + animalId]);
    const resident = $(`.residents .toot-actor[data-id="${animalId}"]`, el.zones); if (resident) act(resident, 'happyDance', 'quiz');
    G.quiz.answered = true; G.busy = true; setTimeout(() => { const r = G.quizResolve; G.quizResolve = null; if (r) r(); }, reduced ? 50 : 400);
    return true;
  }
  G.quiz.attempts++; G.stats.wrong++;
  if (btn) { btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope'); }
  G.ladder.wrong();
  const wrongOne = $(`.residents .toot-actor[data-id="${animalId}"]`, el.zones); if (wrongOne) act(wrongOne, pick(['fart', 'hiccup', 'dizzy']), 'quiz');
  return false;
}
el.quizMenu.addEventListener('click', e => { const b = e.target.closest('.mitem'); if (b) answer(b.dataset.id); });
function next() { if (!G) return false; if (G.step === 'fact' && G.factResolve) { const r = G.factResolve; G.factResolve = null; r(); return true; } return false; }
el.btnCool.addEventListener('click', next);

/* ---------- level complete / cards ---------- */
function finishLevel() {
  G.step = 'done'; G.complete = true; crane.stop(); UI.nudge.clear();
  const s = G.stats, stars = UI.stars(s.firstTry, s.questions);
  const msg = stars === 3 ? L.Z31 : stars === 2 ? L.Z32 : L.Z33;
  const breakTime = UI.sitting + 1 >= 3;
  UI.levelComplete({ n: G.n, stars, hero: G.animals.map(a => a.em).join(''), title: breakTime ? `You’ve done ${UI.sitting + 1} levels!` : 'Zoo full!', subtitle: `Level ${G.n} done!`, msg,
    fact: `Settled <b>${G.animals.length}</b> animals · <b>${s.firstTry}</b> of <b>${s.questions}</b> right first time · <b>${G.poops}</b> poops scooped`,
    onNext: () => startLevel(G.n + 1), onReplay: () => startLevel(G.n), onDone: showTitle });
  // the engine's card wires All-done to its default goodbye; swap in the zoo's own goodbye text
  const b = $('#btn-done', refs.card); if (b) { const c = b.cloneNode(true); b.replaceWith(c); c.addEventListener('click', showGoodbye); }
  if (!breakTime) raw(reduced ? 600 : 4500).then(() => { const nb = $('#btn-next', refs.card); if (nb && UI.overlayOpen()) nb.classList.add('pulse'); });
}
function stopGame() { run++; G = null; crane.stop(); UI.nudge.clear(); }
function showGoodbye() { stopGame(); UI.goodbye({ hero: 'robo', idea: 'go look for a real animal outside', text: 'Stretch, drink some water, go look for a real animal outside. See you next time.', onBack: showTitle }); }
function showTitle() {
  stopGame();
  UI.title({ hero: 'lion monkey robo', title: 'Zookeeper', blurb: 'Animals are coming in crates! Drive the crane to put each one in its home. Feed it. Learn a fun fact. Then Robo scoops the poop!',
    fact: 'Learn <b>🏠</b> habitats · <b>🥣</b> what animals eat · <b>💡</b> fun facts', playLabel: 'Play! 🐾',
    onPlay: () => startLevel(progress.unlocked > LEVELS.length ? LEVELS.length : progress.unlocked), onLevels: showLevels, grownups: showGrownups });
}
function showGrownups() {
  stopGame();
  const rows = LEVELS.map((l, i) => `<li><b>Level ${i + 1} – ${l.title}:</b> ${l.animals} animals, ${l.zones} homes, ${l.maxCorrect === 1 ? 'one food each' : 'up to ' + l.maxCorrect + ' foods each'}${l.easyFoods ? ' (easy, obvious foods)' : ''}${l.tiers.includes(3) ? ' (tricky eaters: insects, plankton, omnivores)' : ''}${l.quiz ? `, plus ${l.quiz} “which animal?” quiz question${l.quiz > 1 ? 's' : ''} at the end` : ''}.</li>`).join('');
  UI.grownups({ html: `<b>What it teaches.</b> Each animal has three steps: <b>habitat</b> (drive the crane with ◀ ▶ and DROP it into its home, or tap the animal then tap its home), <b>diet</b> (tap or drag the foods it eats; empty bowls show how many) and a <b>fun fact</b> read aloud. Later levels finish with a listening quiz.<ul>${rows}</ul>
    <b class="sub">How hints work.</b> There is no losing. A wrong home is just a silly landing: the animal grumbles, the crane picks it up again and the right home glows; after two, an arrow points to it. A wrong food gets a rude reaction (a toot, a sneeze, a slip) and after two wrong foods the right food wiggles. If nothing happens for a while, the instruction is repeated and the thing to tap wiggles. Tap any speech bubble to hear it again. Stars: 3 for 80% first-try, 2 for 50%, else 1.
    <b class="sub">Wholesome, not addictive.</b> There are no streaks, timers, countdowns, daily rewards or notifications. Stars come only from accuracy. The jokes are farts, poops and wobbles, never at the child’s expense.
    <b class="sub">Privacy.</b> Nothing leaves the device. Progress, stars and the sound settings are saved only in this browser. No accounts, no ads, no internet needed.`, onBack: showTitle });
}
function showLevels() {
  stopGame();
  UI.levels({ count: Math.max(LEVELS.length, Math.min(progress.unlocked, LEVELS.length + 3)), intro: 'Each level has more animals and more homes. Finish one to open the next!',
    level: n => { const c = levelConfig(n); return { title: c.title, tags: [`${c.animals} 🐾`, `${c.zones} 🏠`].concat(c.quiz ? ['🧠'] : []) }; }, onPick: startLevel, onBack: showTitle });
}
/* engine workaround: ui's nudge timer calls forEach(wiggle), which passes the array index as wiggle's ms argument
   (toot.js "(els || []).filter(Boolean).forEach(wiggle)"), so the outline vanishes after 0 ms. We wiggle the targets
   ourselves and hand the engine an empty list. */
function setNudge(fn, text) { UI.nudge.set(() => { (fn() || []).filter(Boolean).forEach(e => UI.wiggle(e)); return []; }, text); }
/* manual nudge (the engine's timer does this by itself after nudge.delay ms) */
function nudge() {
  if (!G || UI.overlayOpen() || G.busy) return false;
  const t = { habitat: () => [G.actor, crane.st.holding ? el.btnRight : el.btnGrab], feed: () => $$('.mitem:not(.done)', el.menu), fact: () => [el.btnCool], quiz: () => $$('.mitem:not(.done)', el.quizMenu) }[G.step];
  if (!t) return false; t().filter(Boolean).forEach(x => UI.wiggle(x)); V.say(UI.coachLine); return true;
}

/* ---------- boot ---------- */
function boot(data) { if (data && data.level && data.level <= progress.unlocked) startLevel(data.level); else showTitle(); }
try { window.claude?.hot?.snapshot?.(() => ({ level: G ? G.n : null })); } catch (e) {}
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

/* debug / automation hooks */
window.__game = {
  startLevel, placeIn, feed, next, answer, showLevels, showTitle, showGrownups, showGoodbye, nudge, grabOrDrop, patrol: () => roboPatrol(run),
  act: (name, id) => { const actor = id ? $(`.toot-actor[data-id="${id}"]`, el.scene) : (G && G.actor); return actor ? act(actor, name, 'debug') : Promise.resolve(false); },
  crane: { move: dir => crane.move(dir), grab: grabOrDrop, drop: grabOrDrop, driveTo: x => crane.driveTo(x), get state() { return crane.state; } },
  get sittingLevels() { return UI.sitting; }, clean: V.clean, get lastSpoken() { return lastSpoken; }, get voiceRate() { return 0.9; }, get voiceEnabled() { return V.enabled; }, get soundEnabled() { return S.enabled; },
  get idleMs() { return UI.nudge.delay; }, set idleMs(v) { UI.nudge.delay = Math.max(200, +v || 14000); UI.nudge.touch(); },
  data: { ANIMALS, HABITATS, FOODS, LEVELS, REACTIONS, LINES: L, ART: ART.names }, makeChar,

      foods: G.foods.slice(), correctFoods: G.correct.slice(), needed: G.need, fed: G.fed.slice(), wrongHabitat: G.ladder ? G.ladder.attempts : 0, wrongFood: G.feedLadder ? G.feedLadder.attempts : 0, busy: G.busy,
      stats: Object.assign({}, G.stats), quiz: G.quiz ? { answer: G.quiz.answer, options: G.quiz.options.slice(), attempts: G.quiz.attempts, answered: G.quiz.answered } : null, complete: G.complete,
      crane: crane.state, acting: G.actor ? G.actor._acting || null : null, actionLog: G.actionLog.slice(), poops: G.poops, livePoops: livePoops().length, patrols: G.patrols, lastReaction: G.lastReaction, lastLanding: G.lastLanding };
  }
};
