<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>Robo Goes Boom (Story)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --heat-cool:#5CC8FF; --heat-warm:#FFB703; --heat-hot:#FF3B3B; --grass:#8BD36F;
  --shadow: 0 6px 0 rgba(59,42,31,.16);
  --display: 'Fredoka','Nunito',system-ui,sans-serif;
  --body: 'Nunito','Fredoka',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid #2A7BFF;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

#app{max-width:1280px;margin:0 auto;padding-block:8px 10px;padding-inline:16px;display:flex;flex-direction:column;gap:10px;height:100%}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;flex:none}
.logo{font-family:var(--display);font-weight:700;font-size:1.2rem;display:flex;align-items:center;gap:8px;flex:none}
@media (max-width:540px){.logo{display:none}}
.logo .sign{background:var(--ketchup);color:#fff;padding:3px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block;white-space:nowrap}
.chip{background:var(--white);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;min-height:44px;font-family:var(--display)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.spacer{flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center;flex:none}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}

/* ---------- book layout ---------- */
#book{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0}
#scene{position:relative;flex:none;width:min(100%,calc(38vh*1.6));aspect-ratio:16/10;margin-inline:auto;container-type:inline-size;overflow:hidden;border-radius:22px;background:#F9E7C8;box-shadow:var(--shadow);--k:.66}
#panel{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
#textwrap{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.txt{background:#fff;border-radius:18px;padding:12px 14px;font-size:1.12rem;font-weight:800;line-height:1.4;box-shadow:0 4px 0 rgba(59,42,31,.1);text-wrap:pretty;cursor:pointer}
.txt .w{border-radius:6px;padding:0 1px;transition:background .12s}
.txt .w.on{background:var(--butter);box-shadow:0 0 0 3px var(--butter)}
.txt .ka{font-family:var(--display);color:var(--ketchup);font-size:1.2em}
.txt.prompt{background:var(--butter);box-shadow:0 4px 0 rgba(59,42,31,.12)}
.txt.prompt .w.on{background:#fff;box-shadow:0 0 0 3px #fff}
.txt.small{font-size:1rem;padding:10px 12px}
.hint{background:#E4FBF5;border-radius:14px;padding:8px 12px;font-weight:800;color:var(--mint-dark);font-size:.95rem;text-align:center}
.hint .pic{display:block;font-size:1.6rem;letter-spacing:.05em;line-height:1.2}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{min-height:52px;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1.1rem;font-weight:700;display:flex;align-items:center;gap:10px;padding:8px 14px;text-align:left}
.opt .em{font-size:1.7rem;line-height:1}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.nums{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.num{width:54px;height:54px;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(59,42,31,.16);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.num:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16)}
.num.reveal{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark);animation:okpulse 1s infinite}
.num.nope{animation:wiggle .4s}
@keyframes okpulse{50%{transform:scale(1.08);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
.tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.part{width:56px;height:56px;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(59,42,31,.16);font-size:1.8rem;display:grid;place-items:center;position:relative}
.part.sel{background:var(--butter);box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 4px var(--mint)}
.part.used{opacity:.3;pointer-events:none}
.part:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16)}
#controls{display:flex;align-items:center;justify-content:center;gap:10px;flex:none}
.arrow{width:52px;height:52px;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(59,42,31,.16);font-size:1.5rem;display:grid;place-items:center}
.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16)}
.arrow[disabled]{opacity:.35;pointer-events:none}
#btn-play{width:64px;height:64px;border-radius:22px;background:var(--ketchup);color:#fff;box-shadow:0 6px 0 var(--ketchup-dark);font-size:1.9rem;display:grid;place-items:center}
#btn-play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
#btn-play.paused{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
body.title #controls,body.title #dots{visibility:hidden}
#dots{display:flex;gap:5px;justify-content:center;flex:none;padding:2px 0}
#dots i{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(59,42,31,.12);display:block;transition:transform .2s,background .2s}
#dots i.done{background:var(--butter)}
#dots i.now{background:var(--ketchup);transform:scale(1.3)}
#dots i.now.done{background:var(--ketchup)}

@media (orientation:portrait){
  /* the picture grows to fill the space between the top bar and the controls (up to a square), text under it, controls pinned at the bottom */
  #scene{flex:999 1 auto;min-height:190px;max-height:100vw;width:100%;aspect-ratio:auto}
  #panel{flex:1 1 auto;min-height:0}
  #textwrap{flex:1 1 auto}
}
@media (orientation:landscape){
  #book{flex-direction:row;align-items:stretch}
  #scene{width:min(100%,calc((100vh - 84px)*1.6));margin-inline:0;align-self:flex-start}
  #panel{flex:1;min-width:0}
}
@media (orientation:landscape) and (max-height:560px){
  #app{padding-block:4px 6px;gap:6px}
  #topbar{gap:6px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem;min-height:44px}.iconbtn{width:44px;height:44px;font-size:1.1rem}
  #scene{width:min(100%,calc((100vh - 70px)*1.6))}
  .txt{font-size:.92rem;padding:8px 10px;line-height:1.35}.txt.small{font-size:.85rem}
  .opt{min-height:44px;font-size:.95rem;padding:4px 10px}.opt .em{font-size:1.3rem}
  .num{width:46px;height:46px;font-size:1.25rem}.part{width:48px;height:48px;font-size:1.5rem}
  .arrow{width:44px;height:44px;font-size:1.2rem}#btn-play{width:52px;height:52px;font-size:1.5rem;border-radius:18px}
  .hint{padding:5px 8px;font-size:.85rem}.hint .pic{font-size:1.3rem}
  #dots i{width:9px;height:9px}
}
@media (orientation:portrait) and (max-width:600px){
  #app{padding-block:6px 8px;gap:8px}
  #topbar{gap:6px}.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}
  #scene{width:calc(100% + 32px);margin-inline:-16px;max-height:100vw;border-radius:18px}
  .txt{font-size:1.02rem;padding:10px 12px}
}
@media (orientation:portrait) and (max-height:700px){.txt{font-size:.95rem}}

/* ---------- scene art (from the picture book) ---------- */
.wall{position:absolute;inset:0 0 58% 0;background:repeating-linear-gradient(90deg,#FFE9BC 0 calc(6cqw*var(--k,1)),#FFF2D6 calc(6cqw*var(--k,1)) calc(12cqw*var(--k,1)))}
.trim{position:absolute;left:0;right:0;top:41.2%;height:1.3%;background:var(--wood-dark)}
.floor{position:absolute;left:0;right:0;top:42.5%;bottom:0;background:repeating-conic-gradient(var(--floor-a) 0 25%,var(--floor-b) 0 50%) 0 0/calc(10cqw*var(--k,1)) calc(10cqw*var(--k,1))}
.door{position:absolute;left:4%;top:12%;width:14%;height:30.3%;background:#D2742E;border:calc(.8cqw*var(--k,1)) solid #8E4415;border-bottom:0;border-radius:calc(7cqw*var(--k,1)) calc(7cqw*var(--k,1)) 0 0;z-index:2}
.door::after{content:"";position:absolute;right:12%;top:52%;width:calc(2cqw*var(--k,1));height:calc(2cqw*var(--k,1));border-radius:50%;background:var(--sun)}
.door .sign{position:absolute;left:50%;top:calc(-1.8cqw*var(--k,1));transform:translate(-50%,-100%);background:#fff;border-radius:calc(1.2cqw*var(--k,1));padding:calc(.3cqw*var(--k,1)) calc(1.4cqw*var(--k,1));font-family:var(--display);font-weight:700;font-size:calc(2.6cqw*var(--k,1));white-space:nowrap;color:var(--ketchup);box-shadow:0 calc(.4cqw*var(--k,1)) 0 rgba(59,42,31,.12)}
.scene.dooropen .door{background:linear-gradient(var(--sky) 0 62%,var(--grass) 62%)}
.scene.dooropen .door::after{display:none}
.scene.dooropen .door::before{content:"";position:absolute;right:98%;top:-3%;width:34%;height:106%;background:#D2742E;border:calc(.7cqw*var(--k,1)) solid #8E4415;border-radius:calc(1cqw*var(--k,1)) 0 0 calc(1cqw*var(--k,1));transform:skewY(-14deg);transform-origin:right top;box-shadow:calc(.4cqw*var(--k,1)) 0 0 rgba(59,42,31,.25)}
.bell{position:absolute;left:19%;top:8.5%;font-size:calc(5cqw*var(--k,1));line-height:1;z-index:3;transform:rotate(15deg)}
.bell i{position:absolute;left:110%;top:0;font-style:normal;font-family:var(--display);font-weight:700;font-size:calc(2.6cqw*var(--k,1));color:var(--cocoa-soft);white-space:nowrap;transform:rotate(-15deg)}
.bell.ring{animation:ring .6s 2}
@keyframes ring{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-15deg)}}
.window{position:absolute;left:28%;top:8%;width:24%;height:19%;background:linear-gradient(#9FDBFF,#DFF3FF);border:calc(1cqw*var(--k,1)) solid #fff;border-radius:calc(3cqw*var(--k,1));box-shadow:0 calc(.5cqw*var(--k,1)) 0 rgba(59,42,31,.12)}
.window::before{content:"";position:absolute;right:9%;top:10%;width:calc(6cqw*var(--k,1));height:calc(6cqw*var(--k,1));border-radius:50%;background:var(--sun);box-shadow:0 0 calc(2.5cqw*var(--k,1)) rgba(255,200,61,.8)}
.window::after{content:"☁️";position:absolute;left:7%;bottom:8%;font-size:calc(4cqw*var(--k,1));line-height:1}
.scene.evening .window{background:linear-gradient(#FFB080,#FFE0A0)}
.scene.evening .window::before{background:#FF8A3D;top:45%}
.kitchen{position:absolute;left:57%;top:7%;width:38%;height:30%;background:#5A3A2A;border-radius:calc(3.5cqw*var(--k,1));padding:calc(1.4cqw*var(--k,1));display:flex;flex-direction:column;z-index:2}
.kitchen .hatch{flex:1;background:#FFF6E3;border-radius:calc(2.4cqw*var(--k,1));position:relative;overflow:hidden}
.kitchen .chef{position:absolute;left:8%;bottom:-8%;font-size:calc(11cqw*var(--k,1));line-height:1}
.kitchen .stove{position:absolute;right:8%;bottom:2%;font-size:calc(7cqw*var(--k,1));line-height:1}
.kitchen .orderup{position:absolute;left:50%;top:7%;transform:translateX(-50%);background:var(--ketchup);color:#fff;font-family:var(--display);font-weight:700;font-size:calc(2.4cqw*var(--k,1));padding:calc(.4cqw*var(--k,1)) calc(1.8cqw*var(--k,1));border-radius:999px;letter-spacing:.06em;white-space:nowrap}
.kitchen .counter{height:calc(3cqw*var(--k,1));background:var(--wood);border-radius:0 0 calc(1.8cqw*var(--k,1)) calc(1.8cqw*var(--k,1));margin-top:calc(1cqw*var(--k,1));box-shadow:0 calc(.6cqw*var(--k,1)) 0 var(--wood-dark)}
.scene.nochef .chef{display:none}
.table{position:absolute;left:33%;top:47%;width:32%;height:8.5%;background:repeating-conic-gradient(#E8503A 0 25%,#FFF8EC 0 50%) 0 0/calc(4cqw*var(--k,1)) calc(4cqw*var(--k,1));border-radius:50%;box-shadow:0 calc(.8cqw*var(--k,1)) 0 #C63D2A,0 calc(1.4cqw*var(--k,1)) calc(1.4cqw*var(--k,1)) rgba(59,42,31,.15);z-index:3}
.table::after{content:"";position:absolute;left:44%;top:80%;width:12%;height:120%;background:var(--wood-dark);border-radius:0 0 calc(1cqw*var(--k,1)) calc(1cqw*var(--k,1));z-index:-1}
.table .foot{position:absolute;left:30%;top:190%;width:40%;height:calc(3.5cqw*var(--k,1));background:var(--wood-dark);border-radius:50%;z-index:-2}
.table .on{position:absolute;left:50%;top:calc(-4cqw*var(--k,1));transform:translateX(-50%);font-size:calc(7cqw*var(--k,1));line-height:1;white-space:nowrap}
.table .on.sm{font-size:calc(5cqw*var(--k,1));top:calc(-2.5cqw*var(--k,1))}
.c{position:absolute;line-height:1;font-size:calc(15cqw*var(--k,1));z-index:4;filter:drop-shadow(0 calc(.8cqw*var(--k,1)) 0 rgba(59,42,31,.18))}
.c.sm{font-size:calc(11cqw*var(--k,1))}.c.xs{font-size:calc(8cqw*var(--k,1))}.c.lg{font-size:calc(20cqw*var(--k,1))}
.flip{display:inline-block;transform:scaleX(-1)}
.robo{position:absolute;font-size:calc(22cqw*var(--k,1));line-height:1;z-index:5;width:1em;text-align:center}
.robo .bot{display:inline-block;position:relative;filter:drop-shadow(0 calc(.6cqw*var(--k,1)) 0 rgba(59,42,31,.2))}
.robo .wheels{display:block;font-size:.3em;letter-spacing:-.35em;margin-top:-.3em;opacity:.85;text-align:center;padding-right:.35em}
.robo .broom{position:absolute;right:-28%;bottom:2%;font-size:.62em;transform:rotate(-14deg);transform-origin:bottom}
.robo .hat{position:absolute;left:50%;top:-.55em;transform:translateX(-50%);font-size:.7em;line-height:1}
.robo .hat.balloon{top:-1.05em;font-size:.8em;animation:bob 2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-.15em)}}
.robo .glow{position:absolute;left:50%;top:50%;width:150%;height:150%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,59,59,var(--h,0)) 0%,rgba(255,183,3,calc(var(--h,0)*.45)) 45%,transparent 70%);z-index:-1}
.robo .cheek{position:absolute;top:56%;width:.17em;height:.1em;border-radius:50%;background:rgba(255,80,80,var(--h,0));filter:blur(.02em)}
.robo .cheek.l{left:14%}.robo .cheek.r{right:14%}
.robo .steam{position:absolute;font-size:.42em;line-height:1;opacity:.9;animation:steamy 1.4s infinite ease-in-out}
@keyframes steamy{0%,100%{opacity:.5}50%{opacity:1;translate:0 -.1em}}
.robo .sweat{position:absolute;font-size:.28em;line-height:1}
.robo.sweep .bot{animation:sweepy .3s infinite alternate}
@keyframes sweepy{from{transform:translateX(-.05em) rotate(-2deg)}to{transform:translateX(.05em) rotate(2deg)}}
.robo.wobble .bot{animation:wob .15s infinite alternate}
@keyframes wob{from{transform:translateX(-.04em) rotate(-4deg)}to{transform:translateX(.04em) rotate(4deg)}}
.bub{position:absolute;background:#fff;border-radius:calc(3.2cqw*var(--k,1));padding:calc(1.6cqw*var(--k,1)) calc(2.4cqw*var(--k,1));font-family:var(--display);font-weight:700;font-size:calc(3.6cqw*var(--k,1));line-height:1.15;box-shadow:0 calc(.6cqw*var(--k,1)) 0 rgba(59,42,31,.12);white-space:nowrap;z-index:6;color:var(--cocoa);text-align:center}
.bub::after{content:"";position:absolute;left:calc(3.5cqw*var(--k,1));bottom:calc(-2cqw*var(--k,1));border:calc(2cqw*var(--k,1)) solid transparent;border-top-color:#fff;border-bottom:0}
.bub.r::after{left:auto;right:calc(3.5cqw*var(--k,1))}
.bub.big{font-size:calc(4.4cqw*var(--k,1))}
.bub.sm{font-size:calc(3cqw*var(--k,1));padding:calc(1.2cqw*var(--k,1)) calc(1.8cqw*var(--k,1))}
.bub em{font-style:normal;color:var(--ketchup)}
.puff{position:absolute;width:calc(8cqw*var(--k,1));height:calc(8cqw*var(--k,1));border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(214,232,120,.95),rgba(170,200,80,.65) 55%,rgba(150,180,60,0) 74%);z-index:4;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:calc(2.2cqw*var(--k,1));color:#5d7a1d;font-style:italic;animation:puffy 1.6s infinite ease-in-out}
.puff.sm{width:calc(5.5cqw*var(--k,1));height:calc(5.5cqw*var(--k,1));font-size:calc(1.7cqw*var(--k,1))}
.puff.lg{width:calc(11cqw*var(--k,1));height:calc(11cqw*var(--k,1));font-size:calc(2.8cqw*var(--k,1))}
@keyframes puffy{0%,100%{transform:scale(1)}50%{transform:scale(1.12) translateY(-4%)}}
.crumb{position:absolute;width:calc(1.6cqw*var(--k,1));height:calc(1.25cqw*var(--k,1));border-radius:40% 60% 50% 50%;background:#8A5A2B;box-shadow:inset 0 0 0 calc(.3cqw*var(--k,1)) #B8803F;z-index:3}
.crumbtap{position:absolute;width:clamp(44px,12cqw,64px);height:clamp(44px,12cqw,64px);transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;z-index:8;padding:0}
.crumbtap::before{content:"";width:46%;height:36%;border-radius:40% 60% 50% 50%;background:#8A5A2B;box-shadow:inset 0 0 0 calc(.5cqw*var(--k,1)) #B8803F,0 calc(.3cqw*var(--k,1)) 0 rgba(59,42,31,.18);transition:transform .2s}
.crumbtap.hit::before{transform:scale(.6);opacity:.5}
.crumbtap .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(16px,5cqw,28px);color:#fff;text-shadow:0 2px 0 var(--ketchup-dark);opacity:0;transform:scale(0)}
.crumbtap.hit .n{opacity:1;transform:scale(1);transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .1s;background:var(--ketchup);border-radius:50%;inset:22%}
.crumbtap.last .n{background:var(--mint)}
.sp{position:absolute;font-size:calc(5cqw*var(--k,1));line-height:1;z-index:7}
.sp.twinkle{animation:twinkle 1.2s infinite alternate}
@keyframes twinkle{from{opacity:.4;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
.zip{position:absolute;height:calc(.7cqw*var(--k,1));border-radius:999px;background:rgba(59,42,31,.28);z-index:4}
.spring{position:absolute;width:calc(3.2cqw*var(--k,1));height:calc(9cqw*var(--k,1));border-radius:calc(1.6cqw*var(--k,1));background:repeating-linear-gradient(-60deg,#C9D2DA 0 calc(.9cqw*var(--k,1)),#7E8A96 calc(.9cqw*var(--k,1)) calc(1.8cqw*var(--k,1)));box-shadow:inset 0 0 0 calc(.3cqw*var(--k,1)) #5C6670,0 calc(.4cqw*var(--k,1)) 0 rgba(59,42,31,.2);z-index:5}

/* ---------- sound (all synthesized, no files) ---------- */
const Sound = (() => {
  let ctx = null, enabled = true;
  function ensure(){
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx = null; } }
    if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(freq, dur, o={}){
    const c = ensure(); if(!c || !enabled) return;
    const {type='sine', gain=0.2, slide=null, delay=0} = o;
    const t = c.currentTime + delay;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if(slide) osc.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t+dur+0.05);
  }
  function noise(dur, o={}){
    const c = ensure(); if(!c || !enabled) return;
    const {gain=0.3, from=3000, to=200, delay=0} = o;
    const t = c.currentTime + delay;
    const len = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t+dur);
    const g = c.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  // toot: base pitch per character (bear low, frog high...), wobbly sawtooth through a lowpass
  function toot(base=80, dur=0.4, delay=0){
    const c = ensure(); if(!c || !enabled) return;
    const t = c.currentTime + delay;

    count(n){ tone(440*Math.pow(1.06,n),0.14,{type:'triangle',gain:0.12,slide:440*Math.pow(1.06,n)*1.5}); },
    ding(){ tone(1046,0.3,{gain:0.15}); tone(1568,0.45,{gain:0.1,delay:0.1}); tone(1046,0.3,{gain:0.12,delay:0.3}); tone(1568,0.5,{gain:0.09,delay:0.4}); },

/* ---------- read-aloud ---------- */
const Voice = (() => {
  let enabled = true, voice = null;
  const has = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function pickVoice(){
    if(!has) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/^en/i.test(v.lang) && /Google US|Samantha|Karen|Zira|Aria|Jenny|Female/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  }
  if(has){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function clean(text){
    let t = String(text);
    t = t.replace(/\bKA[- ]?BOOM\b/gi, 'kaboom').replace(/\bKa[- ]ching\b/gi, 'ka ching');
    const N = '(\\$?\\d+)';
    t = t.replace(new RegExp(N+'\\s*[×x]\\s*'+N,'g'), '$1 times $2').replace(/×/g, ' times ');
    t = t.replace(/÷/g, ' divided by ');
    t = t.replace(new RegExp(N+'\\s*\\+\\s*'+N,'g'), '$1 plus $2').replace(/\+/g, ' and ');
    t = t.replace(new RegExp(N+'\\s*[−–-]\\s*'+N,'g'), '$1 take away $2');
    t = t.replace(/−/g, ' take away ').replace(/[–—]/g, ' ').replace(/(\S)-(\S)/g, '$1 $2');
    t = t.replace(/\$(\d+)/g, '$1 dollars');
    t = t.replace(/=\s*\?/g, ' equals what?').replace(/=/g, ' equals ');
    t = t.replace(/[✓✔]/g, ' the green check ').replace(/→/g, ' to ').replace(/&/g, ' and ').replace(/[·•]/g, ', ').replace(/…/g, ', ');
    t = t.replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{1F1E6}-\u{1F1FF}\u{E0020}-\u{E007F}]/gu, ' ');
    t = t.replace(/[^\p{L}\p{N}\s.,!?'’:%]/gu, ' ');
    return t.replace(/\s+/g, ' ').replace(/\s([.,!?])/g, '$1').replace(/^[\s.,]+/, '').trim();
  }
  return {
    has, get voice(){ return voice; },
    get enabled(){ return enabled; }, set enabled(v){ enabled = v; if(!v && has){ try{ speechSynthesis.cancel(); }catch(e){} } },
    clean
  };
})();

/* ---------- narration: say(id, text, wordEls) -> Promise({done|cancelled}); highlights words as spoken ---------- */
let sayToken = 0, currentAudio = null;
function estimateMs(text){ const t = Voice.clean(text); return 60 + t.length*70 + (t.match(/[.,!?]/g)||[]).length*220; }
function say(id, text, words=[]){
  const token = ++sayToken;
  stopSpeech();
  const alive = () => token === sayToken;
  const clearWords = () => words.forEach(w=>w.classList.remove('on'));
  // spoken string built from the same words so onboundary offsets map back to word spans
  const spoken = []; const offsets = [];
  let pos = 0;
  words.forEach((w,i)=>{ const c = Voice.clean(w.textContent); if(!c){ offsets.push(-1); return; } offsets.push(pos); spoken.push(c); pos += c.length+1; });
  const utterText = words.length ? spoken.join(' ') : Voice.clean(text);
  function lightIdx(i){ words.forEach((w,j)=>w.classList.toggle('on', j===i)); }
  function lightChar(ch){ let best=-1; offsets.forEach((o,i)=>{ if(o>=0 && o<=ch) best=i; }); if(best>=0) lightIdx(best); }
  // timer-based sweep, proportional to word length
  let timers = [];
  function sweep(totalMs){
    const lens = words.map(w=>Math.max(1, Voice.clean(w.textContent).length+1)); const sum = lens.reduce((a,b)=>a+b,0)||1;
    let t = 0; words.forEach((w,i)=>{ timers.push(setTimeout(()=>{ if(alive()) lightIdx(i); }, t)); t += totalMs*lens[i]/sum; });
  }
  const stopTimers = () => { timers.forEach(clearTimeout); timers = []; };
  return new Promise(res => {
    const finish = ok => { if(!alive()) return; stopTimers(); clearWords(); res({done:ok, cancelled:!ok}); };
    cancelCurrent = () => { stopTimers(); clearWords(); if(alive()) res({done:false, cancelled:true}); };
    const est = estimateMs(text);
    if(!Voice.enabled){ // read-aloud off: quick silent sweep so the words still light up
      sweep(Math.min(est*0.3, 900)); timers.push(setTimeout(()=>finish(true), Math.min(est*0.3, 900)+50)); return;
    }
    if(VOICE_CLIPS[id]){
      try{
        const a = new Audio(VOICE_CLIPS[id]); currentAudio = a;
        a.addEventListener('loadedmetadata', ()=>{ if(alive()) sweep((isFinite(a.duration)?a.duration*1000:est)); });
        a.addEventListener('ended', ()=>finish(true)); a.addEventListener('error', ()=>finish(true));
        a.play().catch(()=>finish(true)); return;
      }catch(e){}
    }
    if(!Voice.has){ sweep(est); timers.push(setTimeout(()=>finish(true), est+50)); return; }
    let boundaries = false, ended = false; const t0 = performance.now();
    sweep(est); // fallback pacing until the browser gives us word boundaries
    const done = () => { ended = true; if(!boundaries && performance.now()-t0 < est*0.3){ timers.push(setTimeout(()=>finish(true), Math.max(50, est-(performance.now()-t0)))); return; } finish(true); }; // a silent or broken voice: keep the timed sweep so the words still light up
    try{
      const u = new SpeechSynthesisUtterance(utterText); u.rate = 0.9; u.pitch = 1.05; if(Voice.voice) u.voice = Voice.voice;
      u.onboundary = e => { if(!alive()) return; if(!boundaries){ boundaries = true; stopTimers(); } if(e.name==='word' || e.charIndex!=null) lightChar(e.charIndex); };
      u.onend = done;
      u.onerror = done;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
      timers.push(setTimeout(()=>{ if(!ended) finish(true); }, est*1.6+1500)); // safety: never wait forever on a silent voice
    }catch(e){ finish(true); }
  });
}
let cancelCurrent = () => {};
function stopSpeech(){ cancelCurrent(); cancelCurrent = () => {}; if(Voice.has){ try{ speechSynthesis.cancel(); }catch(e){} } if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; } }

/* ---------- state ---------- */

/* ---------- idle nudge ---------- */

  }
  if(kind==='crumbs'){
    C.promptId='X5'; C.prompt=X.X5; C.answer=10; C.counted=0;
    const pos = [[10,62],[28,66],[46,63],[64,66],[82,62],[10,86],[28,90],[46,87],[64,90],[82,86]];
    pos.forEach((p,i)=>{ const b = document.createElement('button'); b.className='crumbtap'; b.style.left=p[0]+'%'; b.style.top=p[1]+'%'; b.setAttribute('aria-label','Crumb'); b.innerHTML='<span class="n"></span>'; b.addEventListener('click', ()=>tapCrumb(b)); el.scene.appendChild(b); });
    C.targets = ()=>[...el.scene.querySelectorAll('.crumbtap:not(.hit)')];
    C.askHowMany = ()=>{
      const p = promptBox(X.X6); p.dataset.lid='X6';
      const nums = numButtons(8, 12, n=>answer(n)); C.targets = ()=>[...nums.querySelectorAll('.num')];
      C.onWrong = (n,b)=>{ b.classList.remove('nope'); void b.offsetWidth; b.classList.add('nope'); if(C.wrong===1){ hintBox(`<span class="pic">1 2 3 4 5 6 7 8 9 <b>10</b></span>${X.X7}`); el.scene.querySelectorAll('.crumbtap').forEach(c=>c.classList.add('last')); return {id:'X7',text:X.X7}; } nums.querySelector('[data-n="10"]').classList.add('reveal'); hintBox(`<span class="pic">10</span>${X.X8}`); C.targets = ()=>[nums.querySelector('[data-n="10"]')]; return {id:'X8',text:X.X8}; };
      C.onRight = ()=>{ nums.querySelectorAll('.num').forEach(b=>{ b.disabled = true; b.classList.toggle('reveal', b.dataset.n==='10'); }); finishChallenge('X9', X.X9); };
      const myRun = run; if(S.mode==='read' && S.playing) say('X6', X.X6, [...p.querySelectorAll('.w')]).then(()=>{ if(run===myRun) setNudge(C.targets, {id:'X6',text:X.X6}); }); else setNudge(C.targets, {id:'X6',text:X.X6});
    };
  }
  if(kind==='benny'){
    C.promptId='X10'; C.prompt=X.X10;
    const p = promptBox(X.X10); p.dataset.lid='X10';
    const door = document.createElement('button'); door.className='doortap'; door.setAttribute('aria-label','The door'); el.scene.appendChild(door);
    const benny = el.scene.querySelector('#benny');
    C.targets = ()=>[door];
    const found = ()=>{ if(C.done) return; benny.classList.remove('peek'); benny.classList.add('found'); door.remove(); el.scene.querySelectorAll('.tapmark').forEach(m=>m.remove()); Sound.toot('bear',1); el.scene.querySelectorAll('.gig').forEach(g=>g.classList.add('giggle')); finishChallenge('X13', X.X13); };
    door.addEventListener('click', found); benny.addEventListener('click', found); benny.style.cursor='pointer';
    C.tapDoor = found;
    const onScene = e=>{ if(S.challenge!==C){ el.scene.removeEventListener('click', onScene); return; } if(C.done || e.target.closest('.doortap') || e.target.closest('#benny')) return; wrongTap(e.target.closest('.c,.robo,.gear,.spring,.table') || null); }; el.scene.addEventListener('click', onScene);
    const wrongTap = t=>{ C.wrong++; Sound.oops(); if(t){ t.classList.remove('nope'); void t.offsetWidth; t.style.animation='wiggle .4s'; setTimeout(()=>t.style.animation='',450); }
      if(C.wrong===1){ door.classList.add('glow'); hintBox(`<span class="pic">🚪 👀</span>${X.X11}`); sayHint({id:'X11',text:X.X11}); }
      else { door.classList.add('glow'); benny.classList.add('peek'); const m = document.createElement('div'); m.className='tapmark'; m.style.left='12%'; m.style.top='4%'; m.textContent='👇'; el.scene.appendChild(m); hintBox(`<span class="pic">🐻👇</span>${X.X12}`); C.targets=()=>[benny]; sayHint({id:'X12',text:X.X12}); } };
    C.wrongTap = ()=>wrongTap(null);
  }
  if(kind==='rebuild'){
    C.promptId='X14'; C.prompt=X.X14; C.sel=null; C.placed=0;
    const p = promptBox(X.X14); p.dataset.lid='X14';
    const PARTS = [['gears','⚙️',8,50],['springs','🔩',46,64],['wheel','⚫',26,84],['broom','🧹',48,34]];
    const tray = document.createElement('div'); tray.className='tray';
    PARTS.forEach(([name,em])=>{ const b = document.createElement('button'); b.className='part'; b.dataset.part=name; b.textContent=em; b.setAttribute('aria-label',name); b.addEventListener('click', ()=>tapPart(name)); tray.appendChild(b); });
    el.extra.appendChild(tray);
    PARTS.forEach(([name,em,x,y])=>{ const s = document.createElement('button'); s.className='slot'; s.dataset.slot=name; s.style.left=x+'%'; s.style.top=y+'%'; s.innerHTML=`<span class="ghost">${em}</span>`; s.setAttribute('aria-label','Spot for '+name); s.addEventListener('click', ()=>tapPart(name, true)); el.scene.appendChild(s); });
    C.targets = ()=> C.sel ? [el.scene.querySelector(`.slot[data-slot="${C.sel}"]`)] : [...tray.querySelectorAll('.part:not(.used)')];
  }
}
function sayHint(line){ const myRun = run; const was = Voice.enabled; if(S.mode==='self') Voice.enabled = true; say(line.id, line.text, []).then(()=>{ Voice.enabled = was; if(run===myRun) setNudge(challengeTargets, line); }); setNudge(challengeTargets, line); }
function answer(n){
  const C = S.challenge; if(!C || C.done || C.answer==null || !C.onWrong) return;
  const b = el.extra.querySelector(`.num[data-n="${n}"]`); if(!b) return;
  if(+n===C.answer){ C.onRight(); return; }
  C.wrong++; Sound.oops(); const line = C.onWrong(+n, b); if(line) sayHint(line);
}
function tapCrumb(b){
  const C = S.challenge; if(!C || C.kind!=='crumbs' || C.done || b.classList.contains('hit')) return;
  C.counted++; b.classList.add('hit'); b.querySelector('.n').textContent = C.counted; Sound.count(C.counted);
  const was = Voice.enabled; if(S.mode==='self') Voice.enabled = true; say('N'+C.counted, String(C.counted), []).then(()=>{ Voice.enabled = was; });
  if(C.counted===10){ b.classList.add('last'); setTimeout(()=>{ if(S.challenge===C) C.askHowMany(); }, 600); }
}
function tapPart(name, isSlot){
  const C = S.challenge; if(!C || C.done) return;
  if(C.kind==='crumbs' && name==='crumb'){ const b = el.scene.querySelector('.crumbtap:not(.hit)'); if(b) tapCrumb(b); return; }
  if(C.kind==='benny'){ if(name==='door'||name==='benny') C.tapDoor(); else C.wrongTap(); return; }
  if(C.kind!=='rebuild') return;
  const slot = el.scene.querySelector(`.slot[data-slot="${name}"]`), part = el.extra.querySelector(`.part[data-part="${name}"]`);
  if(!isSlot){ if(part.classList.contains('used')) return; C.sel = name; el.extra.querySelectorAll('.part').forEach(p=>p.classList.toggle('sel', p===part)); Sound.pop(); el.scene.querySelectorAll('.slot').forEach(s=>s.classList.remove('glow')); if(C.revealed) slot.classList.add('glow'); return; }
  if(!C.sel){ Sound.oops(); slot.classList.remove('nope'); void slot.offsetWidth; slot.classList.add('nope'); return; }
  if(slot.classList.contains('filled')) return;
  if(C.sel===name){
    slot.classList.add('filled'); slot.classList.remove('glow'); el.extra.querySelector(`.part[data-part="${name}"]`).classList.add('used'); el.extra.querySelectorAll('.part').forEach(p=>p.classList.remove('sel')); C.sel = null; C.placed++;
    if(C.placed%2) Sound.click(); else Sound.clack();
    if(C.placed===4){ Sound.clickclack(); const r = el.scene.querySelector('#robo14'); if(r){ r.innerHTML = '<span class="bot">🤖<span class="broom">🧹</span></span><span class="wheels">⚫⚫</span>'; r.classList.add('sweep'); } finishChallenge('X17', X.X17); }
    return;
  }
  C.wrong++; Sound.oops(); slot.classList.remove('nope'); void slot.offsetWidth; slot.classList.add('nope');
  const right = el.scene.querySelector(`.slot[data-slot="${C.sel}"]`); right.classList.add('glow');
  if(C.wrong===1){ hintBox(`<span class="pic">${el.extra.querySelector(`.part[data-part="${C.sel}"]`).textContent} 👉 ✨</span>${X.X15}`); sayHint({id:'X15',text:X.X15}); }
  else { C.revealed = true; hintBox(`<span class="pic">👉 ✨</span>${X.X16}`); sayHint({id:'X16',text:X.X16}); }
}

/* ---------- overlays ---------- */
function showOverlay(html){ el.card.innerHTML = html; el.overlay.classList.add('on'); }
function hideOverlay(){ el.overlay.classList.remove('on'); }
function showTitle(){
  ++run; stopSpeech(); S.screen='title'; setNudge(null); document.body.classList.add('title');
  const hasMark = !!saved.id && saved.id!=='p1';
  el.scene.className='scene diner'; el.scene.innerHTML = BACKDROP + SCENES.p1.html(); el.text.innerHTML=''; el.extra.innerHTML=''; el.dots.innerHTML='';
  showOverlay(`<div class="kicker">A Toot Toot Diner story</div><div class="hero">🤖💥</div><h1>Robo Goes Boom</h1>
    <p>Robo loves to clean. When the diner gets busy, Robo gets hot… and goes KA-BOOM. Friends help him build again.</p>
    ${hasMark ? `<button class="bigbtn" id="btn-keep">Keep reading ▶</button><p style="font-size:.85rem">Or start over:</p>` : ''}
    <div class="rowbtns" style="flex-direction:column;gap:10px"><button class="bigbtn${hasMark?' mint':''}" id="btn-read">🔊 Read to me</button><button class="bigbtn mint" id="btn-self">📖 I read</button></div>
    <div class="rowbtns"><button class="subbtn" id="btn-grownups">For grown-ups</button></div>`);
  if(hasMark) $('#btn-keep').addEventListener('click', ()=>start(saved.mode||'read', true));
  $('#btn-read').addEventListener('click', ()=>{ clearBookmark(); start('read'); });
  $('#btn-self').addEventListener('click', ()=>{ clearBookmark(); start('self'); });
  $('#btn-grownups').addEventListener('click', showGrownups);
}
function showGrownups(){
  showOverlay(`<h2>For grown-ups</h2>
    <div class="fact" id="grownups"><b>Two ways to read</b><ul><li><b>Read to me</b>: the story is read aloud, each word lights up as it is spoken, and pages turn by themselves. The big button pauses.</li><li><b>I read</b>: no narration. Your child taps the arrow to turn the page, and the 🔊 button or the text reads a page when they want help.</li></ul>
    <b style="display:block;margin-top:10px">Three choices</b><ul><li>What Benny eats next, how everyone helps Robo cool down, and how Robo comes back together. Choices change the jokes, never the safety: every path rejoins the story and Robo still goes boom, because that is the point of the book.</li></ul>
    <b style="display:block;margin-top:10px">Four little challenges</b><ul><li>Adding Benny’s bill (3 + 2), counting ten crumbs, finding Benny, and putting Robo back together. First wrong answer: a picture hint. Second: the answer, to tap. The arrows always work, so nobody gets stuck.</li><li>If your child stops for a while, the instruction is repeated and the thing to tap wiggles.</li></ul>
    <b style="display:block;margin-top:10px">Built to be put down</b><ul><li>No stars, scores, timers, streaks or rewards. Nothing ever says “come back”. The end card offers “Read it again” and “All done for today”.</li><li>A bookmark (page and choices) and the sound and read-aloud toggles are saved on this device only. Nothing leaves the device. ⛶ makes it full screen on a tablet.</li></ul></div>
    <div class="rowbtns"><button class="subbtn" id="btn-back">Back</button></div>`);
  $('#btn-back').addEventListener('click', showTitle);
}
function showEnd(){
  S.screen='end'; setNudge(null); clearBookmark();
  const top = S.look==='balloon' ? '🎈' : S.look==='hat' ? '🎩' : '';
  showOverlay(`<div class="endrobo">${top?`<span class="top">${top}</span>`:''}🤖</div><h1>The end</h1><p>Robo went boom. And that’s OK. Friends helped him build again.</p>
    <button class="bigbtn" id="btn-again">Read it again 📖</button><div class="rowbtns"><button class="subbtn" id="btn-done">All done for today 👋</button></div>`);
  Sound.toot('all',2); say('T2', T.T2, []);
  $('#btn-again').addEventListener('click', ()=>{ stopSpeech(); showTitle(); });
  $('#btn-done').addEventListener('click', showGoodbye);
}
function showGoodbye(){
  ++run; stopSpeech(); S.screen='bye'; setNudge(null);
  showOverlay(`<div class="hero">👋🤖</div><h2>Great work today!</h2><p>The book is closed for now. Stretch your arms, go find a real book, and read it to someone you love. Robo will be here when you come back.</p><div class="rowbtns"><button class="subbtn" id="btn-title">Back to start</button></div>`);
  say('T3', T.T3, []);
  $('#btn-title').addEventListener('click', showTitle);
}

/* ---------- top bar + controls ---------- */
function applySettings(){ Sound.enabled = saved.sound !== false; Voice.enabled = saved.voice !== false; $('#btn-sound').classList.toggle('off', !Sound.enabled); $('#btn-sound').textContent = Sound.enabled?'🔊':'🔇'; $('#btn-voice').classList.toggle('off', !Voice.enabled); }
applySettings();
$('#btn-sound').addEventListener('click', ()=>{ saved.sound = !(saved.sound !== false); Save.save(saved); applySettings(); if(Sound.enabled){ Sound.ensure(); Sound.pop(); } });
$('#btn-voice').addEventListener('click', ()=>{ saved.voice = !(saved.voice !== false); Save.save(saved); applySettings(); if(Voice.enabled) say('T0','Read aloud is on.',[]); });
const fsBtn = $('#btn-full');
if(document.documentElement.requestFullscreen){ fsBtn.addEventListener('click', ()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }); document.addEventListener('fullscreenchange', ()=>{ fsBtn.textContent = document.fullscreenElement ? '🡼' : '⛶'; }); } else fsBtn.style.display='none';
$('#btn-home').addEventListener('click', ()=>{ persist(); showTitle(); });
el.mode.addEventListener('click', ()=>{ Sound.pop(); setMode(S.mode==='read' ? 'self' : 'read'); if(S.screen!=='book') setPlayBtn(); });
el.prev.addEventListener('click', prev); el.next.addEventListener('click', next); el.play.addEventListener('click', togglePlay);
function readTapped(box){ // tapping any text re-reads it (even with read-aloud off)
  if(S.screen!=='book' || !box.dataset.text) return;
  const myRun = ++run; const was = Voice.enabled; Voice.enabled = true; Sound.ensure();
  say(box.dataset.lid || 'T0', box.dataset.text, [...box.querySelectorAll('.w')]).then(r=>{ Voice.enabled = was; if(run!==myRun || !r.done) return; if(box===el.text && S.mode==='read' && S.playing){ if(S.challenge && !S.challenge.done) say(S.challenge.promptId, S.challenge.prompt, [...el.extra.querySelectorAll('.w')]); else if(S.id[0]!=='c') wait(1500).then(()=>{ if(run===myRun && S.playing) next(); }); } });
}
el.text.addEventListener('click', ()=>readTapped(el.text));
el.text.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); readTapped(el.text); } });
el.extra.addEventListener('click', e=>{ const box = e.target.closest('.txt'); if(box) readTapped(box); });
document.addEventListener('keydown', e=>{ if(S.screen!=='book' || el.overlay.classList.contains('on')) return; if(e.key==='ArrowRight') next(); if(e.key==='ArrowLeft') prev(); if(e.key===' '){ e.preventDefault(); togglePlay(); } });
// I read mode: tapping the picture turns the page
el.scene.addEventListener('click', e=>{ if(S.screen!=='book' || S.mode!=='self' || S.challenge || e.target.closest('button')) return; next(); });

/* ---------- boot + debug hooks ---------- */
showTitle();
window.__game = {
  get state(){ return {screen:S.screen, mode:S.mode, id:S.id, index:S.index, page:bookPageOf(S.id), seq:S.seq.slice(), choices:S.choices.slice(), playing:S.playing, look:S.look, challenge:S.challenge ? {kind:S.challenge.kind, wrong:S.challenge.wrong, done:S.challenge.done, counted:S.challenge.counted||0, placed:S.challenge.placed||0, sel:S.challenge.sel||null} : null, overlay:el.overlay.classList.contains('on'), bookmark:Save.load()}; },
  start, startLevel(n){ start('read'); if(n>1) goTo(n); }, goTo, choose, answer, tapPart, next, prev, togglePlay,
  mode(m){ setMode(m); }, speech(on){ Voice.enabled = !!on; saved.voice = !!on; applySettings(); }, sound(on){ Sound.enabled = !!on; saved.sound = !!on; applySettings(); },
  title: showTitle, end: showEnd, goodbye: showGoodbye, say, clean: Voice.clean, VOICE_CLIPS
};
})();
</script>
