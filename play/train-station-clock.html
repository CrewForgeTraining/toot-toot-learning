<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:44px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
/* ---------- Train Station Clock: scene + panel styles. The engine (toot.css) owns the chrome. ---------- */
:root{--minute:#2A7BFF;--minute-dark:#1B5FCC;--second:#E63946;--platform:#EDE6D6;--gravel:#D3C8B4;--rail:#6B6257;--sleeper:#9A7550}
.segs{flex:1;display:flex;gap:4px;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);padding:4px 5px}
.segs .seg{flex:1;border-radius:999px;background:rgba(59,42,31,.08);transition:background .4s}
.segs .seg.done{background:var(--mint);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@media (max-width:600px){.meter label .lt{display:none}}

/* ---------- the station (everything in cqw so it scales with the scene) ---------- */
#scene{background:linear-gradient(#A9DFFF,#E4F5FF 62%,#E4F5FF)}
#scene>*{user-select:none;-webkit-user-select:none}
.sun{position:absolute;right:7%;top:7%;width:9cqw;height:9cqw;border-radius:50%;background:var(--sun);box-shadow:0 0 3cqw rgba(255,200,61,.8)}
.cloud{position:absolute;width:10cqw;height:3.4cqw;border-radius:2cqw;background:#fff;opacity:.92;animation:drift 38s linear infinite}
.cloud::before{content:"";position:absolute;left:2.2cqw;top:-1.8cqw;width:4.2cqw;height:4.2cqw;border-radius:50%;background:#fff}
.cloud::after{content:"";position:absolute;left:5.4cqw;top:-1cqw;width:3cqw;height:3cqw;border-radius:50%;background:#fff}
.cloud.c2{animation-duration:52s;animation-delay:-20s;width:7cqw}
@keyframes drift{from{transform:translateX(-20cqw)}to{transform:translateX(110cqw)}}
.hill{position:absolute;left:-10%;right:-10%;top:40%;height:20%;background:var(--grass);border-radius:50% 50% 0 0/100% 100% 0 0}
.station{position:absolute;left:3%;top:9%;width:42%;height:45%;background:var(--butter);border-radius:2cqw 2cqw 0 0;box-shadow:inset 0 0 0 .6cqw #E8C46A;z-index:2}
.station .roof{position:absolute;left:-4%;right:-4%;top:-1.2cqw;height:5cqw;background:repeating-linear-gradient(90deg,var(--ketchup) 0 4cqw,#fff 4cqw 8cqw);border-radius:1cqw;box-shadow:0 .5cqw 0 var(--ketchup-dark)}
.station .sign{position:absolute;left:50%;top:5cqw;transform:translateX(-50%);background:var(--cocoa);color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(8px,2cqw,16px);padding:.3cqw 1.4cqw;border-radius:999px;letter-spacing:.08em;white-space:nowrap}
.station .door{position:absolute;left:7%;bottom:0;width:18%;height:52%;background:#8E4415;border-radius:3cqw 3cqw 0 0;box-shadow:inset 0 0 0 .5cqw #6E3410}
.station .door::after{content:"";position:absolute;right:16%;top:50%;width:1.2cqw;height:1.2cqw;border-radius:50%;background:var(--sun)}
.station .win{position:absolute;right:8%;top:44%;width:20%;height:32%;background:linear-gradient(#9FDBFF,#DFF3FF);border:.6cqw solid #fff;border-radius:1.2cqw;box-shadow:0 .3cqw 0 rgba(59,42,31,.12)}
.station .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:.5cqw;background:#fff;transform:translateX(-50%)}
.cuckoo{position:absolute;left:50%;top:26%;width:8cqw;height:8cqw;transform:translateX(-50%);overflow:hidden;pointer-events:none;z-index:1}
.cuckoo .toot-char{width:100%;transform:translateY(102%)}
.miniclock{position:absolute;left:50%;top:41%;width:13cqw;height:13cqw;transform:translateX(-50%);z-index:2}
.miniclock svg{width:100%;height:100%;display:block;filter:drop-shadow(0 .5cqw 0 rgba(59,42,31,.2))}
.miniclock .chand{transform-origin:100px 100px;transform-box:view-box;transition:transform .3s}
.platform{position:absolute;left:0;right:0;top:54%;height:17%;background:var(--platform);box-shadow:inset 0 -1cqw 0 #F7C948,inset 0 .5cqw 0 rgba(59,42,31,.06);z-index:1}
.bench{position:absolute;left:84%;bottom:1.2cqw;width:11cqw;height:5.4cqw}
.bench i{position:absolute;background:var(--wood);border:.35cqw solid var(--cocoa);border-radius:.5cqw}
.bench .back{left:0;right:0;top:0;height:1.8cqw}
.bench .seat{left:-.6cqw;right:-.6cqw;top:2.2cqw;height:1.4cqw}
.bench .lg{width:.9cqw;height:2.2cqw;bottom:0;background:var(--cocoa)}
.bench .lg.a{left:1cqw}.bench .lg.b{right:1cqw}
.signal{position:absolute;left:63%;bottom:31%;width:1.1cqw;height:12cqw;background:#6E5546;border-radius:.4cqw;z-index:2}
.signal::before{content:"";position:absolute;left:50%;top:-1.2cqw;width:3.2cqw;height:5cqw;transform:translateX(-50%);background:#3B2A1F;border-radius:1cqw}
.signal::after{content:"";position:absolute;left:50%;top:-.4cqw;width:1.8cqw;height:1.8cqw;transform:translateX(-50%);border-radius:50%;background:#F4552F;box-shadow:0 0 1cqw #F4552F;transition:background .3s,box-shadow .3s}
.signal.go::after{background:#8BD36F;box-shadow:0 0 1cqw #8BD36F}
.track{position:absolute;left:0;right:0;top:71%;bottom:0;background:var(--gravel)}
.track .sleepers{position:absolute;left:0;right:0;top:18%;height:64%;background:repeating-linear-gradient(90deg,var(--sleeper) 0 2.4cqw,transparent 2.4cqw 6.5cqw)}
.track .rail{position:absolute;left:0;right:0;height:1cqw;background:var(--rail);box-shadow:0 .3cqw 0 rgba(0,0,0,.18)}
.track .rail.r1{top:30%}.track .rail.r2{top:64%}

/* the train: an SVG engine + two carriages, moved with Toot.physics.tween */
.train{position:absolute;left:110%;bottom:8%;width:56cqw;z-index:4;line-height:0;filter:drop-shadow(0 .6cqw 0 rgba(59,42,31,.18));will-change:left}
.train svg{width:100%;height:auto;display:block;overflow:visible}
.train .car{transform-box:fill-box;transform-origin:50% 100%}
.train .wheel{transform-box:fill-box;transform-origin:50% 50%}
.train.rolling .car{animation:rock .22s infinite alternate}
.train.rolling .car.c1{animation-delay:.07s}.train.rolling .car.c2{animation-delay:.14s}
.train.rolling .wheel{animation:spin .4s linear infinite}
@keyframes rock{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(-1.5px) rotate(.6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* people on the platform: drawn cast characters */
.actor{position:absolute;bottom:31%;width:13%;z-index:5;line-height:0;will-change:left}
.actor .toot-char{width:100%}
.actor .who{position:relative;display:block}
.actor .who::after{content:"";position:absolute;left:14%;right:14%;bottom:-.4cqw;height:1.4cqw;background:rgba(59,42,31,.16);border-radius:50%;z-index:-1}
.passenger{left:110%;transition:left 1.9s cubic-bezier(.4,.1,.5,1),opacity .6s,transform .8s}
.actor.walking .who{animation:walk .32s infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-1.4cqw) rotate(3deg)}}
.passenger.board{transition:left .7s cubic-bezier(.4,.1,.5,1),opacity .4s .3s,transform .7s;opacity:0;transform:scale(.4) translateY(4cqw)}
.case{position:absolute;right:-22%;bottom:0;width:42%;height:36%;background:#B97B3F;border:.4cqw solid var(--cocoa);border-radius:.8cqw;box-shadow:inset 0 0 0 .3cqw #D2924E;transform-origin:50% 100%}
.case::before{content:"";position:absolute;left:34%;right:34%;top:-1.2cqw;height:1.2cqw;border:.4cqw solid var(--cocoa);border-bottom:0;border-radius:.6cqw .6cqw 0 0}
.case .lid{position:absolute;left:-.4cqw;right:-.4cqw;top:-.4cqw;height:45%;background:#C98A46;border:.4cqw solid var(--cocoa);border-radius:.8cqw .8cqw .2cqw .2cqw;transform-origin:0 100%}
.case .strap{position:absolute;left:50%;top:0;bottom:0;width:.8cqw;background:var(--ketchup);transform:translateX(-50%)}
.extra{left:112%;width:11%;transition:left 1.6s cubic-bezier(.4,.1,.5,1)}
.extra.run{transition:left 1.1s cubic-bezier(.4,0,.7,1)}
.extra.board{transition:left .5s,opacity .4s .2s,transform .5s;opacity:0;transform:scale(.4) translateY(4cqw)}
.sleeper{left:84.5%;bottom:33%;width:10%;z-index:3;display:none}
.sleeper.on{display:block}
.zzz{position:absolute;left:70%;top:-10%;font-family:var(--display);font-weight:700;color:var(--cocoa-soft);font-size:2.6cqw;line-height:1;opacity:0;pointer-events:none}
.zzz span{font-size:1.3em}.zzz span+span{font-size:1.7em}
.zzz.on{animation:zzz 1.5s infinite}
@keyframes zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(2cqw,-5cqw) scale(1.25)}}
.robo{left:33%;width:11%;bottom:30%}
.robo .flag{position:absolute;right:-14%;bottom:36%;width:.9cqw;height:8.5cqw;background:var(--cocoa);border-radius:.5cqw;transform-origin:50% 100%;transform:rotate(14deg)}
.robo .flag::after{content:"";position:absolute;left:100%;top:0;width:5cqw;height:3.6cqw;background:var(--mint);clip-path:polygon(0 0,100% 50%,0 100%)}
.robo .whistle{position:absolute;left:54%;top:42%;width:3.2cqw;height:1.8cqw;background:#C8CFD6;border:.3cqw solid var(--cocoa);border-radius:.4cqw 1cqw 1cqw .4cqw;opacity:0;transition:opacity .15s;box-shadow:inset .6cqw 0 0 #8FA3B1}
.robo.whistling .whistle{opacity:1}
.goat{position:absolute;left:112%;bottom:6%;width:12%;z-index:6;line-height:0;transition:left .55s cubic-bezier(.3,0,.6,1)}
.goat .toot-char{width:100%}
.goat.running .toot-char{animation:walk .18s infinite alternate}
.goat.leave{transition:left 1.2s ease-in}
#pigeon{position:absolute;width:6cqw;height:auto;left:-10%;top:12%;display:none;z-index:8;pointer-events:none;overflow:visible}
#pigeon.on{display:block}
.bubble .big{font-size:1.5em;line-height:1.15;display:block;margin-top:.2em;color:var(--ketchup-dark);font-family:var(--display);font-variant-numeric:tabular-nums}
.bubble .big small{display:block;font-size:.55em;color:var(--cocoa-soft);font-family:var(--body)}
.robo .bubble{min-width:10cqw;max-width:26cqw}

/* ---------- panel: the big clock + the three question views ---------- */
.panel-body{display:flex;flex-direction:column;gap:12px}
.clockwrap{display:none;flex-direction:column;align-items:center;gap:6px}
.clockwrap.on{display:flex}
#clock{width:min(100%,300px);max-width:100%;height:auto;display:block;touch-action:none;filter:drop-shadow(0 5px 0 rgba(59,42,31,.14));outline:none;border-radius:50%}
#clock:focus-visible{outline:4px solid var(--focus);outline-offset:4px}
#clock.grab{cursor:grab}
#clock.dragging{cursor:grabbing}
#clock .chand,#clock .ghost{transform-origin:100px 100px;transform-box:view-box;transition:transform .25s}
#clock.dragging .chand,#clock.wobbling .chand{transition:none}
#clock #hand-s{transition:transform .12s cubic-bezier(.2,1.6,.4,1)}
#clock .ghost{display:none;opacity:.6}
#clock .ghost.on{display:block;animation:ghost 1s infinite alternate}
@keyframes ghost{from{opacity:.4}to{opacity:.9}}
#clock .numhi{opacity:0;transition:opacity .3s}
#clock .numhi.on{opacity:1}
.legend{display:none;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.85rem;font-weight:800;color:var(--cocoa-soft)}
.legend.on{display:flex}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;border-radius:4px}
.legend .lh i{background:var(--ketchup);width:16px;height:10px}
.legend .lm i{background:var(--minute);width:28px;height:6px}
.qline{text-align:center;font-family:var(--display);font-weight:700;font-size:1.15rem;background:#F3FBFF;border-radius:14px;padding:8px 10px}
.setters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.setter{background:#fff;border-radius:16px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 0 0 2px rgba(59,42,31,.08)}
.setter small{text-transform:uppercase;letter-spacing:.1em;font-size:.68rem;font-weight:800;color:var(--cocoa-soft)}
.setter .row{display:flex;align-items:center;gap:6px}
.pm{width:48px;height:48px;border-radius:14px;background:var(--butter);font-size:1.6rem;font-weight:700;box-shadow:0 4px 0 #D9B24F;display:grid;place-items:center;line-height:1}
.pm:active{transform:translateY(3px);box-shadow:0 1px 0 #D9B24F}
.setter .val{font-family:var(--display);font-weight:700;font-size:1.7rem;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.setter.hours .val{color:var(--ketchup)}
.setter.mins .val{color:var(--minute)}
.choices{display:grid;gap:10px}
.choice{background:#fff;border-radius:18px;padding:12px 10px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,opacity .3s;min-height:44px}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.choice .dt{font-family:var(--display);font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1}
.choice small{font-weight:800;color:var(--cocoa-soft);font-size:.85rem}
.choice.nope{animation:nope .4s}
.choice.dim{opacity:.3;pointer-events:none}
.choice.hint-hour .hh{background:var(--butter);border-radius:8px;padding:0 6px;box-shadow:0 0 0 3px var(--sun)}
.choice.reveal{box-shadow:0 4px 0 var(--mint-dark),0 0 0 4px var(--mint);background:#E4FBF5;animation:bob 1s infinite}
.paddisp{text-align:center;font-family:var(--display);font-weight:700;font-size:2.4rem;font-variant-numeric:tabular-nums;letter-spacing:.06em;background:var(--butter);border-radius:14px;padding:4px 10px;color:var(--ketchup-dark);line-height:1.2}
.paddisp.reveal{background:#E4FBF5;color:var(--mint-dark)}
.paddisp .ph{display:block;font-size:.85rem;font-family:var(--body);font-weight:800;color:var(--cocoa-soft);letter-spacing:0}
.numpad .pad-keys{grid-template-columns:repeat(3,1fr)}
.key.colon{background:#E8F1FF;color:var(--minute-dark)}
.tip{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.tip.on{display:block}
.tip b{color:var(--ketchup)}
.tip .m{color:var(--minute-dark)}
.hops{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.1rem;margin-top:4px}
.hops span{background:#fff;border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums}
.hops span.from{background:var(--butter)}
.hops span.to{background:#E4FBF5;color:var(--mint-dark)}
.hops i{font-style:normal;color:var(--ketchup)}
.subbtn[hidden]{display:none}
.coach .say{width:44px;height:44px}
.coach p{cursor:pointer}

/* ---------- phones ---------- */
@media (max-width:600px) and (orientation:portrait){
  #progwrap{display:none}
  #clock{width:min(100%,22vh)}
  .passenger .bubble{max-width:52cqw;bottom:70%}.bubble .big{font-size:1.3em}
  .clockwrap{gap:4px}.legend{font-size:.75rem;gap:8px}.qline{font-size:1rem;padding:6px 8px}
  .setters{gap:8px}.setter{padding:6px}.pm{width:44px;height:44px;font-size:1.4rem;border-radius:12px}.setter .val{font-size:1.4rem}
  .choices{grid-template-columns:repeat(3,1fr)}.choice{padding:8px 6px}.choice .dt{font-size:1.5rem}.choice small{font-size:.72rem}
  .numpad .pad-keys{grid-template-columns:repeat(6,1fr)}.key{height:44px;font-size:1.3rem}.paddisp{font-size:1.8rem;padding:2px 8px}.paddisp .ph{font-size:.72rem}
  .tip{padding:8px 10px;font-size:.88rem}.panel-body{gap:8px}
}
@media (orientation:landscape) and (max-height:560px){
  #progwrap{display:none}
  #stage{grid-template-columns:auto minmax(0,1fr);gap:10px}
  #scene{width:calc(45vh*16/9)}
  .panel-body{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
  .clockwrap{grid-column:1;width:38vh}
  #clock{width:38vh;max-width:none}
  .view.on{grid-column:2}
  .legend{font-size:.7rem;gap:4px 8px;max-width:38vh}
  .setters{gap:8px}.setter{padding:6px}.pm{width:44px;height:44px;font-size:1.4rem;border-radius:12px}.setter .val{font-size:1.4rem}
  .numpad .pad-keys{grid-template-columns:repeat(6,1fr)}.key{height:44px;font-size:1.2rem}
  .choices{grid-template-columns:repeat(3,1fr)}.choice{padding:8px 6px}.choice .dt{font-size:1.5rem}.choice small{font-size:.72rem}
  #qline-pad{display:none}.paddisp .ph{display:none}.paddisp{font-size:1.6rem}
  .tip{padding:6px 10px;font-size:.85rem}.qline{font-size:1rem;padding:6px 8px}
}

<body>
<div id="app"></div>
<!-- clips: recorded voice lines go inside #clips as audio elements with data-clip="ID" and src="../voice/train-clock/ID.webm" (ids from docs/voice-script-train-clock.md:
     TC1…TC90, the shared time words half_past / quarter_past / quarter_to / oclock / oh, the shared numbers n_0…n_59 and the customer names c_bear…). engine/inline.js embeds them as data URIs. -->
<div id="clips" hidden><!-- clips --></div>
<script data-inlined="toot.js">
/* Toot Toot engine — one plain script, no modules, no build, no dependencies.
   Defines window.Toot = { util, sound, voice, ui, fx, physics, cast, secrets }.
   Pair with engine/toot.css. See engine/README.md. */
(function(){
'use strict';
const Toot = { version: '1.0.0', speed: 1 };

/* ======================================================================
   UTIL
   ====================================================================== */
const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 150) : ms / Math.max(0.05, Toot.speed)));
const html = s => { const t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstElementChild; };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
function retrigger(el, cls, ms) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); if (ms) setTimeout(() => el.classList.remove(cls), ms); }
/* Web-Animations wrapper: honours reduced motion, registers for slow-motion/freeze, resolves when done. */
const liveAnims = new Set();
function anim(el, keyframes, opts) {
  if (!el || !el.animate) return Promise.resolve();
  const o = Object.assign({ duration: 400, easing: 'ease-out', fill: 'none' }, typeof opts === 'number' ? { duration: opts } : opts || {});
  if (reduced) o.duration = Math.min(o.duration, 1);
  let a; try { a = el.animate(keyframes, o); } catch (e) { return Promise.resolve(); }
  a.playbackRate = Toot.speed; liveAnims.add(a);
  /* a finished fill:forwards animation can be silently "removed" by the browser's replacement rule while its
     pose still shows; persist() keeps it listed so settle()/cancel() can really clear it */
  if (o.fill === 'forwards' || o.fill === 'both') { try { a.persist(); } catch (e) {} }
  (el._tootAnims || (el._tootAnims = new Set())).add(a);
  const done = () => { liveAnims.delete(a); if (o.fill !== 'forwards' && o.fill !== 'both') el._tootAnims.delete(a); };
  return a.finished.then(done, done);
}
/* settle(el): cancel every held pose (fill:forwards animation) the engine created on el or its parts */
function settle(el) {
  if (!el) return;
  const all = new Set(el._tootAnims || []);
  el.querySelectorAll('*').forEach(p => (p._tootAnims || []).forEach(a => all.add(a)));
  all.forEach(a => { try { a.cancel(); } catch (e) {} });
  if (el._tootAnims) el._tootAnims.clear();
  el.querySelectorAll('*').forEach(p => { if (p._tootAnims) p._tootAnims.clear(); });
}
const waitReal = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 150) : ms));  /* ignores Toot.speed: use inside freeze/slow-mo sequences */
Toot.util = { $, $$, rnd, pick, shuffle, clamp, lerp, wait, waitReal, html, esc, retrigger, anim, settle, reduced };
Toot.reduced = reduced;

/* ======================================================================
   SOUND — everything synthesized with WebAudio, no files
   ====================================================================== */
const sound = (() => {
  let ctx = null, enabled = true;
  const stats = { oscillators: 0, noises: 0 };
  const last = {};
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  const on = () => { const c = ensure(); return (c && enabled) ? c : null; };
  function osc(c, type, freq, t) { const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); stats.oscillators++; return o; }
  function env(c, t, dur, gain, attack) { const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + (attack || 0.01)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); return g; }
  function tone(freq, dur, o = {}) {
    const c = on(); if (!c) return;
    const { type = 'sine', gain = 0.2, slide = null, delay = 0, attack = 0.01, vib = 0, vibRate = 6 } = o;
    const t = c.currentTime + delay;
    const s = osc(c, type, freq, t);
    if (slide) s.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    if (vib) { const l = osc(c, 'sine', vibRate, t), lg = c.createGain(); lg.gain.value = vib; l.connect(lg).connect(s.frequency); l.start(t); l.stop(t + dur + 0.05); }
    const g = env(c, t, dur, gain, attack);
    s.connect(g).connect(c.destination); s.start(t); s.stop(t + dur + 0.05);
  }
  function noise(dur, o = {}) {
    const c = on(); if (!c) return;
    const { gain = 0.3, from = 3000, to = 200, delay = 0, type = 'lowpass', q = 1 } = o;
    const t = c.currentTime + delay;
    const len = Math.max(1, Math.floor(c.sampleRate * dur)), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf; stats.noises++;
    const f = c.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  /* the rude-noise engine: a wobbly sawtooth through a resonant low-pass */
  function raspberry(o = {}) {
    const c = on(); if (!c) return;
    const { dur = 0.35, base = 80, endMul = 0.55, wobble = 24, depth = 30, gain = 0.4, filter = 360, q = 7, type = 'sawtooth', delay = 0, attack = 0.03, glide = null } = o;
    const t = c.currentTime + delay;
    const s = osc(c, type, base, t);
    if (glide) { s.frequency.exponentialRampToValueAtTime(glide, t + dur * 0.4); s.frequency.exponentialRampToValueAtTime(base * endMul, t + dur); }
    else s.frequency.exponentialRampToValueAtTime(base * endMul, t + dur);
    const l = osc(c, 'sine', wobble, t), lg = c.createGain(); lg.gain.value = depth; l.connect(lg).connect(s.frequency);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; f.Q.value = q;
    const g = env(c, t, dur, gain, attack);
    s.connect(f).connect(g).connect(c.destination); s.start(t); l.start(t); s.stop(t + dur + 0.05); l.stop(t + dur + 0.05);
  }
  const S = {
    ensure, stats, get enabled() { return enabled; }, set enabled(v) { enabled = !!v; },
    tone, noise, raspberry,
    /* --- the diner's originals --- */
    pop() { tone(600, 0.08, { type: 'triangle', gain: 0.12, slide: 900 }); },
    click() { tone(1200, 0.03, { type: 'square', gain: 0.05 }); },
    ding() { tone(1046, 0.35, { gain: 0.16 }); tone(1568, 0.5, { gain: 0.1, delay: 0.08 }); },
    yay() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, { type: 'triangle', gain: 0.14, delay: i * 0.09 })); },
    oops() { tone(330, 0.18, { type: 'triangle', gain: 0.1 }); tone(262, 0.25, { type: 'triangle', gain: 0.1, delay: 0.16 }); },
    chomp() { noise(0.09, { gain: 0.1, from: 1200, to: 300 }); tone(160 + Math.random() * 60, 0.08, { type: 'square', gain: 0.04 }); },
    sizzle() { noise(1.3, { gain: 0.05, from: 6000, to: 2500 }); },
    coins() { [1800, 2200, 2600].forEach((f, i) => tone(f, 0.12, { type: 'triangle', gain: 0.07, delay: i * 0.07 })); },
    steam() { noise(0.4, { gain: 0.06, from: 5000, to: 1500 }); },
    boom() { noise(1.5, { gain: 0.6, from: 4000, to: 60 }); tone(70, 1, { type: 'sine', gain: 0.5, slide: 30 }); },
    fanfare() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.25, { type: 'triangle', gain: 0.16, delay: i * 0.12 })); tone(1568, 0.7, { type: 'triangle', gain: 0.16, delay: 0.62 }); },

let G = null;        // current level run

function levelConfig(n){ return Object.assign({n}, LEVELS[Math.min(n, LEVELS.length)-1]); }

function distractors(h, m, cfg){
  const allowed = allowedMins(cfg), cands = [];
  const swapH = m/5, swapM = (h*5)%60;
  if(Number.isInteger(swapH) && swapH>=1 && swapH<=12 && allowed.includes(swapM)) cands.push({h:swapH, m:swapM});
  cands.push({h:h%12+1, m}); cands.push({h:(h+10)%12+1, m});
  const others = allowed.filter(x=>x!==m);
  if(others.length){ cands.push({h, m:pick(others)}); cands.push({h, m:pick(others)}); }
  const seen = new Set([digital(h,m)]), out = [];
  for(const c of shuffle(cands)){ const k = digital(c.h,c.m); if(!seen.has(k)){ seen.add(k); out.push(c); } }
  while(out.length < 2){ const c = {h:rnd(1,12), m:pick(allowed)}; const k = digital(c.h,c.m); if(!seen.has(k)){ seen.add(k); out.push(c); } }

function makeQuestion(cfg, mode){
  const base = {mode, ladder:null, resolve:null, t0:0, changed:false};
  if(mode==='elapsed'){
    const now = rnd(1,7), d = rnd(1,5), dep = now + d;
    const others = shuffle([1,2,3,4,5,6].filter(x=>x!==d)).slice(0,2);
    const choices = shuffle([d, ...others]).map(v=>({val:String(v), label:`${v} hour${v>1?'s':''}`, sub:''}));
    return Object.assign(base, {input:'choice', now:{h:now,m:0}, target:{h:dep,m:0}, answer:String(d), choices});
  }

}

function answer(ok, chosenBtn){
  const q = activeQ; if(!q) return;
  if(ok){
    const firstTry = q.ladder.attempts===0;
    G.stats.questions++; if(firstTry) G.stats.firstTry++;
    activeQ = null; UI.nudge.clear(); Clock.interactive = false; Clock.ghost(false,false); Clock.highlight(null); el.btnReady.classList.remove('pulse'); $('#btn-check').classList.remove('pulse');
    if(chosenBtn){ chosenBtn.classList.add('reveal'); [...el.choices.children].forEach(b=>{ if(b!==chosenBtn) b.classList.add('dim'); }); }
    if(q.mode==='set') Clock.set(q.target.h, q.target.m, true);
    S.yay();
    const r = q.resolve; q.resolve = null; r({firstTry, secs:(performance.now()-q.t0)/1000});
    return;
  }
  G.stats.wrong++;
  if(chosenBtn){ chosenBtn.classList.remove('nope'); void chosenBtn.offsetWidth; chosenBtn.classList.add('nope'); chosenBtn.classList.add('dim'); }
  if(G.custChar){ C.mood(G.custChar, 'surprised'); setTimeout(() => G && G.custChar && C.mood(G.custChar, 'neutral'), 1400); }
  q.ladder.wrong();
}
function hintOne(q){
  const t = q.target; G.stats.hints++;
  const sh = handName('h'), lh = handName('l'), tr = pick(TRY_AGAIN);
  if(q.mode==='set'){
    Clock.ghost(true, false, t); Clock.highlight(t.h);
    coach(`${L[tr]} Move the ${sh} to the ${t.h}. See the dotted hand? Then check the ${lh}.`, [T(tr), T(early() ? 'TC38' : 'TC46'), N(t.h), T(early() ? 'TC39' : 'TC47')], 'sad');
    setHint(q, `<b>${cap(sh)}</b> → the <b>${t.h}</b>. <span class="m">${cap(lh)}</span> → <span class="m">${minuteSpot(t.m)}</span>.`);
  } else if(q.mode==='read'){
    Clock.highlight(t.h);
    const correct = q.input==='choice' ? el.choices.querySelector(`[data-val="${q.answer}"]`) : null;
    if(correct) correct.classList.add('hint-hour');
    coach(`${L[tr]} The ${sh} is at the ${t.h}. So the hour is ${t.h}. Now look at the ${lh}.`, [T(tr), T(early() ? 'TC40' : 'TC48'), N(t.h), T('TC41'), N(t.h), T(early() ? 'TC42' : 'TC49')], 'sad');
    setHint(q, `<b>${cap(sh)}</b> is at the <b>${t.h}</b>. The hour is <b>${t.h}</b>. Now count the minutes with the <span class="m">${lh}</span>. Count by 5s from the 12.`);
  } else {
    let hops = `<span class="from">${q.now.h}</span>`; for(let x=q.now.h+1;x<=t.h;x++) hops += `<i>→</i><span class="${x===t.h?'to':''}">${x}</span>`;
    coach(`${L[tr]} Start at ${q.now.h}. Count up to ${t.h}. How many hops?`, [T(tr), T('TC43'), N(q.now.h), T('TC44'), N(t.h), T('TC45')], 'sad');
    setHint(q, `Count the hops from <b>${q.now.h}</b> to <b>${t.h}</b>:<div class="hops">${hops}</div>`);
  }
  UI.nudge.set(nudgeTarget, UI.coachLine);
}
function reveal(q){
  const t = q.target, words = timeWords(t.h,t.m), dig = digital(t.h,t.m);
  if(q.mode==='set'){
    Clock.ghost(true, true, t);
    coach(`It is ${words}. Match the dotted hands. Then press Ready!`, [T('TC21'), TIME(t.h, t.m), T('TC50')], 'happy');
    setHint(q, `The time is <b>${dig}</b> — ${words}. Move the <b>${handName('h')}</b> to the <b>${t.h}</b>. Move the <span class="m">${handName('l')}</span> to <span class="m">${minuteSpot(t.m)}</span>.`);
    el.btnMagic.hidden = false;
  } else if(q.mode==='read'){
    Clock.highlight(t.h);
    if(q.input==='choice'){
      [...el.choices.children].forEach(b=>{ const ok = b.dataset.val===q.answer; b.classList.toggle('reveal', ok); b.classList.toggle('dim', !ok); b.classList.remove('hint-hour'); });
      coach(`It is ${words}. Tap the green one!`, [T('TC21'), TIME(t.h, t.m), T('TC51')], 'happy');
      setHint(q, `The clock says <b>${dig}</b>. Tap the green button!`);
    } else {
      Pad.reset(); Pad.showReveal(dig);
      coach(`It is ${dig}. Type ${dig}. Then press Check!`, [T('TC21'), TIME(t.h, t.m), T('TC52'), TIME(t.h, t.m), T('TC53')], 'happy');
      setHint(q, `The clock says <b>${dig}</b>. Type <b>${t.h}</b>, then <b>${pad2(t.m)}</b>.`);
    }
  } else {
    [...el.choices.children].forEach(b=>{ const ok = b.dataset.val===q.answer; b.classList.toggle('reveal', ok); b.classList.toggle('dim', !ok); });
    const d = +q.answer;
    coach(`${q.now.h} to ${t.h} is ${q.answer} hour${d===1?'':'s'}. Tap it!`, [N(q.now.h), T('TC54'), N(t.h), T('TC55'), N(d), T(d===1?'TC56':'TC57'), T('TC58')], 'happy');
  }
  UI.nudge.set(nudgeTarget, UI.coachLine);
}
function assist(q){
  if(q.mode==='set'){ Clock.set(q.target.h, q.target.m, true); coach(L.TC59, [T('TC59')], 'happy'); el.btnReady.classList.add('pulse'); q.changed = true; }
  else if(q.input==='pad'){ Pad.setValue(q.answer); coach(L.TC60, [T('TC60')], 'happy'); }
  UI.nudge.set(nudgeTarget, UI.coachLine);
}
function submit(){
  const q = activeQ; if(!q) return false;
  if(q.input==='hands'){ answer(Clock.h===q.target.h && Clock.m===q.target.m); return true; }
  if(q.input==='pad'){
    const v = Pad.value();
    if(v===null){ coach(L.TC61, [T('TC61')], 'surprised'); return false; }
    answer(v===q.answer); return true;
  }
  return false;
}
function choose(val, btn){
  const q = activeQ; if(!q) return false;
  if(q.input==='choice'){
    const b = btn || [...el.choices.children].find(x=>x.dataset.val===String(val) || x.textContent.trim()===String(val));
    if(!b || b.classList.contains('dim')) return false;
    answer(b.dataset.val===q.answer, b); return true;
  }
  if(q.input==='pad'){ const m = String(val).match(/^(\d{1,2}):?(\d{2})$/); if(!m) return false; Pad.setValue(`${parseInt(m[1],10)}:${m[2]}`); return true; }
  return false;
}

/* ---------- reactions: short, kind, never a score. Logged in G.reactionLog; a shuffled bag means no immediate repeats ---------- */
const REACTIONS = ['luggageBurst','benchSnooze','trainSneeze','cuckoo','pigeon','roboFlag','passengerDance','roboHiccup','trainToot','slowMoRun','missTrain','goatBonk'];
const CELEBRATE = ['luggageBurst','benchSnooze','trainSneeze','cuckoo','pigeon','roboFlag','passengerDance','roboHiccup','trainToot'];
let bag = [], lastReaction = null;
function nextReaction(){
  if(!bag.length){ bag = shuffle(CELEBRATE); if(bag[bag.length-1] === lastReaction) bag.unshift(bag.pop()); }
  return bag.pop();
}
let reacting = 0;
function reaction(name, fn, cap){
  if(!G) return Promise.resolve(false);
  const myRun = run, entry = { name, t: Math.round(performance.now() - G.t0), dur: null }; G.reactionLog.push(entry); lastReaction = name; reacting++;
  const t0 = performance.now();
  return Promise.race([Promise.resolve().then(() => fn(() => run === myRun)).catch(() => {}), U.waitReal(cap || 2900)])
    .then(() => { entry.dur = Math.round(performance.now() - t0); reacting = Math.max(0, reacting - 1); return true; });
}

    C.mood(goatChar, 'happy'); G.goatDone = true;
  }
};
function pct(x){ return x + '%'; }
function goatLeave(){ el.goat.classList.remove('bonk','running'); el.goat.classList.add('leave'); el.goat.style.left = '112%'; setTimeout(() => C.mood(goatChar, 'neutral'), 1200); }

/* ---------- the train ---------- */
async function trainArrive(alive){
  el.train.classList.add('rolling'); el.signal.classList.remove('go');
  if(fast || reduced){ setTrainX(8); await rwait(40); el.train.classList.remove('rolling'); return; }
  const tw = PH.tween(110, 8, 1900, 'outCubic', setTrainX);
  const t0 = performance.now();
  while(performance.now() - t0 < 1900){ const f = funnel(); if(f.x < 100) FX.burst(f.x, f.y, { kind: 'smoke', count: 4 }); SND.chuff(); await rwait(260); if(!alive()) return; }
  await tw; el.train.classList.remove('rolling');
}
/* the train leaves, puffing steam farts from the pool (never the same one twice in a row) */
async function trainDepart(alive, zoom){
  el.train.classList.add('rolling'); el.signal.classList.add('go'); S.whistle();
  if(fast || reduced){ const f = funnel(); FX.burst(f.x, f.y, { kind: 'puff', count: 6 }); G.fartLog.push(S.play('fart')); setTrainX(-70); await rwait(60); el.train.classList.remove('rolling'); return; }
  const dur = zoom ? 1000 : 1900;
  const tw = PH.tween(trainX, -70, dur, zoom ? 'inCubic' : 'inQuad', setTrainX);
  const t0 = performance.now();
  while(performance.now() - t0 < dur){
    const f = funnel(); if(f.x > -4){ FX.burst(f.x, f.y, { kind: 'puff', count: 5, power: 1.1 }); FX.burst(trainX + TRAIN_W - 3, 82, { kind: 'puff', count: 3, dir: [-30, 30] }); }
    G.fartLog.push(S.play('fart'));
    await rwait(zoom ? 150 : 240); if(!alive()) return;
  }
  await tw; el.train.classList.remove('rolling');
}

/* ---------- main level flow ---------- */
function resetScene(){
  hideBubble(); UI.bubble(el.robo, null);
  el.passenger.classList.remove('walking','board'); el.passenger.style.left = '110%'; settle(el.pcase); settle($('.lid', el.pcase));
  el.goat.classList.remove('running','leave'); el.goat.style.left = '112%'; C.mood(goatChar, 'neutral');
  extraReset(); el.sleeper.classList.remove('on'); el.zzz.classList.remove('on'); el.pigeon.classList.remove('on'); settle(el.pigeon); settle(cuckooChar);
  el.robo.classList.remove('whistling'); settle(el.flag); settle(roboChar); C.mood(roboChar, 'neutral');
  el.train.classList.remove('rolling'); setTrainX(110); el.signal.classList.remove('go');
}
function startLevel(n){
  n = Math.max(1, Math.min(LEVELS.length, n));
  run++; const myRun = run;
  const cfg = levelConfig(n);
  G = {cfg, n, idx:0, order:modeOrder(cfg), q:null, phase:'idle', trainIn:false, stats:{questions:0,firstTry:0,wrong:0,hints:0}, reactionLog:[], fartLog:[], goatLog:[], goatDone:false, forceGoat:false, t0:performance.now(), who:null, custChar:null};
  activeQ = null; bag = []; updateChips(); resetScene();
  el.clockwrap.classList.remove('on'); Clock.set(12,0,true); Clock.ghost(false,false); Clock.highlight(null); Clock.interactive = false;
  UI.hideOverlay(); UI.nudge.clear(); S.ensure();
  coach(`Level ${n}: ${cfg.title}. Help the passengers catch their trains!`, [T('TC2'), N(n), T('TC' + (3 + n)), T('TC3')], 'happy');
  loop(myRun);
}
async function loop(myRun){
  while(run === myRun && G.idx < PASSENGERS_PER_LEVEL){
    await passengerVisit(myRun);
    if(run !== myRun) return;
    await wait(500);
  }
  if(run === myRun) finishLevel();
}
async function passengerVisit(myRun){
  const alive = () => run === myRun;
  const {cfg} = G; const who = pick(CUSTOMERS.filter(c => !G.who || c.cast !== G.who.cast)); G.who = who;
  const q = makeQuestion(cfg, G.order[G.idx]); G.q = q;
  G.phase = 'enter'; show('v-wait'); el.waitEm.textContent='🚉'; el.waitText.textContent = `${who.name} is coming to the platform…`;
  coach(`Here comes ${who.name}!`, [T('TC14'), NAME(who)], 'happy');
  if(!G.trainIn){ await trainArrive(alive); if(!alive()) return; G.trainIn = true; }
  G.custChar = getChar('c:' + who.cast, who.cast); el.passBody.innerHTML = ''; el.passBody.appendChild(G.custChar);
  el.passenger.classList.remove('board'); el.passenger.style.left='110%'; settle(el.pcase); settle($('.lid', el.pcase));
  await wait(60); if(!alive()) return;
  el.passenger.classList.add('walking'); el.passenger.style.left = '58%'; S.pop();
  if(S.enabled && !fast) V.babble('hello hello', { pitch: C.info(who.cast).pitch || 1, el: G.custChar });
  await wait(1900); if(!alive()) return;
  el.passenger.classList.remove('walking');

  // ---- QUESTION ----
  G.phase = 'answer';
  pose(q, who);
  const res = await new Promise(r => { q.resolve = r; }); if(!alive()) return;

  // ---- SUCCESS: praise, a silly reaction, all aboard ----
  G.phase = 'celebrate';
  const t = q.target;
  S.ding(); UI.toast(pick(['Toot toot!','All aboard!','Right on time!'])); FX.burst(64, 40, { kind: 'stars', count: 8 });
  const th = pick(THANKS); bubble(el.passenger, `${L[th]} 👋`, [T(th)], 'left');
  C.mood(G.custChar, 'happy'); anim($('.armR', G.custChar), [{ transform: 'rotate(0)' }, { transform: 'rotate(-140deg)' }, { transform: 'rotate(-110deg)' }, { transform: 'rotate(-140deg)' }, { transform: 'rotate(0)' }], { duration: 900 });
  const pr = pick(PRAISE);
  await wait(900); if(!alive()) return;
  const praiseP = q.mode==='elapsed'
    ? coach(`${L[pr]} ${+q.answer} hour${+q.answer===1?'':'s'} until the train.`, [T(pr), N(+q.answer), T(+q.answer===1?'TC56':'TC57'), T('TC66')], 'happy')
    : coach(`${L[pr]} It is ${timeWords(t.h,t.m)}${t.m%5===0?` — ${digital(t.h,t.m)}`:''}.`, [T(pr), T('TC21'), TIME(t.h, t.m)], 'happy');
  const rname = nextReaction();
  await reaction(rname, REACT[rname]); if(!alive()) return;
  await Promise.race([praiseP, rwait(3500)]); if(!alive()) return;
  hideBubble(); C.mood(G.custChar, 'neutral'); el.passenger.classList.add('board'); el.passenger.style.left = pct(trainX + 18); S.pop();
  await wait(700); if(!alive()) return;
  show('v-wait'); el.waitEm.textContent='🚂'; el.waitText.textContent='All aboard! Toot toot!';
  coach('All aboard! Toot toot!', [T('TC67')], 'happy');

  // ---- DEPART: sometimes Gus the goat has to give the train a push; sometimes a latecomer runs for it ----
  G.phase = 'depart';
  const goat = G.forceGoat || (G.idx === 2 && !G.goatDone) || Math.random() < 0.3; G.forceGoat = false;
  let side = null;
  if(goat){ await reaction('goatBonk', REACT.goatBonk, 3500); if(!alive()) return; }
  else if(Math.random() < 0.45){ const seen = G.reactionLog.map(r => r.name); const name = seen.includes('slowMoRun') && !seen.includes('missTrain') ? 'missTrain' : seen.includes('missTrain') && !seen.includes('slowMoRun') ? 'slowMoRun' : pick(['slowMoRun','missTrain']); side = reaction(name, REACT[name]); }
  await trainDepart(alive, goat); if(!alive()) return;
  if(goat) goatLeave();
  if(side) await side; if(!alive()) return;
  el.passenger.classList.remove('board'); el.passenger.style.left='110%';
  G.idx++; G.trainIn = false; updateChips();
  G.phase = 'between';
}
function finishLevel(){
  G.phase = 'complete'; activeQ = null; UI.nudge.clear(); el.clockwrap.classList.remove('on');
  const s = G.stats; const stars = UI.stars(s.firstTry, s.questions);   // deterministic: accuracy only
  progress.unlocked = Math.max(progress.unlocked || 1, Math.min(LEVELS.length, G.n+1));
  progress.stars[G.n] = Math.max(progress.stars[G.n]||0, stars); UI.progress.save();
  const msgId = stars===3 ? 'TC83' : stars===2 ? 'TC84' : 'TC85';
  const last = G.n >= LEVELS.length, n = G.n, breakTime = UI.sitting + 1 >= 3;
  UI.levelComplete({ n, stars, save: false, hero: 'robo ' + (G.who ? G.who.cast : 'bear'), speak: false,
    title: breakTime ? `You’ve done ${UI.sitting + 1} levels!` : 'All aboard!', subtitle: breakTime ? 'Time for a break?' : `Level ${n} done!`,
    msg: `${breakTime ? `Level ${n} done. ` : ''}${L[msgId]}`,
    fact: `<b>${PASSENGERS_PER_LEVEL}</b> passengers caught their train · <b>${s.firstTry}</b> of <b>${s.questions}</b> right first time`,
    onNext: () => { if(last) showLevels(); else startLevel(n+1); }, onReplay: () => startLevel(n), onDone: showTitle });
  const nb = $('#btn-next', refs.card); if(nb && last) nb.textContent = 'Choose level';
  const rb = $('#btn-replay', refs.card); if(rb) rb.textContent = 'Play it again';
  const bd = $('#btn-done', refs.card); if(bd){ const c = bd.cloneNode(true); bd.replaceWith(c); c.addEventListener('click', showGoodbye); }
  say(breakTime ? [TX(`You've done ${UI.sitting} levels! Time for a break?`), T('TC2'), N(n), T('TC82'), T(msgId)] : [T('TC81'), T('TC2'), N(n), T('TC82'), T(msgId)]);
}
function stopGame(){ run++; G = null; activeQ = null; UI.nudge.clear(); }
function showGoodbye(){
  stopGame();
  UI.goodbye({ hero: 'robo', text: 'Stretch, drink some water, go look at a real clock. See you next time.', spoken: L.TC87, ids: ['TC87'], onBack: showTitle });
}

/* ---------- cards (engine overlays) ---------- */
const GROWNUPS = `<b>What it teaches</b> — telling the time on a round (analog) clock and a digital clock, for ages 5 and up. Each level has 5 passengers. Play with your child and let them drag the hands or press the big + and − buttons.<ul>
    ${LEVELS.map((l, i) => `<li><b>Level ${i + 1}: ${l.title}</b> — ${l.teach}</li>`).join('')}</ul>
  <b class="sub">How hints work</b><ul>
    <li>A wrong answer is never a failure. First miss: the game shows where the short hand belongs (or highlights the hour on the right button). Second miss: it shows the answer and asks your child to set or tap it. Third miss: it does it for them so they can press Ready.</li>
    <li>Stars are for first-try answers (3 stars at 80% or more, 2 at 50%, else 1), and every level can be replayed.</li>
    <li>If your child stops for a while, the instruction is repeated and the right thing to tap wiggles.</li></ul>
  <b class="sub">Tips</b><ul>
    <li>Levels 1–3 say “short hand” and “long hand” and use colour: the short hand is red, the long hand is blue. The thin red hand counts real seconds.</li>
    <li>Drag either hand, use the arrow keys, or press the big + and − buttons. Tap any speech bubble or 🔊 to hear it again.</li></ul>
  <b class="sub">Wholesome, not addictive</b><ul>
    <li>Nothing leaves the device: progress, stars and the sound settings are stored only in this browser. No accounts, no ads, no tracking.</li>
    <li>Celebrations are short (under 3 seconds) and silly: Gus the goat headbutts a dawdling train, a pigeon lands on the clock, Robo is the cuckoo. Nobody is laughed at and the goat is never a score.</li>
    <li>Stars come only from accuracy, never from luck, and there are no chests or collectibles. The game never moves to the next level by itself.</li></ul>`;
function showTitle(){
  stopGame();
  UI.title({ hero: 'robo bear goat', title: 'Train Station Clock',
    blurb: 'Passengers need to catch their trains! Set the station clock, read the time, and send every train off with a toot toot.',
    fact: 'Learn <b>o’clock</b> · <b>half past</b> · <b>quarter past</b> · <b>minutes</b> · <b>digital</b> time', playLabel: 'Play! 🚂',
    onPlay: () => startLevel(Math.min(progress.unlocked || 1, LEVELS.length)), onLevels: showLevels, grownups: GROWNUPS });
}
function showLevels(){
  stopGame();
  UI.levels({ count: LEVELS.length, unlocked: progress.unlocked, stars: progress.stars, level: n => { const c = levelConfig(n); return { title: c.title, tags: c.tags }; }, onPick: n => { S.ensure(); startLevel(n); }, onBack: showTitle });
}

/* ---------- boot ---------- */
function boot(data){
  if(data && data.level && data.level <= (progress.unlocked || 1)) startLevel(data.level); else showTitle();
}
try{ window.claude?.hot?.snapshot?.(()=>({level: G ? G.n : null})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

/* ---------- test hooks ---------- */
window.__game = {
  startLevel(n){ startLevel(n); },
  get state(){
    if(!G) return {phase:'idle', level:null, overlay:UI.overlayOpen(), speed: Toot.speed, sayLog: sayLog.slice()};
    const q = G.q;
    return {
      level:G.n, phase:G.phase, index:G.idx, passengers:PASSENGERS_PER_LEVEL,
      mode:q?q.mode:null, input:q?q.input:null, target:q?Object.assign({},q.target):null, now:q&&q.now?Object.assign({},q.now):null,
      answer:q?q.answer:null, choices:q&&q.choices?q.choices.map(c=>c.val):null,
      current:{h:Clock.h, m:Clock.m}, degrees: Clock.degrees, attempts:q&&q.ladder?q.ladder.attempts:0, hinted:!!(q&&q.ladder&&q.ladder.hinted), revealed:!!(q&&q.ladder&&q.ladder.revealed),
      accepting:!!activeQ, padValue:Pad.raw, stats:Object.assign({}, G.stats), overlay:UI.overlayOpen(),
      reactionLog:G.reactionLog.map(r => Object.assign({}, r)), fartLog:G.fartLog.slice(), goatLog:G.goatLog.map(g => Object.assign({}, g)), goatDone:G.goatDone,
      speed: Toot.speed, clockWobbles: Clock.wobbles, wobbling: Clock.wobbling, sayLog: sayLog.slice(), who: G.who ? G.who.cast : null, trainX, reacting
    };
  },
  setTime(h,m){ if(activeQ && activeQ.mode==='set'){ Clock.set(h,m,true); return true; } return false; },
  choose(text){ return choose(text); },
  submit(){ return submit(); },
  get levels(){ return LEVELS.map(l=>l.title); },
  spoken(text){ return prep(text); },
  get idleMs(){ return UI.nudge.delay; }, set idleMs(v){ UI.nudge.delay = v; UI.nudge.touch(); },
  get progress(){ return Object.assign({}, progress); },
  reactions: REACTIONS.slice(),
  react(name){ return REACT[name] ? reaction(name, REACT[name], 4000) : Promise.resolve(false); },
  goat(){ if(G) G.forceGoat = true; },
  get fast(){ return fast; }, set fast(v){ fast = !!v; },
  clock: Clock, clean: V.clean
};
})();
</script>
