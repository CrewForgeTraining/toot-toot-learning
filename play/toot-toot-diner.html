<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="toot-standard" content="2">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<title>Toot Toot Diner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:44px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
/* ======================================================================
   Toot Toot Diner — built to docs/design-basis.md (Parts 1–1j).
   The engine (toot.css) owns the chrome; this file owns the room and the panel.
   ====================================================================== */
:root{--heat-cool:#5CC8FF;--heat-warm:#FFB703;--heat-hot:#FF3B3B;--wood-mid:#C98A4B;--red:#E8503A;--red-dark:#C63D2A}
html,body{height:100%;overflow:hidden}
body{overscroll-behavior:none}
/* ---------- layout: thin top bar, heat bar, the diner, the question, the answers. Nothing scrolls. ---------- */
.toot-app{height:100%;min-height:0;overflow:hidden;padding-block:8px 10px;gap:8px}
.toot-app .coach{display:none}                       /* no coach: the world asks the questions */
#heatrow{display:flex;align-items:center;gap:8px;padding:0 4px;flex:none}
#heatrow .rf{width:30px;height:30px;flex:none;line-height:0;display:grid;place-items:center}
#heatrow .rf .toot-char{width:28px}
#heatrow .bar{flex:1;height:18px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
#heatrow .fill{height:100%;width:0%;background:linear-gradient(90deg,var(--heat-cool),var(--heat-warm) 55%,var(--heat-hot));border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
#heatrow .flame{font-size:1rem;line-height:1;flex:none;opacity:.35}
.toot-app #stage{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:stretch}
.toot-app #scene{width:100%;height:100%;aspect-ratio:auto;container-type:size;min-height:0;margin:0;background:#F6DDB8}
.toot-app #panel{min-height:0;overflow:hidden;justify-content:flex-start;position:relative}
@media (orientation:portrait){
  .toot-app #stage{display:flex;flex-direction:column;gap:8px}
  .toot-app #scene{flex:1 1 auto;width:100%;height:auto;min-height:0}
  .toot-app #panel{flex:none}
}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}
  .toot-app #stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}
  .toot-app #scene{width:100%;height:100%;margin:0}
  .toot-app #panel{max-height:none;overflow:hidden;padding:10px;gap:8px}
  #heatrow .bar{height:14px}
}
@media (max-width:900px) and (orientation:landscape){.toot-app #stage{grid-template-columns:minmax(0,1fr) 300px}}
@media (min-width:901px) and (orientation:landscape){.toot-app #panel{justify-content:center}}
#btn-music[data-level="1"]{opacity:.65}
#btn-music.off{opacity:.45;text-decoration:line-through}
#btn-home{font-size:1.4rem}
@media (max-width:600px){#topbar{gap:4px}.toot-app .iconbtn{width:40px;height:40px;font-size:1.05rem;border-radius:12px}.logo{gap:4px}.logo .sign{font-size:.8rem;padding:2px 7px;letter-spacing:0}}

/* ---------- the room (three layers: back wall, the floor with the furniture, a table corner in front) ---------- */
#scene .room{position:absolute;inset:0;overflow:hidden}
#scene svg.fx{width:100%;height:auto;display:block;overflow:visible}
.wall{position:absolute;left:0;right:0;top:0;height:44%;background:repeating-linear-gradient(90deg,#FFE7B8 0 5cqh,#FFEFCB 5cqh 10cqh)}
.wall::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5cqh;background:var(--wood-mid);box-shadow:inset 0 .9cqh 0 #E0A96D,inset 0 -.7cqh 0 #8E5B2E}
.floor{position:absolute;left:0;right:0;top:44%;bottom:0;background:repeating-conic-gradient(#F7E0BC 0 25%,#E9C49B 0 50%) 0 0/13cqh 13cqh}
.floor::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 60%,rgba(59,42,31,.10),transparent 40%),radial-gradient(ellipse at 70% 85%,rgba(59,42,31,.08),transparent 35%),radial-gradient(ellipse at 85% 55%,rgba(59,42,31,.07),transparent 30%)}
.floor::after{content:"";position:absolute;left:0;right:0;top:0;height:9cqh;background:linear-gradient(rgba(59,42,31,.22),transparent)}
.light{position:absolute;inset:0;background:linear-gradient(108deg,rgba(255,246,220,.55) 0%,rgba(255,246,220,.22) 28%,rgba(0,0,0,0) 50%,rgba(59,42,31,.12) 100%);pointer-events:none;z-index:1}
.lights{position:absolute;inset:0;background:#1a1410;opacity:0;pointer-events:none;z-index:40;transition:opacity .7s}
.lights.dark{opacity:.92}
/* window with the street going past (the one light source) */
.window{position:absolute;left:3%;top:5%;width:31%;height:28cqh;background:linear-gradient(#8FD0FF,#DDF3FF 72%);border:1.5cqh solid #FFFDF8;border-radius:2cqh;box-shadow:.7cqh .9cqh 0 rgba(59,42,31,.16),inset 0 0 0 .5cqh #3B2A1F;overflow:hidden;z-index:2}
.window .sun{position:absolute;left:8%;top:9%;width:6cqh;height:6cqh;border-radius:50%;background:#FFC83D;box-shadow:0 0 2.5cqh rgba(255,200,61,.9)}
.window .cloud{position:absolute;width:7cqh;height:2.4cqh;background:#fff;border-radius:2cqh}
.window .cloud::before,.window .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;top:-1.4cqh;left:1cqh;width:3cqh;height:3cqh}
.window .cloud::after{left:3.4cqh;top:-1cqh;width:2.3cqh;height:2.3cqh}
.window .c1{left:44%;top:22%}.window .c2{left:70%;top:40%;transform:scale(.7)}
.window .hill{position:absolute;left:-12%;right:-12%;bottom:22%;height:40%;background:#8BD36F;border-radius:50%}
.window .road{position:absolute;left:0;right:0;bottom:0;height:24%;background:#6B7784;border-top:.5cqh solid #3B2A1F}
.window .road::after{content:"";position:absolute;left:0;right:0;top:45%;height:.5cqh;background:repeating-linear-gradient(90deg,#FFE29A 0 2cqh,transparent 2cqh 4cqh)}
.window .car{position:absolute;bottom:3%;left:-40%;width:11cqh;animation:drive 9s linear infinite}
@keyframes drive{from{transform:translateX(0)}to{transform:translateX(320%)}}
.window .valance{position:absolute;left:0;right:0;top:0;height:14%;background:repeating-conic-gradient(#F4552F 0 25%,#fff 0 50%) 0 0/2.2cqh 2.2cqh;border-bottom:.45cqh solid #3B2A1F}
.window .lamp{position:absolute;right:16%;bottom:24%;width:1cqh;height:26%;background:#3B2A1F;border-radius:.5cqh}
.window .lamp::after{content:"";position:absolute;left:50%;top:-1.2cqh;width:3cqh;height:1.6cqh;transform:translateX(-50%);background:#FFE29A;border:.4cqh solid #3B2A1F;border-radius:.6cqh}
/* specials board, fan, crooked picture */
.board{position:absolute;left:50%;top:6%;width:clamp(76px,24cqh,26%);height:17cqh;transform:translateX(-50%) rotate(-1.5deg);background:#2F4A3A;border:1.3cqh solid #B97B3F;border-radius:1cqh;box-shadow:.5cqh .7cqh 0 rgba(59,42,31,.18);color:#FFF4DC;font-family:var(--display);text-align:center;padding:.5cqh .4cqh;overflow:hidden;z-index:2}
.board b{display:block;font-size:2.5cqh;letter-spacing:.08em;color:#FFE29A;line-height:1.1}
.board span{display:block;font-size:2.05cqh;line-height:1.15;font-family:var(--body);font-weight:800;margin-top:.4cqh}
.fan{position:absolute;left:39%;top:-.5cqh;width:16cqh;z-index:2;transform-origin:50% 0;animation:fanwob 1.6s ease-in-out infinite}
.fan .blades{transform-box:fill-box;transform-origin:50% 50%;animation:fanspin 1.1s ease-in-out infinite}
@keyframes fanwob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes fanspin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.25)}}
.wallpic{position:absolute;left:36%;top:26.5%;width:10cqh;transform:rotate(7deg);z-index:2}
/* the kitchen hatch with the chef in it, and the pass shelf where plates land */
.hatch{position:absolute;right:3%;top:4%;width:31%;height:30cqh;background:#6E4520;border-radius:2cqh;box-shadow:.7cqh .9cqh 0 rgba(59,42,31,.18);z-index:2}
.hatch .inner{position:absolute;inset:1.3cqh;background:repeating-conic-gradient(#FFF6E3 0 25%,#F3E3C6 0 50%) 0 0/4.2cqh 4.2cqh;border-radius:1.2cqh;overflow:hidden}
.hatch .shelf{position:absolute;left:6%;right:6%;top:16%;height:1.2cqh;background:#B97B3F;border-radius:.4cqh;box-shadow:0 .4cqh 0 #8E5B2E}
.hatch .pots{position:absolute;left:8%;top:calc(16% - 4.6cqh);display:flex;gap:1.2cqh;align-items:flex-end}
.hatch .pots i{display:block;width:4cqh;height:4.4cqh;background:#4A5561;border:.45cqh solid #3B2A1F;border-radius:.6cqh .6cqh 1.4cqh 1.4cqh;box-shadow:inset 0 -.6cqh 0 rgba(0,0,0,.25)}
.hatch .pots i:nth-child(2){width:5cqh;height:3.4cqh;background:#C3D2DC}
.hatch .pots i:nth-child(3){width:3cqh;height:5cqh;background:#F4552F}
.hatch .chefspot{position:absolute;left:3%;bottom:-32%;width:58%;line-height:0;transition:transform .35s cubic-bezier(.2,1.4,.4,1);z-index:2}
.hatch .chefspot .toot-char{width:100%}
.hatch.up .chefspot{transform:translateY(-18%)}
.hatch .stove{position:absolute;right:4%;bottom:0;width:36%;height:52%}
.hatch .burner{position:absolute;left:0;right:0;bottom:0;height:18%;background:#6B7784;border:.45cqh solid #3B2A1F;border-bottom:0;border-radius:.8cqh .8cqh 0 0}
.hatch .flames{position:absolute;left:14%;right:14%;bottom:16%;height:40%;display:flex;justify-content:space-around;align-items:flex-end;opacity:0;transition:opacity .2s}
.hatch .flames i{width:24%;height:70%;background:linear-gradient(#FFC83D,#F4552F);border-radius:50% 50% 40% 40%/70% 70% 30% 30%;transform-origin:50% 100%;animation:flicker .28s infinite alternate}
.hatch .flames i:nth-child(2){height:95%;animation-delay:.09s}.hatch .flames i:nth-child(3){animation-delay:.17s}
.hatch.cooking .flames{opacity:1}
@keyframes flicker{from{transform:scale(.85,.9) rotate(-5deg)}to{transform:scale(1.1,1.12) rotate(5deg)}}
.hatch .pot{position:absolute;left:4%;right:4%;bottom:34%;height:44%;background:#4A5561;border:.45cqh solid #3B2A1F;border-radius:.6cqh .6cqh 2cqh 2cqh;box-shadow:inset 0 -.7cqh 0 rgba(0,0,0,.25)}
.hatch .pot::before{content:"";position:absolute;left:-10%;right:-10%;top:-.7cqh;height:1.2cqh;background:#8FA3B1;border:.4cqh solid #3B2A1F;border-radius:.6cqh}
.hatch.cooking .pot{animation:jiggle .35s infinite alternate}
@keyframes jiggle{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-.3cqh) rotate(1deg)}}
.osign{position:absolute;left:50%;top:0;transform:translate(-50%,-112%);background:#4A2E22;color:#8a6a5a;padding:.3cqh 1.4cqh;border-radius:.9cqh;font-family:var(--display);font-weight:700;font-size:clamp(8px,2.1cqh,15px);letter-spacing:.08em;white-space:nowrap;border:.4cqh solid #3B2A1F}
.osign.on{background:#F4552F;color:#fff;box-shadow:0 0 1.6cqh #F4552F,0 0 .4cqh #fff inset}
.pass{position:absolute;right:3%;top:calc(4% + 30cqh);width:31%;height:5cqh;background:linear-gradient(#F3D9A8,#E0A96D);border:.5cqh solid #3B2A1F;border-top:0;border-radius:0 0 1.5cqh 1.5cqh;box-shadow:.5cqh .8cqh 0 rgba(59,42,31,.18);z-index:2}
.pass .bell{position:absolute;right:6%;bottom:60%;width:5cqh}
/* the counter: top, front panel, kick board, shadow; the till, the pie dome and the dirty-plate stack live on it */
.counter{position:absolute;left:50%;right:0;top:41%;height:26cqh;z-index:3}
.counter .top{position:absolute;left:0;right:-2cqh;top:0;height:5cqh;background:linear-gradient(#FFF8EC,#E9D3B0);border:.55cqh solid #3B2A1F;border-right:0;border-radius:1.4cqh 0 0 1.4cqh;box-shadow:inset 0 -1cqh 0 #C9A97A}
.counter .front{position:absolute;left:1.2cqh;right:-2cqh;top:4.5cqh;bottom:3cqh;background:repeating-linear-gradient(90deg,#2FBFA6 0 6cqh,#27A892 6cqh 6.8cqh,#DDE7EC 6.8cqh 7.4cqh);border:.55cqh solid #3B2A1F;border-top:0;border-right:0;border-radius:0 0 0 .8cqh;box-shadow:inset .9cqh 0 0 rgba(255,255,255,.35)}
.counter .kick{position:absolute;left:1.8cqh;right:-2cqh;bottom:0;height:3.4cqh;background:#3B2A1F;border-radius:0 0 0 1cqh}
.counter .shadow{position:absolute;left:2cqh;right:-2cqh;bottom:-2.4cqh;height:3.4cqh;background:rgba(59,42,31,.2);border-radius:50%;filter:blur(.5cqh)}
.counter .till{position:absolute;right:5%;bottom:calc(100% - 1.4cqh);width:12cqh}
.counter .dome{position:absolute;left:8%;bottom:calc(100% - 1cqh);width:11cqh}
.counter .cstack{position:absolute;left:38%;bottom:calc(100% - 1.6cqh);width:9cqh;height:2cqh}
.counter .napkins{position:absolute;left:26%;bottom:calc(100% - 1.2cqh);width:4.2cqh;height:4.6cqh;background:#C3D2DC;border:.45cqh solid #3B2A1F;border-radius:.6cqh}
.counter .napkins::after{content:"";position:absolute;left:15%;right:15%;top:-1.4cqh;height:1.8cqh;background:#fff;border:.4cqh solid #3B2A1F;border-radius:.3cqh;transform:rotate(-6deg)}
.dplate{position:absolute;left:0;bottom:0;width:100%;line-height:0}
/* furniture on the floor */
.plant{position:absolute;left:calc(36cqh + 1cqh);bottom:46%;width:15cqh;z-index:1;display:none}
.booth{position:absolute;left:0;bottom:36%;width:36cqh;z-index:2}
.chairback{position:absolute;left:calc(5% + 24cqh - 9cqh);bottom:calc(12% + 26cqh);width:18cqh;z-index:3}
.customer{position:absolute;left:calc(5% + 24cqh - 12cqh);bottom:calc(12% + 22cqh);width:24cqh;z-index:4;line-height:0}
.customer .who{position:relative;display:block;width:100%;line-height:0}
.customer .who .toot-char{width:100%}
.customer .who .em{display:block;font-size:19cqh;line-height:1;text-align:center}
.customer .friends{position:absolute;inset:0;pointer-events:none}
.customer .friends .toot-char{position:absolute;bottom:2%;width:62%}
.customer .friends .f0{left:-64%}.customer .friends .f1{right:-64%}.customer .friends .f2{left:-118%;width:54%;bottom:6%}
.customer .bubble{z-index:8}
.table{position:absolute;left:5%;bottom:12%;width:48cqh;z-index:5;line-height:0}
.table.hot svg{filter:drop-shadow(0 0 1.4cqh rgba(47,191,166,.95))}
.chair{position:absolute;left:.5%;bottom:9%;width:15cqh;z-index:6}
.tstack{position:absolute;width:10cqh;height:2cqh;z-index:6;pointer-events:none}
.dock{position:absolute;left:72%;bottom:7%;width:22cqh;z-index:6;line-height:0}
.robo{position:absolute;left:73.5%;bottom:9%;width:19cqh;z-index:7;--heat:0;line-height:0}
.robo .glow{position:absolute;left:50%;top:50%;width:170%;height:170%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,59,59,calc(var(--heat)*.6)) 0%,rgba(255,183,3,calc(var(--heat)*.25)) 45%,transparent 70%);z-index:-1;pointer-events:none}
.robo .bot{position:relative;display:block;line-height:0}
.robo .bot::after{content:"";position:absolute;left:8%;right:4%;bottom:-.6cqh;height:1.8cqh;background:rgba(59,42,31,.2);border-radius:50%;z-index:-1;transform:translateX(.6cqh)}
.robo .bot .toot-char{width:100%}
.robo.flip .bot .toot-char{transform:scaleX(-1)}
.robo .broom{position:absolute;left:78%;bottom:2%;width:26%;opacity:0;transform-origin:50% 100%;transition:opacity .15s;pointer-events:none;line-height:0}
.robo.sweeping .broom{opacity:1}
.robo.red .cheeks circle{fill:#FF3B3B!important;opacity:1!important}
.robo.rattle .bot{animation:rattle .14s infinite alternate}
@keyframes rattle{from{transform:translateX(-.35cqh) rotate(-2.5deg)}to{transform:translateX(.35cqh) rotate(2.5deg)}}
.robo .bubble{z-index:8}
.plate{position:absolute;width:11cqh;height:11cqh;z-index:8;touch-action:none;cursor:grab;line-height:0;display:none}
.plate.on{display:block}
.plate .food{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-size:6cqh;line-height:1;pointer-events:none;display:flex;gap:0}
.plate .food span{margin:0 -.6cqh}
.plate.dirty .food{display:none}
.plate .ring{position:absolute;inset:-14%;border-radius:50%;border:.7cqh solid var(--mint);opacity:0;pointer-events:none}
.plate.ready .ring{opacity:1;animation:ring 1s infinite}
.plate.selected .ring{opacity:1;animation:none;border-color:#FFC83D;box-shadow:0 0 1.2cqh #FFC83D}
.plate.dragging{cursor:grabbing;z-index:20}
@keyframes ring{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.12);opacity:.6}}
.cash{position:absolute;width:9cqh;z-index:8;display:none;line-height:0;pointer-events:none}
.cash.on{display:block}
.tcoins{position:absolute;z-index:8;display:flex;gap:1.2cqh;align-items:flex-end;pointer-events:none}
.tcoins .stack{display:flex;flex-direction:column-reverse;gap:0}
.tcoins .stack i{display:block;width:3.2cqh;height:1.35cqh;border-radius:50%;background:#FFC83D;box-shadow:inset 0 -.35cqh 0 #D89A00,0 0 0 .3cqh #3B2A1F;margin-top:-.45cqh}
.tcoins .stack i.lit{background:#fff;box-shadow:inset 0 -.35cqh 0 #B8E6DB,0 0 0 .3cqh #2FBFA6}
.crumb{position:absolute;width:1.6cqh;height:1.2cqh;border-radius:45% 55% 50% 50%;background:#A2692F;box-shadow:inset 0 0 0 .3cqh #6E4520;z-index:6;pointer-events:none}
.bubble .oi{font-size:1.6em;line-height:1;vertical-align:middle}
.crumb.b{background:#C38A46}.crumb.c{background:#8A5A2B;border-radius:50% 40% 60% 50%}
.bolt{position:absolute;width:3cqh;z-index:6;display:none;line-height:0}
.wheel{position:absolute;width:5cqh;z-index:6;display:none;line-height:0}
.fore{position:absolute;left:-3%;bottom:-11cqh;width:36cqh;z-index:9;pointer-events:none;line-height:0}
.stool{position:absolute;bottom:22%;width:9cqh;z-index:4;display:none}
.stool.s1{left:56%}.stool.s2{left:88%}
.table2{position:absolute;left:52%;bottom:30%;width:30cqh;z-index:3;display:none;line-height:0}
.clock{position:absolute;left:37%;top:5%;width:8cqh;display:none;z-index:2}
@container (min-aspect-ratio: 1.3){
  .stool,.clock,.plant{display:block}
  .board{left:50%}
  .wallpic{left:63%;top:8%}
  .fan{left:41%}
}
@container (min-aspect-ratio: 1.6){.window{width:29%}.hatch{width:29%}.pass{width:29%}.wallpic{left:65%}}
/* quiet while thinking: the ambient motion holds still */
#scene.quiet .chefspot{transition:none}
#scene.quiet .car,#scene.quiet .fan,#scene.quiet .fan .blades,#scene.quiet .flames i,#scene.quiet .pot,#scene.quiet .rattle .bot,#scene.quiet .plate.ready .ring{animation-play-state:paused}

/* ---------- the panel: the question and the answers, always together, never scrolling ---------- */
.ticket{background:#FFF9E8;border:2px dashed #C9A97A;border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:50px}
.ticket .tk{font-family:var(--display);font-weight:700;color:var(--cocoa-soft);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;flex:none}
.slots{display:flex;gap:6px;flex:1;justify-content:center}
.slot{width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px rgba(59,42,31,.14);display:grid;place-items:center;font-size:1.5rem;line-height:1}
.slot.filled{box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px var(--mint)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mitem{background:#fff;border-radius:16px;padding:6px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:0;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:68px;font-family:var(--display);font-weight:700;line-height:1.15}
.mitem:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.mitem .em{font-size:1.9rem;line-height:1.1}.mitem .nm{font-size:.72rem;color:var(--cocoa-soft)}.mitem .pr{font-size:1rem;color:var(--ketchup-dark)}
.mitem.taken{opacity:.35;pointer-events:none}
.mitem.nope{animation:mnope .4s}
@keyframes mnope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flyer{position:fixed;z-index:200;pointer-events:none;font-size:1.9rem;line-height:1}
.bill{background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 rgba(59,42,31,.12);display:flex;flex-direction:column;gap:1px}
.bill .line{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:1.15rem;min-height:30px}
.bill .pic{font-size:1.45rem;line-height:1;flex:none}.bill .nm{color:var(--cocoa-soft);font-size:.92rem;flex:none}
.bill .cs{display:flex;gap:2px;flex-wrap:wrap;flex:1;justify-content:flex-end;min-height:1px}
.bill .pr{font-variant-numeric:tabular-nums;min-width:2.3em;text-align:right;flex:none}
.bill .pr small,.choice small,.paybox small{font-size:.62em;vertical-align:.22em;margin-right:1px;color:var(--cocoa-soft)}
.coin{width:16px;height:16px;border-radius:50%;background:#FFC83D;box-shadow:inset 0 0 0 2px #D89A00;display:inline-block;flex:none}
.coin.lit{background:#fff;box-shadow:0 0 0 3px var(--mint)}
.bill .line.total{border-top:2px solid rgba(59,42,31,.12);margin-top:2px;padding-top:3px;justify-content:flex-end}
.bill .line.total .q{margin-left:6px}
.q{display:inline-grid;place-items:center;min-width:1.5em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .25em;font-family:var(--display);font-weight:700}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.choice{height:62px;border-radius:16px;background:#fff;font-family:var(--display);font-weight:700;font-size:1.65rem;box-shadow:0 5px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums;color:var(--cocoa)}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.choice.glow{background:#E4FBF5;box-shadow:0 5px 0 var(--mint-dark),0 0 0 4px var(--mint)}
.choice.dim{opacity:.35}
#panel.busy .choice,#panel.busy .mitem{pointer-events:none}
.paybox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 rgba(59,42,31,.12);min-height:64px;font-family:var(--display);font-weight:700;font-size:1.15rem}
.paybox .note{width:66px;flex:none;line-height:0}
.paybox .owed{flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.05}
.paybox .owed small{font-size:.65rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;margin:0}
.paybox .palm{flex:1;position:relative;min-width:80px;height:52px;display:flex;align-items:flex-end;justify-content:center}
.paybox .palm svg{position:absolute;left:50%;bottom:0;width:80px;transform:translateX(-50%)}
.paybox .palm .pc{position:relative;display:flex;gap:3px;padding-bottom:16px;z-index:1}
.paybox .palm .cnt{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:1.25rem;color:var(--mint-dark);white-space:nowrap}
.paybox .ask{flex:none}
.share{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 3px 0 rgba(59,42,31,.12);min-height:64px;font-family:var(--display);font-weight:700;font-size:1.1rem}
.share .faces{display:flex;gap:2px}.share .faces .toot-char{width:34px}
.share .plates{display:flex;gap:6px;flex:1;justify-content:center}
.share .plates i{width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3px #DDE7EC,0 0 0 2px #3B2A1F;display:flex;flex-wrap:wrap;gap:1px;align-content:center;justify-content:center;padding:3px}
.share .plates i .coin{width:9px;height:9px;box-shadow:inset 0 0 0 1.5px #D89A00}
.chefnote{display:flex;align-items:center;gap:10px;background:var(--butter);border-radius:14px;padding:8px 12px;font-weight:800;font-size:1rem;min-height:56px}
.chefnote .face{width:40px;flex:none;line-height:0}.chefnote .face .toot-char{width:40px}
.endline{margin:0;text-align:center;font-family:var(--display);font-weight:700;font-size:1.2rem;padding:4px 0}
.endq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.endq button{min-height:64px;border-radius:18px;background:#fff;font-family:var(--display);font-size:1.05rem;white-space:nowrap;font-weight:700;box-shadow:0 5px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);color:var(--cocoa);padding:8px 10px}
.endq button:active{transform:translateY(3px)}
.rest{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--cocoa-soft);font-weight:800;min-height:56px;font-family:var(--display)}
/* cards */
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px}
.card .made{font-size:.95rem}

})();

const sceneRect = () => el.scene.getBoundingClientRect();
function relRect(e) { const s = sceneRect(), r = e.getBoundingClientRect(); return { x: r.left - s.left, y: r.top - s.top, w: r.width, h: r.height, cx: r.left - s.left + r.width / 2, cy: r.top - s.top + r.height / 2, sw: s.width, sh: s.height }; }

/* ---------- the mess: crumbs land where the customer ate and stay until Robo reaches them; plates stack up ---------- */
function addCrumbs(n, spread = 0.72) {
  const t = relRect(el.table), sw = t.sw, sh = t.sh;

    let x, y;
    if (Math.random() < spread) { x = t.x + t.w * (-0.1 + Math.random() * 1.25); y = t.y + t.h * (0.88 + Math.random() * 0.34); }

/* ---------- questions: one on screen at a time, the world asks, the screen goes quiet ---------- */
function openQuestion(q) {

function makeChoices(ans, lo, hi) {
  const set = new Set([ans]);
  const tier = ds => shuffle(ds.flatMap(d => [ans - d, ans + d])).filter(v => v >= lo && v <= hi && v !== ans);
  for (const v of tier([1, 2]).concat(tier([3, 4, 5]))) { if (set.size >= 4) break; set.add(v); }
  let k = 6; while (set.size < 4) { [ans - k, ans + k].forEach(v => { if (v >= 0 && set.size < 4) set.add(v); }); k++; }
  return shuffle([...set]);

}
function orderSegs(cust) {

/* ---------- one customer, twelve beats ---------- */
function makeMenu(cfg) {
  const foods = shuffle(FOODS).slice(0, cfg.prices.length);
  if (CFG.foods && CFG.foods.length) { const f = pick(CFG.foods); foods[0] = { id: 'custom-' + Math.random().toString(36).slice(2, 7), name: f.name, em: f.em || '🍽️', clip: null }; }
  const prices = shuffle(cfg.prices);
  return foods.map((f, i) => Object.assign({}, f, { price: prices[i] }));
}
function makeOrder(shape, menu) {
  const n = shape.items || 2, lo = shape.minTotal || 0, hi = shape.maxTotal || 99;
  for (let t = 0; t < 160; t++) {
    const items = shuffle(menu).slice(0, n), total = items.reduce((s, m) => s + m.price, 0);
    if (total < lo || total > hi) continue;
    if (shape.share) { const ks = shuffle([2, 3, 4]).filter(k => total % k === 0 && total / k >= 1 && total / k <= 5); if (!ks.length) continue; return { items, total, friends: ks[0], each: total / ks[0], share: true, pay: 0 }; }
    if (shape.pay && total >= shape.pay) continue;
    return { items, total, pay: shape.pay || 0 };
  }
  const items = menu.slice().sort((a, b) => a.price - b.price).slice(0, n), total = items.reduce((s, m) => s + m.price, 0);
  if (shape.share) { const k = [2, 3, 4].find(k => total % k === 0 && total / k <= 5); if (k) return { items, total, friends: k, each: total / k, share: true, pay: 0 }; return { items, total, pay: 0 }; }
  return { items, total, pay: shape.pay ? (total < 10 ? 10 : 20) : 0 };
}
function makeCustomer(slot) {
  if (G.regulars.length && slot >= G.regulars[0].after) { const r = G.regulars.shift(); note('regular', { slot, who: r.who.cast || 'kid' }); return { who: r.who, order: r.order, shape: r.shape, regular: true }; }
  const cfg = G.cfg;
  const shape = (slot === 0 && cfg.n > 1) ? DAYS[cfg.n - 2] : (cfg.mixed ? pick(MIXED) : cfg);   /* review first: the first customer of the day brings yesterday's maths */
  const who = (KID.name && slot === 2) ? KID : (() => { const n = G.whoPool.shift(); return { cast: n, em: null, name: C.info(n).name, persona: PERSONA[n] }; })();
  return { who, order: makeOrder(shape, G.menu), shape, review: slot === 0 && cfg.n > 1 };
}

  resetScene(); el.joke.textContent = JOKES[n - 1];
  U.show('v-rest'); fillSlots($('#slots3'), [], false); el.restText.textContent = ''; el.panel.classList.add('busy');
  U.hideOverlay(); S.ensure(); AMB.start(); AMB.level(0);
  U.progress.data.current = n; U.progress.save();
  note('day', { n });
  runDay(n, my);
}
async function runDay(n, my) {
  const A = guard(my);
  try {
    await A(opening(n));
    for (let i = 0; i < CUSTOMERS_PER_DAY; i++) { G.customers[i] = makeCustomer(i); await A(serveCustomer(i)); }
    if (G.cleaning) { await A(G.cleaning); G.cleaning = null; }
    await A(boom(false));
    finishDay(n);
    const choice = await A(endQuestion());
    if (choice === 'keep') { if (n < DAYS.length) startDay(n + 1); else showDays(); } else goodbye();
  } catch (e) { if (!(e instanceof Abort)) { console.error(e); note('error', { msg: String(e && e.message) }); } }
}
function finishDay(n) {
  const p = U.progress.data, st = U.stars(G.firstTry, G.questions);
  p.stars[n] = Math.max(p.stars[n] || 0, st); p.done = p.done || {}; p.done[n] = true; p.unlocked = Math.max(p.unlocked || 1, n + 1); p.current = n < DAYS.length ? n + 1 : n;
  p.last = { day: n, firstTry: G.firstTry, questions: G.questions, stars: st }; U.progress.save();
  note('day-done', { n, firstTry: G.firstTry, questions: G.questions, stars: st });
}
async function opening(n) {
  const my = RUN, A = guard(my); G.phase = 'intro';
  el.lights.style.transition = 'none'; el.lights.classList.add('dark'); void el.lights.offsetWidth; el.lights.style.transition = '';
  await A(wait(120)); el.lights.classList.remove('dark'); S.tone(1200, 0.12, { gain: 0.06 }); S.tone(1600, 0.25, { gain: 0.05, delay: 0.12 });
  if (!U.progress.data.seenIntro) { await A(intro()); U.progress.data.seenIntro = true; U.progress.save(); note('intro', { kind: 'long', skipped: !!G.skipped }); }
  else {
    note('intro', { kind: 'short' });
    const line = n === 4 ? [T('This time the customers pay you, and you work out the change.', 'PR6')] : n === 7 ? [T('This time some customers come as friends and share the bill.', 'PR7')] : [T('Six hungry customers are coming to the diner.', 'PR2')];
    el.hatch.classList.add('up'); bubble(el.hatch, textOf(line), line, { left: true, by: chefChar });
    setTimeout(() => { if (RUN === my) el.hatch.classList.remove('up'); }, 1800);
    await A(wait(650));
  }
  G.phase = 'play';
}
/* the first visit: about eighteen seconds, Robo does each job as it is named, and goes boom so the child knows where the day ends. Tapping skips it. */
class Skip extends Error {}
let skipIntro = () => {};
async function intro() {
  const my = RUN; G.skipped = false; let skipped = false, skipRes; const skipP = new Promise(r => { skipRes = r; });
  skipIntro = () => { if (!skipped) { skipped = true; if (G) G.skipped = true; V.stop(); skipRes(); note('intro-skip'); } };
  const w = ms => Promise.race([wait(ms), skipP]);
  const step = async (segs, fn, minMs = 1500) => {
    if (skipped) throw new Skip(); const t0 = now();
    const p = say(segs, { by: chefChar }), f = fn ? fn(w).catch(() => {}) : Promise.resolve();
    await Promise.race([Promise.all([p, f]), skipP]);
    const left = minMs - (now() - t0); if (left > 0 && !skipped) await w(left);
    if (skipped) throw new Skip(); if (my !== RUN) throw new Abort();
  };
  const demo = { who: { cast: 'bear', persona: PERSONA.bear }, order: { items: [FOODS[0], FOODS[15]] } };
  setCustomer(demo); el.hatch.classList.add('up'); C.look(demo.el, 0, 0.3);
  try {
    await step(['Welcome to the Toot Toot Diner! Our food is the tastiest in town.'], async () => { showPlate([FOODS[0]], tableSpot(0.46, 0.3)); await anim($('.armR', chefChar), [{ transform: 'rotate(0)' }, { transform: 'rotate(-150deg)' }, { transform: 'rotate(-120deg)' }, { transform: 'rotate(-150deg)' }, { transform: 'rotate(0)' }], { duration: 1100 }); }, 2200);
    await step(['It also makes everybody go... TOOT!'], async w => { await w(1000); S.play('fart'); FX.burstAt(demo.el, { kind: 'puff', ax: 0.72, ay: 0.85, count: 12, dir: [-30, 60] }); C.mood(demo.el, 'silly'); await w(500); C.mood(demo.el, 'happy'); }, 1800);
    await step(['This is Robo. Robo has two jobs.'], async w => { S.tone(880, 0.1, { type: 'square', gain: 0.06 }); S.tone(1100, 0.1, { type: 'square', gain: 0.06, delay: 0.14 }); await anim(el.robo, [{ transform: 'translateY(0)' }, { transform: 'translateY(-12%)' }, { transform: 'translateY(0)' }], { duration: 500 }); }, 1600);
    await step(['He sweeps every last crumb off the floor...'], async w => { addCrumbs(16, 0.9); el.plate.classList.add('dirty'); await w(200); const t = relRect(el.table); await roboDrive(t.x + t.w * 1.02, 500); await roboSweep(1, true); }, 2400);
    await step(['...and he clears the dirty plates off the tables.'], async w => { hidePlate(); G.tplates = 2; renderStack(el.tstack, 2); placeStack(); await w(200); const head = relRect(roboChar); await anim(el.tstack, [{ transform: 'translate(0,0)' }, { transform: `translate(${head.cx - relRect(el.tstack).cx}px,${head.y - relRect(el.tstack).cy - 6}px)` }], { duration: 260, fill: 'forwards' }); await roboDrive(relRect(el.dock).x + 6, 520); settle(el.tstack); renderStack(el.tstack, 0); G.tplates = 0; G.cplates = 2; renderStack(el.cstack, 2); settle(el.robo); el.robo.classList.remove('flip'); }, 2200);
    await step(['The more you serve, the more mess there is.'], async w => { for (let i = 0; i < 3; i++) { FX.burstAt(el.table, { kind: 'crumbs', ax: 0.5, ay: 0.4, count: 14 }); addCrumbs(14, 0.5); S.chomp(); await w(220); } G.tplates = 3; renderStack(el.tstack, 3); placeStack(); }, 1600);
    await step(['And the harder Robo works, the hotter he gets.'], async w => { el.heatfill.style.transition = 'width 1.6s linear'; el.heatfill.style.width = '100%'; el.robo.classList.add('red'); C.blush(roboChar, true); for (let i = 0; i < 4; i++) { S.steam(); FX.burstAt(roboChar, { kind: 'smoke', ax: 0.12, ay: 0.38, count: 5, dir: [-160, -120] }); FX.burstAt(roboChar, { kind: 'smoke', ax: 0.88, ay: 0.38, count: 5, dir: [-60, -20] }); await w(320); } el.heatfill.style.transition = ''; }, 2000);
    await step(['And when Robo gets TOO hot...'], async () => { el.robo.classList.add('rattle'); S.ratchet(); }, 1200);
    await step([T('KA-BOOM!', 'R8')], async () => { await boom(true); }, 2600);
    await step(['You’re the waiter today. Here comes someone now!'], async w => { S.play('fart'); FX.burstAt(demo.el, { kind: 'puff', ax: 0.72, ay: 0.85, count: 10 }); const r = relRect(el.customer); await anim(el.customer, [{ transform: 'translate(0,0)' }, { transform: `translate(${-(r.x + r.w + 40)}px,-30%) rotate(-25deg)` }], { duration: 600, easing: 'ease-in', fill: 'forwards' }); clearMess(); el.heatfill.style.width = '0%'; }, 1500);
  } catch (e) { if (!(e instanceof Skip)) throw e; }
  V.stop(); settle(roboChar); el.robo.classList.remove('rattle', 'red', 'flip', 'sweeping'); settle(el.robo); C.blush(roboChar, false); C.mood(roboChar, 'neutral'); el.robo.style.setProperty('--heat', 0); el.heatfill.style.transition = ''; el.heatfill.style.width = '0%';
  clearMess(); hidePlate(); settle(el.tstack); settle(el.customer); el.customer.style.visibility = 'hidden'; U.bubble(el.customer, null); el.hatch.classList.remove('up'); U.bubble(el.hatch, null); el.wheel.style.display = 'none'; C.mood(demo.el, 'neutral'); C.mood(chefChar, 'neutral');
  skipIntro = () => {};
}
/* the plain question, on the same screen: two buttons, equal size, equal weight, no default */
function endQuestion() {
  sitting++; G.phase = 'end';
  const three = sitting === 3;
  el.endLine.textContent = three ? 'You’ve done three days.' : 'That’s the lunch rush done.';
  U.show('v-end'); el.panel.classList.remove('busy');
  say([three ? 'You’ve done three days.' : 'That’s the lunch rush done.', 'Keep playing, or stretch your legs?'], { by: chefChar });
  note('end', { sitting });
  return new Promise(res => { G.endRes = res; });
}
$('#btn-keep').addEventListener('click', () => { if (G && G.endRes) { note('choice', { pick: 'keep' }); const r = G.endRes; G.endRes = null; r('keep'); } });
$('#btn-legs').addEventListener('click', () => { if (G && G.endRes) { note('choice', { pick: 'legs' }); const r = G.endRes; G.endRes = null; r('legs'); } });

/* ---------- cards (the game's own: no level word, no stars, no opinion) ---------- */
function showTitle() {
  abortRun(); const p = U.progress.data, cur = clamp(p.current || 1, 1, DAYS.length);
  U.overlay(`<div class="hero">robo bear</div><h1>Toot Toot Diner</h1>${CFG.childName ? `<div class="fact made">Made for <b>${esc(CFG.childName)}</b>${CFG.from ? ' by ' + esc(CFG.from) : ''}</div>` : ''}
    <p>Take the orders, carry the plates, and watch Robo clean up. Careful, he gets hot.</p>
    <button class="bigbtn" id="btn-play">Play<small>Day ${cur}</small></button>
    <div class="rowbtns"><button class="subbtn" id="btn-days">Pick a day</button><button class="subbtn" id="btn-grownups">For grown-ups</button></div>
    <p class="tiny">Everything is read out loud. Tap any speech bubble to hear it again.</p>`);
  U.castify($('.hero', refs.card));
  $('#btn-play', refs.card).addEventListener('click', () => { S.ensure(); startDay(cur); });
  $('#btn-days', refs.card).addEventListener('click', () => { S.ensure(); showDays(); });
  $('#btn-grownups', refs.card).addEventListener('click', showGrownups);
}
function showDays() {
  abortRun(); const p = U.progress.data;
  U.overlay(`<h2>Which day?</h2><div class="days">${DAYS.map(d => `<button class="day" data-n="${d.n}"><span class="num">Day ${d.n}</span><span class="ttl">${esc(d.title)}</span><span class="tags">${d.tags}</span>${p.done && p.done[d.n] ? '<span class="done">✓</span>' : ''}</button>`).join('')}</div>
    <div class="rowbtns"><button class="subbtn" id="btn-title">Back</button></div>`);
  $$('.day', refs.card).forEach(b => b.addEventListener('click', () => { S.ensure(); startDay(+b.dataset.n); }));
  $('#btn-title', refs.card).addEventListener('click', showTitle);
}
function showGrownups() {
  const p = U.progress.data, last = p.last;
  U.overlay(`<h2>For grown-ups</h2><div class="fact grownups">
    <b class="sub">What each day practises</b><ul>${DAYS.map(d => `<li><b>Day ${d.n}</b> ${esc(d.title)}: ${esc(d.lesson)}.</li>`).join('')}</ul>
    <p>Six customers a day. The first customer on every day after the first brings back yesterday’s maths. Change is always counted up from the bill to the note, the way a cashier does it, never taken away.</p>
    <b class="sub">Getting it wrong</b><p>Nothing is marked wrong on screen and nothing funny happens on a mistake. Wrong once: the prices turn into coins to count. Wrong twice: the customer counts them out loud and shows the answer to tap. That customer comes back for seconds later in the day, so the same sum gets a second go. Robo goes boom at the end of every day however it went.</p>
    ${last ? `<b class="sub">Last day played</b><p>Day ${last.day}: ${last.firstTry} of ${last.questions} answered right first time (${'⭐'.repeat(last.stars)}). This is the only place stars or scores appear.</p>` : ''}
    <b class="sub">Built to be put down</b><ul><li>No streaks, timers, prizes or “come back” messages. Every day ends with the same plain question: keep playing, or stretch your legs.</li><li>Heat rises one notch per customer served, never with time. A child can take four minutes over one bill.</li><li>No accounts, no analytics, nothing leaves this device. Tap the house to stop at any moment; nothing is lost.</li><li>Sound: 🔊 effects, 🗣️ read-aloud, 🎵 music (tap to cycle on, quiet, off). ⛶ makes it full screen.</li></ul></div>
    <div class="rowbtns"><button class="subbtn" id="btn-back">Back</button></div>`);
  $('#btn-back', refs.card).addEventListener('click', showTitle);
}
function goodbye() {
  abortRun(); sitting = 0; const idea = pick(IDEAS);
  AMB.start(); AMB.fade(0);
  U.overlay(`<div class="hero">chef</div><h2>Closing time</h2><p>Great work today. Stretch your arms, drink some water, and ${esc(idea)}.</p><div class="rowbtns"><button class="subbtn" id="btn-title">Back to start</button></div>`);
  U.castify($('.hero', refs.card));
  say([`Great work today. Stretch your arms, drink some water, and ${idea}.`], { by: chefChar });
  note('goodbye', { idea });
  $('#btn-title', refs.card).addEventListener('click', showTitle);
}

/* ---------- debug hooks for the tests ---------- */
window.__diner = window.__game = {
  get G() { return G; }, get state() { return G; }, get log() { return log; }, get question() { return G && G.question; },
  startDay, startLevel: startDay, showTitle, showDays, showGrownups, goodbye, skipIntro: () => skipIntro(),
  answer(v) { if (!G || !G.question) return false; const q = G.question; if (q.type === 'order') { const b = $(`.mitem[data-id="${v}"]`, el.menu); if (!b) return false; q.onTap(String(v), b); return true; } const b = $(`.choice[data-v="${v}"]`, el.panel); if (!b) return false; q.onTap(+v, b); return true; },
  carryNow() { landPlate(); }, get carry() { return G && G.carry; },
  cfg: CFG, days: DAYS, foods: FOODS, get progress() { return U.progress.data; }, get amb() { return AMB.st; }, get roboChar() { return roboChar; }, chefChar, say, textOf, idsOf, get sitting() { return sitting; }, set sitting(v) { sitting = v; },
  get served() { return G ? G.served : 0; }, get heat() { return G ? G.heat : 0; }, get run() { return RUN; }
};

/* ---------- boot ---------- */
el.panel.classList.add('busy');
el.customer.style.visibility = 'hidden';
el.joke.textContent = JOKES[0];
showTitle();
})();
