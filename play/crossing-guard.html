<html lang="en">

<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:44px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
:root{--road:#5C5C68;--walk:#E6DFD1;--hivis:#E6FF1A}
/* ---------- scene: a drawn street (16:9), positions in % and cqw so it scales ---------- */
#scene{aspect-ratio:16/9;background:#A9DFFF}
#scene>*{user-select:none;-webkit-user-select:none}
.street{position:absolute;inset:0;width:100%;height:100%;display:block}
.street .lamp{fill:#4a4a52;opacity:.5}
.street[data-light=red] .lr{fill:#FF3B3B;opacity:1}
.street[data-light=amber] .la{fill:#FFC83D;opacity:1}
.street[data-light=green] .lg{fill:#4BDB6C;opacity:1}
.street .swalk,.street .shand{display:none}
.street[data-sig=walk] .swalk{display:inline}
.street[data-sig=stop] .shand,.street[data-sig=flash] .shand{display:inline}
.street[data-sig=flash] .shand{animation:sigflash .7s steps(1) infinite}
.street[data-sig=walk] .sigbox{fill:#1E8F7B}
@keyframes sigflash{50%{opacity:.15}}
.street .cloud{animation:drift 40s linear infinite}
.street .cloud.c2{animation-duration:55s;animation-delay:-30s}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(170px)}}
#ssign{transform-box:fill-box;transform-origin:50% 100%}
#cross-hot{fill:none;stroke:var(--mint);stroke-width:1.2;opacity:0;transition:opacity .3s}
.street.hot #cross-hot{opacity:1}
.actor{position:absolute;line-height:0;transform:translateX(-50%);z-index:9}
.actor .toot-char{width:100%}
#guard{left:27%;top:60%;width:13cqw}
#guard .armR{transform-box:view-box;transform-origin:150px 158px}
#guard .bubble{left:auto;right:-8%;bottom:103%;max-width:27cqw;min-width:12cqw;transform-origin:85% 100%}
#guard .bubble::after{left:auto;right:3cqw;bottom:-1.3cqw;border:1.4cqw solid transparent;border-top-color:#fff;border-bottom:0}
#kid{left:50%;top:63%;width:11cqw}
#kid .head{transition:transform .35s}
#kid.walking .toot-char,#clerk.walking .toot-char{animation:kwalk .32s infinite alternate}
@keyframes kwalk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-1.2cqw) rotate(3deg)}}
.actor .tag{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font:700 2.4cqw var(--display);background:#fff;border-radius:2cqw;padding:.3cqw 1.2cqw;white-space:nowrap;line-height:1.2;margin-bottom:.4cqw;box-shadow:0 .3cqw 0 rgba(59,42,31,.12);color:var(--cocoa)}
.actor .bubble.below{bottom:auto;top:30%}
#clerk{left:84%;top:42%;width:11cqw;z-index:8}
.veh{position:absolute;width:14cqw;transform:translateX(-50%);z-index:4;line-height:0;will-change:left}
.veh.bus{width:22cqw}.veh.bike{width:10cqw}
.veh svg{width:100%;height:auto;overflow:visible;display:block}
.veh.rev svg{transform:scaleX(-1)}
.veh .wheel{transform-box:fill-box;transform-origin:center}
.veh.moving .wheel{animation:vspin .5s linear infinite}
.veh.bike.moving .wheel{animation-duration:.8s}
@keyframes vspin{to{transform:rotate(360deg)}}
.veh.stopped{filter:brightness(.9)}
.veh .bubble{font-size:clamp(11px,2.2cqw,18px);z-index:7}
.lookzone{position:absolute;top:31%;height:44%;width:20%;border-radius:2cqw;display:none;place-items:center;background:rgba(255,255,255,.16);z-index:12;padding:0;transition:background .2s}
.lookzone svg{width:9cqw;height:9cqw;overflow:visible}
.lookzone.l{left:2%}.lookzone.r{right:2%}
.lookzone .arr{fill:#fff;stroke:var(--cocoa);stroke-width:5;stroke-linejoin:round;animation:lookpulse 1s infinite}
@keyframes lookpulse{50%{transform:scale(1.12)}}
#scene.looking .lookzone{display:grid}
#scene.looking .lookzone.dim .arr{opacity:.35;animation:none}
.lookzone:active{background:rgba(255,255,255,.4)}
.place{position:absolute;inset:0;display:none;z-index:8}
.place.on{display:block}
.place svg{position:absolute;inset:0;width:100%;height:100%}
.place .cap{position:absolute;left:50%;top:4%;transform:translateX(-50%);font:700 4cqw var(--display);background:#fff;border-radius:3cqw;padding:.6cqw 2.6cqw;white-space:nowrap;box-shadow:0 .4cqw 0 rgba(59,42,31,.12);color:var(--cocoa);z-index:2}
.place .counter{position:absolute;left:74%;top:66%;width:26%;height:34%;background:linear-gradient(#E0A96D,#B97B3F);border-top:1.2cqw solid #FFF3DC;border-left:.5cqw solid #3B2A1F;z-index:3}
.place .counter::after{content:"";position:absolute;left:14%;top:12%;width:22%;height:20%;background:#C3D2DC;border-radius:.6cqw;border:.4cqw solid #3B2A1F}
.prop{position:absolute;z-index:10;line-height:0;pointer-events:none}
.prop svg{width:100%;height:auto;overflow:visible;display:block}
.prop.ducks{width:4.6cqw}.prop.ducks svg{margin-bottom:.4cqw}

const Cars = (() => {
  let list = [], loop = null, nextSpawn = 0, hold = false, running = false, lastToot = 0, seq = 0, calm = false;   // calm: no new traffic while a kid waits for a car to pass
  const LANES = [{ top: 39, dir: -1 }, { top: 60, dir: 1 }];
  const KINDS = { car: { w: 14, speed: [15, 19], dy: 0 }, bus: { w: 22, speed: [11, 13], dy: -1 }, bike: { w: 10, speed: [12, 14], dy: 1 } };
  function spawn(laneIdx, kind, x){
    if(laneIdx == null){ const free = [0, 1].filter(i => !list.some(c => c.dir === LANES[i].dir && (LANES[i].dir > 0 ? c.x < 36 : c.x > 64))); if(!free.length) return null; laneIdx = pick(free); }
    const lane = LANES[laneIdx]; kind = kind || pick(['car', 'car', 'car', 'bus', 'bike']); const Kd = KINDS[kind];
    const c = { id: ++seq, el: document.createElement('div'), kind, w: Kd.w, x: x != null ? x : (lane.dir > 0 ? -Kd.w : 100 + Kd.w), dir: lane.dir, speed: rnd(Kd.speed[0] * 10, Kd.speed[1] * 10) / 10, stopped: false, stopUntil: 0, puffAt: performance.now() + 600, color: pick(CAR_COLORS) };
    c.el.className = `veh ${kind}${lane.dir < 0 ? ' rev' : ''} moving`; c.el.innerHTML = VEH_SVG[kind](c.color); c.el.style.top = (lane.top + Kd.dy) + '%'; c.el.style.left = c.x + '%'; c.el.dataset.kind = kind;
    el.cars.appendChild(c.el); list.push(c); return c;
  }
  function tick(dt){
    const now = performance.now();
    for(const c of list){
      if(c.stopped){ if(now < c.stopUntil) continue; c.stopped = false; c.el.classList.remove('stopped'); }
      const stopX = c.dir > 0 ? 39 - c.w / 2 : 61 + c.w / 2;    // the front bumper waits at the crosswalk line
      if(hold && (c.dir > 0 ? (c.x <= stopX && c.x + c.speed * dt >= stopX) : (c.x >= stopX && c.x - c.speed * dt <= stopX))){ c.x = stopX; c.el.style.left = c.x + '%'; c.el.classList.remove('moving'); continue; }
      c.x += c.dir * c.speed * dt; c.el.style.left = c.x + '%'; c.el.classList.add('moving');
      if(c.kind !== 'bike' && now > c.puffAt && Toot.speed > 0.5){   // exhaust puffs that are tiny toots

  }

    start(){ if(running) return; running = true; nextSpawn = performance.now() + 1500; loop = P.loop(tick); },
    stop(){ running = false; if(loop) loop.stop(); loop = null; list.forEach(c => c.el.remove()); list = []; hold = false; calm = false; },
    get running(){ return running; }, get near(){ return list.some(nearOne); }, get any(){ return list.length > 0; }, get list(){ return list; },
    set hold(v){ hold = v; }, get hold(){ return hold; }, set calm(v){ calm = !!v; }, get calm(){ return calm; },

async function loop(myRun){
  const used = { signal: [], safe: [], lost: [], tricky: [], call: [] };
  const pickSpec = (pool, key) => { let left = pool.filter(s => !used[key].includes(s)); if(!left.length){ used[key] = []; left = pool; } const s = pick(left); used[key].push(s); return s; };
  await wait(900); if(run !== myRun) return;
  while(run === myRun && G.round < G.rounds.length){
    const type = G.rounds[G.round]; renderRound();
    const kid = pick(KIDS);
    if(type === 'look') await roundLook(myRun);
    else if(type === 'signal') await roundChoice('signal', pickSpec(SIGNALS, 'signal'), kid);
    else if(type === 'safe') await roundChoice('safe', pickSpec(SAFE, 'safe'), kid);
    else if(type === 'lost') await roundChoice('lost', pickSpec(LOST, 'lost'), kid);
    else if(type === 'tricky') await roundChoice('tricky', pickSpec(TRICKY, 'tricky'), kid);
    else if(type === 'call') await roundChoice('call', pickSpec(CALL, 'call'), kid);
    else if(type === 'say') await roundSay(kid);
    else if(type === 'gear') await roundGear(kid, gearOrder[G.round % 3]);
    else if(type === 'dial') await roundDial(kid);
    if(run !== myRun) return;
    if(R && R.watch) clearInterval(R.watch);
    G.round++; renderRound();
    await wait(300); if(run !== myRun) return;
  }
  if(run !== myRun) return;
  R = null;
  if(G.cfg.mixed){ await parade(myRun); if(run !== myRun) return; }
  finishLevel();
}
function finishLevel(){
  const s = G.stats, stars = UI.stars(s.firstTry, s.questions);
  G.complete = true; Cars.stop(); UI.nudge.clear();
  const msgKey = stars === 3 ? 'm3' : stars === 2 ? 'm2' : 'm1', n = G.n, breakTime = UI.sitting + 1 >= 3;
  UI.levelComplete({ n, stars, hero: `robo ${kidInfo ? kidInfo.key : 'bear'}`, title: `Level ${n} done!`, subtitle: G.cfg.title, msg: L[msgKey], speak: false, last: n >= LEVELS.length,
    fact: `<b>${s.firstTry}</b> of <b>${s.questions}</b> safe choices right the first time`,
    onNext: () => startLevel(n + 1), onReplay: () => startLevel(n), onLevels: showLevels, onDone: showTitle });
  const bd = $('#btn-done', refs.card); if(bd){ const c = bd.cloneNode(true); bd.replaceWith(c); c.addEventListener('click', showGoodbye); }
  const ln = line(L.level, n, L.done, L[msgKey]);
  V.say(ln.text + (breakTime ? ` You’ve done ${UI.sitting} levels. Time for a break?` : ''), !breakTime && ln.ids ? { ids: ln.ids } : {});
}
function stopGame(){ run++; G = null; R = null; Cars.stop(); clearProps(); UI.nudge.clear(); looking(false); el.kid.classList.remove('walking'); el.street.classList.remove('hot'); }
function showGoodbye(){
  stopGame();
  const idea = pick(IDEAS);
  UI.goodbye({ hero: 'robo', idea, text: `The crossing guard is going home for now. Stretch your arms, ${idea}. Robo will be here when you come back.`, spoken: `${L.byeA} ${idea}. ${L.byeB}`, ids: [VID.get(L.byeA), VID.get(idea), VID.get(L.byeB)], onBack: showTitle });
  refs.card.dataset.kind = 'goodbye';
}

/* ---------- cards ---------- */
function showTitle(){
  stopGame(); setPlace(null); setSignal('stop'); setLight('green'); cue(null); UI.show('');
  if(!kidChar) setKid(pick(KIDS));
  UI.title({ hero: 'robo bear', title: 'Crossing Guard',
    blurb: 'You are the crossing guard! Help the kids look left, right, left, cross at the crosswalk, gear up, find a helper, and call 9-1-1 when it really matters.',
    fact: 'Learn <b>👀</b> looking · <b>🚦</b> signals · <b>⛑️</b> helmets and seatbelts · <b>🔍</b> what to do if lost · <b>📞</b> 9-1-1', playLabel: 'Play! 🦺',
    onPlay: () => startLevel(Math.min(progress.unlocked || 1, LEVELS.length)), onLevels: showLevels, grownups: showGrownups });
  refs.card.dataset.kind = 'title';
}
function showGrownups(){
  UI.grownups({ html: `<b>What each level teaches</b><ul>${LEVELS.map((l, i) => `<li><b>${i + 1}. ${l.title}:</b> ${l.teaches}</li>`).join('')}</ul>
    <b class="sub">Nothing scary</b><ul>
      <li>Cars are slow and easy to see, and they always stop when Robo raises his STOP paddle. If your child taps Walk while a car is near, Robo blows his whistle, everything freezes for a moment, the car stops early with a squeak, and the guard says “Whoa! Let’s wait.” No collisions are ever shown.</li>
      <li>The lost and tricky-grown-up scenes are calm and kind: stay put, find a helper (like Gus at the help desk), say no, tell your grown-up. The safe choice is always on screen.</li>
      <li>The silly bits (a duck family, a sneezing car, a bus that toots, a squirrel Robo escorts) are short, gentle, and always follow the safety rules.</li></ul>
    <b class="sub">How hints work</b><ul>
      <li>First miss: the guard explains the rule with a picture cue. Second miss: the right answer is shown to tap. Nobody fails a level.</li>
      <li>If your child stops for a while, the instruction is repeated and the thing to tap wiggles.</li>
      <li>Stars come only from first-try accuracy. No timers, no accounts, nothing leaves this device.</li></ul>
    <b class="sub">Practise for real</b><ul>
      <li>Walk to a real crosswalk together. Say “left, right, left” out loud, hold hands, and wait for the walking person.</li>
      <li>Practise your full name, your child’s address, and your name as their grown-up. Point out helpers: workers with name tags, parents with kids, police officers.</li>
      <li>Check the bike helmet fits snug, two fingers above the eyebrows, and click the seatbelt every ride.</li>
      <li>In Canada the emergency number is 9-1-1. Show your child how to unlock a phone and find the call button.</li></ul>`, onBack: showTitle });
  const g = $('.grownups', refs.card); if(g) g.id = 'grownups';
  refs.card.dataset.kind = 'grownups';
}
function showLevels(){
  stopGame();
  UI.levels({ count: LEVELS.length, intro: 'Each level teaches one safety idea. Finish one to unlock the next!', level: n => ({ title: LEVELS[n - 1].title, tags: [LEVELS[n - 1].em] }), onPick: startLevel, onBack: showTitle });
  refs.card.dataset.kind = 'levels';
}

/* ---------- wiring ---------- */
el.arrows.addEventListener('click', e => { const b = e.target.closest('.arrow'); if(!b) return; S.ensure(); look(b.dataset.dir); });
el.zoneL.addEventListener('click', () => { S.ensure(); look('left'); });
el.zoneR.addEventListener('click', () => { S.ensure(); look('right'); });
el.btnWalk.addEventListener('click', () => { S.ensure(); walk(); });
el.btnWait.addEventListener('click', () => { S.ensure(); waitBtn(); });
el.choices.addEventListener('click', e => { const b = e.target.closest('.choice'); if(!b) return; S.ensure(); choose(b.dataset.t); });
el.btnSaid.addEventListener('click', () => { S.ensure(); saidIt(); });
el.btnSaid2.addEventListener('click', () => { S.ensure(); saidIt(); });
el.keys.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button class="pk" data-k="${n}" aria-label="${n}">${n}</button>`).join('') + `<button class="pk zero" data-k="0" aria-label="0">0</button>`;
el.keys.addEventListener('click', e => { const b = e.target.closest('.pk'); if(!b) return; S.ensure(); dial(b.dataset.k); });
document.addEventListener('keydown', e => { if(R && R.type === 'dial' && /^\d$/.test(e.key) && !UI.overlayOpen()) dial(e.key); });
/* gear: real drag, tap-then-tap, and a plain button */
(function initDrag(){
  let drag = null;
  el.items.addEventListener('pointerdown', e => {
    const it = e.target.closest('.item'); if(!it || !R || R.type !== 'gear' || R.solved) return;
    e.preventDefault(); S.ensure();
    drag = { el: it, id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false };
    try { it.setPointerCapture(e.pointerId); } catch(err){}
  });
  el.items.addEventListener('pointermove', e => {
    if(!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if(Math.hypot(dx, dy) > 6){ drag.moved = true; drag.el.classList.add('dragging'); }
    if(drag.moved){ drag.el.style.transform = `translate(${dx}px,${dy}px)`; el.target.classList.toggle('hot', overTarget(e.clientX, e.clientY)); }
  });
  function end(e){
    if(!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; d.el.classList.remove('dragging'); d.el.style.transform = ''; el.target.classList.remove('hot');
    if(!R || R.type !== 'gear' || R.solved) return;
    if(d.moved){ if(overTarget(e.clientX, e.clientY)) drop(d.el.dataset.item, R.target); else coach(line(L.dropOn, K(R.kid), '.'), { speak: false }); }
    else { $$('.item', el.items).forEach(b => b.classList.toggle('selected', b === d.el && !b.classList.contains('selected'))); R.selected = d.el.classList.contains('selected') ? d.el.dataset.item : null; if(R.selected) coach(line(L.nowTap, K(R.kid), '!'), { speak: false }); }
  }
  el.items.addEventListener('pointerup', end); el.items.addEventListener('pointercancel', end);
  function overTarget(x, y){ const t = el.target.getBoundingClientRect(); return x > t.left - 10 && x < t.right + 10 && y > t.top - 10 && y < t.bottom + 10; }
  el.target.addEventListener('pointerdown', () => { if(R && R.type === 'gear' && R.selected) drop(R.selected, R.target); });
  el.btnPuton.addEventListener('click', () => { if(!R || R.type !== 'gear' || R.solved) return; if(R.selected) drop(R.selected, R.target); else coach(L.gearFirst); });
})();
Toot.secrets.on(robo, 3, () => { C.hat(robo, 'propeller'); S.play('fart'); });

  get state(){

      kid: R ? R.kid.name : null, target: R ? R.target || null : null, dialed: R ? R.dialed || '' : '', sigOn: R ? !!R.sigOn : false,
      carNear: Cars.near, vehicles: Cars.list.map(c => ({ kind: c.kind, x: Math.round(c.x * 10) / 10, dir: c.dir, stopped: c.stopped })), hold: Cars.hold,
      complete: G ? G.complete : false, stats: G ? Object.assign({}, G.stats) : null, coach: UI.coachLine, hint: el.cue.classList.contains('on') ? el.cueText.textContent : '',

      place: el.scene.dataset.place || 'street', reactionLog: reactionLog.slice(), lastReaction, reacting: !!reacting, whistles: whistleLog.slice(), freeze: !!$('.toot-freeze'), speed: Toot.speed,
      helmetOn: hasHelmet(stageChar) || hasHelmet(kidChar), gearOn: stageChar ? $$('.gear', stageChar).map(g => g.classList[1]) : []
    };
  }
};
