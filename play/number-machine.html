<html lang="en">

<meta charset="utf-8">

<title>Number Machine · Toot Toot Learning</title>

<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:44px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
/* Game-only styles. The engine (toot.css / toot.js) owns the top bar, stage grid, coach strip, cards, hint box, nudge, numpad and buttons.
   The scene IS the machine: a drawn cabinet (hopper, pipes, lever, display window, dials with gears, output chute). */
:root{
  --butter-dark:#D9A400; --sky-mid:#5CC8FF; --sky-dark:#2A7BFF; --red:#FF3B3B;
  --silver:#C9D3DC; --silver-dark:#8A99A8; --copper:#D98A5B; --copper-dark:#A85C2E; --bill:#7CC47F; --bill-dark:#3E8C43;
  --steel:#C3D2DC; --steel-dark:#8FA3B1; --steel-deep:#5F7382;
  --slh: clamp(120px, 30vh, 240px);   /* dial track height */
  --th: 44px;                          /* thumb height */
  --u: clamp(4px, 1vmin, 6px);         /* base-ten block unit */
}
/* ---------- the machine (scene) ---------- */
#scene{aspect-ratio:auto;height:auto;width:100%;background:linear-gradient(180deg,#DCE6EE,#B6C6D3);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr);gap:10px 12px;padding:12px;align-items:start;box-shadow:var(--shadow),inset 0 0 0 5px var(--steel-dark),inset 0 0 0 7px rgba(59,42,31,.35)}
#scene::before{content:"";position:absolute;inset:14px;pointer-events:none;border-radius:16px;background:radial-gradient(circle,#5F7382 0 2px,transparent 3px) 0 0/100% 100% no-repeat,radial-gradient(circle,#5F7382 0 2px,transparent 3px) 100% 0/8px 8px no-repeat,radial-gradient(circle,#5F7382 0 2px,transparent 3px) 0 100%/8px 8px no-repeat,radial-gradient(circle,#5F7382 0 2px,transparent 3px) 100% 100%/8px 8px no-repeat;background-size:8px 8px}
#scene.hot{background:linear-gradient(180deg,#F5C9B8,#E39A86)}
.mtop{grid-column:1;grid-row:1;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;min-height:0;position:relative;z-index:3}
.mtop .toot-actor{position:relative;width:clamp(56px,11vmin,120px);flex:none}
.mtop .toot-actor .toot-char{width:100%}
.mtop .gap{flex:1;min-width:0}
.customer{transition:transform .5s cubic-bezier(.3,1.2,.5,1),opacity .3s}
.customer.away{transform:translateX(-60px);opacity:0}
.customer .bubble{left:96%;bottom:auto;top:-6px;transform-origin:0 0;min-width:70px;max-width:min(240px,58cqw);text-align:center;z-index:8}
.customer .bubble::after{bottom:auto;top:12px}
.bubble .big{font-family:var(--display);font-size:1.7em;color:var(--ketchup);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;display:block;margin:2px 0}
.bubble .ecards{display:inline-flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.bubble .ecard{font-family:var(--display);font-weight:700;font-size:1.15em;background:var(--butter);border-radius:8px;padding:1px 7px;box-shadow:0 2px 0 rgba(59,42,31,.14);font-variant-numeric:tabular-nums}
.bubble .plus{font-family:var(--display);font-weight:700;color:var(--ketchup)}
.bubble .sub{display:block;font-size:.8em;color:var(--cocoa-soft);font-weight:800}
.robo .bubble{left:auto;right:96%;bottom:auto;top:-6px;transform-origin:100% 0}
.robo .bubble::after{left:auto;right:-8px;bottom:auto;top:12px;border-right:0;border-left:8px solid #fff}
.chef .bubble{bottom:auto;top:-6px}
.chef .bubble::after{bottom:auto;top:12px}
.hopperwrap{flex:none;width:clamp(58px,11vmin,120px);position:relative;align-self:flex-end}
.hopperwrap svg{width:100%;height:auto;display:block;overflow:visible}
.hopper .mouth{transform-box:fill-box;transform-origin:50% 100%}
.gearbox .gear{transform-box:fill-box;transform-origin:50% 50%}
.run .gearbox .gear{animation:spin 1.2s linear}
.run .gearbox .gear.ccw{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.leverwrap{flex:none;width:clamp(34px,6.5vmin,70px);align-self:flex-end;cursor:pointer;touch-action:manipulation;border-radius:12px;position:relative}
.leverwrap svg{width:100%;height:auto;display:block;overflow:visible}
.lever .arm{transform-box:fill-box;transform-origin:50% 100%;transform:rotate(-28deg);transition:transform .32s cubic-bezier(.3,1.5,.5,1)}
.lever.down .arm{transform:rotate(30deg)}
.leverwrap.ready svg{animation:pulse 1s infinite}
.robo{position:relative}
/* display window: split-flap cards */
.display{grid-column:1;grid-row:2;background:#4A3B31;border-radius:14px;padding:8px 10px;box-shadow:inset 0 0 0 3px #2B2622,0 3px 0 rgba(59,42,31,.35);display:flex;justify-content:center;gap:6px;align-items:flex-start;font-variant-numeric:tabular-nums;perspective:500px;position:relative;min-height:60px}

function levelConfig(n){ return Object.assign({n}, LEVELS[n-1]); }
function makeQuestion(cfg, i){
  let c = cfg;
  if(cfg.mixed){
    c = pick([
      {places:MONEY, gen:()=>rnd(101,999), modes:['make'], money:true},
      {places:MONEY, gen:()=>rnd(101,999), modes:['read'], input:'choice', money:true},
      {places:WHOLE3, gen:()=>rnd(100,999), modes:['make']},
      {places:WHOLE3, gen:()=>rnd(100,999), modes:['read'], input:'pad'},
      {places:WHOLE4, gen:()=>rnd(1000,9999), modes:['read'], input:'pad'}
    ]);
  }
  const mode = c.modes[i % c.modes.length];
  const target = c.gen();
  const q = {mode, target, places:c.places, money:!!c.money, input:c.input||'choice', expanded:!!c.expanded, showTarget:!!c.showTarget, sentence:!!c.sentence, misses:0, solved:false, accepting:false, customer:pick(CUSTOMERS), item:pick(ITEMS)};
  if(mode==='read') q.choices = makeChoices(target, q.places, q.money);
  return q;
}
function makeChoices(target, places, money){
  const set = new Set([target]);
  const cands = [];
  const ds = places.map(p=>digitOf(target,p));
  for(let i=0;i<places.length-1;i++){ const d2=ds.slice(); [d2[i],d2[i+1]]=[d2[i+1],d2[i]]; cands.push(valueOf(Object.fromEntries(places.map((p,k)=>[p,d2[k]])),places)); }
  places.forEach(p=>{ cands.push(target+PLACE[p].value); cands.push(target-PLACE[p].value); });
  cands.push(target*10, Math.floor(target/10));
  const top = valueOf(Object.fromEntries(places.map(p=>[p,9])), places);
  const ok = v => v>=0 && v<=top && v!==target && Number.isInteger(v);
  for(const v of shuffle(cands)){ if(set.size>=3) break; if(ok(v)) set.add(v); }
  while(set.size<3){ const v = rnd(0, top); if(ok(v)) set.add(v); }
  return shuffle([...set]);
}

/* ---------- the dials: drag, tap, +/−, keyboard; each dial turns a gear that settles on a spring ---------- */
let gearLoop = null;
function gearTick(dt){
  let live = false;
  for(const p in sliderEls){ const s = sliderEls[p]; PH.springStep(s.spring, dt); if(Math.abs(s.spring.vel) > 2 || Math.abs(s.spring.target - s.spring.value) > 0.5) live = true; s.gear.style.transform = `rotate(${s.spring.value.toFixed(1)}deg)`; s.gear.dataset.angle = s.spring.value.toFixed(0); }
  if(!live && gearLoop){ const l = gearLoop; gearLoop = null; setTimeout(() => l.stop(), 0); }   /* stop outside the tick: loop.stop() from inside the callback is undone by the engine */
}
function gearsTouch(){ if(!gearLoop) gearLoop = PH.loop(gearTick); }
function buildSliders(places, locked){
  el.sliders.innerHTML = ''; sliderEls = {}; el.sliders.classList.remove('copying');
  places.forEach(p=>{
    const root = h(`<div class="sl${locked?' locked':''}" data-place="${p}"><span class="copy" aria-hidden="true"></span><span class="lbl">${PLACE[p].label}${PLACE[p].sub?`<small>${PLACE[p].sub}</small>`:''}</span>

      <div class="trackwrap"><span class="gear" aria-hidden="true"></span><div class="track" role="slider" aria-label="${PLACE[p].label}" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" tabindex="${locked?-1:0}">${Array.from({length:10},(_,i)=>`<span class="tick" style="bottom:calc(var(--th)/2 + (100% - var(--th)) * ${i/9})"></span>`).join('')}<span class="fill"></span><span class="thumb">0</span></div></div>
      <button class="pm down" aria-label="${PLACE[p].label} down one">−</button></div>`);
    el.sliders.appendChild(root);
    const track = root.querySelector('.track'), thumb = root.querySelector('.thumb'), gear = root.querySelector('.gear');
    gear.appendChild(gearSVG());
    sliderEls[p] = {root, track, thumb, gear, copy:root.querySelector('.copy'), up:root.querySelector('.up'), down:root.querySelector('.down'), spring:PH.spring({value:0, target:0, k:110, damping:9})};
    root.querySelector('.up').addEventListener('click', ()=>{ if(!accepting()) return; S.click(); setPlace(p, cur[p]+1, true); });
    root.querySelector('.down').addEventListener('click', ()=>{ if(!accepting()) return; S.click(); setPlace(p, cur[p]-1, true); });
    const fromPointer = clientY => { const r = track.getBoundingClientRect(); const th = thumb.offsetHeight || 44; const usable = Math.max(1, r.height - th); const rel = (r.bottom - th/2 - clientY) / usable; return clamp(Math.round(rel*9), 0, 9); };
    track.addEventListener('pointerdown', e=>{ if(!accepting()) return; e.preventDefault(); track.setPointerCapture(e.pointerId); root.classList.add('dragging'); S.ensure(); setPlace(p, fromPointer(e.clientY), true, true); });
    track.addEventListener('pointermove', e=>{ if(!root.classList.contains('dragging')) return; setPlace(p, fromPointer(e.clientY), true, true); });

  });
}
function accepting(){ return !!(Q && Q.accepting && Q.mode==='make' && !busy); }
let lastTick = 0;
function setPlace(place, digit, fromUser, drag){
  if(!Q || !(place in sliderEls)) return;
  digit = clamp(Math.floor(Number(digit)||0), 0, 9);
  const changed = digit !== cur[place];
  cur[place] = digit;
  const s = sliderEls[place];
  s.track.style.setProperty('--p', (digit/9).toFixed(4)); s.thumb.textContent = digit; s.track.setAttribute('aria-valuenow', digit);
  s.root.classList.remove('wrong');
  s.spring.target = digit * 40; gearsTouch();
  if(!changed) return;
  if(fromUser){
    if(drag){ const now = performance.now(); if(now - lastTick > 40){ lastTick = now; S.tone(500 + digit*70, 0.05, {type:'triangle', gain:0.09, slide:400 + digit*70}); S.noise(0.025,{gain:0.05,from:5000,to:2000}); } }
    updateReadout(place); renderBlocks();
    clearTimeout(speakTimer);   /* the machine reads the number out when the child pauses */
    speakTimer = setTimeout(()=>{ if(Q && Q.accepting){ const v = valueOf(cur, Q.places); if(Q.money) V.sayMoney(v); else V.sayNumber(v); } }, 900);
    const ready = Q.mode==='make' && valueOf(cur,Q.places)===Q.target;
    el.go.classList.toggle('ready', ready); el.leverwrap.classList.toggle('ready', ready);
  } else { updateReadout(); renderBlocks(); }
}
function setAll(digits, fromUser){ Object.keys(sliderEls).forEach(p=>setPlace(p, digits[p]||0, fromUser)); updateReadout(); renderBlocks(); }

/* ---------- question flow ---------- */
function startLevel(n){

  G = {n, cfg, index:0, stats:{questions:0, firstTry:0}, questions:[]};
  for(let i=0;i<QUESTIONS_PER_LEVEL;i++) G.questions.push(makeQuestion(cfg, i));
  UI.chip('lvl', n); UI.hideOverlay();
  coachSay(['NM2', 'n_'+n, 'NM'+(39+n)], 'robo');
  nextQuestion();
}
function nextQuestion(){
  if(G.index >= QUESTIONS_PER_LEVEL){ finishLevel(); return; }
  Q = G.questions[G.index]; G.prevLog = machineLog.slice(); machineLog.length = 0; Q.misses = 0; Q.solved = false; Q.accepting = false; Q.reacting = null; Q.idled = false;
  Q.ladder = UI.ladder({ onHint: () => {}, onReveal: () => {} });
  UI.chip('q', `${G.index+1} / ${QUESTIONS_PER_LEVEL}`);
  const myRun = run;
  /* the customer walks in */
  el.customer.classList.add('away');
  newCustomer(Q.customer); C.mood(robo, 'neutral'); C.mood(chef, 'neutral');
  setTimeout(() => { if(alive(myRun)) el.customer.classList.remove('away'); }, 30);
  UI.bubble(el.robo, null); UI.bubble(el.chef, null); setHint(''); el.go.classList.remove('ready'); el.leverwrap.classList.remove('ready'); el.blocks.classList.remove('gone'); el.chute.classList.remove('open');
  cur = Object.fromEntries(Q.places.map(p=>[p,0]));
  const t = Q.target, tw = sayNum(t, Q.money), tf = fmtNum(t, Q.money), who = 'c_'+Q.customer.id;
  scene.classList.toggle('reading', Q.mode==='read');
  if(pad) pad.deactivate();
  if(Q.mode==='make'){
    buildSliders(Q.places, false); buildReadout(false); setAll(cur);
    UI.show('v-make');
    let html, ids;
    if(Q.expanded){
      const parts = expandedParts(t, Q.places);
      html = `I need <span class="ecards">${parts.map((x,i)=>`${i?'<span class="plus">+</span>':''}<span class="ecard">${x}</span>`).join('')}</span> ${Q.item}!`;
      ids = [who, 'NM4', 'NM6']; parts.forEach((x,i) => { if(i) ids.push('NM9'); ids.push(...N(x)); }); ids.push('.', 'NM8', ...N(t), '.', ...slideIds(t, Q.places), '.');
    } else if(Q.money){
      html = `Please make <span class="big">${tf}</span><span class="sub">${tw}</span>`;
      ids = [who, 'NM4', 'NM7', ...M(t), '.', ...slideIds(t, Q.places), '.'];
    } else {
      html = `I need <span class="big">${t}</span> ${Q.item}!` + (Q.sentence ? `<span class="sub">${placeSentence(t, Q.places)} is ${t}</span>` : '');
      ids = [who, 'NM4', 'NM6', ...N(t), '.', ...slideIds(t, Q.places), '.'];
    }
    Q.bubbleHTML = html; Q.bubbleIds = ids; bubble(html, ids); say(ids);
    UI.coach(Q.showTarget ? L.NM20 : L.NM19, 'robo', false);
    UI.nudge.set(()=> valueOf(cur,Q.places)===Q.target ? [el.go] : [sliderEls[Q.places[0]].track], textOf(ids));
  } else {
    buildSliders(Q.places, true); buildReadout(true);
    let html, ids;
    if(Q.expanded){
      const parts = expandedParts(t, Q.places);
      html = `Which number is <span class="ecards">${parts.map((x,i)=>`${i?'<span class="plus">+</span>':''}<span class="ecard">${x}</span>`).join('')}</span>?`;
      ids = [who, 'NM5', 'NM17']; parts.forEach((x,i) => { if(i) ids.push('NM9'); ids.push(...N(x)); }); ids.push('?', 'NM18');
    } else if(Q.money){ html = `How much money is this?`; ids = [who, 'NM5', 'NM16']; }
    else { html = `What number is this?`; ids = [who, 'NM5', Q.input==='pad' ? 'NM15' : 'NM14']; }
    Q.bubbleHTML = html; Q.bubbleIds = ids; bubble(html, ids); say(ids);
    if(Q.input==='pad'){ buildPad(); UI.show('v-pad'); UI.coach(L.NM22, 'robo', false); UI.nudge.set(()=>[el.numpad.querySelector('.key.ok')], textOf(ids)); }
    else {
      el.choices.innerHTML = Q.choices.map(v=>`<button class="choice" data-v="${v}">${fmtNum(v,Q.money)}</button>`).join('');
      el.choices.querySelectorAll('.choice').forEach(b=>b.addEventListener('click', ()=>choose(b.textContent)));
      UI.show('v-choice'); UI.coach(L.NM21, 'robo', false);
      UI.nudge.set(()=>[el.choices], textOf(ids));
    }
  }
  renderBlocks(true);
  if(Q.mode==='read') dropBlocks();
  Q.accepting = true;
  UI.fit();
}

/* ---------- answers ---------- */
function submit(){
  if(!Q || !Q.accepting || busy) return;
  if(Q.mode==='make'){
    const wrong = Q.places.filter(p => cur[p] !== digitOf(Q.target,p));
    if(!wrong.length) return success();
    Q.misses++; Q.ladder.wrong(); log('wrong');
    wrong.forEach(p=>{ Toot.util.retrigger(sliderEls[p].root, 'wrong'); });
    const myRun = run;
    (async () => {
      await machineMiss(Q.misses); if(!alive(myRun)) return;
      renderBlocks();
      if(Q.misses===1){
        log('hint'); coachSay(['NM23', ...placeIds(Q.target, Q.places), '.'], 'robo', `${L.NM23} ${placeSentence(Q.target, Q.places)}.`);
      } else {
        Q.places.forEach(p=>{ sliderEls[p].copy.textContent = digitOf(Q.target,p); sliderEls[p].copy.classList.add('on'); });
        el.sliders.classList.add('copying'); log('reveal');
        coachSay(['NM24', ...slideIds(Q.target, Q.places), '.'], 'robo', `${L.NM24} ${slideText(Q.target, Q.places)}`);
        if(Q.misses>=3){ /* always ends in success: Robo sets the dials */
          busy = true; coachSay(['NM25'], 'robo'); S.whirr(0.8); C.mood(robo, 'happy');
          for(const p of Q.places){ await wait(350); if(!alive(myRun)) return; setPlace(p, digitOf(Q.target,p), false); S.ratchet(); }
          await wait(500); if(!alive(myRun)) return; busy = false; success();
        }
      }
    })();
  } else if(Q.input==='pad'){
    const raw = pad ? pad.value : '';
    if(!raw){ coachSay(['NM32'], 'robo'); return; }
    const v = Q.money ? Number(raw) : parseInt(raw, 10);
    if(v===Q.target) return success();
    readMiss(v);
  }
}
function choose(text){
  if(!Q || !Q.accepting || busy || Q.mode!=='read' || Q.input!=='choice') return;
  const v = Q.money ? Math.round(parseFloat(String(text).replace(/[^\d.]/g,''))*100) : parseInt(String(text).replace(/[^\d]/g,''),10);
  const btn = [...el.choices.querySelectorAll('.choice')].find(b=>+b.dataset.v===v);
  if(v===Q.target) return success();
  if(btn) Toot.util.retrigger(btn, 'nope');
  readMiss(v);
}
function readHint(){ const t = Q.target; setHint(`Count each group: <b>${placeSentence(t, Q.places)}</b>.`); coachSay(['NM26', ...placeIds(t, Q.places), '.', 'NM27'], 'robo', `${L.NM26} ${placeSentence(t, Q.places)}. ${L.NM27}`); }
function readMiss(v){
  Q.misses++; Q.ladder.wrong(); log('wrong');
  const t = Q.target, tf = fmtNum(t, Q.money), myRun = run;
  (async () => {
    await machineMiss(Q.misses); if(!alive(myRun)) return;
    if(Q.misses===1){ log('hint'); readHint(); }
    else {
      log('reveal');
      setHint(`It is <b>${tf}</b>. ${placeSentence(t, Q.places)} makes ${tf}.`);
      if(Q.input==='pad'){ pad.reveal(tf); coachSay(['NM28', ...numSeg(t, Q.money), '.', 'NM29', ...String(t).split('').map(d => 'n_'+d), 'NM30'], 'robo', `${L.NM28} ${tf}. ${L.NM29} ${String(t).split('').join(' ')} ${L.NM30}`); }
      else { const btn = [...el.choices.querySelectorAll('.choice')].find(b=>+b.dataset.v===t); if(btn) btn.classList.add('reveal'); coachSay(['NM28', ...numSeg(t, Q.money), '.', 'NM31', ...numSeg(t, Q.money), '.'], 'robo', `${L.NM28} ${tf}. ${L.NM31} ${tf}.`); }
    }
  })();
}
/* wrong answer: the machine sneezes its digits out (they fly with sparks, then reassemble); a second miss is a hiccup */
async function machineMiss(n){
  busy = true; S.oops();
  try { if(n === 1) await react('machineSneeze', {situation:'wrong'}); else await react('digitHiccup', {situation:'wrong'}); } finally { busy = false; }
}
async function sneezeDigits(){
  const cards = $$('.rd .d', el.readout); if(!cards.length) return;
  log('sneeze'); C.mood(robo, 'surprised'); if(cust) C.mood(cust, 'surprised');
  /* wind-up: ah… ah… */
  const tilt = anim(el.readout, [{transform:'translateY(0) rotate(0)'},{transform:'translateY(-4px) rotate(-1.5deg)'},{transform:'translateY(-6px) rotate(-2.5deg)'}], {duration:520, fill:'forwards', easing:'ease-in'});
  S.tone(420, 0.25, {type:'triangle', gain:0.08, slide:640}); await wait(260); S.tone(470, 0.25, {type:'triangle', gain:0.09, slide:720}); await tilt;
  /* CHOO: the digits fly out with sparks */
  S.sneeze(); settle(el.readout);
  anim(el.readout, [{transform:'translateY(-6px) rotate(-2.5deg)'},{transform:'translateY(6px) rotate(3deg)'},{transform:'translateY(0) rotate(0)'}], {duration:360, easing:'cubic-bezier(.2,1.5,.4,1)'});
  FX.burstAt(el.readout, {kind:'sparks', ax:0.5, ay:0.5, count:22, dir:[-160,-20]});
  FX.shake(scene, {strength:5, ms:400});
  const sr = sceneRect(), flyers = [];
  cards.forEach((c, i) => {
    const r = c.getBoundingClientRect(); const f = h(`<div class="flydigit">${esc(c.textContent)}</div>`);
    f.style.left = (r.left - sr.left)+'px'; f.style.top = (r.top - sr.top)+'px'; f.style.setProperty('--pc', getComputedStyle(c.parentElement).getPropertyValue('--pc') || '#fff');
    el.fx.appendChild(f); c.style.visibility = 'hidden';
    const dx = (i - (cards.length-1)/2) * 46 + rnd(-24, 24), dy = 60 + rnd(0, 50), rot = rnd(-300, 300);
    flyers.push({f, a: anim(f, [{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dx*0.6}px,${-dy}px) rotate(${rot/2}deg)`, offset:0.45},{transform:`translate(${dx}px,${dy*0.35}px) rotate(${rot}deg)`}], {duration:620, easing:'ease-out', fill:'forwards'}), dx, dy, rot});
  });
  await Promise.all(flyers.map(x => x.a));
  actorSay(el.customer, cust, ['NM35'], 1100);
  await wait(220);
  /* reassemble: fly back and click into place */
  await Promise.all(flyers.map(x => anim(x.f, [{transform:`translate(${x.dx}px,${x.dy*0.35}px) rotate(${x.rot}deg)`},{transform:'translate(0,0) rotate(0)'}], {duration:420, easing:'ease-in', fill:'forwards'})));
  flyers.forEach(x => x.f.remove()); cards.forEach(c => { c.style.visibility = ''; Toot.util.retrigger(c, 'flip'); }); S.click(); S.tone(1200, 0.08, {type:'square', gain:0.05, slide:900});
  C.mood(robo, 'neutral'); if(cust) C.mood(cust, 'neutral');
}
async function hiccupDigits(){
  const cards = $$('.rd .d', el.readout);
  log('hiccup'); S.hiccup();
  await Promise.all(cards.map((c, i) => anim(c, [{transform:'translateY(0)'},{transform:`translateY(-${10+i*3}px) scale(1.08)`},{transform:'translateY(0)'}], {duration:300, easing:'cubic-bezier(.2,1.5,.4,1)', delay:i*40})));
  const g = FX.gag(robo, 'hiccup', {level:1});
  actorSay(el.robo, robo, ['NM84'], 900);
  await g;
}

/* ---------- success: Robo pulls the lever, the machine runs, the number drops out as blocks, the chef collects ---------- */
async function pullLever(myRun){
  log('lever'); S.ensure();
  const rArm = q1(robo, '.armL'); C.mood(robo, 'happy');
  anim(rArm, [{transform:'rotate(0)'},{transform:'rotate(80deg)'}], {duration:220, fill:'forwards'});
  await wait(200); if(!alive(myRun)) return;
  S.ratchet(); el.lever.classList.add('down'); scene.classList.add('run'); S.whirr(1.1);
  anim(q1(el.hopperSvg, '.mouth'), [{transform:'scale(1,1)'},{transform:'scale(1.15,.85)'},{transform:'scale(.95,1.08)'},{transform:'scale(1,1)'}], {duration:520, easing:'ease-in-out'});
  await wait(250); if(!alive(myRun)) return;
  $$('.vent', el.hopperSvg).forEach((v, i) => setTimeout(() => { FX.burstAt(v, {kind:'smoke', ax:0.5, ay:0.05, count:5}); S.steam(); }, i*120));
  await wait(350); if(!alive(myRun)) return;
  if(Q.mode === 'read') revealReadout(); else Q.places.forEach(p => { const d = el.readout.querySelector(`.rd[data-place="${p}"] .d`); if(d) Toot.util.retrigger(d, 'bump', 300); });
  S.ding();
  await wait(300); if(!alive(myRun)) return;
  el.lever.classList.remove('down'); scene.classList.remove('run'); settle(rArm); anim(rArm, [{transform:'rotate(80deg)'},{transform:'rotate(0)'}], {duration:250});
}
function stampCard(text){ const s = h(`<div class="stamp">${esc(text)}</div>`); el.fx.appendChild(s); S.noise(0.12,{gain:0.25,from:2500,to:200}); S.tone(120,0.15,{type:'square',gain:0.08,slide:60}); setTimeout(()=>s.remove(), 1700); }
async function chefCollects(myRun){

  S.pop(); actorSay(el.chef, chef, ['NM94'], 1000); el.blocks.classList.add('gone'); if(cust) C.mood(cust, 'happy');
  await wait(450); if(!alive(myRun)) return;
  await anim(el.chef, [{transform:`translateX(${dx}px)`},{transform:'translateX(0)'}], {duration:300, fill:'forwards'}); settle(el.chef); C.mood(chef, 'neutral');
}
function veryBig(){ const top = valueOf(Object.fromEntries(Q.places.map(p=>[p,9])), Q.places); return Q.target >= top * 0.9; }
async function success(){
  if(!Q || !Q.accepting || Q.solved || busy) return;
  Q.solved = true; Q.accepting = false; clearTimeout(speakTimer); el.go.classList.remove('ready'); el.leverwrap.classList.remove('ready'); setHint(''); UI.nudge.clear();
  G.stats.questions++; if(Q.misses===0) G.stats.firstTry++;
  const myRun = run, tf = fmtNum(Q.target, Q.money), tw = sayNum(Q.target, Q.money);
  if(pad) pad.enable(false);
  busy = true;
  try {
    await pullLever(myRun); if(!alive(myRun)) return;
    el.chute.classList.add('open'); S.pop(); dropBlocks();
    await wait(300); if(!alive(myRun)) return;
    const praise = pick(PRAISE);
    stampCard(tf); FX.burst(50, 40, {kind:'confetti', count: reduced ? 6 : 26}); S.yay();
    if(cust) C.mood(cust, 'happy');
    UI.coach(`${textOf([praise])} ${tf} is ${tw}.`, 'robo', {spoken: textOf([praise, ...numSeg(Q.target, Q.money), '.']), ids:[praise, ...numSeg(Q.target, Q.money)]});
    say([praise, ...numSeg(Q.target, Q.money), '.']);
    await wait(500); if(!alive(myRun)) return;
    if(veryBig()) await overheat(myRun); else await react(pickReaction(RIGHT_POOL), {situation:'right'});
    if(!alive(myRun)) return;
    await chefCollects(myRun); if(!alive(myRun)) return;
    await wait(250); if(!alive(myRun)) return;
  } finally { if(alive(myRun)) busy = false; }
  if(pad) pad.enable(true);
  G.index++; nextQuestion();
}
/* a very big number makes the machine overheat, gently: steam, freeze "!!!", a slow-motion rattle, then it cools down. Never explodes. */
async function overheat(myRun){
  log('overheat'); scene.classList.add('hot'); C.mood(robo, 'surprised'); if(cust) C.mood(cust, 'surprised');
  const vents = $$('.vent', el.hopperSvg);
  for(let i=0;i<3;i++){ vents.forEach(v => FX.burstAt(v, {kind:'smoke', ax:0.5, ay:0.05, count:6})); S.steam(); await wait(180); if(!alive(myRun)) return; }
  actorSay(el.robo, robo, ['NM90'], 2200);
  log('freeze'); await FX.freeze({ms:600, text:'!!!', host:scene}); if(!alive(myRun)) return;
  log('slowmo'); const slow = FX.slowmo({ms:900, rate:0.35});
  const rattle = anim(el.readout, [{transform:'translate(0,0)'},{transform:'translate(-4px,2px) rotate(-1deg)'},{transform:'translate(4px,-2px) rotate(1deg)'},{transform:'translate(-3px,-2px)'},{transform:'translate(3px,2px)'},{transform:'translate(0,0)'}], {duration:400, iterations:2});
  for(let i=0;i<5;i++){ S.tone(180 + i*30, 0.08, {type:'square', gain:0.06}); await waitReal(140); }
  FX.shake(el.sliders, {strength:4, ms:500});
  await slow; await rattle; if(!alive(myRun)) return;
  scene.classList.remove('hot'); S.whirr(0.6); vents.forEach(v => FX.burstAt(v, {kind:'puff', ax:0.5, ay:0.05, count:4}));
  C.mood(robo, 'happy'); if(cust) C.mood(cust, 'happy'); await wait(200);
}

    fact: `<b>${s.firstTry}</b> of <b>${s.questions}</b> numbers right first time · Level ${done}: ${esc(cfg.title)}`, last: done >= LEVELS.length, speak: false,
    onNext: () => startLevel(done+1), onReplay: () => startLevel(done), onLevels: showLevels, onDone: showTitle,
    goodbye: { text: L.NM67.replace('Great work today! ', ''), spoken: L.NM67, ids: ['NM67'], hero: 'robo' } });

}

    await anim(el.robo, [{transform:`translate(${(-sr.width*0.05).toFixed(0)}px,${(sr.height*0.12).toFixed(0)}px) rotate(-6deg)`},{transform:'translate(0,0)'}], {duration:380, fill:'forwards'}); settle(el.robo); C.look(robo, 0, 0); C.mood(robo, 'neutral'); } },
  customerCounts: { kind:'right', async run(){
    if(!cust) return; C.look(cust, 1, 1); C.mood(cust, 'neutral'); actorSay(el.customer, cust, ['NM81'], 1500);
    const head = q1(cust, '.head');

  hopperBurp: { kind:'right', async run(){
    const mouth = q1(el.hopperSvg, '.mouth');

    await wait(900); C.blush(robo, false); C.mood(robo, 'neutral'); if(cust) giggle(cust, 400); await wait(400); if(cust) C.mood(cust, 'neutral'); } },
  cubeBonksChef: { kind:'right', async run(){
    const sr = sceneRect(), from = scenePx(el.chute, 0.5, 0.5), hat = q1(chef, '.hat') || q1(chef, '.head'), to = scenePx(hat, 0.5, 0.1), w = Math.max(14, sr.width*0.035);

    /* the cube drops off and bounces on the floor (physics body) */
    const b = PH.body({x:to[0], y:to[1], vx:sr.width*0.12, vy:-120, g:1400, bounce:0.45, floor: sr.height - w/2, radius:w/2});
    await new Promise(res => { const lp = PH.loop(dt => { if(PH.step(b, dt)) S.pop(); p.style.transform = `translate(${(b.x-to[0]).toFixed(1)}px,${(b.y-to[1]).toFixed(1)}px) rotate(${((b.x-to[0])*2).toFixed(0)}deg)`; if(b.rest || b.x > sr.width + w || performance.now() > lp.t0 + 900){ lp.stop(); res(); } }); lp.t0 = performance.now(); });
    await anim(p, [{opacity:1},{opacity:0}], {duration:150, fill:'forwards'}); p.remove(); settle(chef); C.mood(chef, 'happy'); await wait(200); C.mood(chef, 'neutral'); } },
  numberConfetti: { kind:'right', async run(){
    const sr = sceneRect(), n = reduced ? 4 : 12, nodes = [];
    S.yay(); FX.burstAt(el.readout, {kind:'confetti', ax:0.5, ay:0.5, count:16});
    for(let i=0;i<n;i++){ const s = h(`<span class="numconf">${rnd(0,9)}</span>`); s.style.left = (sr.width*(0.15+Math.random()*0.7))+'px'; s.style.top = (sr.height*0.1+Math.random()*sr.height*0.2)+'px'; s.style.color = pick(['#F4552F','#2FBFA6','#D9A400','#2A7BFF']); el.fx.appendChild(s); nodes.push(s);
      anim(s, [{transform:'translateY(0) rotate(0)', opacity:1},{transform:`translateY(${(sr.height*0.55).toFixed(0)}px) rotate(${rnd(-360,360)}deg)`, opacity:0}], {duration:1100 + rnd(0,400), easing:'ease-in', fill:'forwards'}); }
    if(cust){ C.mood(cust, 'happy'); C.look(cust, 0, -1); } C.mood(robo, 'happy');
    await wait(1500); nodes.forEach(s => s.remove()); if(cust){ C.look(cust, 0, 0); C.mood(cust, 'neutral'); } C.mood(robo, 'neutral'); } },
  machineHiccup: { kind:'right', async run(){
    const cards = $$('.rd[data-place] .d', el.readout); const c = cards.length ? pick(cards) : null; const orig = c ? c.textContent : '';
    S.hiccup(); anim(el.readout, [{transform:'translateY(0)'},{transform:'translateY(-8px) scale(1.03)'},{transform:'translateY(0)'}], 300);
    if(c){ c.textContent = String(rnd(0,9)); Toot.util.retrigger(c, 'flip'); }
    const g = FX.gag(robo, 'hiccup', {level:1}); actorSay(el.robo, robo, ['NM84'], 900);
    await wait(450); if(c){ c.textContent = orig; Toot.util.retrigger(c, 'flip'); S.click(); }
    await g; } },
  roboLeverDance: { kind:'right', async run(){
    scene.classList.add('run'); S.whirr(1.2); Object.values(sliderEls).forEach(s => { s.spring.vel += 900; }); gearsTouch();
    await FX.gag(robo, 'happyDance', {level:1}); scene.classList.remove('run'); } },
  chefJuggle: { kind:'right', async run(){
    const sr = sceneRect(), c = scenePx(q1(chef, '.head'), 0.5, 0), w = Math.max(12, sr.width*0.03), nodes = [];
    C.mood(chef, 'happy'); anim(q1(chef, '.armL'), [{transform:'rotate(0)'},{transform:'rotate(-70deg)'},{transform:'rotate(0)'}], {duration:400, iterations:3}); anim(q1(chef, '.armR'), [{transform:'rotate(0)'},{transform:'rotate(70deg)'},{transform:'rotate(0)'}], {duration:400, iterations:3, delay:200});
    for(let i=0;i<3;i++){ const p = prop(shapeEl('cube'), [c[0] + (i-1)*w*1.4, c[1]], w); nodes.push(p); anim(p, [{transform:'translateY(0)'},{transform:`translate(${(i-1)*-w*1.4}px,-${sr.height*0.16}px) rotate(180deg)`},{transform:'translateY(0) rotate(360deg)'}], {duration:520, iterations:2, delay:i*170, easing:'ease-in-out'}); setTimeout(() => S.pop(), i*170); }
    await wait(1200); S.boing(); actorSay(el.chef, chef, ['NM86'], 900); FX.burstAt(chef, {kind:'stars', ax:0.5, ay:0.05, count:6});
    nodes.forEach(p => anim(p, [{opacity:1},{opacity:0}], {duration:200, fill:'forwards'}).then(() => p.remove()));
    await wait(500); settle(chef); C.mood(chef, 'neutral'); } },
  steamWhistle: { kind:'right', async run(){
    const vents = $$('.vent', el.hopperSvg);
    for(let i=0;i<3;i++){ const v = vents[i % vents.length]; FX.burstAt(v, {kind:'smoke', ax:0.5, ay:0.05, count:5}); S.steam(); S.whistle(); await wait(260); }
    if(cust){ const ears = q1(cust, '.ears'); if(ears) anim(ears, [{transform:'scale(1)'},{transform:'scale(1.25) translateY(-4px)'},{transform:'scale(1)'}], 400); C.mood(cust, 'surprised'); actorSay(el.customer, cust, ['NM87'], 1000); }
    anim(q1(robo, '.antenna'), [{transform:'rotate(0)'},{transform:'rotate(-25deg)'},{transform:'rotate(25deg)'},{transform:'rotate(0)'}], 500);
    await wait(900); if(cust) C.mood(cust, 'happy'); await wait(300); if(cust) C.mood(cust, 'neutral'); } },
  customerHat: { kind:'right', async run(){
    if(!cust) return; const sr = sceneRect(), from = scenePx(trayGroup('tens'), 0.5, 0.4), head = q1(cust, '.head'), to = scenePx(head, 0.5, 0.05), w = Math.max(30, sr.width*0.09);
    const p = prop(shapeEl('rod'), from, w*0.15, w); p.style.transform = 'rotate(90deg)'; S.slideWhistle('up');
    await anim(p, [{transform:'translate(0,0) rotate(90deg)'},{transform:`translate(${((from[0]+to[0])/2-from[0]).toFixed(0)}px,${(to[1]-from[1]-sr.height*0.2).toFixed(0)}px) rotate(270deg)`},{transform:`translate(${(to[0]-from[0]).toFixed(0)}px,${(to[1]-from[1]).toFixed(0)}px) rotate(450deg)`}], {duration:600, easing:'ease-in-out', fill:'forwards'});
    S.boing(); C.mood(cust, 'silly'); actorSay(el.customer, cust, ['NM88'], 1000); FX.burstAt(head, {kind:'hearts', ax:0.5, ay:0, count:4});
    await anim(head, [{transform:'rotate(0)'},{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'},{transform:'rotate(0)'}], 500);
    await wait(500); await anim(p, [{transform:`translate(${(to[0]-from[0]).toFixed(0)}px,${(to[1]-from[1]).toFixed(0)}px) rotate(450deg)`, opacity:1},{transform:`translate(${(to[0]-from[0]+w).toFixed(0)}px,${(to[1]-from[1]+w).toFixed(0)}px) rotate(520deg)`, opacity:0}], {duration:350, easing:'ease-in', fill:'forwards'}); p.remove();
    C.mood(cust, 'neutral'); } },
  /* ---- wrong answers: the machine is the silly one, never the child ---- */
  machineSneeze: { kind:'wrong', async run(){ await sneezeDigits(); } },
  digitHiccup: { kind:'wrong', async run(){ await hiccupDigits(); } },
  roboHmm: { kind:'wrong', async run(){
    const head = q1(robo, '.head'), aR = q1(robo, '.armR'); C.mood(robo, 'surprised'); actorSay(el.robo, robo, ['NM92'], 900);
    await Promise.all([anim(head, [{transform:'rotate(0)'},{transform:'rotate(-10deg) translateY(2px)'}], {duration:320, fill:'forwards'}), anim(aR, [{transform:'rotate(0)'},{transform:'rotate(-150deg)'}], {duration:360, fill:'forwards'})]);
    Object.values(sliderEls).forEach(s => { s.spring.vel -= 300; }); gearsTouch();
    await anim(aR, [{transform:'rotate(-150deg)'},{transform:'rotate(-140deg)'},{transform:'rotate(-152deg)'},{transform:'rotate(-140deg)'},{transform:'rotate(-150deg)'}], 520);
    await wait(200); settle(robo); C.mood(robo, 'neutral'); } },
  /* ---- idle: a little life while the child thinks ---- */
  gearSqueak: { kind:'idle', async run(){
    const s = Object.values(sliderEls)[0]; const g = s ? s.gear : q1(el.hopperSvg, '.gear'); S.squeakyTires();
    if(s){ s.spring.vel += 500; gearsTouch(); }
    C.mood(robo, 'sleepy'); actorSay(el.robo, robo, ['NM89'], 1200);
    await anim(q1(robo, '.armL'), [{transform:'rotate(0)'},{transform:'rotate(60deg)'},{transform:'rotate(50deg)'},{transform:'rotate(60deg)'},{transform:'rotate(0)'}], 900);
    S.ding(); if(g) FX.burstAt(g, {kind:'splash', count:6, ax:0.5, ay:0.5}); C.mood(robo, 'happy'); await wait(400); settle(robo); C.mood(robo, 'neutral'); } },
  customerPeek: { kind:'idle', async run(){
    if(!cust) return; const head = q1(cust, '.head'); C.look(cust, 1, 1); S.tone(520, 0.16, {type:'sine', gain:0.07, slide:780});
    await anim(head, [{transform:'rotate(0)'},{transform:'rotate(12deg) translate(6px,4px)'},{transform:'rotate(12deg) translate(6px,4px)'},{transform:'rotate(0)'}], {duration:1100, easing:'ease-in-out'});
    C.blink(cust); C.look(cust, 0, 0); } }
};
const RIGHT_POOL = ['rodRollsAway','customerCounts','hopperBurp','cubeBonksChef','numberConfetti','machineHiccup','roboLeverDance','chefJuggle','steamWhistle','customerHat'];
const IDLE_POOL = ['gearSqueak','customerPeek'];
function pickReaction(pool){ const c = pool.filter(n => n !== lastReaction); return pick(c.length ? c : pool); }
async function react(name, ctx = {}){
  const R = REACTIONS[name]; if(!R) return null;
  const q = Q, prev = q && q.reacting;   /* one reaction at a time: a new one queues behind the running one (so the idle gag never overlaps) */
  const entry = { name, kind:R.kind, situation: ctx.situation || R.kind, who: custInfo ? custInfo.name : null, at: Date.now(), ms: 0 };
  lastReaction = name; reactionLog.push(entry); if(reactionLog.length > 80) reactionLog.shift();
  const p = (async () => {
    if(prev) await prev.catch(() => {});
    const t0 = performance.now();
    try { await Promise.race([R.run(ctx), new Promise(r => setTimeout(r, 2900))]); } catch(e){ console.warn('reaction ' + name + ' stopped early:', e); /* a reaction is decoration, never a blocker */ }
    entry.ms = Math.round(performance.now() - t0);
  })();
  if(q) q.reacting = p;
  await p;
  if(q && q.reacting === p) q.reacting = null;
  return name;
}
/* idle life: after 7 s with no taps (before the 14 s nudge) one small idle gag per question */
let lastTap = performance.now();
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => { lastTap = performance.now(); }, {passive:true}));
setInterval(() => {
  if(!G || !Q || !Q.accepting || busy || Q.solved || Q.reacting || Q.idled || UI.overlayOpen()) return;
  if(performance.now() - lastTap < 7000) return;
  runIdle();
}, 1000);
function runIdle(){ if(!Q || Q.reacting) return null; Q.idled = true; const name = pickReaction(IDLE_POOL); react(name, {situation:'idle'}); return name; }

/* ---------- boot ---------- */
showTitle();

// hooks for automated testing
window.__game = {
  startLevel, submit, choose, setPlace:(p,d)=>setPlace(p,d,true), showTitle, showLevels,
  typeAnswer(str){ if(!pad) return; pad.reset(); String(str).replace(/[^\d]/g, '').split('').forEach(ch=>pad.key(ch)); pad.key('ok'); },
  words:(n,money)=>sayNum(n,money), numIds,
  levels: LEVELS.map(l=>l.title),
  react: (name, ctx) => react(name, ctx || {}), idle: runIdle, overheat: () => { if(!Q) return null; busy = true; const r = run; return overheat(r).then(() => { if(alive(r)) busy = false; return machineLog.slice(); }); },
  reactions: Object.keys(REACTIONS).map(k => ({ name:k, kind:REACTIONS[k].kind })), voiceLines: L,
  get state(){
    const overlay = UI.overlayOpen();
    const base = {overlay, sitting:UI.sitting, reactionLog: reactionLog.slice(), lastReaction, machineLog: machineLog.slice(), prevLog: G && G.prevLog ? G.prevLog.slice() : [], busy};
    if(!G || !Q) return Object.assign(base, {level:G?G.n:null, index:G?G.index:null, mode:null, accepting:false, solved:false});
    return Object.assign(base, {level:G.n, index:G.index, mode:Q.mode, input:Q.input, money:Q.money, expanded:Q.expanded, target:Q.target, targetText:fmtNum(Q.target,Q.money),
      placeNames:Q.places.slice(), places:Object.assign({},cur), targetPlaces:Object.fromEntries(Q.places.map(p=>[p,digitOf(Q.target,p)])),
      choices:Q.choices?Q.choices.slice():null, solved:Q.solved, accepting:Q.accepting, misses:Q.misses, reacting: !!Q.reacting, idled: !!Q.idled, customer:Q.customer.name,
      gears:Object.fromEntries(Object.keys(sliderEls).map(p => [p, +sliderEls[p].gear.dataset.angle || 0])), stats:Object.assign({},G.stats)});
  }
};
})();
