<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Feelings Faces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:44px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
/* Game-only styles. The engine (toot.css / toot.js) owns the top bar, stage grid, coach strip, cards, hint box, nudge and buttons. */
:root{--lav:#E9E1FF;--rose:#FFD6E0}
[hidden]{display:none!important}
#scene{background:linear-gradient(#DDF3FF 0 55%,#FBE9CC 55%)}
.chip .rdots{display:inline-flex;gap:3px}.chip .rdots i{width:10px;height:10px;border-radius:50%;background:rgba(59,42,31,.15);display:inline-block}.chip .rdots i.done{background:var(--mint)}

/* ---------- scene: diner ---------- */
.wall{position:absolute;inset:0 0 45% 0;background:repeating-linear-gradient(90deg,#E4F4FF 0 6cqw,#F2FAFF 6cqw 12cqw)}
.trim{position:absolute;left:0;right:0;top:54%;height:2%;background:var(--wood-dark)}
.floor{position:absolute;left:0;right:0;top:56%;bottom:0;background:repeating-conic-gradient(var(--floor-a) 0 25%,var(--floor-b) 0 50%) 0 0/10cqw 10cqw}
.window{position:absolute;left:6%;top:8%;width:20%;height:30%;background:linear-gradient(#9FDBFF,#DFF3FF);border:.8cqw solid #fff;border-radius:2cqw;box-shadow:0 .4cqw 0 rgba(59,42,31,.12)}
.window::before{content:"";position:absolute;right:10%;top:12%;width:4.5cqw;height:4.5cqw;border-radius:50%;background:var(--sun);box-shadow:0 0 2cqw rgba(255,200,61,.8)}
.diner-sign{position:absolute;left:50%;top:5%;transform:translateX(-50%);background:#fff;border-radius:1.2cqw;padding:.4cqw 2cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.2cqw,16px);white-space:nowrap;color:var(--ketchup);box-shadow:0 .4cqw 0 rgba(59,42,31,.12)}
.plant{position:absolute;right:4%;top:24%;width:9cqw;height:14cqw}
.plant i{position:absolute;left:50%;bottom:0;width:6cqw;height:5cqw;margin-left:-3cqw;background:#D2742E;border-radius:1cqw 1cqw 2cqw 2cqw;border:.5cqw solid var(--cocoa)}
.plant b{position:absolute;left:50%;bottom:4cqw;width:3cqw;height:9cqw;margin-left:-1.5cqw;background:var(--grass);border-radius:50% 50% 20% 20%;border:.5cqw solid var(--cocoa);transform-origin:50% 100%}
.plant b:nth-child(2){transform:rotate(-30deg)}.plant b:nth-child(3){transform:rotate(30deg)}
.layer{position:absolute;inset:0;display:none}
.layer.on{display:block}

/* ---------- the cast on stage ---------- */
.chars{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:5cqw;padding-bottom:3%}
.char{position:relative;width:24cqw;display:flex;flex-direction:column;align-items:center;transition:transform .3s;border-radius:16px}
.char .toot-char{width:100%;position:relative;z-index:2}
.char .tag{margin-top:.6cqw;background:#fff;border-radius:999px;padding:.3cqw 1.6cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.3cqw,16px);white-space:nowrap;box-shadow:0 .4cqw 0 rgba(59,42,31,.12);z-index:3}
.char.big{width:38cqw}
#lay-diner.story .char.big{width:30cqw}
#lay-diner.story .chars{padding-bottom:2%}
.char.pick{cursor:pointer}
.char.pick:active{transform:translateY(1cqw)}
.char.chosen .toot-char{transform:scale(1.1)}
.char.fade{opacity:.35}
.char.reveal{animation:nudge .55s 4}
.char .item{position:absolute;left:-4cqw;bottom:5cqw;font-size:6cqw;line-height:1;z-index:3;filter:drop-shadow(0 .4cqw 0 rgba(59,42,31,.15))}
.char.big .item{font-size:8cqw;left:-7cqw}
.toot-char .head,.toot-char .armL,.toot-char .armR,.toot-char .body,.toot-char .legs{transition:transform .35s}
/* body language per feeling (the face comes from Toot.cast.mood, the props are drawn into the head group) */
.char[data-feel=happy] .toot-char{animation:bob 1.1s infinite ease-in-out}
.char[data-feel=happy] .armL{transform:rotate(30deg)}.char[data-feel=happy] .armR{transform:rotate(-30deg)}
.char[data-feel=sad] .head{transform:rotate(-9deg) translateY(5px)}.char[data-feel=sad] .body{transform:scale(1.02,.94)}
.char[data-feel=sad] .armL{transform:rotate(-12deg) translateY(3px)}.char[data-feel=sad] .armR{transform:rotate(12deg) translateY(3px)}
.char[data-feel=sad] .prop-tear{animation:drip 1.6s infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(16px);opacity:0}}
.char[data-feel=angry] .armL{transform:rotate(-70deg) translate(6px,-4px)}.char[data-feel=angry] .armR{transform:rotate(70deg) translate(-6px,-4px)}
.char[data-feel=angry] .legs{animation:stomp .5s infinite alternate}
.char[data-feel=angry] .head{transform:translateY(3px)}
.char[data-feel=angry] .prop-cloud{animation:cloudbob 1.4s infinite ease-in-out}

/* applyFeel(castEl, key): mood + brows/lips tweaks + props + blush. The pose comes from the wrapper's data-feel (CSS). */
function applyFeel(cast, key){
  const f = FEEL[key]; settle(cast);
  $$('.prop', cast).forEach(p => p.remove());
  C.mood(cast, f.mood); C.blush(cast, !!f.blush);
  if(f.brows === 'sad'){ const bl = q1(cast, '.browL'), br = q1(cast, '.browR'); if(bl) bl.setAttribute('transform', 'translate(0 -6) rotate(-18 78 66)'); if(br) br.setAttribute('transform', 'translate(0 -6) rotate(18 122 66)'); }
  if(f.lips){ const lips = q1(cast, '.lips'); lips.setAttribute('d', f.lips); lips.setAttribute('fill', 'none'); }
  const head = q1(cast, '.head');
  f.props.forEach(p => PROPS[p] && PROPS[p](head));

}

  el.breathword.textContent = 'Lovely.';
  if(G.calm){ coachSay('FF62', 'robo'); el.btnBreathe.hidden = false; el.btnBreathe.textContent = 'Breathe again 🐲'; UI.nudge.clear(); return; }
  if(G.breaths < BREATHS){ coachSay('FF63', 'robo'); showNext('Next breath ▶'); }
  else { coachSay('FF64', 'robo'); showNext(); }
}
/* shake it out: the helper (and the dragon) wiggle everything loose; leave any time */
async function doShake(){
  if(!G || G.breathing || G.activity) return; const myRun = run; G.activity = 'shake';
  coachSay('FF65', 'robo'); S.ratchet(); C.mood(helper, 'silly');
  const aL = q1(helper, '.armL'), aR = q1(helper, '.armR'), legs = q1(helper, '.legs');
  const ms = T(2200);
  const p = [anim(helper, [{transform:'translateX(0) rotate(0)'},{transform:'translateX(-6px) rotate(-6deg)'},{transform:'translateX(6px) rotate(6deg)'},{transform:'translateX(0) rotate(0)'}], {duration:240, iterations:Math.max(1, Math.round(ms/240))}),
    anim(aL, [{transform:'rotate(0)'},{transform:'rotate(120deg)'},{transform:'rotate(40deg)'}], {duration:300, iterations:Math.max(1, Math.round(ms/300))}),
    anim(aR, [{transform:'rotate(0)'},{transform:'rotate(-120deg)'},{transform:'rotate(-40deg)'}], {duration:300, iterations:Math.max(1, Math.round(ms/300))}),
    anim(legs, [{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}], {duration:200, iterations:Math.max(1, Math.round(ms/200))}),
    anim(dragon.svg, [{transform:'rotate(0)'},{transform:'rotate(-2deg)'},{transform:'rotate(2deg)'},{transform:'rotate(0)'}], {duration:300, iterations:Math.max(1, Math.round(ms/300))})];
  for(let i = 0; i < 4; i++) setTimeout(() => { if(run === myRun) S.tone(300 + i*40, 0.08, {type:'square', gain:0.03}); }, i*ms/4);
  await Promise.all(p); if(run !== myRun) return;
  settle(helper); C.mood(helper, 'happy'); coachSay('FF66', 'robo'); FX.burstAt(helper, {kind:'stars', ax:0.5, ay:0.2, count:6});
  await waitReal(T(800)); if(run !== myRun) return; C.mood(helper, 'neutral'); G.activity = null;
}
/* big stretch: arms up, hold, and down soft */
async function doStretch(){
  if(!G || G.breathing || G.activity) return; const myRun = run; G.activity = 'stretch';
  coachSay('FF67', 'robo'); S.slideWhistle('up'); C.mood(helper, 'surprised');
  const aL = q1(helper, '.armL'), aR = q1(helper, '.armR'), body = q1(helper, '.body'), head = q1(helper, '.head');
  const up = T(1200), hold = T(1500), down = T(1000);
  await Promise.all([anim(aL, [{transform:'rotate(0)'},{transform:'rotate(160deg)'}], {duration:up, fill:'forwards', easing:'ease-in-out'}), anim(aR, [{transform:'rotate(0)'},{transform:'rotate(-160deg)'}], {duration:up, fill:'forwards', easing:'ease-in-out'}),
    anim(body, [{transform:'scale(1)'},{transform:'scale(.96,1.1)'}], {duration:up, fill:'forwards'}), anim(head, [{transform:'translateY(0)'},{transform:'translateY(-8px)'}], {duration:up, fill:'forwards'})]);
  if(run !== myRun) return; await waitReal(hold); if(run !== myRun) return;
  coachSay('FF68', 'robo'); S.slideWhistle('down'); C.mood(helper, 'sleepy');
  await Promise.all([anim(aL, [{transform:'rotate(160deg)'},{transform:'rotate(0)'}], {duration:down, fill:'forwards', easing:'ease-in-out'}), anim(aR, [{transform:'rotate(-160deg)'},{transform:'rotate(0)'}], {duration:down, fill:'forwards', easing:'ease-in-out'}),
    anim(body, [{transform:'scale(.96,1.1)'},{transform:'scale(1)'}], {duration:down, fill:'forwards'}), anim(head, [{transform:'translateY(-8px)'},{transform:'translateY(0)'}], {duration:down, fill:'forwards'})]);
  if(run !== myRun) return; settle(helper); C.mood(helper, 'happy'); chime(); await waitReal(T(600)); if(run !== myRun) return; C.mood(helper, 'neutral'); G.activity = null;
}

/* ---------- 5. same feeling, different faces ---------- */
function roundOdd(){
  const grp = pick(ODD_GROUPS.filter(g => g !== G.lastOdd)); G.lastOdd = grp; const [same, odd] = grp;
  const cs = shuffle(CAST).slice(0, 3); const oddIdx = rnd(0, 2);
  const variants = shuffle(VARIANTS[same] || [same]); let vi = 0;
  layer('lay-diner'); el.chars.innerHTML = '';
  cs.forEach((c, i) => { const key = i === oddIdx ? odd : (variants[vi++ % variants.length] || same); const d = charEl(c, key, {pick:true, key:first(c)}); d.dataset.feel = key; el.chars.appendChild(d); if(i === oddIdx) setActor(d); });
  const ans = first(cs[oddIdx]);
  G.q = {type:'odd', feel:odd, answer:ans, answers:[ans], wrong:0, solved:false, revealIds:['FF16', 'c_'+cs[oddIdx].id, '.', 'c_'+cs[oddIdx].id, 'FF8', 'w_'+odd, '.', 'FF6', 'c_'+cs[oddIdx].id, '.']};
  coachSay(['FF34', 'w_'+same, '.', 'FF35']);
  const charOf = name => q1(el.chars, `.char[data-key="${name}"]`);
  G.q.onChoose = (text, b) => handleChoice(text, b, text.toLowerCase() === ans.toLowerCase(),
    () => { cs.forEach(c => { const ch = charOf(first(c)); if(ch) ch.classList.toggle('fade', first(c) !== ans); }); const ch = charOf(ans); if(ch){ ch.classList.remove('reveal'); ch.classList.add('chosen'); }
      coachSay(['FF21', 'c_'+cs[oddIdx].id, 'FF8', 'w_'+odd, '.', 'FF36', 'w_'+same, ',', 'FF37']); hearts(G.actor); reactRight({c:cs[oddIdx]}); showNext(); },
    t => { const c = cs.find(x => first(x).toLowerCase() === t.toLowerCase()); return [c ? 'c_'+c.id : t, 'FF8', 'w_'+same, ',', 'FF38']; });
  const after = () => { if(G.q.wrong >= 2 && !G.q.solved){ const ch = charOf(ans); if(ch) ch.classList.add('reveal'); } };
  setChoices(cs.map(c => ({text:first(c), mini:miniHTML(c, null)})), (t, b) => { G.q.onChoose(t, b); after(); });
  el.chars.onclick = e => { const ch = e.target.closest('.char'); if(!ch || !G.q) return; UI.nudge.touch(); G.q.onChoose(ch.dataset.key, null); after(); };
  UI.nudge.set(() => $$('.char', el.chars), UI.coachLine);
}

/* ---------- 6. big feelings are OK ---------- */
function roundBig(){
  const c = pick(CAST); const b = pick(BIG.filter(x => x !== G.lastBig)); G.lastBig = b; const storyIds = fill(b.text, c), story = textOf(storyIds);
  layer('lay-diner'); el.layDiner.classList.add('story'); el.story.hidden = false; el.story.innerHTML = `${esc(story)}<span class="em">${b.em}</span>`;
  showChar(c, b.feel, {item:b.em});
  const helps = shuffle(HELPS).slice(0, 2); const unkind = textOf(b.unkind);
  const opts = shuffle([...helps.map(x => ({text:textOf(x.text), em:x.em})), {text:unkind, em:'🙃', silly:true}]);
  G.q = {type:'big', feel:b.feel, answer:textOf(helps[0].text), answers:helps.map(x => textOf(x.text)), wrong:0, solved:false, revealIds:['FF14', '“', helps[0].text, '”', '.', 'FF15']};
  coachSay(storyIds.concat(['FF39']));
  G.q.onChoose = (text, b2) => { const x = helps.find(y => textOf(y.text).toLowerCase() === text.toLowerCase());
    handleChoice(text, b2, !!x,
      async () => { const myRun = run; const doesIds = fill(x.does, c, {feel:b.feel});
        showChar(c, b.feel, {item:x.em, still:true}); coachSay(['c_'+c.id].concat(doesIds));
        const p = x.rx ? react(x.rx, {c, situation:'right', after:b.after}) : null;
        await wait(x.rx ? 1400 : 1800); if(run !== myRun) return;
        if(!p){ applyFeel(G.actor, b.after); G.actorBox.dataset.feel = b.after; }
        coachSay(['c_'+c.id].concat(doesIds, ['c_'+c.id, 'FF41'])); hearts(G.actor);
        if(p){ G.q.reacting = p.then(() => { if(run === myRun && G.actor){ applyFeel(G.actor, b.after); G.actorBox.dataset.feel = b.after; } G.q.reacting = null; }); }
        else reactRight({c, after:b.after});
        showNext(); },
      t => ['FF9', '“', t, '”', '?', 'FF40']); };
  setChoices(opts, G.q.onChoose);
  UI.nudge.set(() => [...el.choices.children], UI.coachLine);
}

/* ---------- 7. feelings can change ---------- */
function roundOrder(){
  const c = pick(CAST); const st = pick(STORIES.filter(s => s !== G.lastStory)); G.lastStory = st; const storyIds = fill(st.text, c), story = textOf(storyIds);
  const seq = st.seq, words = seq.map(feelWord);
  layer('lay-diner'); el.layDiner.classList.add('story', 'order'); el.story.hidden = false; el.story.textContent = story;
  showChar(c, null);
  el.oslots.hidden = false; el.oslots.innerHTML = seq.map((k, i) => `<div class="oslot" data-i="${i}"><span class="n">${i+1}</span></div>`).join('<span class="oarrow">→</span>');
  const slots = $$('.oslot', el.oslots);
  const ORD = ['FF44', 'FF45', 'FF46'];
  G.q = {type:'order', feel:seq[0], step:0, answer:words[0], answers:words.slice(), wrong:0, solved:false, hintC:c, hintFeel:seq[0]};
  coachSay(storyIds.concat(['FF42', 'c_'+c.id, 'FF43']));
  G.q.onChoose = (text, b) => {
    const q = G.q; if(q.solved) return; const i = q.step; const want = words[i];
    const btns = [...el.choices.children]; b = b || btns.find(x => x.dataset.text.toLowerCase() === String(text).toLowerCase());
    if(String(text).toLowerCase() === want.toLowerCase()){
      S.pop(); slots[i].classList.add('filled'); const mc = C.make(c.id, {autoBlink:false}); applyFeel(mc, seq[i]); slots[i].appendChild(mc);
      if(b){ b.classList.add('fade'); b.classList.remove('reveal'); } btns.forEach(x => x.classList.remove('reveal'));
      applyFeel(G.actor, seq[i]); G.actorBox.dataset.feel = seq[i]; clearHint();
      q.step++;
      if(q.step >= seq.length){ q.solved = true; markFirstTry(); S.ding(); roboHappy(); coachSay([].concat(...words.map((w, j) => [j ? 'FF45' : '', 'w_'+seq[j], j < words.length-1 ? ',' : '.']).map(a => a.filter(Boolean)), ['FF50'])); hearts(G.actor); reactRight({c, after:seq[2]}); showNext(); return; }
      q.answer = words[q.step]; q.feel = seq[q.step]; q.hintFeel = seq[q.step];
      coachSay([ORD[q.step], ',', 'FF47', 'c_'+c.id, 'FF43']); UI.nudge.set(() => btns.filter(x => !x.classList.contains('fade')), UI.coachLine); return;
    }
    q.wrong++; if(b) Toot.util.retrigger(b, 'hmm', 600);
    if(q.wrong === 1){ coachSay(['FF9', ORD[i], ',', 'c_'+c.id, 'FF48', 'w_'+seq[i], '.', 'FF49', 'w_'+seq[i], '?', FEEL[seq[i]].tip]); hint(`${textOf(ORD[i])}: ${want}`, c, seq[i]); reactHint(seq[i], {c}); return; }
    const target = btns.find(x => x.dataset.text === want); if(target) target.classList.add('reveal');
    coachSay([ORD[i], ',', 'c_'+c.id, 'FF48', 'w_'+seq[i], '.', 'FF6', 'w_'+seq[i], '.']); hmmSound(); UI.nudge.set(() => [target], UI.coachLine);
  };
  setChoices(shuffle(seq).map(k => choiceFor(c, k)), G.q.onChoose);
  UI.nudge.set(() => [...el.choices.children], UI.coachLine);
}

/* ---------- level complete / goodbye ---------- */
const kind = k => { refs.card.dataset.kind = k; };
function finishLevel(){
  const s = G.stats, stars = UI.stars(s.firstTry, s.questions), calmLevel = !!G.cfg.calm, n = G.n;
  G.done = true; run++; UI.nudge.clear();
  UI.unlock(n, stars);
  const msgId = calmLevel ? 'FF71' : stars === 3 ? 'FF72' : stars === 2 ? 'FF73' : 'FF74';
  const who = G.actorC ? G.actorC.id : 'bear';
  const r = UI.levelComplete({ n, stars, save:false, hero: calmLevel ? 'robo' : 'robo ' + who, title:`Level ${n} done!`, msg:L[msgId], speak:false, noStars:calmLevel, last: n >= LEVELS.length,
    fact: calmLevel ? '' : `<b>${s.firstTry}</b> of <b>${s.questions}</b> faces read first time`,
    onNext: () => startLevel(n+1), onReplay: () => startLevel(n), onLevels: showLevels, onDone: showTitle,
    goodbye: goodbyeOpts() });
  kind('complete');
  if(calmLevel){ chime(); const hero = q1(refs.card, '.hero .toot-char'); if(hero) C.mood(hero, 'sleepy'); }
  else { const hero = $$('.hero .toot-char', refs.card); hero.forEach(x => C.mood(x, 'happy')); }
  say(['FF69', 'n_'+n, 'FF70', msgId].concat(r.breakTime ? ['FF200', 'n_'+r.sitting, 'FF201', 'FF199'] : []));
  const done = $('#btn-done', refs.card); if(done) done.addEventListener('click', () => { run++; G = null; UI.nudge.clear(); kind('goodbye'); });
}
function goodbyeOpts(){ const idea = pick(IDEAS); return { hero:'robo', text:`The diner is quiet now. Stretch your arms, ${idea}. Robo will be here whenever you want to play.`, spoken:`${L.FF75} ${idea}. ${L.FF76}`, ids:['FF75', idea, 'FF76'] }; }
function showGoodbye(){ run++; G = null; UI.nudge.clear(); UI.goodbye(Object.assign({ onBack: showTitle }, goodbyeOpts())); kind('goodbye'); }

/* ---------- cards ---------- */
function showTitle(){
  run++; G = null; UI.nudge.clear();
  UI.title({ hero:'bear robo rabbit', title:'Feelings Faces', playLabel:'Play! 😀',
    blurb:'Read faces, spot body clues, find what helps, and breathe with a friendly dragon. Robo is still working out his own feelings.',
    fact:'Learn <b>Happy</b> · <b>Sad</b> · <b>Angry</b> · <b>Scared</b> · <b>Calm</b> and more',
    extra:'<button class="subbtn" id="btn-calm">Calm corner 🐲</button>',
    onPlay: () => startLevel(Math.min(UI.progress.data.unlocked || 1, LEVELS.length)), onLevels: showLevels, grownups: showGrownups });
  kind('title');
  const heroes = $$('.hero .toot-char', refs.card);
  if(heroes.length === 3){ applyFeel(heroes[0], 'happy'); applyFeel(heroes[2], 'sad'); const rh = heroes[1]; rh.id = 'robohero'; rh.setAttribute('role', 'button'); rh.tabIndex = 0; rh.setAttribute('aria-label', 'Tap Robo'); C.mood(rh, 'surprised');
    const beep = () => { S.ensure(); S.tone(880, 0.12, {type:'square', gain:0.05}); S.tone(1320, 0.12, {type:'square', gain:0.05, delay:0.15}); S.tone(220, 0.35, {type:'sawtooth', gain:0.08, slide:150, delay:0.4}); Toot.util.retrigger(rh, 'spin', 1800); const a = q1(rh, '.antenna'); if(a) anim(a, [{transform:'rotate(0)'},{transform:'rotate(360deg)'}], {duration:300, iterations:6}); anim(rh, [{transform:'rotate(0)'},{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'},{transform:'rotate(0)'}], {duration:300, iterations:3}); say('FF53'); };
    rh.addEventListener('click', beep); rh.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') beep(); }); }
  const calm = $('#btn-calm', refs.card); if(calm) calm.addEventListener('click', () => { S.ensure(); startCalm(); });
}
function showGrownups(){
  UI.grownups({ onBack: showTitle, html: `<b>What it teaches</b><ul>
      <li>Feelings words: happy, sad, angry, scared, tired, surprised, calm, silly, then proud, worried, shy and excited. Every feeling is shown on a drawn character with a face and body language (drooping shoulders, stomping feet, hiding behind hands).</li>
      <li>Level 1: naming a feeling from a face and a body cue.</li>
      <li>Level 2: guessing how someone feels from what happened, then choosing something kind that helps.</li>
      <li>Level 3: feelings live in the body (a fluttery tummy, a fast heart, tight fists).</li>
      <li>Level 4 and the Calm corner: Dragon Breathing, in for 4, hold for 2, out for 6, with a flower that opens as a gentle timer, plus “Shake it out” and a “Big stretch”. Nothing is timed against the child. The Calm corner is always open from the title, with no stars or score, and can be left at any moment.</li>
      <li>Level 5: the same feeling can look different on different faces.</li>
      <li>Level 6: big feelings are OK. Helpful things to do: take a breath, ask for a hug, say “I feel…”, get a drink of water, ask a grown-up. The character feels a bit better, never instantly fixed.</li>
      <li>Level 7: feelings change over time (sad, then calm, then happy). Level 8 mixes everything.</li></ul>
    <b class="sub">How it helps without nagging</b><ul>
      <li>Answers are never called wrong. First try: a kind clue (“Look at the eyebrows.”) and Robo points at the clue. Second try: the answer is shown to tap. Nobody fails.</li>
      <li>Right answers get a gentle reaction: a breath, a blanket, a hug from Robo, a tiny toot that makes a sad friend giggle. Feelings are never mocked.</li>
      <li>If your child stops for a while, the instruction is repeated and the thing to tap wiggles.</li></ul>` });
  kind('grownups');
}
function showLevels(){
  run++; G = null; UI.nudge.clear();
  UI.levels({ count: LEVELS.length, intro:'Finish one to open the next. Dragon Breathing is always open.', level: n => ({ title: LEVELS[n-1].title, tags: [LEVELS[n-1].em] }), onPick: startLevel, onBack: showTitle });
  kind('levels');
  LEVELS.forEach((c, i) => { if(!c.calm) return; const b = q1(refs.card, `.lv[data-n="${i+1}"]`); if(!b) return; const st = q1(b, '.lvstars'); if(st) st.textContent = 'Always open';
    if(b.classList.contains('locked')){ b.classList.remove('locked'); b.disabled = false; b.removeAttribute('aria-disabled'); b.addEventListener('click', () => startLevel(i+1)); } });
}

/* ---------- wiring ---------- */
el.story.addEventListener('click', () => V.say(UI.coachLine, {force:true}));
el.btnBreathe.addEventListener('click', () => { S.ensure(); doBreath(); });
$('#btn-shake').addEventListener('click', () => { S.ensure(); doShake(); });
$('#btn-stretch').addEventListener('click', () => { S.ensure(); doStretch(); });
$('#btn-calm-done').addEventListener('click', () => { say('FF52'); showTitle(); });
el.bodyout.addEventListener('click', e => { const p = e.target.closest('.part'); if(!p || !G || !G.q || G.q.type !== 'body' || !G.q.onTap) return; UI.nudge.touch(); G.q.onTap(p.dataset.part); });
el.chars.addEventListener('keydown', e => { const ch = e.target.closest('.char.pick'); if(ch && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); ch.click(); } });
function nextRoundFromButton(){ if(el.btnNext.hidden) return; el.btnNext.hidden = true; S.click(); nextRound(); }
el.btnNext.onclick = nextRoundFromButton;
// showNext always resets the default handler; rounds that need a different next step override it after calling showNext
const _showNext = showNext;
showNext = function(text){ el.btnNext.onclick = nextRoundFromButton; _showNext(text); };

/* ---------- boot ---------- */
function boot(data){ if(data && data.level && data.level <= (UI.progress.data.unlocked || 1)) startLevel(data.level); else showTitle(); }
try{ window.claude?.hot?.snapshot?.(() => ({level: G ? G.n : null})); }catch(e){}
if(window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});

/* ---------- debug hooks for automated testing ---------- */
window.__game = {
  startLevel, startCalm, showTitle, showLevels, levels: LEVELS, feelings: ALLF, feelMoods: MOOD_OF, voiceLines: L,
  reactions: Object.keys(REACTIONS).map(k => ({ name:k, kind:REACTIONS[k].kind })),
  react: (name, ctx) => react(name, ctx || {}),
  showFeeling(key, who){ run++; UI.hideOverlay(); if(!G) G = {n:0, cfg:LEVELS[0], round:0, total:0, stats:{questions:0, firstTry:0}, q:null, calm:false, breaths:0, breathing:false, done:false}; resetPanel(); layer('lay-diner'); const c = who ? CAST.find(x => x.id === who) : pick(CAST); showChar(c, key); G.q = {type:'demo', feel:key, answer:key, answers:[key], wrong:0, solved:false}; return c.id; },
  get state(){ if(!G) return { level:null, calm:false, type:null, reactionLog: reactionLog.slice(), lastReaction }; const q = G.q || {}; return {level:G.n, calm:G.calm, round:G.round, total:G.total, type:q.type||null, feel:q.feel||null, answer:q.answer||null, answers:q.answers||[], solved:!!q.solved, wrong:q.wrong||0, phase:q.phase||null, step:q.step, breaths:G.breaths, breathing:G.breathing, activity:G.activity, belly:dragon.scale, bellyPeak:G.bellyPeak||1, flowerPeak:G.flowerPeak||0, smokes:G.smokes||0, flower:flower.open, stats:Object.assign({}, G.stats), done:G.done, nextReady:!el.btnNext.hidden, reacting:!!q.reacting, actorMood: G.actor ? G.actor.dataset.mood : null, actorFeel: G.actor ? G.actor.dataset.feel : null, reactionLog: reactionLog.slice(), lastReaction}; },
  choose(text){ if(G && G.q && G.q.onChoose) G.q.onChoose(String(text), null); },
  tapBody(part){ if(G && G.q && G.q.onTap) G.q.onTap(part); },
  breathe(){ doBreath(); }, shake(){ return doShake(); }, stretch(){ return doStretch(); },
  next(){ if(!el.btnNext.hidden) el.btnNext.click(); },
  get fast(){ return fast; }, set fast(v){ fast = !!v; },
  get idleMs(){ return UI.nudge.delay; }, set idleMs(v){ UI.nudge.delay = v; },
  get sittingDone(){ return UI.sitting; }
};

})();
