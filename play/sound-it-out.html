<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sound It Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --cookie:#E9B36A; --cookie-dark:#B97B3F; --cookie-lit:#FFD98A; --grass:#8BD36F;
  --shadow: 0 6px 0 rgba(59,42,31,.16);
  --display: 'Fredoka','Nunito',system-ui,sans-serif;
  --body: 'Nunito','Fredoka',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card{user-select:none;-webkit-user-select:none}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid #2A7BFF;outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

#app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}

/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block;white-space:nowrap}
.logo .brand{font-size:.7rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.spacer{flex:1 1 10px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}

/* ---------- stage ---------- */
#stage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:14px;align-items:start}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(26vh*16/7));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 340px;gap:10px}}

#scene{position:relative;width:100%;aspect-ratio:16/7;container-type:inline-size;overflow:hidden;border-radius:24px;background:#FBE9CF;box-shadow:var(--shadow);user-select:none;-webkit-user-select:none}
.wall{position:absolute;inset:0 0 40% 0;background:repeating-linear-gradient(90deg,#FFE9BC 0 6cqw,#FFF2D6 6cqw 12cqw)}
.trim{position:absolute;left:0;right:0;top:58%;height:2.5%;background:var(--wood-dark)}
.floor{position:absolute;left:0;right:0;top:60%;bottom:0;background:repeating-conic-gradient(var(--floor-a) 0 25%,var(--floor-b) 0 50%) 0 0/8cqw 8cqw}
.shopsign{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:.5cqw 2.4cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.4cqw,18px);color:var(--ketchup);white-space:nowrap;box-shadow:0 .4cqw 0 rgba(59,42,31,.12);letter-spacing:.04em}
.oven{position:absolute;left:66%;top:16%;width:30%;height:40%;background:#5A3A2A;border-radius:2.5cqw;padding:1cqw;display:flex;flex-direction:column}
.oven .door{flex:1;background:#2B1A12;border-radius:1.5cqw;position:relative;overflow:hidden;border:.6cqw solid #8E6A4E}
.oven .door .heat{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 90%,rgba(255,140,40,.9),rgba(255,90,20,.3) 50%,transparent 75%);opacity:.5;transition:opacity .4s}
.oven.baking .door .heat{opacity:1;animation:flicker .3s infinite alternate}
@keyframes flicker{from{transform:scale(.97)}to{transform:scale(1.03)}}
.oven .door .tray{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);font-size:3.2cqw;letter-spacing:-.2em;line-height:1;white-space:nowrap}
.oven .knob{height:2.2cqw;display:flex;gap:1cqw;justify-content:center;margin-top:.8cqw}
.oven .knob i{width:2cqw;height:2cqw;border-radius:50%;background:var(--sun);display:block}
.counter{position:absolute;left:34%;top:50%;width:30%;height:14%;background:var(--wood);border-radius:1.5cqw 1.5cqw .5cqw .5cqw;box-shadow:0 .8cqw 0 var(--wood-dark)}
.counter .jar{position:absolute;left:8%;top:-70%;font-size:4cqw;line-height:1}
.counter .plate{position:absolute;right:6%;top:-40%;width:44%;height:60%;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 .6cqw #E9EEF3,0 .4cqw 0 rgba(59,42,31,.15);display:flex;align-items:center;justify-content:center;gap:.2cqw;font-family:var(--display);font-weight:700;font-size:2.4cqw;color:var(--cocoa)}
.counter .plate span{display:inline-grid;place-items:center;width:3cqw;height:3cqw;border-radius:50%;background:var(--cookie);box-shadow:inset 0 0 0 .3cqw var(--cookie-dark);transition:transform .3s,opacity .3s}
.counter .plate span.eaten{transform:scale(0);opacity:0;width:0}
.robot{position:absolute;left:69%;bottom:6%;width:12%;font-size:9cqw;line-height:1;text-align:center;z-index:4}
.robot .bot{display:inline-block;position:relative;filter:drop-shadow(0 .5cqw 0 rgba(59,42,31,.2))}
.robot.busy .bot{animation:bake .35s infinite alternate}
@keyframes bake{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-.6cqw) rotate(3deg)}}
.robot .steam{position:absolute;left:50%;top:-20%;font-size:.5em;opacity:0;pointer-events:none}
.robot .steam.go{animation:steam .9s forwards}
@keyframes steam{0%{opacity:.9;transform:translate(-50%,0) scale(.7)}100%{opacity:0;transform:translate(-30%,-2.5em) scale(1.4)}}

.customer{position:absolute;left:-18%;top:30%;width:16%;font-size:13cqw;line-height:1;text-align:center;transition:left 1.6s cubic-bezier(.4,.1,.5,1);z-index:5;will-change:left}
.customer .body{display:inline-block;filter:drop-shadow(0 .8cqw 0 rgba(59,42,31,.18))}
.customer.walking .body{animation:walk .32s infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-1.4cqw) rotate(3deg)}}
.customer.chomp .body{animation:chomp .22s infinite alternate}
@keyframes chomp{from{transform:scale(1,1)}to{transform:scale(1.08,.92) translateY(.6cqw)}}
.customer.happy .body{animation:happy .5s 2}
@keyframes happy{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) translateY(-1cqw)}75%{transform:rotate(8deg) translateY(-1cqw)}}
.customer.leaving{transition:left 2s linear}
.bubble{position:absolute;left:100%;bottom:80%;width:max-content;min-width:12cqw;max-width:40cqw;background:#fff;border-radius:2cqw;padding:1cqw 1.6cqw;font-size:clamp(11px,2.4cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.5em;display:block;line-height:1.1}
.spark{position:absolute;font-size:4cqw;line-height:1;animation:spark 1.4s cubic-bezier(.2,.8,.3,1) forwards;z-index:9;pointer-events:none}
@keyframes spark{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.crumb{position:absolute;width:1cqw;height:.8cqw;border-radius:40% 60% 50% 50%;background:#8A5A2B;box-shadow:inset 0 0 0 .2cqw #B8803F;z-index:3;animation:crumbfall .8s forwards}
@keyframes crumbfall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(6cqw);opacity:0}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* ---------- panel ---------- */
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:240px}
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:38px;height:38px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* letter cookies */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.tile{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F5C77E,var(--cookie) 60%,#D89A52);box-shadow:0 5px 0 var(--cookie-dark),inset 0 0 0 3px rgba(255,255,255,.25);font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1;color:var(--cocoa);position:relative;transition:transform .15s,box-shadow .15s,opacity .3s;display:grid;place-items:center;letter-spacing:-.02em}
.tile::before{content:"";position:absolute;left:22%;top:26%;width:11%;height:11%;border-radius:50%;background:#5A3A2A;box-shadow:24px 6px 0 -1px #5A3A2A,10px 24px 0 -1px #5A3A2A,30px 26px 0 -2px #5A3A2A;opacity:.35;pointer-events:none}
.tile.wide{width:auto;min-width:64px;padding:0 14px;border-radius:32px}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cookie-dark),inset 0 0 0 3px rgba(255,255,255,.25)}
.tile.lit{transform:scale(1.15);background:radial-gradient(circle at 35% 30%,#FFF1C4,var(--cookie-lit) 60%,#F3B65A);box-shadow:0 5px 0 var(--cookie-dark),0 0 0 5px rgba(47,191,166,.55),0 0 18px rgba(47,191,166,.8)}
.tile.glow{animation:glow 1s infinite;box-shadow:0 5px 0 var(--cookie-dark),0 0 0 5px rgba(47,191,166,.55)}
@keyframes glow{50%{transform:scale(1.08);box-shadow:0 5px 0 var(--cookie-dark),0 0 0 8px rgba(47,191,166,.3)}}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px) rotate(-6deg)}75%{transform:translateX(8px) rotate(6deg)}}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.3)}
.tile.silent{color:var(--cocoa-soft);opacity:.85}
.tile.silent::after{content:"shh";position:absolute;right:-4px;top:-6px;background:#fff;color:var(--cocoa-soft);font-size:.55rem;padding:1px 5px;border-radius:999px;box-shadow:0 2px 0 rgba(59,42,31,.12)}
.tilewrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.tilewrap .lbl{font-size:.8rem;font-weight:800;color:var(--cocoa-soft)}
.tiles .plus{font-family:var(--display);font-weight:700;color:var(--cocoa-soft);font-size:1.2rem}

/* blend & pick choices */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pic{background:#fff;border-radius:20px;padding:12px 6px;display:grid;place-items:center;font-size:3rem;line-height:1;box-shadow:0 5px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:88px;transition:transform .15s,opacity .3s}
.pic:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.pic.dim{opacity:.35;pointer-events:none}
.pic.nope{animation:nope .4s}
.pic.reveal{animation:glow 1s infinite;box-shadow:0 5px 0 rgba(59,42,31,.14),0 0 0 5px rgba(47,191,166,.55)}
.pic.win{background:#E4FBF5;box-shadow:0 5px 0 var(--mint-dark),0 0 0 3px var(--mint)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}

/* build the word */
.target{display:flex;align-items:center;justify-content:center;gap:14px}
.target .big{font-size:3.4rem;line-height:1;background:#fff;border-radius:20px;padding:8px 14px;box-shadow:0 4px 0 rgba(59,42,31,.12);cursor:pointer;min-height:44px;min-width:44px;display:grid;place-items:center}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot{width:56px;height:56px;border-radius:50%;border:3px dashed rgba(59,42,31,.3);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.7rem;background:rgba(255,226,154,.35);position:relative;color:var(--cocoa)}
.slot.wide{width:auto;min-width:56px;padding:0 10px;border-radius:28px}
.slot.filled{border-style:solid;border-color:var(--cookie-dark);background:radial-gradient(circle at 35% 30%,#F5C77E,var(--cookie) 60%,#D89A52);box-shadow:0 4px 0 var(--cookie-dark);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.slot.lit{transform:scale(1.15);background:radial-gradient(circle at 35% 30%,#FFF1C4,var(--cookie-lit) 60%,#F3B65A);box-shadow:0 4px 0 var(--cookie-dark),0 0 0 5px rgba(47,191,166,.55)}
.slot.next{border-color:var(--mint)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#FFF6E3;border-radius:18px;padding:10px;border:3px solid var(--wood)}

.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .eg{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .eg span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:.9rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}
#grownups{text-align:left;font-size:.95rem}#grownups li{margin-bottom:4px}

.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* ---------- compact layouts ---------- */
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.logo .brand{display:none}.chip{padding:4px 10px;font-size:.85rem}.iconbtn{width:40px;height:40px}}
@media (max-width:600px) and (orientation:portrait){#app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{width:min(100%,calc(22vh*16/7))}#panel{padding:10px;gap:8px;min-height:0}.coach{padding:7px 10px}.coach p{font-size:.95rem}.coach .face{font-size:1.4rem}.coach .say{width:34px;height:34px}.tile{width:56px;height:56px;font-size:1.6rem}.tile.wide{min-width:56px}.pic{min-height:76px;font-size:2.6rem;padding:8px 4px}.slot{width:50px;height:50px;font-size:1.5rem}.target .big{font-size:2.8rem}.tray{gap:8px;padding:8px}.wait{padding:6px 0}.wait .em{font-size:2rem}.subbtn{padding:8px 12px;font-size:.95rem}}
@media (orientation:landscape) and (max-height:560px){#app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.logo .brand{display:none}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:36px;height:36px;font-size:1.05rem}#scene{width:min(100%,calc((100vh - 60px)*16/7));margin-inline:auto}#panel{padding:8px;gap:6px;min-height:0;max-height:calc(100vh - 60px);overflow:auto}.view{gap:6px}.coach{padding:5px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:32px;height:32px}.tile{width:48px;height:48px;font-size:1.4rem}.tile.wide{min-width:48px;padding:0 10px}.tiles{gap:6px}.pic{min-height:64px;font-size:2.2rem;padding:6px 4px}.choices{gap:8px}.slot{width:46px;height:46px;font-size:1.4rem}.slot.wide{min-width:46px}.target{gap:10px}.target .big{font-size:2.3rem;padding:4px 10px}.tray{gap:6px;padding:6px}.wait{padding:4px 0}.wait .em{font-size:1.8rem}.subbtn{padding:6px 10px;font-size:.9rem;min-height:40px}.rowbtns{gap:6px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo"><span class="sign">Sound It Out</span><span class="brand">Toot Toot Learning</span></div>
    <div class="chip"><small>Level</small><span id="lvl-chip">1</span></div>
    <div class="chip"><small>Cookies</small><span id="served-chip">0</span><small>/ 6</small></div>
    <span class="spacer"></span>
    <button class="iconbtn" id="btn-sound" aria-label="Sound on or off" title="Sound">🔊</button>

/* split a word into letter-cookie tokens: {g: letters shown, key: sound-map key, sound, silent} */
function tokenize(word, magicE){
  const toks = [];
  let i = 0;
  while(i < word.length){
    const d = DIGRAPHS.find(x => word.startsWith(x, i));
    if(d){ toks.push({g:d, key:d}); i += d.length; } else { toks.push({g:word[i], key:word[i]}); i++; }
  }
  if(magicE && word.length >= 3 && word.endsWith('e')){
    const last = toks[toks.length-1];
    if(last.g === 'e' && toks.length >= 3 && 'aeiou'.includes(toks[toks.length-3].g) && !'aeiou'.includes(toks[toks.length-2].g)){
      const v = toks[toks.length-3]; v.key = v.g + '_e'; last.key = '_e'; last.silent = true;
    }
  }
  return toks.map(t => Object.assign(t, {sound: SOUNDS[t.key]}));
}

/* ---------- sound (all synthesized, no files) ---------- */
const Sound = (() => {
  let ctx = null, enabled = true;
  function ensure(){
    if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx = null; } }
    if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    return ctx;
  }
  function tone(freq, dur, o={}){
    const c = ensure(); if(!c || !enabled) return;
    const {type='sine', gain=0.2, slide=null, delay=0} = o;
    const t = c.currentTime + delay;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, t);
    if(slide) osc.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t+dur+0.05);
  }
  function noise(dur, o={}){
    const c = ensure(); if(!c || !enabled) return;
    const {gain=0.3, from=3000, to=200, delay=0} = o;
    const t = c.currentTime + delay;
    const len = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t+dur);
    const g = c.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  return {
    ensure, get enabled(){ return enabled; }, set enabled(v){ enabled = v; },
    pop(){ tone(600,0.08,{type:'triangle',gain:0.12,slide:900}); },
    ding(){ tone(1046,0.35,{gain:0.16}); tone(1568,0.5,{gain:0.1,delay:0.08}); },
    yay(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.18,{type:'triangle',gain:0.14,delay:i*0.09})); },
    oops(){ tone(330,0.18,{type:'triangle',gain:0.1}); tone(262,0.25,{type:'triangle',gain:0.1,delay:0.16}); },
    chomp(){ noise(0.09,{gain:0.1,from:1200,to:300}); tone(160+Math.random()*60,0.08,{type:'square',gain:0.04}); },
    steam(){ noise(0.4,{gain:0.06,from:5000,to:1500}); },
    fanfare(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.25,{type:'triangle',gain:0.16,delay:i*0.12})); tone(1568,0.7,{type:'triangle',gain:0.16,delay:0.62}); },
    fart(){
      const c = ensure(); if(!c || !enabled) return;
      const t = c.currentTime, dur = 0.22 + Math.random()*0.4, base = 55 + Math.random()*75;
      const o = c.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(base, t); o.frequency.exponentialRampToValueAtTime(base*0.55, t+dur);
      const lfo = c.createOscillator(); lfo.type='sine'; lfo.frequency.value = 16+Math.random()*22;
      const lg = c.createGain(); lg.gain.value = 20+Math.random()*30; lfo.connect(lg).connect(o.frequency);
      const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 360; f.Q.value = 7;
      const g = c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.4,t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(f).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t+dur+0.05); lfo.stop(t+dur+0.05);
    }

})();

/* ---------- read-aloud ---------- */
const Voice = (() => {
  let enabled = true, voice = null;
  const has = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  function pickVoice(){
    if(!has) return;
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/^en/i.test(v.lang) && /Google US|Samantha|Karen|Zira|Aria|Jenny|Female/i.test(v.name)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  }
  if(has){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function clean(text){
    let t = String(text);
    t = t.replace(/\bKA[- ]?BOOM\b/gi, 'kaboom').replace(/\bKa[- ]ching\b/gi, 'ka ching');
    const N = '(\\$?\\d+)';
    t = t.replace(new RegExp(N+'\\s*[×x]\\s*'+N,'g'), '$1 times $2').replace(/×/g, ' times ');
    t = t.replace(/÷/g, ' divided by ');
    t = t.replace(new RegExp(N+'\\s*\\+\\s*'+N,'g'), '$1 plus $2').replace(/\+/g, ' and ');
    t = t.replace(new RegExp(N+'\\s*[−–-]\\s*'+N,'g'), '$1 take away $2');
    t = t.replace(/−/g, ' take away ').replace(/[–—]/g, ' ').replace(/(\S)-(\S)/g, '$1 $2');
    t = t.replace(/\$(\d+)/g, '$1 dollars');
    t = t.replace(/=\s*\?/g, ' equals what?').replace(/=/g, ' equals ');
    t = t.replace(/[✓✔]/g, ' the green check ').replace(/→/g, ' to ').replace(/&/g, ' and ').replace(/[·•]/g, ', ').replace(/…/g, ', ');
    t = t.replace(/[\p{Extended_Pictographic}\p{Emoji_Presentation}\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}\u{1F1E6}-\u{1F1FF}\u{E0020}-\u{E007F}]/gu, ' ');
    t = t.replace(/[^\p{L}\p{N}\s.,!?'’:%]/gu, ' ');
    return t.replace(/\s+/g, ' ').replace(/\s([.,!?])/g, '$1').replace(/^[\s.,]+/, '').trim();
  }
  function speak(text, rate, pitch){
    if(!enabled || !has) return;
    try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(clean(text)); u.rate = rate; u.pitch = pitch; if(voice) u.voice = voice; speechSynthesis.speak(u); }catch(e){}
  }
  return {
    get enabled(){ return enabled; }, set enabled(v){ enabled = v; if(!v && has) speechSynthesis.cancel(); },
    clean,
    say(text){ speak(text, 0.9, 1.1); },
    /* a letter sound: a little slower and lower so "sss" and "mmm" stretch out */
    sound(text){ speak(text, 0.75, 1.0); },
    word(text){ speak(text, 0.8, 1.1); }
  };
})();

async function nextCustomer(myRun){
  el.oven.classList.remove('baking'); el.robot.classList.remove('busy');
  if(G.idx >= G.queue.length) return finishLevel();
  const w = G.queue[G.idx], cust = G.customers[G.idx % G.customers.length], mode = G.cfg.mix[G.idx % G.cfg.mix.length];
  G.q = {word:w.word, em:w.em, tokens:w.tokens, mode, attempts:0, wrong:0, solved:false, cust, filled:0, hint:0, choices:[], tray:[]};
  G.busy = true; show('v-wait'); el.waitText.textContent = `${cust.name} is coming…`; el.waitEm.textContent = cust.em;
  el.custBody.textContent = cust.em; el.customer.className = 'customer walking'; hideBubble();
  await wait(50); el.customer.style.left = '12%';
  await wait(1700); if(run!==myRun) return;
  el.customer.classList.remove('walking');

}

  container.innerHTML = '';
  tokens.forEach((t,i)=>{
    const b = document.createElement('button'); b.className = cls + (t.g.length>1?' wide':'') + (t.silent?' silent':''); b.textContent = tileLabel(t); b.dataset.i = i; b.dataset.g = t.g; b.setAttribute('aria-label', `letter ${t.g}`);
    container.appendChild(b);
  });
}
async function playBlend(tiles, tokens, ms, myRun){
  for(let i=0;i<tokens.length;i++){
    tiles.forEach(t=>t.classList.remove('lit')); tiles[i].classList.add('lit');
    if(!tokens[i].silent) sayTile(tokens[i]);
    await wait(tokens[i].silent ? ms*0.4 : ms); if(run!==myRun) return;
  }
  tiles.forEach(t=>t.classList.add('lit'));
  Voice.word(G.q.word);
  await wait(700); tiles.forEach(t=>t.classList.remove('lit'));
}
function makeChoices(w){
  const pool = shuffle(WORDS.filter(x => x.word!==w.word && x.em!==w.em));
  const same = pool.filter(x=>x.level===G.n), other = pool.filter(x=>x.level!==G.n);
  const ds = []; const seen = new Set([w.em]);
  for(const x of same.concat(other)){ if(ds.length>=2) break; if(seen.has(x.em) || x.word[0]===w.word[0] && ds.length && false) continue; seen.add(x.em); ds.push(x); }
  return shuffle([w, ds[0], ds[1]]);
}
async function askBlend(myRun){
  const q = G.q, w = WORDS.find(x=>x.word===q.word);
  show('v-blend'); el.choices.innerHTML = ''; setPlate(q.tokens);
  bubble(`<span class="big">🍪 ?</span>`, `${q.cust.name} says: I want a cookie word, please!`);
  renderTiles(el.tiles, q.tokens, 'tile');
  coach('Listen. The cookies say their sounds.', '🤖');
  await wait(1400); if(run!==myRun) return;
  await playBlend([...el.tiles.children], q.tokens, STEP, myRun); if(run!==myRun) return;
  q.choices = makeChoices(w);
  el.choices.innerHTML = q.choices.map(c=>`<button class="pic" data-word="${c.word}" aria-label="${c.word}">${c.em}</button>`).join('');
  G.busy = false;
  coach(`Which picture is ${q.word}? Tap it.`, '🤖');
  setNudge(()=>[...el.choices.querySelectorAll('.pic:not(.dim)')], `Which picture is ${q.word}?`);
}
async function chooseWord(word){
  const q = G.q; if(!q || q.mode!=='blend' || q.solved || G.busy) return false;
  const myRun = run; bump();
  const btn = el.choices.querySelector(`.pic[data-word="${word}"]`); if(!btn || btn.classList.contains('dim')) return false;
  if(word === q.word){
    q.solved = true; G.busy = true; btn.classList.add('win'); btn.classList.remove('reveal');
    el.choices.querySelectorAll('.pic').forEach(p=>{ if(p!==btn) p.classList.add('dim'); });
    return solved(myRun, q.attempts===0);
  }
  q.attempts++; q.wrong++; G.stats.wrong++; btn.classList.add('nope','dim'); Sound.oops();
  if(q.attempts === 1){
    G.busy = true; coach('Almost! Listen again.', '🤖');
    await wait(1300); if(run!==myRun) return true;
    await playBlend([...el.tiles.children], q.tokens, SLOW, myRun); if(run!==myRun) return true;
    q.hint = 1; const first = el.tiles.children[0]; first.classList.add('glow');
    G.busy = false;
    coach(`${q.word} starts with ${q.tokens[0].sound}. Which picture is ${q.word}?`, '🤖');
    setNudge(()=>[...el.choices.querySelectorAll('.pic:not(.dim)')], `Which picture is ${q.word}?`);
  } else {
    q.hint = 2; const right = el.choices.querySelector(`.pic[data-word="${q.word}"]`);
    el.choices.querySelectorAll('.pic').forEach(p=>{ if(p!==right) p.classList.add('dim'); });
    right.classList.add('reveal');
    coach(`This one is ${q.word}. Tap it!`, '🤖');
    setNudge(()=>[right], `This one is ${q.word}. Tap it!`);
  }
  return true;
}

/* ---------- (b) BUILD THE WORD ---------- */
function makeTray(tokens, n){
  const have = new Set(tokens.map(t=>t.g));
  let pool = PLAIN.filter(l => !have.has(l));
  if(n >= 6) pool = pool.concat(DIGRAPHS.filter(d => !have.has(d)).slice(0,6));
  pool = shuffle(pool);
  const size = tokens.length<=3 ? 5 : 6;
  const tray = tokens.map((t,i)=>({g:t.g, sound:t.sound, own:true, i}));
  while(tray.length < size && pool.length){ const g = pool.pop(); tray.push({g, sound:SOUNDS[g], own:false, i:tray.length}); }
  return shuffle(tray);
}
function nextTok(){ return G.q.tokens[G.q.filled]; }
function markNext(){
  const q = G.q; [...el.slots.children].forEach((s,i)=>s.classList.toggle('next', i===q.filled));
  el.tray.querySelectorAll('.tile').forEach(t=>t.classList.remove('glow'));
  if(q.hint >= 1 && nextTok()){ const t = [...el.tray.querySelectorAll('.tile:not(.gone)')].find(t=>t.dataset.g===nextTok().g); if(t) t.classList.add('glow'); }
}
async function askBuild(myRun){
  const q = G.q;
  show('v-build'); setPlate(null); el.targetPic.textContent = q.em;
  q.tray = makeTray(q.tokens, G.n);
  el.slots.innerHTML = q.tokens.map(t=>`<span class="slot${t.g.length>1?' wide':''}"></span>`).join('');
  el.tray.innerHTML = q.tray.map(t=>`<button class="tile${t.g.length>1?' wide':''}" data-g="${t.g}" data-i="${t.i}" aria-label="letter ${t.g}">${t.g}</button>`).join('');
  bubble(`<span class="big">${q.em}</span>`, `${q.cust.name} says: Please make me the word ${q.word}!`);
  await wait(1800); if(run!==myRun) return;
  G.busy = false; markNext();
  coach(`Build the word ${q.word}. Tap the cookies in order.`, '🤖');
  setNudge(()=>{ const n = nextTok(); return n ? [[...el.tray.querySelectorAll('.tile:not(.gone)')].find(t=>t.dataset.g===n.g)] : []; }, `Build the word ${q.word}. Tap the cookies in order.`);
}
async function tapTrayTile(btn){
  const q = G.q; if(!q || q.mode!=='build' || q.solved || G.busy || btn.classList.contains('gone')) return false;
  const myRun = run; bump();
  const g = btn.dataset.g, item = q.tray.find(t=>t.i===+btn.dataset.i);
  const n = nextTok();
  if(g === n.g){
    sayTile(n); Sound.pop();
    btn.classList.add('gone');
    const slot = el.slots.children[q.filled]; slot.textContent = n.g; slot.classList.add('filled'); if(n.silent) slot.classList.add('silent');
    q.filled++; markNext();
    if(q.filled === q.tokens.length){
      q.solved = true; G.busy = true; el.tray.querySelectorAll('.tile').forEach(t=>t.classList.remove('glow'));
      coach('All the cookies are in! Let’s read it.', '🤖');
      await wait(900); if(run!==myRun) return true;
      await playBlend([...el.slots.children], q.tokens, STEP, myRun); if(run!==myRun) return true;
      setPlate(q.tokens);
      return solved(myRun, q.wrong===0);
    }
    return true;
  }
  sayTile(item || {g}); q.wrong++; G.stats.wrong++;
  btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
  if(q.wrong === 1) coach(`Not that one. What comes next in ${q.word}?`, '🤖');
  if(q.wrong >= 2){ q.hint = 1; markNext(); coach(`The next cookie is glowing. Tap ${nextTok().sound}.`, '🤖'); }
  return true;
}

/* ---------- solved: customer eats the cookie word (short and silly, under 3 seconds) ---------- */
async function solved(myRun, firstTry){
  const q = G.q; G.stats.questions++; if(firstTry) G.stats.firstTry++;
  setNudge(null);
  const praise = pick(PRAISE).replace('{w}', q.word);
  Sound.yay(); coach(praise, '🤖'); toast(firstTry ? 'Yes!' : 'Got it!');
  sparks(45, 40, 6);
  await wait(900); if(run!==myRun) return true;
  el.customer.classList.add('chomp'); steam();
  const cookies = [...el.plate.children];
  for(const c of cookies){ Sound.chomp(); c.classList.add('eaten'); crumbs(18, 62, 2); await wait(220); if(run!==myRun) return true; }
  el.customer.classList.remove('chomp'); el.customer.classList.add('happy');
  bubble(`<span class="big">😋</span>`, pick(YUM));
  if(Math.random() < 0.3){ Sound.fart(); } else Sound.ding();
  G.served++; el.servedChip.textContent = G.served;
  await wait(1100); if(run!==myRun) return true;
  hideBubble(); el.customer.classList.remove('happy'); el.customer.classList.add('leaving'); el.customer.style.left = '110%';
  el.oven.classList.add('baking'); el.robot.classList.add('busy');
  show('v-wait'); el.waitText.textContent = pick(SILLY); el.waitEm.textContent = '🍪';
  await wait(1300); if(run!==myRun) return true;
  el.customer.classList.remove('leaving'); el.customer.style.left = '-18%';
  G.idx++; G.q = null;
  await wait(100); if(run!==myRun) return true;
  nextCustomer(myRun);
  return true;
}

/* ---------- level complete: stars from accuracy only; never auto-advances ---------- */
function finishLevel(){
  const s = G.stats; const rate = s.questions ? s.firstTry/s.questions : 1;
  const stars = rate >= 0.8 ? 3 : rate >= 0.5 ? 2 : 1;
  progress.unlocked = Math.max(progress.unlocked, Math.min(LEVELS.length, G.n+1));
  progress.stars[G.n] = Math.max(progress.stars[G.n]||0, stars); Save.save(progress);
  sittingLevels++;
  const n = G.n, hasNext = n < LEVELS.length;
  const msg = stars===3 ? 'You read almost every word on the first try. Super sounding out!' : stars===2 ? 'Good reading! Your ears are getting sharper every time.' : 'You finished the whole level! Every try makes you stronger.';
  Sound.fanfare();
  const starsHTML = `<div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'lit':''}" style="animation-delay:${i*0.25}s">⭐</span>`).join('')}</div>`;
  const fact = `<div class="fact">Fed <b>${G.served}</b> customers · <b>${s.firstTry}</b> of <b>${s.questions}</b> words right first time</div>`;
  const breakTime = sittingLevels >= 3;
  let html;
  if(breakTime){
    html = `<div class="hero">🍪🤖</div><h1>You’ve done ${sittingLevels} levels!</h1><h2>Time for a break?</h2>${starsHTML}<p>${msg}</p>${fact}
      <button class="bigbtn mint" id="btn-done">All done for today 👋</button>
      <div class="rowbtns">${hasNext?'<button class="subbtn" id="btn-next">Next level ▶</button>':''}<button class="subbtn" id="btn-replay">Play it again</button></div>`;
  } else {
    html = `<div class="hero">🍪🤖</div><h1>Level ${n} done!</h1><h2>The bakery is out of cookies.</h2>${starsHTML}<p>${msg}</p>${fact}
      ${hasNext?'<button class="bigbtn" id="btn-next">Next level ▶</button>':'<div class="fact">That was the last level. You read every kind of word!</div>'}
      <div class="rowbtns"><button class="subbtn" id="btn-replay">Play it again</button><button class="subbtn" id="btn-done">All done for today 👋</button></div>`;
  }
  cardKind = breakTime ? 'break' : 'complete'; showOverlay(html);
  Voice.say(breakTime ? `You’ve done ${sittingLevels} levels! Time for a break? ${msg}` : `Level ${n} done! ${msg}`);
  if(hasNext) $('#btn-next').addEventListener('click', ()=>startLevel(n+1));
  $('#btn-replay').addEventListener('click', ()=>startLevel(n));
  $('#btn-done').addEventListener('click', showGoodbye);
}
function showGoodbye(){
  run++; G = null; cardKind = 'goodbye';
  showOverlay(`<div class="hero">👋🍪</div><h2>Great reading today!</h2>
    <p>Stretch, drink some water, go find a word on a real sign. See you next time.</p>
    <div class="rowbtns"><button class="subbtn" id="btn-title">Back to start</button></div>`);
  Voice.say('Great reading today! Stretch, drink some water, go find a word on a real sign. See you next time.');
  $('#btn-title').addEventListener('click', showTitle);
}

/* ---------- overlays ---------- */
function showOverlay(html){ el.card.innerHTML = html; el.overlay.classList.add('on'); }
function hideOverlay(){ el.overlay.classList.remove('on'); cardKind = 'none'; }
function showTitle(){
  run++; G = null; cardKind = 'title';
  showOverlay(`<div class="hero">🍪🤖</div><h1>Sound It Out</h1>
    <p>Robo bakes letter cookies. Tap a cookie to hear its sound, blend the sounds into a word, and feed the hungry customers!</p>
    <div class="fact">Practise <b>letter sounds</b> · <b>blending</b> · <b>reading simple words</b></div>
    <button class="bigbtn" id="btn-play">Play! 🍪</button>
    <div class="rowbtns"><button class="subbtn" id="btn-choose">Choose a level</button><button class="subbtn" id="btn-grownups">For grown-ups</button></div>
    <p style="font-size:.85rem">Everything is read out loud. Tap any speech bubble or 🔊 to hear it again.</p>`);
  $('#btn-play').addEventListener('click', ()=>{ Sound.ensure(); startLevel(Math.min(progress.unlocked, LEVELS.length)); });
  $('#btn-choose').addEventListener('click', ()=>{ Sound.ensure(); showLevels(); });
  $('#btn-grownups').addEventListener('click', showGrownups);
}
function showGrownups(){
  cardKind = 'grownups';
  showOverlay(`<h2>For grown-ups</h2>
    <div class="fact" id="grownups"><b>What it teaches</b><ul style="margin:6px 0 0;padding-left:18px">
      <li>Letter <em>sounds</em> (not letter names): tap any cookie to hear it.</li>
      <li>Levels 1–4: short-vowel words (cat, pig, dog, then mixed).</li>
      <li>Level 5: consonant blends (frog, drum). Level 6: sh, ch, th, ck.</li>
      <li>Level 7: magic e (cake, bike). Level 8: vowel teams (rain, boat, tree).</li>
      <li>Two games: <b>Blend &amp; Pick</b> (hear the sounds, pick the picture) and <b>Build the Word</b> (see the picture, tap the letters in order).</li></ul>
    <b style="display:block;margin-top:10px">About the sounds</b><ul style="margin:6px 0 0;padding-left:18px">
      <li>Sounds are spoken by your device’s built-in voice from a sound-spelling map (“buh”, “sss”, “shh”), so they are approximations. Saying the pure sound alongside your child helps a lot.</li></ul>
    <b style="display:block;margin-top:10px">How it helps without nagging</b><ul style="margin:6px 0 0;padding-left:18px">
      <li>First miss: “Almost! Listen again”, a slower replay and a first-letter hint. Second miss: the answer is shown to tap. Nobody fails.</li>
      <li>If your child stops for a while, the instruction is repeated and the right thing to tap wiggles.</li></ul>
    <b style="display:block;margin-top:10px">Wholesome, not addictive</b><ul style="margin:6px 0 0;padding-left:18px">
      <li>No streaks, timers, countdowns, daily rewards, notifications or “come back tomorrow” nags.</li>
      <li>Levels never auto-advance. Every level-complete card has an “All done for today” button; after three levels in one sitting it becomes the big suggested button.</li>
      <li>Stars come only from accuracy (3 for 80% first-try, 2 for 50%). No random prizes, chests or collectibles.</li>
      <li>Celebrations are short and a little silly. Humour is gentle, never mean.</li>
      <li>No accounts, nothing leaves this device. Only stars and the sound/voice toggles are remembered. ⛶ makes it full screen on a tablet.</li></ul></div>
    <div class="rowbtns"><button class="subbtn" id="btn-back">Back</button></div>`);
  $('#btn-back').addEventListener('click', showTitle);
}
function showLevels(){
  run++; G = null; cardKind = 'levels';
  let cards=''; for(let n=1;n<=LEVELS.length;n++){
    const c = levelConfig(n), locked = n > progress.unlocked, st = progress.stars[n]||0;
    cards += `<button class="lv ${locked?'locked':''}" data-n="${n}" ${locked?'disabled aria-disabled="true"':''}><span class="num">Level ${n}</span><span class="ttl">${c.title}</span><span class="lvstars">${st?'⭐'.repeat(st):(locked?'':'Not played yet')}</span><span class="eg">${c.hint.split(' · ').map(w=>`<span>${w}</span>`).join('')}</span></button>`;
  }
  showOverlay(`<h2>Choose a level</h2><p>Each level has six hungry customers. Finish one to unlock the next!</p><div class="levels">${cards}</div><div class="rowbtns"><button class="subbtn" id="btn-title">Back</button></div>`);
  el.card.querySelectorAll('.lv:not(.locked)').forEach(b=>b.addEventListener('click', ()=>startLevel(+b.dataset.n)));
  $('#btn-title').addEventListener('click', showTitle);
}

/* ---------- wiring ---------- */
el.tiles.addEventListener('click', e=>{ const b = e.target.closest('.tile'); if(!b || !G || !G.q) return; bump(); const t = G.q.tokens[+b.dataset.i]; [...el.tiles.children].forEach(x=>x.classList.remove('lit')); b.classList.add('lit'); setTimeout(()=>b.classList.remove('lit'), 500); sayTile(t); });
el.choices.addEventListener('click', e=>{ const b = e.target.closest('.pic'); if(b) chooseWord(b.dataset.word); });
el.tray.addEventListener('click', e=>{ const b = e.target.closest('.tile'); if(b) tapTrayTile(b); });
el.targetPic.addEventListener('click', ()=>{ if(G && G.q){ bump(); Voice.word(G.q.word); } });
el.btnAgain.addEventListener('click', async ()=>{ if(!G || !G.q || G.busy || G.q.mode!=='blend') return; bump(); const myRun = run; G.busy = true; await playBlend([...el.tiles.children], G.q.tokens, STEP, myRun); if(run===myRun) G.busy = false; });
function applySettings(){ Sound.enabled = progress.sound !== false; Voice.enabled = progress.voice !== false; $('#btn-sound').classList.toggle('off', !Sound.enabled); $('#btn-sound').textContent = Sound.enabled?'🔊':'🔇'; $('#btn-voice').classList.toggle('off', !Voice.enabled); }
applySettings();
$('#btn-sound').addEventListener('click', ()=>{ progress.sound = !(progress.sound !== false); Save.save(progress); applySettings(); if(Sound.enabled){ Sound.ensure(); Sound.pop(); } });
$('#btn-voice').addEventListener('click', ()=>{ progress.voice = !(progress.voice !== false); Save.save(progress); applySettings(); if(Voice.enabled) Voice.say('Read aloud is on.'); });
const fsBtn = $('#btn-full');
if(document.documentElement.requestFullscreen){ fsBtn.addEventListener('click', ()=>{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }); document.addEventListener('fullscreenchange', ()=>{ fsBtn.textContent = document.fullscreenElement ? '🡼' : '⛶'; }); } else fsBtn.style.display='none';
el.bubble.addEventListener('pointerdown', e=>{ e.stopPropagation(); if(lastBubbleSpeech){ const was=Voice.enabled; Voice.enabled=true; Voice.say(lastBubbleSpeech); Voice.enabled=was; } });
$('#btn-home').addEventListener('click', showLevels);
$('#btn-say').addEventListener('click', ()=>{ const was = Voice.enabled; Voice.enabled = true; Voice.say(coachLine); Voice.enabled = was; });

/* ---------- boot ---------- */
showTitle();

/* ---------- debug hooks for automated testing ---------- */
window.__game = {
  startLevel,
  get state(){
    const q = G && G.q;
    return {
      level: G ? G.n : null, title: G ? G.cfg.title : null, customer: G ? G.idx : null, total: CUSTOMERS_PER_LEVEL, served: G ? G.served : 0,
      busy: G ? G.busy : false, mode: q ? q.mode : null, word: q ? q.word : null, em: q ? q.em : null, solved: q ? q.solved : null,
      attempts: q ? q.attempts : 0, wrong: q ? q.wrong : 0, hint: q ? q.hint : 0, filled: q ? q.filled : 0,
      choices: q ? q.choices.map(c=>c.word) : [], tray: q ? [...el.tray.querySelectorAll('.tile:not(.gone)')].map(t=>t.dataset.g) : [],
      tokens: q ? q.tokens.map(t=>t.g) : [], stats: G ? Object.assign({}, G.stats) : null,
      overlay: el.overlay.classList.contains('on'), card: cardKind, cardButtons: [...el.card.querySelectorAll('button')].map(b=>({id:b.id, text:b.textContent.trim(), cls:b.className})),
      sittingLevels, unlocked: progress.unlocked, stars: Object.assign({}, progress.stars), coach: coachLine
    };
  },
  /* both return true/false synchronously (the animations run on afterwards) */
  choose(text){ const q = G && G.q; if(!q || q.mode!=='blend' || q.solved || G.busy) return false; const c = q.choices.find(x=>x.word===text || x.em===text); if(!c) return false; chooseWord(c.word); return true; },
  tapLetter(ch){ const q = G && G.q; if(!q || q.mode!=='build' || q.solved || G.busy) return false; const t = [...el.tray.querySelectorAll('.tile:not(.gone)')].find(t=>t.dataset.g===ch); if(!t) return false; tapTrayTile(t); return true; },
  words: WORDS, sounds: SOUNDS, levels: LEVELS.map(l=>({n:l.n, title:l.title, count:l.list.length, words:l.list.map(w=>w.word)}))
};
})();
