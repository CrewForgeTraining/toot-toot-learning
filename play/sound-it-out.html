<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sound It Out</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style data-inlined="toot.css">
/* Toot Toot engine — shared styles. Pair with engine/toot.js. Games add their own scene/panel styles on top. */
:root{
  --cream:#FFF4DC; --butter:#FFE29A; --ketchup:#F4552F; --ketchup-dark:#C9391A;
  --mint:#2FBFA6; --mint-dark:#1E8F7B; --sky:#BDE8FF; --cocoa:#3B2A1F; --cocoa-soft:#6E5546;
  --wood:#E0A96D; --wood-dark:#B97B3F; --floor-a:#FBE3BF; --floor-b:#F3C89A; --white:#FFFDF8;
  --sun:#FFC83D; --grass:#8BD36F; --blush:#F98A7A; --focus:#2A7BFF;
  --shadow:0 6px 0 rgba(59,42,31,.16);
  --display:'Fredoka','Nunito',system-ui,sans-serif;
  --body:'Nunito','Fredoka',system-ui,sans-serif;
  --toot-speed:1;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
#topbar,#panel,#scene,.card,.toot-app{user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font-family:var(--display);color:var(--cocoa);cursor:pointer;border:0;background:none;font-size:1rem}
button:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}

/* ---------- layout shell: top bar + stage (scene + panel) ---------- */
.toot-app{max-width:1280px;margin:0 auto;padding-block:10px 20px;padding-inline:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}
#topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .spacer{flex:1}
.logo{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo .sign{background:var(--ketchup);color:#fff;padding:4px 12px;border-radius:14px;box-shadow:0 4px 0 var(--ketchup-dark);transform:rotate(-2deg);display:inline-block}
.chip{background:var(--white);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 rgba(59,42,31,.12);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--white);box-shadow:0 3px 0 rgba(59,42,31,.12);font-size:1.3rem;display:grid;place-items:center}
.iconbtn.off{opacity:.45;text-decoration:line-through}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.12)}
.meter{flex:1 1 160px;min-width:140px;display:flex;align-items:center;gap:10px}
.meter label{font-family:var(--display);font-weight:700;white-space:nowrap;font-size:.95rem}
.meter .bar{flex:1;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 0 0 3px rgba(59,42,31,.15);overflow:hidden;position:relative}
.meter .fill{height:100%;width:0%;background:linear-gradient(90deg,#5CC8FF,#FFB703 55%,#FF3B3B);border-radius:999px;transition:width .6s cubic-bezier(.2,.9,.3,1.3)}
.meter .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8rem;font-variant-numeric:tabular-nums}

#stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
#scene{position:relative;width:100%;aspect-ratio:16/9;container-type:inline-size;overflow:hidden;border-radius:24px;background:#F9E7C8;box-shadow:var(--shadow)}
#panel{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px;min-height:280px}
#views{display:contents}
.view{display:none;flex-direction:column;gap:12px}
.view.on{display:flex}
@media (max-width:900px) and (orientation:portrait){#stage{grid-template-columns:1fr}#scene{width:min(100%,calc(34vh*16/9));margin-inline:auto}}
@media (max-width:900px) and (orientation:landscape){#stage{grid-template-columns:minmax(0,1fr) 300px;gap:10px}}
@media (orientation:landscape) and (max-height:560px){
  .toot-app{padding-block:6px 8px;gap:6px}#topbar{gap:8px}.logo .sign{font-size:.95rem;padding:2px 10px}.chip{padding:2px 10px;font-size:.8rem}.iconbtn{width:44px;height:44px;font-size:1.1rem}.meter .bar{height:18px}
  #scene{width:min(100%,calc((100vh - 72px)*16/9));margin-inline:auto}#panel{padding:10px;gap:8px;min-height:0;max-height:calc(100vh - 72px);overflow:auto}
  .hint{padding:6px 10px}.key{height:44px;font-size:1.2rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}.bigbtn{padding:11px 14px;font-size:1.1rem}.coach{padding:6px 10px}.coach p{font-size:.88rem}.coach .face{font-size:1.3rem}.coach .say{width:44px;height:44px}.equation{font-size:1.5rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}
@media (max-width:600px){.logo .sign{font-size:1rem;padding:3px 10px}.chip{padding:4px 10px;font-size:.85rem}.meter label{font-size:.85rem}.iconbtn{width:44px;height:44px;font-size:1.15rem}}
@media (max-width:600px) and (orientation:portrait){
  .toot-app{padding-block:6px 10px;gap:8px}#topbar{gap:6px}#scene{aspect-ratio:16/10;width:min(100%,calc(36vh*1.6));margin-inline:auto}
  .toot-app.math #scene{width:min(100%,calc(22vh*1.6))}
  .hint{padding:6px 10px;font-size:.85rem}#panel{padding:10px;gap:8px;min-height:0}.key{height:46px;font-size:1.3rem;border-radius:12px}.pad-keys{gap:6px}.numpad{gap:6px}
  .bigbtn{padding:13px 14px;font-size:1.15rem}.coach{padding:7px 10px}.coach p{font-size:.92rem}.coach .face{font-size:1.4rem}.coach .say{width:44px;height:44px}.equation{font-size:1.6rem}.wait{padding:6px 0}.wait .em{font-size:2rem}
}

/* ---------- coach strip ---------- */
.coach{display:flex;align-items:flex-start;gap:10px;background:var(--butter);border-radius:16px;padding:10px 12px}
.coach .face{font-size:1.8rem;line-height:1;flex:none;display:flex;align-items:center}
.coach .face .toot-char{width:40px}
.coach p{margin:0;font-weight:800;font-size:1.05rem;flex:1;line-height:1.3}
.coach .say{width:44px;height:44px;border-radius:12px;background:#fff;font-size:1.1rem;flex:none}

/* ---------- speech bubble (on any positioned host) ---------- */
.bubble{position:absolute;left:105%;bottom:88%;width:max-content;min-width:14cqw;max-width:38cqw;background:#fff;border-radius:2cqw;padding:1.2cqw 1.6cqw;font-size:clamp(11px,2.3cqw,20px);font-weight:800;line-height:1.25;box-shadow:0 .5cqw 0 rgba(59,42,31,.12);opacity:0;transform:scale(.6);transform-origin:0 100%;transition:opacity .25s,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:normal;text-align:left;pointer-events:auto;cursor:pointer;z-index:6;color:var(--cocoa)}
.bubble.show{opacity:1;transform:scale(1)}
.bubble::after{content:"";position:absolute;left:-1.2cqw;bottom:1.4cqw;border:1.4cqw solid transparent;border-right-color:#fff;border-left:0}
.bubble .big{font-size:1.6em;line-height:1.15;display:block;margin-top:.2em}
.bubble.left{left:auto;right:105%;transform-origin:100% 100%}
.bubble.left::after{left:auto;right:-1.2cqw;border-right:0;border-left:1.4cqw solid #fff}
.toot-actor{position:absolute;line-height:0}
.toot-actor .bubble{min-width:60px;max-width:160px;border-radius:12px;padding:6px 10px;font-size:clamp(11px,2.3cqw,16px)}
.toot-actor .bubble::after{left:-8px;bottom:8px;border-width:8px}

/* ---------- buttons, chips, toast, cards ---------- */
.bigbtn{width:100%;padding:16px 18px;border-radius:20px;background:var(--ketchup);color:#fff;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 var(--ketchup-dark);letter-spacing:.01em}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ketchup-dark)}
.bigbtn.mint{background:var(--mint);box-shadow:0 6px 0 var(--mint-dark)}
.bigbtn.mint:active{box-shadow:0 2px 0 var(--mint-dark)}
.subbtn{padding:10px 14px;border-radius:14px;background:#fff;font-weight:700;box-shadow:0 3px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);font-size:1rem;min-height:44px}
.subbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.subbtn.on{background:var(--butter)}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:#fff;border-radius:18px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 4px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:72px;transition:transform .15s;font-family:var(--display);font-weight:700}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.tile.nope{animation:nope .4s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wait{text-align:center;font-weight:800;color:var(--cocoa-soft);padding:14px 0;font-size:1.05rem}
.wait .em{display:block;font-size:2.6rem;margin-bottom:6px;animation:bob 1.2s infinite ease-in-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1cqw)}}
.toast{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.5);font-family:var(--display);font-weight:700;font-size:clamp(20px,6cqw,56px);color:#fff;-webkit-text-stroke:.35cqw var(--ketchup-dark);paint-order:stroke fill;text-shadow:0 .6cqw 0 var(--ketchup-dark);opacity:0;animation:toast 1.5s forwards;pointer-events:none;z-index:30;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.fact{background:#fff;border-radius:16px;padding:10px 14px;font-weight:800;color:var(--cocoa)}
.fact b{color:var(--ketchup)}

/* ---------- questions: equation, hint, number pad ---------- */
.equation{text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.equation .q{display:inline-grid;place-items:center;min-width:1.4em;height:1.4em;border-radius:.4em;background:var(--butter);color:var(--ketchup-dark);padding:0 .2em}
.equation .q.reveal{background:#E4FBF5;color:var(--mint-dark);animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hint{display:none;background:#F3FBFF;border-radius:14px;padding:10px 12px;font-weight:800;font-size:.95rem;line-height:1.4}
.hint.on{display:block}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0}
.hrow .hn{font-family:var(--display);font-weight:700;font-size:1.2rem;min-width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.dots{display:inline-flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--sun);box-shadow:inset 0 0 0 2px #D89A00;display:inline-block}
.dots b{width:14px;height:44px;border-radius:5px;background:#5CC8FF;box-shadow:inset 0 0 0 2px #2A7BFF;display:inline-block}
.numpad{display:flex;flex-direction:column;gap:8px}
.numpad.disabled{opacity:.5;pointer-events:none}
.pad-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.key.ok{grid-row:3/5;grid-column:4;height:auto}.key.zero{grid-column:1/4}.key.hintk{background:#FFF6D6}
.key{height:56px;border-radius:16px;background:#fff;font-size:1.5rem;font-weight:700;box-shadow:0 4px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06);font-variant-numeric:tabular-nums}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.16),0 0 0 2px rgba(59,42,31,.06)}
.key.ok{background:var(--mint);color:#fff;box-shadow:0 4px 0 var(--mint-dark)}
.key.del{background:#FFE7E0;color:var(--ketchup-dark)}
.key.ok.ready{animation:okpulse 1s infinite}
@keyframes okpulse{50%{transform:scale(1.06);box-shadow:0 4px 0 var(--mint-dark),0 0 0 6px rgba(47,191,166,.35)}}

/* ---------- overlays ---------- */
#overlay{position:fixed;inset:0;background:rgba(59,42,31,.55);display:none;place-items:center;padding:16px;z-index:100;overflow:auto}
#overlay.on{display:grid}
.card{background:var(--cream);border-radius:28px;padding:24px 22px;max-width:640px;width:100%;box-shadow:0 10px 0 rgba(59,42,31,.25);text-align:center;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto;color:var(--cocoa)}
.card h1{font-size:clamp(2rem,7vw,3.4rem);color:var(--ketchup);text-shadow:0 4px 0 #fff;font-weight:700;letter-spacing:.01em}
.card h2{font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700}
.card p{margin:0;font-weight:700;font-size:1.05rem;color:var(--cocoa-soft);max-width:48ch;margin-inline:auto}
.card p.tiny{font-size:.85rem}
.card .hero{font-size:clamp(3rem,12vw,5.5rem);line-height:1;letter-spacing:-.1em}
.card .hero.cast-hero{display:flex;justify-content:center;gap:4px;letter-spacing:0}
.card .hero.cast-hero .toot-char{width:clamp(64px,18vw,110px)}
.card .stars{font-size:clamp(2.2rem,8vw,3.5rem);letter-spacing:.05em}
.card .stars span{display:inline-block;opacity:.25}
.card .stars span.lit{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;text-align:left}
.lv{background:#fff;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 rgba(59,42,31,.14);text-align:left;position:relative;min-height:104px}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,31,.14)}
.lv .num{font-family:var(--display);font-weight:700;font-size:.8rem;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.1em}
.lv .ttl{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1}
.lv .ops{display:flex;gap:4px;margin-top:auto;flex-wrap:wrap}
.lv .ops span{font-family:var(--display);font-weight:700;background:var(--butter);border-radius:8px;padding:1px 8px;font-size:1rem}
.lv .lvstars{font-size:.9rem;letter-spacing:.05em}
.lv.locked{opacity:.55;cursor:not-allowed}
.lv.locked::after{content:"🔒";position:absolute;right:10px;top:10px;font-size:1.2rem}
.grownups{text-align:left;font-size:.95rem}.grownups ul{margin:6px 0 0;padding-left:18px}.grownups li{margin-bottom:4px}.grownups b.sub{display:block;margin-top:10px}

/* ---------- nudge, pulse, shake ---------- */
.nudge{animation:nudge .55s 4 !important;outline:4px solid var(--mint);outline-offset:3px;border-radius:16px}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}
.hand{position:absolute;font-size:5cqw;line-height:1;animation:tap 1s infinite;pointer-events:none}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,1.2cqw)}}

/* ---------- slow motion + reduced motion ---------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .nudge{outline-width:5px}
}

</style>
<style>
/* Game-only styles. The engine (toot.css / toot.js) owns the top bar, stage grid, coach strip, cards, buttons, nudge and reduced motion. */
:root{--cookie:#E9B36A;--cookie-dark:#B97B3F;--cookie-lit:#FFD98A;--glass:rgba(189,232,255,.55)}

/* ---------- scene: the Letter Cookie Bakery ---------- */
#scene{background:#FBE9CF}
.wall{position:absolute;inset:0 0 40% 0;background:repeating-linear-gradient(90deg,#FFE9BC 0 6cqw,#FFF2D6 6cqw 12cqw)}
.trim{position:absolute;left:0;right:0;top:58%;height:2.5%;background:var(--wood-dark)}
.floor{position:absolute;left:0;right:0;top:60%;bottom:0;background:repeating-conic-gradient(var(--floor-a) 0 25%,var(--floor-b) 0 50%) 0 0/8cqw 8cqw}
.shopsign{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:.5cqw 2.4cqw;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.4cqw,18px);color:var(--ketchup);white-space:nowrap;box-shadow:0 .4cqw 0 rgba(59,42,31,.12);letter-spacing:.04em;display:flex;align-items:center;gap:.8cqw;z-index:2}
.shopsign .cookie{width:3cqw;height:3cqw}
.oven{position:absolute;left:64%;top:13%;width:28%;height:40%;background:#5A3A2A;border-radius:2.5cqw;padding:1cqw;display:flex;flex-direction:column;z-index:1}
.oven .door{flex:1;background:#2B1A12;border-radius:1.5cqw;position:relative;overflow:hidden;border:.6cqw solid #8E6A4E}
.oven .door .heat{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 90%,rgba(255,140,40,.9),rgba(255,90,20,.3) 50%,transparent 75%);opacity:.5;transition:opacity .4s}
.oven.baking .door .heat{opacity:1;animation:flicker .3s infinite alternate}
@keyframes flicker{from{transform:scale(.97)}to{transform:scale(1.03)}}
.oven .door .rack{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);display:flex;gap:.4cqw}
.oven .door .rack .cookie{width:3.4cqw;height:3.4cqw}
.oven .knob{height:2.2cqw;display:flex;gap:1cqw;justify-content:center;margin-top:.8cqw}
.oven .knob i{width:2cqw;height:2cqw;border-radius:50%;background:var(--sun);display:block;border:.35cqw solid var(--cocoa)}
.counter{position:absolute;left:30%;top:54%;width:32%;height:12%;background:var(--wood);border-radius:1.5cqw 1.5cqw .5cqw .5cqw;box-shadow:0 .8cqw 0 var(--wood-dark);z-index:2}
.counter .jar{position:absolute;left:3%;bottom:70%;width:20%;line-height:0}
.counter .jar svg{width:100%;height:auto;overflow:visible}
.counter .jar .lid{transform-box:fill-box;transform-origin:50% 100%}
.counter .plate{position:absolute;right:5%;bottom:60%;width:60%;height:5cqw;background:#fff;border-radius:50%;box-shadow:inset 0 0 0 .6cqw #E9EEF3,0 .4cqw 0 rgba(59,42,31,.15);display:flex;align-items:center;justify-content:center;gap:.9cqw}
.counter .plate .pc{width:3.6cqw;height:3.6cqw;line-height:0;transition:transform .3s,opacity .3s}
.counter .plate .pc.w{width:5.2cqw}
.counter .plate .pc.eaten{transform:scale(0)!important;opacity:0}
.toot-actor .toot-char{width:100%}
.robo{left:65%;top:44%;width:11%;z-index:4}
.robo.busy .toot-char{animation:bake .35s infinite alternate}
@keyframes bake{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-.6cqw) rotate(3deg)}}
.customer{left:-18%;top:30%;width:15%;transition:left 1.6s cubic-bezier(.4,.1,.5,1);z-index:5;will-change:left}
.customer .who{position:relative;width:100%;z-index:2}
.customer.walking .who .toot-char{animation:walk .32s infinite alternate}
.customer.walking.hop .who .toot-char{animation:hop .42s infinite}
.customer.walking.waddle .who .toot-char{animation:waddle .36s infinite alternate}
.customer.walking.bounce .who .toot-char{animation:bounce .26s infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-1.4cqw) rotate(3deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-3cqw) scale(.95,1.08)}70%{transform:translateY(-1cqw) scale(1,1)}}
@keyframes waddle{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes bounce{from{transform:translateY(0) scale(1.04,.96)}to{transform:translateY(-2cqw) scale(.98,1.04)}}
.customer.chomp .who .toot-char{animation:chomp .22s infinite alternate}
@keyframes chomp{from{transform:scale(1,1)}to{transform:scale(1.08,.92) translateY(.6cqw)}}
.customer.leaving{transition:left 2s linear}
.customer .bubble{left:80%;bottom:92%;transform-origin:0 100%;text-align:center;min-width:12cqw;max-width:30cqw}
.customer .bubble .big{display:flex;align-items:center;justify-content:center;gap:.4em}
.customer .bubble .cookie{width:1.4em;height:1.4em;vertical-align:middle}
.prop{position:absolute;line-height:0;z-index:7;pointer-events:none}
.prop .cookie{width:100%;height:100%}
#fx{position:absolute;inset:0;pointer-events:none;z-index:7}

/* ---------- cookies (SVG) ---------- */
.cookie{display:block;overflow:visible}
.cookie .body{fill:var(--cookie);stroke:var(--cookie-dark);stroke-width:5}
.cookie .icing{font-family:var(--display);font-weight:700;fill:#fff;stroke:var(--cocoa);stroke-width:6;stroke-linejoin:round;paint-order:stroke fill}
.jar .lid rect{fill:var(--cookie-dark)}

/* ---------- panel ---------- */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;position:relative}
.tile.cookie-btn{width:64px;height:64px;min-height:0;padding:0;border-radius:50%;background:none;box-shadow:none;display:grid;place-items:center;position:relative;transition:transform .15s,opacity .3s,box-shadow .15s}
.tile.cookie-btn .cookie{width:100%;height:100%}
.tile.cookie-btn.wide{width:auto;min-width:64px;aspect-ratio:1.5;border-radius:32px}
.tile.cookie-btn:active{transform:translateY(3px);box-shadow:none}
.tile.cookie-btn.lit{transform:scale(1.15);box-shadow:0 0 0 5px rgba(47,191,166,.55),0 0 18px rgba(47,191,166,.8)}
.tile.cookie-btn.lit .cookie .body,.slot.lit .cookie .body{fill:var(--cookie-lit)}
.tile.cookie-btn.glow{animation:glow 1s infinite;box-shadow:0 0 0 5px rgba(47,191,166,.55)}
@keyframes glow{50%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(47,191,166,.3)}}
.tile.cookie-btn.gone{opacity:0;pointer-events:none;transform:scale(.3)}
.tile.cookie-btn.silent{opacity:.85}
.tile.cookie-btn.silent::after,.slot.silent::after{content:"shh";position:absolute;right:-4px;top:-6px;background:#fff;color:var(--cocoa-soft);font-size:.55rem;font-weight:800;padding:1px 5px;border-radius:999px;box-shadow:0 2px 0 rgba(59,42,31,.12)}
.tile.cookie-btn.flying{z-index:5;pointer-events:none}

.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pic{background:#fff;border-radius:20px;padding:12px 6px;display:grid;place-items:center;font-size:3rem;line-height:1;box-shadow:0 5px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06);min-height:88px;transition:transform .15s,opacity .3s}
.pic:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(59,42,31,.14),0 0 0 2px rgba(59,42,31,.06)}
.pic.dim{opacity:.35;pointer-events:none}
.pic.nope{animation:nope .4s}
.pic.reveal{animation:glow 1s infinite;box-shadow:0 5px 0 rgba(59,42,31,.14),0 0 0 5px rgba(47,191,166,.55)}
.pic.win{background:#E4FBF5;box-shadow:0 5px 0 var(--mint-dark),0 0 0 3px var(--mint)}

.target{display:flex;align-items:center;justify-content:center;gap:14px}
.target .big{font-size:3.4rem;line-height:1;background:#fff;border-radius:20px;padding:8px 14px;box-shadow:0 4px 0 rgba(59,42,31,.12);cursor:pointer;min-height:44px;min-width:44px;display:grid;place-items:center}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;position:relative}
.slot{width:56px;height:56px;border-radius:50%;border:3px dashed rgba(59,42,31,.3);display:grid;place-items:center;background:rgba(255,226,154,.35);position:relative;color:var(--cocoa)}
.slot.wide{width:auto;min-width:56px;aspect-ratio:1.5;border-radius:28px}
.slot .cookie{width:100%;height:100%;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.2,1.6,.4,1)}
.slot.filled{border-style:solid;border-color:var(--cookie-dark)}
.slot.landed .cookie{opacity:1;transform:scale(1.06)}
.slot.lit{transform:scale(1.15);box-shadow:0 0 0 5px rgba(47,191,166,.55)}
.slot.next{border-color:var(--mint)}
.crumbdom{position:absolute;width:7px;height:5px;border-radius:40% 60% 50% 50%;background:#8A5A2B;box-shadow:inset 0 0 0 1px #B8803F;pointer-events:none;animation:crumbfall .7s forwards}
@keyframes crumbfall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#FFF6E3;border-radius:18px;padding:10px;border:3px solid var(--wood)}
.wait .em .toot-char{width:56px;margin-inline:auto}
.wait .em .cookie{width:44px;height:44px;margin-inline:auto}

/* split a word into letter-cookie tokens: {g: letters shown, key: sound-map key, sound, silent} */
function tokenize(word, magicE){
  const toks = [];
  let i = 0;
  while(i < word.length){
    const d = DIGRAPHS.find(x => word.startsWith(x, i));
    if(d){ toks.push({g:d, key:d}); i += d.length; } else { toks.push({g:word[i], key:word[i]}); i++; }
  }
  if(magicE && word.length >= 3 && word.endsWith('e')){
    const last = toks[toks.length-1];
    if(last.g === 'e' && toks.length >= 3 && 'aeiou'.includes(toks[toks.length-3].g) && !'aeiou'.includes(toks[toks.length-2].g)){
      const v = toks[toks.length-3]; v.key = v.g + '_e'; last.key = '_e'; last.silent = true;
    }
  }
  return toks.map(t => Object.assign(t, {sound: SOUNDS[t.key]}));
}

/* phrase(parts) → {text, ids}: a part is an L id, a [text, id] pair, or plain text (then there are no ids and the browser voice reads the whole line) */
function phrase(...parts){
  const text = [], ids = []; let ok = true;
  for(const p of parts){
    if(Array.isArray(p)){ text.push(p[0]); ids.push(p[1]); }
    else if(L[p]){ text.push(L[p]); ids.push(p); }
    else { text.push(String(p)); ok = false; }
  }
  return { text: text.join(' ').replace(/\s+([.,!?])/g, '$1'), ids: ok ? ids : null };
}

const POOLS = { right:['happyDance','eyesHearts','bellyBalloon','crumbCheeks','cookieRoll','jarLidPop'], wrong:['headScratch','hmmShrug','soundsOut'], idle:['sneezeCrumbs','roboSneeze'], exit:['tootExit','hopExit'] };
const bags = {};
function pickReaction(kind){
  let bag = bags[kind]; if(!bag || !bag.length) bag = bags[kind] = shuffle(POOLS[kind]);
  if(bag[0] === lastReaction){
    if(bag.length > 1) bag.push(bag.shift());
    else { bags[kind] = shuffle(POOLS[kind]); return pick(POOLS[kind].filter(n => n !== lastReaction)); }   // the last one in the bag would repeat: start a fresh bag instead
  }
  return bag.shift();
}
function reactionFor(situation){
  if(situation === 'wrongLetter') return lastReaction === 'roboEats' ? pickReaction('wrong') : 'roboEats';
  return pickReaction(POOLS[situation] ? situation : 'wrong');
}
async function react(name, ctx = {}){
  const R = REACTIONS[name]; if(!R || !cust) return null;
  const entry = { name, kind:R.kind, situation: ctx.situation || R.kind, who: custInfo ? custInfo.name : null, at: Date.now(), ms: 0 };
  lastReaction = name; reactionLog.push(entry); if(reactionLog.length > 80) reactionLog.shift();
  const t0 = performance.now();
  try { await Promise.race([R.run(ctx), wait(3000)]); } catch(e){ /* a reaction is decoration, never a blocker */ }
  entry.ms = Math.round(performance.now() - t0);
  return name;
}
/* run a reaction for a situation in the background (skipped while another is running) */
function reactBg(situation, ctx = {}){ const q = G && G.q; if(!q || q.reacting) return null; const name = reactionFor(situation); q.reacting = react(name, Object.assign({situation}, ctx)).then(() => { q.reacting = null; }); return name; }

/* ---------- idle life: after 7 s with no taps (before the 14 s nudge) one small idle gag per customer ---------- */
let lastTap = performance.now();
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, () => { lastTap = performance.now(); }, {passive:true}));
setInterval(() => {
  if(!G || G.busy || !G.q || G.q.solved || G.q.reacting || G.q.idled || UI.overlayOpen()) return;
  if(performance.now() - lastTap < 7000) return;
  runIdle();
}, 1000);
function runIdle(){ const q = G && G.q; if(!q || q.reacting) return null; q.idled = true; return reactBg('idle'); }

/* ---------- level flow ---------- */

  n = Math.max(1, Math.min(LEVELS.length, n|0));
  run++; const myRun = run;
  const cfg = levelConfig(n);
  G = {n, cfg, idx:0, served:0, busy:false, q:null, stats:{questions:0, firstTry:0, wrong:0}, queue: shuffle(cfg.list).slice(0, CUSTOMERS_PER_LEVEL), customers: shuffle(CUSTOMERS), roboMeals:0};
  UI.chip('lvl', n); UI.chip('served', '0 / ' + CUSTOMERS_PER_LEVEL); UI.hideOverlay(); cardKind = 'none'; hideBubble(); setPlate(null); resetCustomer(); UI.nudge.clear();
  coach(`Level ${n}: ${cfg.title}. Robo is baking letter cookies!`, phrase('SO11', N(n), 'SO' + (2 + n), 'SO2'));

/* ---------- (a) BLEND & PICK ---------- */
function cookieButton(t, i){
  const b = h(`<button class="tile cookie-btn${t.g.length > 1 ? ' wide' : ''}${t.silent ? ' silent' : ''}" data-i="${i}" data-g="${esc(t.g)}" aria-label="letter ${esc(t.g)}">${cookieSVG(t.g)}</button>`);
  return b;
}
function renderTiles(container, tokens){ container.innerHTML = ''; tokens.forEach((t, i) => container.appendChild(cookieButton(t, i))); }
/* light each cookie while its sound plays; at the end slide them together with a snap and say the whole word */
async function playBlend(tiles, tokens, ms, myRun, o = {}){
  for(let i = 0; i < tokens.length; i++){
    tiles.forEach(t => t.classList.remove('lit')); tiles[i].classList.add('lit');
    if(!tokens[i].silent) saySound(tokens[i]);
    await wait(tokens[i].silent ? ms*0.4 : ms); if(run !== myRun) return;
  }
  tiles.forEach(t => t.classList.add('lit'));
  if(o.snap !== false){
    snapSound(); const n = tiles.length, r0 = tiles[0].getBoundingClientRect(), r1 = tiles[n-1].getBoundingClientRect(), gap = n > 1 ? Math.max(0, (r1.left - r0.right) / (n-1)) : 0;
    tiles.forEach((t, i) => anim(t, [{transform:'scale(1.15) translateX(0)'}, {transform:`scale(1.15) translateX(${((i - (n-1)/2) * -gap * 0.9).toFixed(1)}px)`}], {duration:260, easing:'cubic-bezier(.2,1.6,.4,1)', fill:'forwards'}));
    if(tiles[0].parentElement) crumbsIn(tiles[0].parentElement, 6);
    snapPlate(); FX.burstAt(el.plate, {kind:'crumbs', ax:0.5, ay:0.4, count:10});
  }
  sayWord(G.q.word);
  await wait(700); tiles.forEach(t => { settle(t); t.classList.remove('lit'); });
}
function makeChoices(w){
  const pool = shuffle(WORDS.filter(x => x.word !== w.word && x.em !== w.em));
  const same = pool.filter(x => x.level === G.n), other = pool.filter(x => x.level !== G.n);
  const ds = []; const seen = new Set([w.em]);
  for(const x of same.concat(other)){ if(ds.length >= 2) break; if(seen.has(x.em)) continue; seen.add(x.em); ds.push(x); }
  return shuffle([w, ds[0], ds[1]]);
}
async function askBlend(myRun){
  const q = G.q, w = WORDS.find(x => x.word === q.word);
  UI.show('v-blend'); el.choices.innerHTML = ''; setPlate(q.tokens, true);

async function chooseWord(word){
  const q = G.q; if(!q || q.mode !== 'blend' || q.solved || G.busy) return false;
  const myRun = run; UI.nudge.touch();

/* ---------- (b) BUILD THE WORD ---------- */
function makeTray(tokens, n){
  const have = new Set(tokens.map(t => t.g));
  let pool = PLAIN.filter(l => !have.has(l));
  if(n >= 6) pool = pool.concat(DIGRAPHS.filter(d => !have.has(d)).slice(0, 6));
  pool = shuffle(pool);
  const size = tokens.length <= 3 ? 5 : 6;
  const tray = tokens.map((t, i) => ({g:t.g, key:t.key, sound:t.sound, own:true, i}));
  while(tray.length < size && pool.length){ const g = pool.pop(); tray.push({g, key:g, sound:SOUNDS[g], own:false, i:tray.length}); }
  return shuffle(tray);
}

function markNext(){

  el.tray.querySelectorAll('.tile').forEach(t => t.classList.remove('glow'));
  if(q.hint >= 1 && nextTok()){ const t = [...el.tray.querySelectorAll('.tile:not(.gone)')].find(t => t.dataset.g === nextTok().g); if(t) t.classList.add('glow'); }

  bubble(q.bubble.html, q.bubble.ph, {babbleText:'please make me the word ' + q.word});
  await wait(1800); if(run !== myRun) return;
  G.busy = false; markNext();
  coach(`Build the word ${q.word}. Tap the cookies in order.`, phrase('SO18', W(q.word), 'SO19'));
  UI.nudge.set(() => { const n = nextTok(); return n ? [[...el.tray.querySelectorAll('.tile:not(.gone)')].find(t => t.dataset.g === n.g)] : []; }, `Build the word ${q.word}. Tap the cookies in order.`);
}
/* the tapped cookie slides from the tray into its slot */
async function slideToSlot(btn, slot, tok){
  slot.classList.add('filled'); if(tok.silent) slot.classList.add('silent'); slot.innerHTML = cookieSVG(tok.g);
  const a = btn.getBoundingClientRect(), b = slot.getBoundingClientRect();
  btn.classList.add('flying');
  await anim(btn, [{transform:'translate(0,0) scale(1)'}, {transform:`translate(${(b.left + b.width/2 - a.left - a.width/2).toFixed(1)}px,${(b.top + b.height/2 - a.top - a.height/2).toFixed(1)}px) scale(${(b.width / Math.max(1, a.width)).toFixed(2)})`}], {duration:320, easing:'cubic-bezier(.3,.8,.4,1)', fill:'forwards'});
  settle(btn); btn.classList.remove('flying'); btn.classList.add('gone'); slot.classList.add('landed'); S.pop();
}
async function slotsTogether(){
  const s = [...el.slots.children], n = s.length; if(n < 2) return;
  const r0 = s[0].getBoundingClientRect(), r1 = s[n-1].getBoundingClientRect(), gap = Math.max(0, (r1.left - r0.right) / (n-1));
  snapSound();
  await Promise.all(s.map((t, i) => anim(t, [{transform:'translateX(0)'}, {transform:`translateX(${((i - (n-1)/2) * -gap * 0.9).toFixed(1)}px)`}], {duration:280, easing:'cubic-bezier(.2,1.6,.4,1)', fill:'forwards'})));
  crumbsIn(el.slots, 7);
}
async function tapTrayTile(btn){
  const q = G.q; if(!q || q.mode !== 'build' || q.solved || G.busy || btn.classList.contains('gone') || btn.classList.contains('flying')) return false;
  const myRun = run; UI.nudge.touch();
  const g = btn.dataset.g, item = q.tray.find(t => t.i === +btn.dataset.i);
  const n = nextTok();
  if(g === n.g){
    saySound(n);
    const slot = el.slots.children[q.filled];
    q.filled++; markNext();
    const fly = slideToSlot(btn, slot, n);
    if(q.filled === q.tokens.length){
      q.solved = true; G.busy = true; el.tray.querySelectorAll('.tile').forEach(t => t.classList.remove('glow'));
      await fly; if(run !== myRun) return true;
      await slotsTogether(); if(run !== myRun) return true;
      coach('All the cookies are in! Let’s read it.', phrase('SO22'));
      await wait(700); if(run !== myRun) return true;
      const slots = [...el.slots.children]; slots.forEach(s => settle(s));
      setPlate(q.tokens, true);
      await playBlend(slots, q.tokens, STEP, myRun); if(run !== myRun) return true;
      return solved(myRun, q.wrong === 0);
    }
    return true;
  }
  saySound(item || {sound: SOUNDS[g] || g, key: g}); q.wrong++; G.stats.wrong++;
  retrigger(btn, 'nope', 450);
  if(q.wrong === 1) coach(`Not that one. What comes next in ${q.word}?`, phrase('SO20', W(q.word)));
  if(q.wrong >= 2){ q.hint = 1; markNext(); coach(`The next cookie is glowing. Tap ${nextTok().sound}.`, phrase('SO21', SND(nextTok()))); }
  reactBg('wrongLetter', {letter:g});
  return true;
}

/* ---------- solved: the customer eats the cookie word, then a reaction (short and silly, under 3 seconds) ---------- */
async function solved(myRun, firstTry){
  const q = G.q; G.stats.questions++; if(firstTry) G.stats.firstTry++;
  UI.nudge.clear();
  const pr = pick(PRAISE).map(p => p === 'W' ? W(q.word) : p), ph = phrase(...pr);
  S.yay(); coach(ph.text, ph); UI.toast(firstTry ? 'Yes!' : 'Got it!');
  FX.burstAt(el.plate, {kind:'stars', ax:0.5, ay:0.3, count:10}); FX.burstAt(el.plate, {kind:'confetti', ax:0.5, ay:0.2, count:14});
  await wait(900); if(run !== myRun) return true;
  if(q.reacting) await q.reacting; if(run !== myRun) return true;
  /* eat: one chomp per cookie */
  el.customer.classList.add('chomp'); C.mood(cust, 'happy'); C.talk(cust, 220 * el.plate.children.length + 100);
  for(const c of [...el.plate.children]){ S.chomp(); c.classList.add('eaten'); FX.burstAt(el.plate, {kind:'crumbs', ax:0.3, ay:0.4, count:5}); await wait(220); if(run !== myRun) return true; }
  el.customer.classList.remove('chomp');
  const yum = pick(YUM); bubble(L[yum], phrase(yum), {babbleText:'yum yum yum thank you'});
  q.reacting = react(pickReaction('right'), {situation:'right'}); await q.reacting; q.reacting = null; if(run !== myRun) return true;
  G.served++; UI.chip('served', G.served + ' / ' + CUSTOMERS_PER_LEVEL); S.ding();
  await wait(500); if(run !== myRun) return true;
  hideBubble(); el.customer.classList.add('leaving'); el.customer.style.left = '110%';
  react(pickReaction('exit'), {situation:'exit'});
  robotBaking(true);
  showWait(pick(SILLY), cookieSVG(''));
  if(Math.random() < 0.3) react('roboSneeze', {situation:'idle'});
  await wait(1300); if(run !== myRun) return true;
  resetCustomer();
  G.idx++; G.q = null;
  await wait(100); if(run !== myRun) return true;
  nextCustomer(myRun);
  return true;
}

/* ---------- level complete: stars from accuracy only; never auto-advances ---------- */
function finishLevel(){
  const s = G.stats, stars = UI.stars(s.firstTry, s.questions), n = G.n;
  progress.unlocked = Math.max(progress.unlocked || 1, Math.min(LEVELS.length, n + 1));
  progress.stars[n] = Math.max(progress.stars[n] || 0, stars); UI.progress.save();
  UI.nudge.clear(); G.busy = false;
  const msgId = stars === 3 ? 'SO46' : stars === 2 ? 'SO47' : 'SO48';
  const r = UI.levelComplete({ n, stars, save:false, hero:'robo bear', title:`Level ${n} done!`, subtitle:L.SO45, msg:L[msgId], speak:false, last: n >= LEVELS.length,
    fact:`Fed <b>${G.served}</b> customers · <b>${s.firstTry}</b> of <b>${s.questions}</b> words right first time`,
    onNext: () => startLevel(n + 1), onReplay: () => startLevel(n), onDone: showTitle });
  cardKind = r.breakTime ? 'break' : 'complete';
  const replay = $('#btn-replay', refs.card); if(replay) replay.textContent = 'Play it again';
  if(n >= LEVELS.length){ const b = $('#btn-next', refs.card); if(b) b.remove(); }
  say(r.breakTime ? phrase('SO49', N(r.sitting), 'SO50', msgId) : phrase('SO11', N(n), 'SO44', msgId));
  const done = $('#btn-done', refs.card); if(done) done.addEventListener('click', e => { e.stopImmediatePropagation(); showGoodbye(); }, true);
}
const GOODBYE = { text:' Stretch, drink some water, go find a word on a real sign. See you next time.', spoken:L.SO51, ids:['SO51'], hero:'👋' };
function showGoodbye(){
  run++; G = null; cardKind = 'goodbye'; UI.nudge.clear();
  UI.goodbye(Object.assign({ onBack: showTitle }, GOODBYE));
  const h2 = $('h2', refs.card); if(h2) h2.textContent = 'Great reading today!';
}

/* ---------- overlays ---------- */
function showTitle(){
  run++; G = null; cardKind = 'title'; UI.nudge.clear();
  UI.title({ hero:'robo bear', title:'Sound It Out', playLabel:'Play! 🍪',
    blurb:'Robo bakes letter cookies. Tap a cookie to hear its sound, blend the sounds into a word, and feed the hungry customers!',
    fact:'Practise <b>letter sounds</b> · <b>blending</b> · <b>reading simple words</b>',
    onPlay: () => startLevel(Math.min(progress.unlocked || 1, LEVELS.length)), onLevels: showLevels, grownups: showGrownups });
}
function showGrownups(){
  cardKind = 'grownups';
  UI.grownups({ onBack: showTitle, rules:false, html:`<b>What it teaches</b><ul>
      <li>Letter <em>sounds</em> (not letter names): tap any cookie to hear it.</li>
      <li>Levels 1–4: short-vowel words (cat, pig, dog, then mixed).</li>
      <li>Level 5: consonant blends (frog, drum). Level 6: sh, ch, th, ck.</li>
      <li>Level 7: magic e (cake, bike). Level 8: vowel teams (rain, boat, tree).</li>
      <li>Two games: <b>Blend &amp; Pick</b> (hear the sounds, pick the picture) and <b>Build the Word</b> (see the picture, tap the letters in order).</li></ul>
    <b class="sub">About the sounds</b><ul>
      <li>Sounds are spoken by your device’s built-in voice from a sound-spelling map (“buh”, “sss”, “shh”), so they are approximations. Saying the pure sound alongside your child helps a lot.</li></ul>
    <b class="sub">How it helps without nagging</b><ul>
      <li>First miss: “Almost! Listen again”, a slower replay and a first-letter hint. Second miss: the answer is shown to tap. Nobody fails.</li>
      <li>Wrong cookies get eaten by Robo (he burps). The customers are the silly ones, never your child.</li>
      <li>If your child stops for a while, the instruction is repeated and the right thing to tap wiggles.</li></ul>
    <b class="sub">Wholesome, not addictive</b><ul>
      <li>No streaks, timers, countdowns, daily rewards, notifications or “come back tomorrow” nags.</li>
      <li>Levels never auto-advance. Every level-complete card has an “All done for today” button; after three levels in one sitting it becomes the big suggested button.</li>
      <li>Stars come only from accuracy (3 for 80% first-try, 2 for 50%). No random prizes, chests or collectibles.</li>
      <li>Celebrations are short and a little silly. Humour is gentle, never mean.</li>
      <li>No accounts, nothing leaves this device. Only stars and the sound/voice toggles are remembered. ⛶ makes it full screen on a tablet.</li></ul>` });
}
function showLevels(){
  run++; G = null; cardKind = 'levels'; UI.nudge.clear();
  UI.levels({ count: LEVELS.length, intro:'Each level has six hungry customers. Finish one to unlock the next!', level: n => ({ title: levelConfig(n).title, tags: levelConfig(n).hint.split(' · ') }), onPick: startLevel, onBack: showTitle });
}

/* ---------- wiring ---------- */
el.tiles.addEventListener('click', e => { const b = e.target.closest('.tile'); if(!b || !G || !G.q) return; UI.nudge.touch(); const t = G.q.tokens[+b.dataset.i]; [...el.tiles.children].forEach(x => x.classList.remove('lit')); b.classList.add('lit'); setTimeout(() => b.classList.remove('lit'), 500); saySound(t); });
el.choices.addEventListener('click', e => { const b = e.target.closest('.pic'); if(b) chooseWord(b.dataset.word); });
el.tray.addEventListener('click', e => { const b = e.target.closest('.tile'); if(b) tapTrayTile(b); });
el.targetPic.addEventListener('click', () => { if(G && G.q){ UI.nudge.touch(); sayWord(G.q.word); } });
el.btnAgain.addEventListener('click', async () => { if(!G || !G.q || G.busy || G.q.mode !== 'blend') return; UI.nudge.touch(); const myRun = run; G.busy = true; await playBlend([...el.tiles.children], G.q.tokens, STEP, myRun); if(run === myRun) G.busy = false; });

/* ---------- boot ---------- */
showTitle();

/* ---------- debug hooks for automated testing ---------- */
window.__game = {
  startLevel, showTitle, showLevels,
  get state(){
    const q = G && G.q;
    return {
      level: G ? G.n : null, title: G ? G.cfg.title : null, customer: G ? G.idx : null, total: CUSTOMERS_PER_LEVEL, served: G ? G.served : 0,
      busy: G ? G.busy : false, mode: q ? q.mode : null, word: q ? q.word : null, em: q ? q.em : null, solved: q ? q.solved : null,
      attempts: q ? q.attempts : 0, wrong: q ? q.wrong : 0, hint: q ? q.hint : 0, filled: q ? q.filled : 0,
      choices: q ? q.choices.map(c => c.word) : [], tray: q ? [...el.tray.querySelectorAll('.tile:not(.gone)')].map(t => t.dataset.g) : [],
      tokens: q ? q.tokens.map(t => t.g) : [], stats: G ? Object.assign({}, G.stats) : null,
      overlay: UI.overlayOpen(), card: cardKind, cardButtons: [...refs.card.querySelectorAll('button')].map(b => ({id:b.id, text:b.textContent.trim(), cls:b.className})),
      sittingLevels: UI.sitting, unlocked: progress.unlocked, stars: Object.assign({}, progress.stars), coach: UI.coachLine, coachText,
      who: custInfo ? custInfo.name : null, reacting: !!(q && q.reacting), idled: !!(q && q.idled), roboMeals: G ? G.roboMeals : 0,
      reactionLog: reactionLog.slice(), lastReaction
    };
  },
  /* both return true/false synchronously (the animations run on afterwards) */
  choose(text){ const q = G && G.q; if(!q || q.mode !== 'blend' || q.solved || G.busy) return false; const c = q.choices.find(x => x.word === text || x.em === text); if(!c) return false; chooseWord(c.word); return true; },
  tapLetter(ch){ const q = G && G.q; if(!q || q.mode !== 'build' || q.solved || G.busy) return false; const t = [...el.tray.querySelectorAll('.tile:not(.gone)')].find(t => t.dataset.g === ch); if(!t) return false; tapTrayTile(t); return true; },
  react: (name, ctx) => react(name, ctx || {}), idle: runIdle,
  reactions: Object.keys(REACTIONS).map(k => ({ name:k, kind:REACTIONS[k].kind })), voiceLines: L, soundIds: Object.fromEntries(Object.keys(SOUNDS).map(k => [k, sid(k)])),
  words: WORDS, sounds: SOUNDS, levels: LEVELS.map(l => ({n:l.n, title:l.title, count:l.list.length, words:l.list.map(w => w.word)}))
};
})();
</script>
